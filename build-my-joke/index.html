<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1e"><title>Build My Joke</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../arcade-ui.css"><style>
.head-actions{justify-self:end;display:flex;gap:5px}.builder{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}.ingredients{min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.ingredient{min-height:0;padding:8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}.ingredient h2{margin:0;color:var(--arcade-cyan);font-size:clamp(13px,2.6vmin,18px);text-align:center}.options{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px}.option{min-height:48px;padding:7px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.055);color:#fff;font:800 clamp(11px,2.2vmin,14px)/1.15 system-ui;text-align:left;touch-action:manipulation}.option:active{transform:scale(.98)}.option.selected{border-color:var(--arcade-cyan);background:rgba(33,220,255,.11);box-shadow:0 0 0 2px rgba(33,220,255,.13) inset}.build-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:7px}.build-actions .arcade-btn{font-size:17px;min-height:50px}.reveal-card{width:min(780px,100%);padding:clamp(16px,4vmin,30px);text-align:center;background:linear-gradient(145deg,#202c58,#111a38)}.joke{font:1000 clamp(22px,5.2vmin,42px)/1.25 system-ui;margin:12px 0;color:#fff}.meter-title{color:var(--arcade-gold);font-weight:1000;font-size:clamp(18px,4vmin,27px)}.meter-track{height:22px;border-radius:999px;overflow:hidden;background:rgba(0,0,0,.35);margin:8px auto;width:min(440px,100%);border:1px solid var(--arcade-line)}.meter-fill{height:100%;width:0;background:linear-gradient(90deg,#72ef80,#ffce3a,#ff5ac8);transition:width .7s cubic-bezier(.2,.8,.2,1)}.reveal-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}.favorites{width:min(720px,100%);max-height:100%;overflow:auto;padding:16px}.fav-list{display:flex;flex-direction:column;gap:7px;margin:10px 0}.fav{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:9px;border-radius:14px;background:rgba(255,255,255,.06);text-align:left;font-size:12px;font-weight:800}.empty{color:var(--arcade-muted);padding:20px;text-align:center}
@media(max-width:720px){.ingredients{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.ingredient{padding:6px}.option{min-height:40px}.reveal-actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-height:520px){.builder{grid-template-columns:minmax(0,1fr) 180px;grid-template-rows:1fr}.ingredients{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr;gap:4px}.ingredient{padding:5px}.ingredient h2{font-size:11px}.option{min-height:34px;padding:5px;font-size:10px}.build-actions{grid-template-columns:1fr;align-content:center}.build-actions .arcade-btn{min-height:45px;font-size:13px}.joke{font-size:22px}.reveal-card{padding:10px}}
</style></head><body class="arcade-shell"><main class="arcade-app"><header class="arcade-top"><button class="arcade-btn arcade-home" id="home">⌂ <span class="label">Arcade</span></button><h1 class="arcade-title">Build My Joke</h1><div class="head-actions"><button class="arcade-btn" id="favorites">★ <span class="label">Favorites</span></button></div></header><section class="builder"><div class="ingredients" id="ingredients"></div><div class="build-actions"><button class="arcade-btn pink" id="random">🎲 Random Joke</button><button class="arcade-btn gold" id="reveal">🎤 Reveal My Joke!</button></div></section></main>
<div class="arcade-overlay" id="result" hidden><div class="reveal-card arcade-panel"><div class="meter-title" id="reaction">Certified Goofy</div><div class="joke" id="joke"></div><div class="meter-track"><div class="meter-fill" id="meter"></div></div><div id="rating" style="font-weight:1000;color:var(--arcade-muted)"></div><div class="reveal-actions"><button class="arcade-btn good" id="speak">🔊 Speak</button><button class="arcade-btn" id="favorite">☆ Favorite</button><button class="arcade-btn primary" id="again">Again</button><button class="arcade-btn" id="close">Keep Building</button></div></div></div>
<div class="arcade-overlay" id="favOverlay" hidden><div class="favorites arcade-panel"><h1 class="arcade-title">Favorite Nonsense</h1><div class="fav-list" id="favList"></div><button class="arcade-btn" id="favDone" style="width:100%">Done</button></div></div>
<script>
(()=>{'use strict';
const DATA=[
{title:'1. Start',items:['Why did','Seriously, why did','Quick question: why did','Breaking news: why did','On Tuesday, why did','At lunchtime, why did','In outer space, why did','Behind the school bus, why did']},
{title:'2. Goofball',items:['the farting unicorn','a zombie grandma','the booger wizard','my underpants','a confused chicken','the toilet monster','an alien teacher','a disco potato','the burping penguin','a haunted meatball','the principal’s llama','a sneezing dinosaur']},
{title:'3. Nonsense',items:['dance on the toilet','eat a sock sandwich','hide inside the refrigerator','wear spaghetti as a hat','challenge a banana to a duel','sing to a pile of boogers','put mustard in its shoes','ride a skateboard to the Moon','tickle the school bus','sleep in a bowl of cereal','teach a fart to whistle','invite a pickle to gym class']},
{title:'4. Punchline',items:['Because its underpants were haunted!','Because the toilet said, “Not again!”','Because Tuesday smelled like cheese!','Because nobody warned the banana!','Because its butt had other plans!','Because the boogers were in charge!','Because even the zombie said, “Gross!”','Because the pickle stole its homework!','Because it was nacho problem!','Because Grandma pressed the silly button!','Because the alien needed a snack!','Because normal jokes are boring!']}
];
const $=id=>document.getElementById(id),pick=a=>a[(Math.random()*a.length)|0];let selected=[0,0,0,0],currentJoke='',favorites=[],reveals=0;
function build(){const root=$('ingredients');root.replaceChildren();DATA.forEach((group,g)=>{const panel=document.createElement('section');panel.className='ingredient arcade-panel';const h=document.createElement('h2');h.textContent=group.title;const opts=document.createElement('div');opts.className='options';group.items.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='option'+(selected[g]===i?' selected':'');b.textContent=item;b.addEventListener('click',()=>{selected[g]=i;build();touch()});opts.appendChild(b)});panel.append(h,opts);root.appendChild(panel)})}
function assemble(){return `${DATA[0].items[selected[0]]} ${DATA[1].items[selected[1]]} ${DATA[2].items[selected[2]]}? ${DATA[3].items[selected[3]]}`}
function randomize(){selected=DATA.map(g=>(Math.random()*g.items.length)|0);build();touch()}
function hash(s){let n=2166136261;for(const c of s){n^=c.codePointAt(0);n=Math.imul(n,16777619)}return(n>>>0)}
function show(){currentJoke=assemble();reveals++;$('joke').textContent=currentJoke;const rating=55+(hash(currentJoke)%46),reactions=rating>92?['LEGENDARY NONSENSE','Emergency Giggle Alert','Too Goofy for Earth']:rating>78?['Certified Goofy','Major Silly Energy','Top-Tier Toilet Humor']:['Delightfully Ridiculous','Proudly Terrible','A Fine Mess'];$('reaction').textContent=pick(reactions);$('rating').textContent=`Giggle Meter: ${rating}%`;$('meter').style.width='0';$('favorite').textContent=favorites.includes(currentJoke)?'★ Favorited':'☆ Favorite';$('result').hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>$('meter').style.width=rating+'%'));touch()}
function speak(text){if(window.ArcadeNative&&typeof ArcadeNative.speak==='function'){try{ArcadeNative.speak(text,1.02,1.08);return}catch(_){}}if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined')return;try{speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);u.rate=1.02;u.pitch=1.08;speechSynthesis.speak(u)},80)}catch(_){}}
function toggleFavorite(){if(!currentJoke)return;const i=favorites.indexOf(currentJoke);if(i>=0)favorites.splice(i,1);else favorites.unshift(currentJoke);favorites=favorites.slice(0,30);$('favorite').textContent=favorites.includes(currentJoke)?'★ Favorited':'☆ Favorite';renderFavorites();touch()}
function renderFavorites(){const box=$('favList');box.replaceChildren();if(!favorites.length){const e=document.createElement('div');e.className='empty';e.textContent='No favorites yet. Save the jokes that make you snort.';box.appendChild(e);return}favorites.forEach((j,i)=>{const row=document.createElement('div');row.className='fav';const t=document.createElement('span');t.textContent=j;const say=document.createElement('button');say.className='arcade-btn';say.textContent='🔊';say.addEventListener('click',()=>speak(j));const del=document.createElement('button');del.className='arcade-btn';del.textContent='✕';del.addEventListener('click',()=>{favorites.splice(i,1);renderFavorites();touch()});row.append(t,say,del);box.appendChild(row)})}
function touch(){if(window.ArcadeSave)ArcadeSave.touch(300)}function leave(){ArcadeSave.goHome()}
$('random').addEventListener('click',()=>{randomize();show()});$('reveal').addEventListener('click',show);$('speak').addEventListener('click',()=>speak(currentJoke));$('favorite').addEventListener('click',toggleFavorite);$('again').addEventListener('click',()=>{randomize();show()});$('close').addEventListener('click',()=>{$('result').hidden=true});$('favorites').addEventListener('click',()=>{renderFavorites();$('favOverlay').hidden=false});$('favDone').addEventListener('click',()=>{$('favOverlay').hidden=true});$('home').addEventListener('click',leave);
window.JokeAutosave={id:'build-my-joke',title:'Build My Joke',version:1,capture:()=>({selected,favorites,reveals,currentJoke}),restore:s=>{if(!s||!Array.isArray(s.selected))throw new Error('Invalid joke save');selected=s.selected.slice(0,4).map((v,i)=>Math.max(0,Math.min(DATA[i].items.length-1,Number(v)||0)));favorites=Array.isArray(s.favorites)?s.favorites.slice(0,30).map(String):[];reveals=Math.max(0,Number(s.reveals)||0);currentJoke=String(s.currentJoke||'');$('result').hidden=true;$('favOverlay').hidden=true;build();return true},meaningful:()=>reveals>0||favorites.length>0||selected.some(Boolean),summary:()=>`${reveals} jokes • ${favorites.length} favorites`,startFresh:()=>{selected=[0,0,0,0];favorites=[];reveals=0;currentJoke='';$('result').hidden=true;$('favOverlay').hidden=true;build()}};build();
})();
</script><script src="../arcade-save.js"></script><script>ArcadeSave.register(window.JokeAutosave);</script></body></html>
