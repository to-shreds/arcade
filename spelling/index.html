<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1e"><title>Picture Spelling</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../arcade-ui.css">
<style>
.score{justify-self:end}.score .arcade-pill{font-size:12px;padding:5px 8px}.game{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:7px}.card{min-height:0;display:grid;grid-template-columns:minmax(120px,.72fr) minmax(0,1.28fr);align-items:center;gap:clamp(10px,3vw,28px);padding:clamp(12px,3vmin,28px);overflow:hidden}.picture{text-align:center;font-size:clamp(86px,25vmin,210px);line-height:1;filter:drop-shadow(0 10px 12px rgba(0,0,0,.3));user-select:none}.word-side{min-width:0;text-align:center}.level{color:var(--arcade-cyan);font-size:12px;font-weight:1000;letter-spacing:1px;text-transform:uppercase}.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(3px,1vw,8px);margin:12px 0}.slot{width:clamp(27px,6vw,52px);height:clamp(41px,9vmin,68px);border-bottom:4px solid rgba(255,255,255,.38);display:grid;place-items:center;font:1000 clamp(23px,6vmin,45px)/1 system-ui;color:#fff;text-transform:uppercase}.slot.hint{color:var(--arcade-gold);border-color:var(--arcade-gold)}.message{min-height:31px;font-weight:900;color:var(--arcade-muted);font-size:clamp(14px,3vmin,20px)}.message.good{color:var(--arcade-green)}.message.bad{color:var(--arcade-red)}.word-actions{display:flex;justify-content:center;gap:7px;margin-top:7px}.keyboard{padding:6px;display:flex;flex-direction:column;gap:4px}.key-row{display:flex;justify-content:center;gap:4px}.key{flex:1 1 0;min-width:0;max-width:74px;height:clamp(37px,7vh,52px);border:1px solid rgba(255,255,255,.17);border-radius:10px;background:linear-gradient(180deg,#354267,#222b49);box-shadow:0 3px 0 rgba(0,0,0,.42);color:#fff;font:1000 clamp(15px,4vw,21px)/1 system-ui;text-transform:uppercase}.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.42)}.key.wide{max-width:none;flex:1.7;font-size:13px}.key.submit{max-width:none;flex:3;background:linear-gradient(135deg,var(--arcade-green),#23b86c);color:#062315}.card.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(max-width:560px){.card{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:2px;padding:9px}.picture{font-size:clamp(72px,20vh,128px)}.slots{margin:5px 0}.word-actions{margin-top:3px}.keyboard{padding:5px}.key-row{gap:3px}.key{border-radius:8px}}
@media(max-height:540px){.game{grid-template-columns:minmax(0,1fr) minmax(330px,.95fr);grid-template-rows:1fr}.card{grid-template-columns:.62fr 1fr;padding:8px}.picture{font-size:clamp(70px,27vh,124px)}.keyboard{justify-content:center}.key{height:34px;font-size:15px}.slot{height:37px;width:29px;font-size:24px}.slots{margin:4px 0}.word-actions .arcade-btn{min-height:31px}.message{min-height:20px;font-size:13px}}
</style></head><body class="arcade-shell"><main class="arcade-app"><header class="arcade-top"><button class="arcade-btn arcade-home" id="home">⌂ <span class="label">Arcade</span></button><h1 class="arcade-title">Picture Spelling</h1><div class="score"><span class="arcade-pill" id="score">⭐ 0</span><button class="arcade-btn" id="menu">Menu</button></div></header><section class="game"><div class="card arcade-panel" id="card"><div class="picture" id="picture">🦄</div><div class="word-side"><div class="level" id="level">Easy</div><div class="slots" id="slots"></div><div class="message" id="message">Spell the picture!</div><div class="word-actions"><button class="arcade-btn" id="hint">Hint</button><button class="arcade-btn" id="clear">Clear</button></div></div></div><div class="keyboard arcade-panel" id="keyboard"></div></section></main>
<div class="arcade-overlay" id="start"><div class="arcade-dialog arcade-panel"><h1>Picture Spelling</h1><p>Look at the picture, then build the word with the safe arcade keyboard. Every word has at least four letters.</p><div class="arcade-segments" id="difficulty"><button class="arcade-btn active" data-d="easy">Easy</button><button class="arcade-btn" data-d="regular">Regular</button><button class="arcade-btn" data-d="hard">Tricky</button></div><div style="height:10px"></div><button class="arcade-btn gold" id="play" style="width:100%;font-size:19px">Play</button><button class="arcade-btn" id="load" style="width:100%;margin-top:7px">Load Saved Game</button><button class="arcade-btn" id="back" style="width:100%;margin-top:7px">Back to Arcade</button></div></div>
<script>
(()=>{'use strict';
const WORDS={easy:[['🐸','frog'],['🦁','lion'],['🦆','duck'],['🎂','cake'],['⭐','star'],['🌙','moon'],['🐟','fish'],['🐻','bear'],['🦀','crab'],['🧦','sock'],['🍎','apple'],['🍕','pizza'],['🤖','robot'],['🐴','horse'],['🐳','whale'],['🐍','snake'],['👻','ghost'],['🤡','clown']],regular:[['🐰','rabbit'],['🐒','monkey'],['🐢','turtle'],['🚀','rocket'],['🍪','cookie'],['🍌','banana'],['🧀','cheese'],['🌸','flower'],['🏰','castle'],['🕷️','spider'],['⚽','soccer'],['🦒','giraffe'],['🌈','rainbow'],['🦄','unicorn'],['🐙','octopus'],['🎃','pumpkin'],['🐧','penguin'],['🚲','bicycle'],['🌋','volcano']],hard:[['🦖','dinosaur'],['🐘','elephant'],['🥪','sandwich'],['✈️','airplane'],['🧑‍🚀','astronaut'],['🍓','strawberry'],['🍍','pineapple'],['🦋','butterfly'],['🐊','crocodile'],['🪂','parachute'],['🚁','helicopter'],['🛹','skateboard'],['🧑‍🚒','firefighter'],['🦛','hippopotamus']]};
const ROWS=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];const $=id=>document.getElementById(id),pick=a=>a[(Math.random()*a.length)|0];let difficulty='easy',entry=null,typed='',score=0,streak=0,tries=0,hints=[];
function buildKeyboard(){const k=$('keyboard');ROWS.forEach(row=>{const r=document.createElement('div');r.className='key-row';row.forEach(ch=>{const b=document.createElement('button');b.className='key';b.type='button';b.textContent=ch;b.dataset.key=ch;r.appendChild(b)});k.appendChild(r)});const r=document.createElement('div');r.className='key-row';[['Clear','clear','wide'],['Space','space','wide'],['⌫','back','wide'],['Check','submit','submit']].forEach(x=>{const b=document.createElement('button');b.type='button';b.className='key '+x[2];b.textContent=x[0];b.dataset.key=x[1];r.appendChild(b)});k.appendChild(r)}
function chooseWord(){const pool=WORDS[difficulty],last=entry&&entry[1];let next;do{next=pick(pool)}while(pool.length>1&&next[1]===last);entry=next;typed='';tries=0;hints=[];render()}
function render(){if(!entry)return;$('picture').textContent=entry[0];$('level').textContent=(difficulty==='hard'?'Tricky':difficulty)+' • '+entry[1].length+' letters';$('score').textContent='⭐ '+score+(streak>1?'  🔥'+streak:'');const slots=$('slots');slots.replaceChildren();for(let i=0;i<entry[1].length;i++){const s=document.createElement('span');s.className='slot'+(hints.includes(i)?' hint':'');s.textContent=typed[i]||entry[1][i]&&(hints.includes(i)?entry[1][i]:'');slots.appendChild(s)}$('message').className='message';$('message').textContent=typed.length>entry[1].length?'Too many letters. Try backspace.':'Spell the picture!';if(window.ArcadeSave)ArcadeSave.touch(350)}
function press(key){if(!entry)return;if(key==='clear'){typed='';render();return}if(key==='back'){typed=typed.slice(0,-1);render();return}if(key==='space')return;if(key==='submit'){check();return}if(typed.length<entry[1].length+2){typed+=key;render()}}
function check(){if(typed.toLowerCase()===entry[1]){score++;streak++;$('message').className='message good';$('message').textContent=pick(['You got it!','Perfect spelling!','Boom! Correct!','Picture solved!']);if(window.ArcadeSave)ArcadeSave.touch(50);setTimeout(chooseWord,850)}else{tries++;streak=0;$('message').className='message bad';$('message').textContent=typed.length!==entry[1].length?'Check the number of letters.':'Not quite. Try again!';$('card').classList.remove('shake');void $('card').offsetWidth;$('card').classList.add('shake');if(tries>=3&&hints.length<2)giveHint();if(window.ArcadeSave)ArcadeSave.touch(100)}}
function giveHint(){const open=[];for(let i=0;i<entry[1].length;i++)if(!hints.includes(i))open.push(i);if(!open.length)return;const i=pick(open);hints.push(i);if(typed.length>i)typed=typed.slice(0,i)+entry[1][i]+typed.slice(i+1);render();$('message').textContent='A gold letter is a hint.'}
function setDifficulty(d){difficulty=d;document.querySelectorAll('#difficulty button').forEach(b=>b.classList.toggle('active',b.dataset.d===d))}
$('keyboard').addEventListener('click',e=>{const b=e.target.closest('.key');if(b)press(b.dataset.key)});$('hint').addEventListener('click',giveHint);$('clear').addEventListener('click',()=>press('clear'));document.querySelectorAll('#difficulty button').forEach(b=>b.addEventListener('click',()=>setDifficulty(b.dataset.d)));$('play').addEventListener('click',()=>{$('start').hidden=true;score=streak=0;chooseWord()});$('menu').addEventListener('click',()=>{$('start').hidden=false});$('load').addEventListener('click',()=>window.ArcadeSave&&ArcadeSave.load());$('home').addEventListener('click',leave);$('back').addEventListener('click',leave);function leave(){ArcadeSave.goHome()}
window.SpellingAutosave={id:'spelling',title:'Picture Spelling',version:1,capture:()=>entry?{difficulty,entry,typed,score,streak,tries,hints}:undefined,restore:s=>{if(!s||!Array.isArray(s.entry)||typeof s.entry[1]!=='string')throw new Error('Invalid spelling save');difficulty=WORDS[s.difficulty]?s.difficulty:'easy';entry=s.entry;typed=String(s.typed||'').slice(0,20);score=Math.max(0,Number(s.score)||0);streak=Math.max(0,Number(s.streak)||0);tries=Math.max(0,Number(s.tries)||0);hints=Array.isArray(s.hints)?s.hints:[];setDifficulty(difficulty);$('start').hidden=true;render();return true},meaningful:()=>!!entry,summary:()=>`${score} words • ${difficulty}`,startFresh:()=>{entry=null;typed='';score=streak=tries=0;hints=[];$('start').hidden=false}};buildKeyboard();setDifficulty('easy');
})();
</script><script src="../arcade-save.js"></script><script>ArcadeSave.register(window.SpellingAutosave);</script></body></html>
