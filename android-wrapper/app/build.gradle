plugins {
    id "com.android.application"
}

def localSigningPropertiesFile = rootProject.file("private-signing/signing.properties")
def localSigningProperties = new Properties()
if (localSigningPropertiesFile.isFile()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}
def localKeystoreName = localSigningProperties.getProperty("storeFile")
def localKeystorePath = localKeystoreName
        ? new File(localSigningPropertiesFile.parentFile, localKeystoreName).canonicalPath
        : null
def releaseKeystorePath = System.getenv("ARCADE_KEYSTORE_PATH") ?: localKeystorePath
def releaseKeystorePassword = System.getenv("ARCADE_KEYSTORE_PASSWORD")
        ?: localSigningProperties.getProperty("storePassword")
def releaseKeyAlias = System.getenv("ARCADE_KEY_ALIAS")
        ?: localSigningProperties.getProperty("keyAlias")
        ?: "arcade"
def releaseKeyPassword = System.getenv("ARCADE_KEY_PASSWORD")
        ?: localSigningProperties.getProperty("keyPassword")
        ?: releaseKeystorePassword
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyPassword

android {
    namespace "com.familyarcade.platform"
    compileSdk 35

    defaultConfig {
        applicationId "com.familyarcade.platform"
        minSdk 23
        targetSdk 35
        versionCode 2026083101
        versionName "2.3.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
