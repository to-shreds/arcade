<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090d1e">
<link rel="icon" href="arcade.png">
<title>Arcade</title>
<style>
:root{color-scheme:dark;--bg:#090d1e;--panel:#141a33;--text:#fff;--muted:#aab5d9;--line:rgba(255,255,255,.14);--gold:#ffce3a;--cyan:#21dcff;--pink:#ff5ac8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);touch-action:manipulation}
body{background:radial-gradient(circle at 14% 12%,rgba(33,220,255,.13),transparent 32%),radial-gradient(circle at 86% 88%,rgba(255,90,200,.12),transparent 32%),var(--bg)}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:8px;min-width:0}
h1{margin:0;font-size:clamp(25px,5.4vmin,44px);line-height:1;font-weight:1000;letter-spacing:-1.2px;color:var(--gold);text-shadow:0 0 22px rgba(255,206,58,.25)}
.count{color:var(--muted);font-weight:800;font-size:12px;white-space:nowrap}
.updated{color:#dce4ff;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;white-space:nowrap}
.head-actions{margin-left:auto;display:flex;gap:6px}
button,select{min-height:38px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:900;padding:7px 10px;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97);background:rgba(255,255,255,.16)}
.icon-btn{width:42px;padding:0;font-size:20px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(92px,1.28fr) minmax(105px,1.5fr);gap:6px;padding-bottom:1px}
.filter{white-space:nowrap;font-size:12px;min-height:35px;padding:6px 10px}
.filter.active{background:linear-gradient(135deg,var(--cyan),#4277ff);border-color:transparent;color:#071126}
#category{font-size:12px;width:100%;min-width:0;padding-left:7px;padding-right:4px}
#category.active{border-color:var(--pink);background:rgba(255,90,200,.16)}
.grid{min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));grid-auto-rows:116px;gap:8px;padding:1px;align-content:start}
.card{position:relative;min-width:0;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));color:#fff;display:grid;grid-template-rows:58px minmax(34px,auto);place-items:center;gap:5px;padding:10px 7px 8px;box-shadow:0 8px 20px rgba(0,0,0,.22);overflow:hidden}
.card:before{content:"";position:absolute;width:78px;height:78px;right:-28px;bottom:-33px;border-radius:50%;background:var(--accent,var(--cyan));opacity:.18;filter:blur(1px)}
.card img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.22))}
.name{font-size:clamp(11.5px,3.35vw,14px);line-height:1.12;text-align:center;font-weight:1000;max-width:100%;min-height:2.24em;display:flex;align-items:center;justify-content:center;overflow:hidden;overflow-wrap:anywhere}
.players{position:absolute;right:7px;top:7px;border-radius:999px;background:rgba(0,0,0,.5);font-size:10px;padding:3px 6px;color:#dfe7ff;font-weight:900}
.saved{position:absolute;left:7px;top:7px;border-radius:999px;background:linear-gradient(135deg,#21dcff,#597aff);font-size:10px;padding:3px 7px;color:#071126;font-weight:1000;box-shadow:0 3px 10px rgba(33,220,255,.24)}
.empty{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-weight:900;padding:30px}
.loading{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:900}
@media(orientation:landscape){.app{gap:6px}.grid{grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:90px;gap:6px}.card{grid-template-rows:43px minmax(28px,auto);border-radius:16px;gap:3px;padding:6px 4px}.card img{width:41px;height:41px}.name{font-size:clamp(9.5px,1.75vw,12px);line-height:1.08;min-height:2.16em}.filters{min-height:35px}}
@media(orientation:landscape) and (min-width:720px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(max-height:520px){h1{font-size:25px}.count{display:none}.filter,#category{min-height:31px;padding:4px 8px;font-size:11px}.icon-btn{min-height:34px;height:34px}}
@media(max-width:480px){.count{display:none}.updated{padding:4px 6px;font-size:9px}.filters{gap:4px;grid-template-columns:repeat(3,minmax(0,.85fr)) minmax(82px,1.2fr) minmax(92px,1.32fr)}.filter,#category{font-size:10px;padding:5px 3px}}
@media(min-width:900px) and (min-height:521px){.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));grid-auto-rows:124px}.card{grid-template-rows:64px minmax(34px,auto)}.card img{width:60px;height:60px}.name{font-size:14px}}
</style>
</head>
<body>
<main class="app">
<header><h1>Arcade</h1><time class="updated" datetime="2026-08-31">Last updated Aug 31, 2026</time><span class="count" id="count"></span><div class="head-actions"><button class="icon-btn" id="reload" aria-label="Reload arcade">↻</button><button class="icon-btn" id="manage" aria-label="Manage games">⚙</button></div></header>
<nav class="filters" aria-label="Filters">
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="game">Games</button>
<button class="filter" data-filter="activity">Activities</button>
<button class="filter" id="playerFilter" type="button">Players: Any</button>
<select id="category" aria-label="Category"><option value="">Categories</option></select>
</nav>
<section class="grid loading" id="grid">Loading…</section>
</main>
<script>
(()=>{
const grid=document.getElementById('grid');
const count=document.getElementById('count');
const category=document.getElementById('category');
const filters=[...document.querySelectorAll('.filter')];
const playerFilter=document.getElementById('playerFilter');
let items=[];
let mode='all';
let playerMode='any';
let cat='';
let saves={};
const accents=['#ffce3a','#21dcff','#ff5ac8','#72ef80','#ff6b6b','#9b7cff'];
function readSaves(){
try{const parsed=JSON.parse(localStorage.getItem('arcade.autosave.registry.v1')||'{}');return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};}catch(_){return {};}
}
const label=s=>s.replace(/(^|[-_ ])([a-z])/g,(_,a,b)=>a+b.toUpperCase());
function playerLabel(item){
if(item.playersMin===item.playersMax)return item.playersMax===1?'1P':item.playersMax+'P';
return item.playersMin+'-'+item.playersMax+'P';
}
function visible(item){
if(!item.enabled||item.warning)return false;
if(mode==='game'&&item.type!=='game')return false;
if(mode==='activity'&&item.type!=='activity')return false;
if(playerMode==='single'&&!(item.playersMin<=1&&item.playersMax>=1))return false;
if(playerMode==='two'&&item.playersMax<2)return false;
if(cat&&!(item.categories||[]).includes(cat))return false;
return true;
}
function launch(item){
if(window.ArcadeNative&&typeof ArcadeNative.openGameWithOrientation==='function'){ArcadeNative.openGameWithOrientation(item.launchPath,item.orientation||'any');return;}
if(window.ArcadeNative&&ArcadeNative.openGame){ArcadeNative.openGame(item.launchPath);return;}
location.href=item.launchPath;
}
function render(){
const shown=items.filter(visible);
count.textContent=shown.length+' available';
grid.className='grid';
grid.replaceChildren();
if(!shown.length){const e=document.createElement('div');e.className='empty';e.textContent='No matches';grid.append(e);return;}
shown.forEach((item,i)=>{
const b=document.createElement('button');b.className='card';b.style.setProperty('--accent',accents[i%accents.length]);b.addEventListener('click',()=>launch(item));
const p=document.createElement('span');p.className='players';p.textContent=playerLabel(item);
if(saves[item.folder]){const s=document.createElement('span');s.className='saved';s.textContent='↺ SAVED';b.append(s);}
const img=document.createElement('img');img.src=item.folder+'/'+item.icon;img.alt='';img.addEventListener('error',()=>{img.style.display='none'});
const n=document.createElement('span');n.className='name';n.textContent=item.title;
b.append(p,img,n);grid.append(b);
});
}
async function load(){
grid.className='grid loading';grid.textContent='Loading…';
let data;
try{
const source=location.hostname==='arcade.local'?'/__catalog.json':'catalog.json';
const r=await fetch(source+'?t='+Date.now(),{cache:'no-store'});
if(!r.ok)throw new Error();
data=await r.json();
}catch(_){grid.textContent='Arcade catalog unavailable';return;}
items=(data.items||[]).slice().sort((a,b)=>(a.order-b.order)||a.title.localeCompare(b.title));
saves=readSaves();
const cats=[...new Set(items.flatMap(x=>x.categories||[]))].sort();
category.replaceChildren(new Option('Categories',''),...cats.map(x=>new Option(label(x),x)));
render();
requestAnimationFrame(()=>requestAnimationFrame(()=>{
if(window.ArcadeNative&&typeof ArcadeNative.arcadeReady==='function')ArcadeNative.arcadeReady();
}));
}
function updateFilterUI(){
filters.filter(b=>b.dataset.filter).forEach(b=>b.classList.toggle('active',b.dataset.filter===mode));
playerFilter.classList.toggle('active',playerMode!=='any');
playerFilter.textContent=playerMode==='single'?'Players: 1':playerMode==='two'?'Players: 2':'Players: Any';
category.classList.toggle('active',!!cat);
}
filters.filter(b=>b.dataset.filter).forEach(b=>b.addEventListener('click',()=>{
mode=b.dataset.filter;
if(mode==='all'){cat='';category.value='';playerMode='any';}
updateFilterUI();render();
}));
playerFilter.addEventListener('click',()=>{playerMode=playerMode==='any'?'single':playerMode==='single'?'two':'any';updateFilterUI();render()});
category.addEventListener('change',()=>{cat=category.value;updateFilterUI();render()});
document.getElementById('reload').addEventListener('click',()=>{if(window.ArcadeNative&&ArcadeNative.reloadArcade)ArcadeNative.reloadArcade();else load()});
document.getElementById('manage').addEventListener('click',()=>{if(window.ArcadeNative&&ArcadeNative.openManager)ArcadeNative.openManager()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){saves=readSaves();render();}});
load();
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname.endsWith('github.io')){
navigator.serviceWorker.register('sw.js',{scope:'./'}).then(async reg=>{await reg.update();const ready=await navigator.serviceWorker.ready;if(ready.active)ready.active.postMessage({type:'REFRESH_CORE'});}).catch(()=>{});
}
})();
</script>
</body>
</html>
