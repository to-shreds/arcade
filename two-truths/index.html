</style></head><body class="arcade-shell"><main class="arcade-app"><header class="arcade-top"><button class="arcade-btn arcade-home" id="home">⌂ <span class="label">Arcade</span></button><h1 class="arcade-title">Two Truths &amp; a Lie</h1><div class="hud"><span class="arcade-pill" id="score">⭐ 0</span><button class="arcade-btn" id="menu">Menu</button></div></header><section class="round"><div class="topic arcade-panel" id="topic">Pick the lie!</div><div class="claims" id="claims"></div><div class="explain arcade-panel" id="explain" hidden><div class="explain-text" id="explainText"></div><button class="arcade-btn primary" id="next">Next</button></div></section></main>
<div class="arcade-overlay" id="start"><div class="arcade-dialog arcade-panel"><h1>Spot the Lie!</h1><p>Exactly two amazing claims are true. Tap the one made-up claim. Every answer gets a quick explanation.</p><div class="arcade-segments" id="difficulty"><button class="arcade-btn active" data-d="easy">Easy</button><button class="arcade-btn" data-d="regular">Regular</button><button class="arcade-btn" data-d="hard">Sneaky</button></div><div style="height:10px"></div><button class="arcade-btn gold" id="play" style="width:100%;font-size:19px">Start</button><button class="arcade-btn" id="load" style="width:100%;margin-top:7px">Load Saved Game</button><button class="arcade-btn" id="back" style="width:100%;margin-top:7px">Back to Arcade</button></div></div>
<script>
(()=>{'use strict';
const R=[
['easy','🐙 Octopuses',[['An octopus has three hearts.',1,'Two pump blood to the gills and one pumps it around the body.'],['Its blood is blue.',1,'Its blood uses copper-rich hemocyanin, which looks blue.'],['It can breathe air and live on land for months.',0,'Octopuses need water to breathe and cannot live on land for months.']]],

['easy','🧊 Wombats',[['Wombat poop can be cube-shaped.',1,'Their intestines shape the poop into little cubes.'],['A wombat pouch opens toward its back.',1,'That helps keep dirt out while the wombat digs.'],['Wombats can glide between trees.',0,'Wombats stay on the ground and do not glide.']]],
['easy','🌙 The Moon',[['Footprints can last for millions of years on the Moon.',1,'There is no wind or rain to wash them away.'],['Gravity on the Moon is about one-sixth as strong as on Earth.',1,'That is why astronauts could make huge hops.'],['The Moon makes its own light.',0,'Moonlight is sunlight reflected from the Moon.']]],
['easy','🦴 Your Body',[['Babies have more bones than adults.',1,'Some baby bones fuse together as they grow.'],['Your skin is your largest organ.',1,'Skin covers and protects your whole body.'],['Your heart stops whenever you sneeze.',0,'A sneeze changes the rhythm slightly, but the heart does not stop.']]],

const $=id=>document.getElementById(id),shuffle=a=>{for(let i=a.length-1;i;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};let difficulty='easy',score=0,streak=0,current=null,order=[],answered=false,pickedIndex=-1;
function setDiff(d){difficulty=d;document.querySelectorAll('#difficulty button').forEach(b=>b.classList.toggle('active',b.dataset.d===d));order=[]}

function choose(i,award=true){if(answered)return;i=Math.max(0,Math.min(2,Number(i)||0));answered=true;pickedIndex=i;const claims=[...document.querySelectorAll('.claim')],pickedLie=!current[2][i][1];if(award){if(pickedLie){score++;streak++}else streak=0}claims.forEach((b,n)=>{const truth=!!current[2][n][1];b.classList.add(truth?'truth':'lie');const badge=document.createElement('span');badge.className='badge';badge.textContent=truth?'TRUE':'THE LIE';b.appendChild(badge)});const details=current[2].map((s,n)=>`<div class="detail"><strong>${n+1}. ${s[1]?'True':'False'}:</strong> ${s[2]}</div>`).join('');$('explainText').innerHTML=`<strong>${pickedLie?'You found it!':'That one is true.'}</strong><div class="details">${details}</div>`;$('explain').hidden=false;$('score').textContent='⭐ '+score+(streak>1?'  🔥'+streak:'');if(window.ArcadeSave)ArcadeSave.touch(100)}
