function shuffle(a,rng=Math.random){for(let i=a.length-1;i;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function choose(i,award=true){if(answered)return;i=Math.max(0,Math.min(2,Number(i)||0));answered=true;pickedIndex=i;const claims=[...document.querySelectorAll('.claim')],pickedLie=!current[2][i][1];if(award){if(pickedLie){score++;streak++}else streak=0}claims.forEach((b,n)=>{const truth=!!current[2][n][1];b.classList.add(truth?'truth':'lie');const badge=document.createElement('span');badge.className='badge';badge.textContent=truth?'TRUE':'THE LIE';b.appendChild(badge)});const details=current[2].map((s,n)=>`<div class="detail"><strong>${n+1}. ${s[1]?'True':'False'}:</strong> ${s[2]}</div>`).join('');$('explainText').innerHTML=`<strong>${pickedLie?'You found it!':'That one is true.'}</strong><div class="details">${details}</div>`;$('explain').hidden=false;$('score').textContent='⭐ '+score+(streak>1?'  🔥'+streak:'');if(window.ArcadeSave)ArcadeSave.touch(100)}
function leave(){ArcadeSave.goHome()}
document.querySelectorAll('#difficulty button').forEach(b=>b.addEventListener('click',()=>setDiff(b.dataset.d)));$('play').addEventListener('click',()=>{$('start').hidden=true;score=streak=0;nextRound()});$('next').addEventListener('click',nextRound);$('menu').addEventListener('click',()=>{$('start').hidden=false});$('load').addEventListener('click',()=>window.ArcadeSave&&ArcadeSave.load());$('home').addEventListener('click',leave);$('back').addEventListener('click',leave);
function seeded(seed){let x=seed>>>0;return()=>((x=Math.imul(1664525,x)+1013904223>>>0)/4294967296)}
window.TruthsDebug={roundCount:ALL.length,factCount:FACTS.length,poolStats:()=>Object.fromEntries(['easy','regular','hard'].map(d=>[d,{rounds:ALL.filter(r=>r[0]===d).length,facts:FACTS.filter(f=>f.difficulty===d).length}])),sample:(n=180,d='easy')=>{const oldOrder=order.slice(),oldRecent=recentFacts.slice(),rng=seeded(24681357),positions=[0,0,0],mixedTopics=new Set();for(let i=0;i<n;i++){const round=makeRound(d,i%2===0,rng),lie=round[2].findIndex(s=>!s[1]);positions[lie]++;if(round[1]==='🎲 Wild Mix')round[2].forEach(s=>mixedTopics.add(s[3]))}order=oldOrder;recentFacts=oldRecent;return{positions,mixedTopicCount:mixedTopics.size,ok:positions.every(v=>v>0)&&mixedTopics.size>3}},validate:()=>{const bad=ALL.filter(r=>r[2].length!==3||r[2].filter(s=>!!s[1]).length!==2);const sample=window.TruthsDebug.sample();return{ok:!bad.length&&ALL.length>=50&&FACTS.length>=150&&sample.ok,badRounds:bad.length,...sample}}};
window.TruthsAutosave={id:'two-truths',title:'Two Truths & a Lie',version:2,capture:()=>current?{difficulty,score,streak,current,order,answered,pickedIndex,recentFacts}:undefined,restore:s=>{if(!s||!Array.isArray(s.current))throw new Error('Invalid facts save');difficulty=['easy','regular','hard'].includes(s.difficulty)?s.difficulty:'easy';score=Math.max(0,Number(s.score)||0);streak=Math.max(0,Number(s.streak)||0);current=s.current;const savedOrder=Array.isArray(s.order)?s.order:[],savedRecent=Array.isArray(s.recentFacts)?s.recentFacts:[],wasAnswered=!!s.answered,savedPick=Math.max(0,Math.min(2,Number(s.pickedIndex)||0));setDiff(difficulty);order=savedOrder;recentFacts=savedRecent.slice(-18);pickedIndex=-1;$('start').hidden=true;render();if(wasAnswered)choose(savedPick,false);return true},meaningful:()=>!!current,summary:()=>`${score} lies found • ${difficulty}`,startFresh:()=>{current=null;score=streak=0;order=[];recentFacts=[];answered=false;pickedIndex=-1;$('start').hidden=false}};setDiff('easy');
})();
</script><script src="../arcade-save.js"></script><script>ArcadeSave.register(window.TruthsAutosave);</script></body></html>
