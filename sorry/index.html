<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Arcade - Sorry! Fire & Ice</title>
<style>
:root{
  --bg:#050609;
  --panel:rgba(255,255,255,.075);
  --panel2:rgba(0,0,0,.38);
  --border:rgba(255,255,255,.18);
  --border2:rgba(255,255,255,.34);
  --gold:#ffd700;
  --cyan:#00e5ff;
  --green:#72ff7b;
  --red:#ff4057;
  --blue:#30a7ff;
  --yellow:#ffd43b;
  --player-green:#35d26f;
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --topbar-h:44px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(circle at 24% 15%,#252834 0,#090a0e 42%,#000 78%);user-select:none;-webkit-user-select:none}
button,input{font:inherit}
button{border:0;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.975)}
button:disabled{opacity:.35;transform:none;cursor:default}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 5px) max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));gap:5px}
#topbar{height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;z-index:30}
.turn-pill{height:38px;min-width:0;flex:1 1 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(0,0,0,.48);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);overflow:hidden}
.turn-dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;border:2px solid rgba(255,255,255,.78);box-shadow:0 0 12px currentColor}
.turn-text{min-width:0;display:flex;flex-direction:column;line-height:1.05}
#turnName{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#turnSub{font-size:10px;color:rgba(255,255,255,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.ui-btn{height:36px;min-width:36px;padding:0 9px;border:1px solid var(--border);border-radius:12px;background:var(--panel);font-weight:900;font-size:12px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.ui-btn:active{background:rgba(255,255,255,.14);border-color:var(--border2)}
#playArea{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px}
#boardWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#board{position:relative;aspect-ratio:1/1;width:min(98vw,calc(100svh - 190px),760px);max-width:100%;max-height:100%;--turn-color:#fff;border-radius:18px;background:conic-gradient(from 270deg at 50% 50%,rgba(255,64,87,.28) 0 25%,rgba(48,167,255,.28) 0 50%,rgba(255,212,59,.27) 0 75%,rgba(53,210,111,.27) 0);border:2px solid rgba(255,255,255,.33);box-shadow:0 14px 36px rgba(0,0,0,.56),inset 0 0 0 2px rgba(0,0,0,.45);overflow:hidden;isolation:isolate;transition:border-color .2s ease,box-shadow .2s ease}
#board.turn-active{border-color:color-mix(in srgb,var(--turn-color) 72%,#fff);box-shadow:0 14px 36px rgba(0,0,0,.56),0 0 22px color-mix(in srgb,var(--turn-color) 38%,transparent),inset 0 0 0 2px rgba(0,0,0,.45)}
#board:after{content:"";position:absolute;inset:6.25%;border:1px solid rgba(255,255,255,.09);pointer-events:none;z-index:1}
.track-cell,.safety-cell{position:absolute;width:6.25%;height:6.25%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.5);background:linear-gradient(145deg,#f6f6f7,#cfd2d7);color:#111;font-size:clamp(7px,1.8vmin,13px);font-weight:1000;z-index:5;overflow:hidden}
.track-cell:nth-child(odd){background:linear-gradient(145deg,#fff,#d9dce2)}
.track-cell.entry{box-shadow:inset 0 0 0 3px var(--cell-color),0 0 10px color-mix(in srgb,var(--cell-color) 55%,transparent)}
.track-cell.entry:before{content:"";width:38%;height:38%;border:2px solid var(--cell-color);border-radius:3px;transform:rotate(45deg);background:rgba(255,255,255,.58)}
.track-cell.start-exit:after{content:"";width:48%;height:48%;border-radius:50%;background:var(--cell-color);border:2px solid rgba(255,255,255,.9);box-shadow:0 0 7px var(--cell-color)}
.track-cell.fire-space{background:radial-gradient(circle,#fff4be 0 24%,#ffb312 26% 52%,#e73d18 54% 74%,#75100c 76%);color:#fff;text-shadow:0 1px 2px #000;border-color:#ffce62}
.track-cell.fire-space:after{content:"🔥";font-size:clamp(10px,2.7vmin,20px);filter:drop-shadow(0 0 4px #ff6400)}
.track-cell.fire-space.start-exit:after{content:"🔥";width:auto;height:auto;border:0;background:none;box-shadow:none}
.track-cell.slide-path{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--slide-a) 27%,#f7f7f8) 0 12%,color-mix(in srgb,var(--slide-b) 27%,#f7f7f8) 12% 24%,color-mix(in srgb,var(--slide-c) 27%,#f7f7f8) 24% 36%)}
.track-cell.slide-end:after{content:"";width:44%;height:44%;border:2px solid #111;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.safety-cell{border-radius:7px;background:color-mix(in srgb,var(--cell-color) 58%,#101218);border-color:color-mix(in srgb,var(--cell-color) 78%,#fff);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);color:#fff;z-index:6}
.safety-cell:after{content:attr(data-step);position:absolute;right:2px;top:1px;font-size:clamp(5px,1.15vmin,8px);opacity:.62;line-height:1}
.safety-cell.safety-entry{box-shadow:inset 0 0 0 2px rgba(255,255,255,.58),0 0 10px color-mix(in srgb,var(--cell-color) 58%,transparent)}
.board-paths{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible}
.board-paths .arrow-shadow{stroke:#08090c;stroke-linecap:round;stroke-linejoin:round;opacity:.94}
.board-paths .arrow-core{stroke-linecap:round;stroke-linejoin:round}
.board-paths .arrow-head-shadow{fill:#08090c;opacity:.96}
.board-paths .arrow-head-core{stroke:rgba(255,255,255,.72);stroke-width:.05;stroke-linejoin:round}
.board-paths .slide-accent{stroke:#fff;opacity:.95}
.zone{position:absolute;z-index:8;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;border:2px solid color-mix(in srgb,var(--zone-color) 78%,#fff);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--zone-color) 80%,#fff),var(--zone-color) 45%,color-mix(in srgb,var(--zone-color) 62%,#000) 100%);box-shadow:0 8px 18px rgba(0,0,0,.42),inset 0 0 0 2px rgba(255,255,255,.12);transition:filter .2s ease,box-shadow .2s ease,transform .2s ease}
.zone.start-zone{width:18.75%;height:18.75%;transform:translate(-50%,-50%)}
.zone.home-zone{width:15.625%;height:15.625%;transform:translate(-50%,-50%)}
.zone.active-turn{filter:brightness(1.18);box-shadow:0 0 0 3px rgba(255,255,255,.72),0 0 18px var(--zone-color),inset 0 0 0 2px rgba(255,255,255,.18)}
.zone-label{font-size:clamp(7px,1.9vmin,14px);font-weight:1000;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.75);pointer-events:none}
.zone-count{font-size:clamp(7px,1.45vmin,11px);font-weight:900;opacity:.78;pointer-events:none}
.center-well{position:absolute;left:35%;top:35%;width:30%;height:30%;z-index:3;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;opacity:.26}
.center-logo{font-size:clamp(17px,5.2vmin,39px);font-weight:1000;letter-spacing:-1.2px;transform:rotate(-26deg);text-shadow:0 0 12px rgba(255,255,255,.28)}
.center-logo span{color:var(--gold)}
.power-center{position:absolute;bottom:5%;display:flex;gap:3px;font-size:clamp(10px,2.5vmin,19px)}
#boardCard{position:absolute;left:50%;top:50%;width:18.5%;aspect-ratio:.69;transform:translate(-50%,-50%) rotate(-4deg);z-index:16;border-radius:9%;border:2px solid rgba(255,255,255,.86);background:repeating-linear-gradient(135deg,#171923 0 8%,#272b38 8% 16%);color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.58),inset 0 0 0 2px rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:auto;overflow:hidden;cursor:default;padding:0;-webkit-tap-highlight-color:transparent}
#boardCard:before,#boardCard:after{content:"";position:absolute;inset:5%;border:1px solid rgba(255,255,255,.28);border-radius:7%;pointer-events:none}
#boardCard:after{inset:11%;border-color:rgba(255,215,0,.34)}
#boardCard.draw-ready{cursor:pointer;animation:deckReady .72s ease-in-out infinite alternate;box-shadow:0 0 0 3px rgba(255,215,0,.24),0 0 22px rgba(255,215,0,.74),0 8px 18px rgba(0,0,0,.58),inset 0 0 0 2px rgba(0,0,0,.22)}
#boardCard.draw-ready:active{transform:translate(-50%,-50%) rotate(-4deg) scale(.93)}
@keyframes deckReady{from{filter:brightness(.94)}to{filter:brightness(1.24)}}
#boardCard.revealed{background:linear-gradient(145deg,#fff,#d5d7dc);color:#111;border-color:#fff}
#boardCard.sorry-card{background:linear-gradient(145deg,#fff,#efefef)}
#boardCardValue{position:relative;z-index:1;font-size:clamp(18px,5.4vmin,42px);font-weight:1000;line-height:.88;letter-spacing:-1px;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#boardCard:not(.revealed) #boardCardValue{font-size:clamp(7px,2.3vmin,17px);letter-spacing:-.7px;transform:rotate(-8deg);color:#fff}
#boardCard.sorry-card #boardCardValue{font-size:clamp(8px,2.4vmin,18px);transform:rotate(-8deg)}
#boardCardText{position:relative;z-index:1;margin-top:8%;padding:0 8%;font-size:clamp(5px,1.15vmin,9px);font-weight:1000;line-height:1.05;max-width:100%}
#boardCard.dealt{animation:dealCard .34s cubic-bezier(.2,.82,.25,1.25)}
@keyframes dealCard{0%{transform:translate(-50%,-50%) rotate(-16deg) scale(.45);opacity:.1}100%{transform:translate(-50%,-50%) rotate(-4deg) scale(1);opacity:1}}
#endpointLayer{position:absolute;inset:0;z-index:28;pointer-events:none}
.endpoint-marker{position:absolute;min-width:34px;height:28px;padding:0 7px;transform:translate(-50%,-50%);border-radius:999px;border:2px solid #fff;background:linear-gradient(180deg,#00e5ff,#0876a8);color:#00151b;font-size:9px;font-weight:1000;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(0,229,255,.27),0 0 19px rgba(0,229,255,.92),0 4px 9px rgba(0,0,0,.7);pointer-events:auto;z-index:28;animation:endpointPulse .7s ease-in-out infinite alternate}
.endpoint-marker.backward{background:linear-gradient(180deg,#ffe46b,#ff9d18);color:#321600;box-shadow:0 0 0 4px rgba(255,215,0,.28),0 0 19px rgba(255,190,20,.92),0 4px 9px rgba(0,0,0,.7)}
.endpoint-marker.split-step{min-width:28px;height:28px;padding:0 5px;background:linear-gradient(180deg,#ffe75f,#ff9d18);color:#2c1600;box-shadow:0 0 0 4px rgba(255,215,0,.25),0 0 18px rgba(255,190,20,.92),0 4px 9px rgba(0,0,0,.7)}
.endpoint-marker.split-finish{background:linear-gradient(180deg,#79ffb0,#14a858);color:#001e0e;box-shadow:0 0 0 4px rgba(58,255,135,.24),0 0 19px rgba(58,255,135,.9),0 4px 9px rgba(0,0,0,.7)}
.endpoint-marker.whole-seven{background:linear-gradient(180deg,#00e5ff,#0876a8);color:#00151b}
.endpoint-marker:after{content:"";position:absolute;inset:-8px;border:2px dashed rgba(255,255,255,.9);border-radius:999px}
@keyframes endpointPulse{from{transform:translate(-50%,-50%) scale(.94)}to{transform:translate(-50%,-50%) scale(1.1)}}
#pawnLayer{position:absolute;inset:0;z-index:20;pointer-events:none}
.pawn{position:absolute;width:4.8%;height:4.8%;min-width:12px;min-height:12px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff 0 8%,var(--pawn-color) 12% 48%,color-mix(in srgb,var(--pawn-color) 56%,#000) 78%);border:1.5px solid rgba(255,255,255,.86);box-shadow:0 3px 7px rgba(0,0,0,.7),0 0 7px color-mix(in srgb,var(--pawn-color) 48%,transparent);display:flex;align-items:center;justify-content:center;font-size:clamp(6px,1.4vmin,10px);font-weight:1000;color:#fff;text-shadow:0 1px 2px #000;pointer-events:auto;transition:transform .16s ease,filter .16s ease,opacity .16s ease;z-index:22;opacity:.7}
.pawn:before{content:"";position:absolute;width:48%;height:48%;border-radius:50%;top:-19%;left:26%;background:radial-gradient(circle at 35% 25%,#fff 0 10%,var(--pawn-color) 15% 56%,color-mix(in srgb,var(--pawn-color) 55%,#000) 82%);border:1px solid rgba(255,255,255,.72);box-shadow:0 2px 4px rgba(0,0,0,.45)}
.pawn.current-turn{opacity:1;filter:saturate(1.18) brightness(1.08);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 4px color-mix(in srgb,var(--pawn-color) 72%,transparent),0 0 14px var(--pawn-color),0 4px 8px rgba(0,0,0,.72);z-index:24}
.pawn.waiting{filter:saturate(.68) brightness(.78)}
.pawn.selectable{opacity:1;animation:pulsePawn .7s ease-in-out infinite alternate;filter:saturate(1.25) brightness(1.2);cursor:pointer;z-index:29}
.pawn.targetable{animation:targetPawn .66s ease-in-out infinite alternate;box-shadow:0 0 0 3px rgba(0,229,255,.9),0 0 18px rgba(0,229,255,.78)}
.pawn.selected{animation:none;transform:translate(-50%,-50%) scale(1.3);box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 6px rgba(255,215,0,.92),0 0 22px rgba(255,215,0,.88);z-index:31}
.pawn.cpu-pawn{cursor:default}
.move-badge{position:absolute;left:50%;bottom:-68%;transform:translateX(-50%);min-width:18px;height:13px;padding:0 3px;border-radius:999px;background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;font-size:clamp(5px,1.25vmin,9px);line-height:1;font-weight:1000;color:#fff;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.72);z-index:5}
.pawn.has-fire{box-shadow:0 0 0 3px #fff,0 0 0 7px #ff7217,0 0 25px #ff3b00,0 4px 8px rgba(0,0,0,.75)!important}
.pawn.has-ice{box-shadow:0 0 0 3px #fff,0 0 0 7px #39cfff,0 0 25px #00a9ff,0 4px 8px rgba(0,0,0,.75)!important}
.pawn.has-fire.has-ice{box-shadow:-7px 0 0 4px #ff7217,7px 0 0 4px #39cfff,0 0 0 3px #fff,0 0 27px #fff!important}
.power-badge{position:absolute;right:-61%;top:-69%;min-width:21px;height:21px;padding:0 3px;border-radius:999px;background:#5b1700;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;box-shadow:0 0 12px #ff5a00,0 3px 6px rgba(0,0,0,.8);z-index:7}
.power-badge.ice{left:-61%;right:auto;background:#064b75;box-shadow:0 0 12px #00c8ff,0 3px 6px rgba(0,0,0,.8)}
@keyframes pulsePawn{from{transform:translate(-50%,-50%) scale(1.04)}to{transform:translate(-50%,-50%) scale(1.24);box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 0 6px rgba(255,215,0,.82),0 0 20px rgba(255,215,0,.72)}}
@keyframes targetPawn{from{transform:translate(-50%,-50%) scale(1.02)}to{transform:translate(-50%,-50%) scale(1.2);box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 6px rgba(0,229,255,.82),0 0 20px rgba(0,229,255,.75)}}
#controlPanel{flex:0 0 140px;min-height:0;width:min(760px,100%);align-self:center;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(0,0,0,.34));border-radius:16px;padding:7px;display:grid;grid-template-columns:86px minmax(0,1fr);grid-template-rows:36px minmax(0,1fr);gap:6px;box-shadow:var(--shadow);overflow:hidden}
#cardDisplay{grid-column:1;grid-row:1/3;border-radius:11px;border:2px solid rgba(255,255,255,.5);background:linear-gradient(145deg,#f9f9fa,#cfd1d6);color:#13141a;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 12px rgba(0,0,0,.35);overflow:hidden;min-width:0;padding:0;cursor:default}
#cardDisplay.draw-ready{cursor:pointer;border-color:#fff0a0;box-shadow:0 0 0 3px rgba(255,215,0,.18),0 0 18px rgba(255,215,0,.43),0 5px 12px rgba(0,0,0,.35)}
#cardValue{font-size:34px;line-height:.95;font-weight:1000;letter-spacing:-1px;text-align:center}
#cardMini{font-size:10px;font-weight:1000;text-align:center;line-height:1.08;padding:4px 5px;max-width:100%}
#cardDisplay.sorry-card{background:linear-gradient(145deg,#fff,#ececec);color:#111}
#cardDisplay.sorry-card #cardValue{font-size:13px;letter-spacing:-.6px;transform:rotate(-8deg)}
#message{grid-column:2;grid-row:1;min-width:0;border-radius:10px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:5px 9px;font-weight:1000;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#choices{grid-column:2;grid-row:2;min-width:0;display:flex;align-content:center;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;overflow:hidden}
.action-btn{min-height:38px;max-height:48px;min-width:82px;flex:1 1 98px;padding:6px 9px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.09);font-weight:1000;font-size:12px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center}
.action-btn.draw-action{min-height:52px;max-height:58px;font-size:17px;letter-spacing:.6px;background:linear-gradient(180deg,#ffe968,#efad00);border-color:#fff2a0;color:#271900;box-shadow:0 6px 15px rgba(255,190,0,.24)}
.action-btn.primary{background:linear-gradient(180deg,rgba(255,215,0,.34),rgba(255,215,0,.12));border-color:rgba(255,215,0,.64);color:#fff9c5}
.action-btn.cyan{background:linear-gradient(180deg,rgba(0,229,255,.28),rgba(0,229,255,.1));border-color:rgba(0,229,255,.52)}
.action-btn.danger{background:linear-gradient(180deg,rgba(255,64,87,.28),rgba(255,64,87,.1));border-color:rgba(255,64,87,.52)}
.hand-row{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.hand-card{height:47px;border-radius:9px;border:1px solid rgba(255,255,255,.48);background:linear-gradient(145deg,#fafafa,#cfd2d8);color:#111;font-size:17px;font-weight:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.hand-card span{font-size:7px;margin-top:2px}
.hand-card.sorry{font-size:8px;transform:none}
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.panel{width:min(620px,96vw);max-height:96svh;border:1px solid var(--border2);border-radius:19px;background:linear-gradient(160deg,rgba(35,38,48,.97),rgba(8,9,13,.98));box-shadow:0 20px 55px rgba(0,0,0,.72);padding:11px;overflow:hidden}
.panel-title{font-size:clamp(25px,6.7vw,42px);line-height:.92;color:#fff;font-weight:1000;text-align:center;letter-spacing:-2px;text-shadow:0 0 18px rgba(255,255,255,.2)}
.panel-title span{color:var(--gold)}
.panel-sub{text-align:center;font-size:11px;color:rgba(255,255,255,.68);font-weight:800;margin-top:4px}
.setup-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}
.setup-box{border:1px solid var(--border);background:rgba(0,0,0,.24);border-radius:13px;padding:7px;min-width:0}
.setup-label{font-size:10px;font-weight:1000;color:rgba(255,255,255,.78);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.choice-row{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:4px}
.choice{height:32px;padding:0 4px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.07);font-size:10px;font-weight:1000;line-height:1}
.choice.active{background:rgba(255,215,0,.18);border-color:rgba(255,215,0,.74);color:#fff4a6;box-shadow:inset 0 0 0 1px rgba(255,215,0,.18)}
.player-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.player-row{height:44px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.055);display:grid;grid-template-columns:50px minmax(0,1fr) 63px;gap:5px;align-items:center;padding:5px 6px;min-width:0}

<body>
<div id="app">
  <header id="topbar">
    <div class="turn-pill">

    <section id="controlPanel">

      <div id="message">Set up a new game.</div>
      <div id="choices"><button class="action-btn primary" id="openSetupBtn" type="button">New Game</button><button class="action-btn cyan" id="quickLoadBtn" type="button">Load Saved</button></div>

</div>
<div class="overlay" id="setupOverlay">

      <div class="setup-box"><div class="setup-label">Rules</div><div class="choice-row" style="--count:3" id="modeChoices"><button class="choice active" data-value="fireIce" type="button">F&amp;I</button><button class="choice" data-value="classic" type="button">Classic</button><button class="choice" data-value="strategic" type="button">5 Card</button></div></div>
      <div class="setup-box"><div class="setup-label">CPU Skill</div><div class="choice-row" style="--count:3" id="skillChoices"><button class="choice" data-value="1" type="button">1</button><button class="choice active" data-value="2" type="button">2</button><button class="choice" data-value="3" type="button">3</button></div></div>

function logicalStep(pawn,direction){
  const next={id:pawn.id,player:pawn.player,slot:pawn.slot,zone:pawn.zone,pos:pawn.pos};
  const color=getColorByPlayer(next.player);
  if(direction==="backward"){
    if(next.zone==="safety"){
      if(next.pos>0)next.pos--;
      else{next.zone="track";next.pos=color.entry;}
    }else if(next.zone==="track")next.pos=(next.pos+59)%60;
    return next;

    else next.pos=(next.pos+1)%60;

    if(next.pos<4)next.pos++;
    else{next.zone="home";next.pos=0;}
  }

}
function moveFrames(beforePawn,plan){

    let cursor={id:beforePawn.id,player:beforePawn.player,slot:beforePawn.slot,zone:"track",pos:getColorByPlayer(beforePawn.player).start};
    frames.push(pawnScreenPosition(cursor));
    for(let i=1;i<plan.amount;i++){cursor=logicalStep(cursor,"forward");frames.push(pawnScreenPosition(cursor));}
  }else{
    let cursor={id:beforePawn.id,player:beforePawn.player,slot:beforePawn.slot,zone:beforePawn.zone,pos:beforePawn.pos};
    for(let i=0;i<plan.amount;i++){cursor=logicalStep(cursor,plan.kind);frames.push(pawnScreenPosition(cursor));}
  }

function animatePawnFrames(pawnId,frames,delay){

function chooseCpuAction(actions,forceSmart){
  if(!actions.length)return null;
  if(forceSmart)return actions.map(function(a){return{a:a,s:scoreAction(a)};}).sort(function(x,y){return y.s-x.s;})[0].a;
  if(state.skill===1)return actions[Math.floor(Math.random()*actions.length)];
  const ranked=actions.map(function(a){return{a:a,s:scoreAction(a)+Math.random()*(state.skill===2?25:2)};}).sort(function(x,y){return y.s-x.s;});
  if(state.skill===2)return ranked[Math.floor(Math.random()*Math.min(3,ranked.length))].a;
  return ranked[0].a;
}
function maybeCpu(){
  clearTimeout(cpuTimer);
  if(!state||state.winner!==null||state.phase==="resolving"||(!currentPlayer().cpu&&autoPlayerId!==state.turn))return;
  cpuTimer=setTimeout(cpuStep,520);
}
function autoPlayTurn(){
  if(!state||state.winner!==null||currentPlayer().cpu||state.phase==="resolving"||state.phase==="noMove")return;
  autoPlayerId=state.turn;showToast("Auto is choosing the smartest move.");cpuStep();
}
function cpuStep(){
  if(!state||state.winner!==null||(!currentPlayer().cpu&&autoPlayerId!==state.turn))return;
  const forceSmart=!currentPlayer().cpu&&autoPlayerId===state.turn;
  if(state.phase==="preFire"){
    const plan=planFireJump(state,state.firePawnId);
    if(plan){
      const copy=cloneGame(state);const before=scoreState(copy,state.turn);applyFireJump(copy,plan);const gain=scoreState(copy,state.turn)-before;
      useFireJump(!forceSmart&&state.skill===1?Math.random()>.45:gain>=0);
    }else useFireJump(false);
    return;
  }
  if(state.phase==="draw"){drawCard();return;}
  if(state.phase==="chooseCard"){
    const hand=state.hands[state.turn];
    const options=hand.map(function(card,index){const actions=legalActionsForCard(state,card,state.turn);const best=actions.length?Math.max.apply(null,actions.map(scoreAction)):-30;const tokenBonus=card==="1"||card==="2"?12:0;return{index:index,score:best+tokenBonus+(forceSmart?0:Math.random()*(state.skill===1?90:state.skill===2?22:2))};}).sort(function(a,b){return b.score-a.score;});
    chooseHandCard(options[0].index);return;
  }
  if(state.phase==="ice"){
    const targets=iceTokenTargets();
    if(!targets.length){state.icePawnId=null;beginAction();return;}
    targets.sort(function(a,b){const af=(state.firePawnId===a.id?30:0)+positionProgress(state,a);const bf=(state.firePawnId===b.id?30:0)+positionProgress(state,b);return bf-af;});
    moveIceTo(!forceSmart&&state.skill===1?targets[Math.floor(Math.random()*targets.length)].id:targets[0].id);return;
  }
  if(state.phase==="fireToken"){
    const own=fireTokenTargets();
    if(!own.length){beginAction();return;}
    own.sort(function(a,b){return positionProgress(state,b)-positionProgress(state,a);});
    moveFireTo(!forceSmart&&state.skill===1?own[Math.floor(Math.random()*own.length)].id:own[0].id);return;
  }
  if(state.phase==="firePull"){
    const candidates=firePullCandidates();
    candidates.sort(function(a,b){return positionProgress(state,a)-positionProgress(state,b);});
    pullPawnHome(candidates.length?candidates[0].id:null);return;
  }
  if(state.phase==="action"){
    const actions=legalActionsForCard(state,state.currentCard,state.turn);
    const action=chooseCpuAction(actions,forceSmart);
    if(action)performAction(action);else finishCard();
  }
}
function announce(text){el.message.textContent=text;showToast(text);sound(430,.045);}
function showToast(text){clearTimeout(toastTimer);el.toast.textContent=text;el.toast.classList.add("show");toastTimer=setTimeout(function(){el.toast.classList.remove("show");},1500);}
function sound(freq,duration){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(18);}catch(e){}
}
function saveGame(show){
  const saved=heldSave||state;
  if(!saved||!saved.started||saved.winner!==null){if(show)showToast("No active game to save.");return false;}
  try{const snapshot=cloneGame(saved);snapshot.savedAt=Date.now();if(!heldSave)state.savedAt=snapshot.savedAt;localStorage.setItem(SAVE_KEY,JSON.stringify({version:VERSION,savedAt:snapshot.savedAt,state:snapshot}));if(show&&window.ArcadeSave)ArcadeSave.saveNow();if(show)showToast("Game saved.");return true;}catch(e){if(show)showToast("Save failed.");return false;}
}
function autoSave(){saveGame(false);}
function migrateSave(saved){
  if(!saved||!saved.started)return null;
  if(saved.version===VERSION)return saved;
  const starts=OLD_STARTS[saved.version];
  if(!starts)return null;
  const migrated=cloneGame(saved);
  migrated.pawns.forEach(function(pawn){
    if(pawn.zone!=="track")return;
    const progress=(pawn.pos-starts[pawn.player]+60)%60;
    pawn.pos=(COLORS[pawn.player].start+progress)%60;
  });
  migrated.version=VERSION;
  return migrated;
}
function applyLoadedGame(saved,show){
  clearTimeout(cpuTimer);clearTimeout(animationTimer);
  const loaded=migrateSave(saved);
  if(!validSave(loaded))return false;
  heldSave=null;state=loaded;undoStack=[];autoPlayerId=null;
  if(typeof state.pendingFirePull!=="boolean")state.pendingFirePull=false;
  if(!state.flow||typeof state.flow!=="object")state.flow={};
  selectedPawnId=null;selectedTargetId=null;selectedAmount=null;selectedMode=null;lastBoardCard=null;
  el.setupOverlay.classList.add("hidden");el.menuOverlay.classList.add("hidden");el.rulesOverlay.classList.add("hidden");el.winOverlay.classList.add("hidden");hideKeyboard();
  render();if(show)showToast("Saved game loaded.");
  if(state.phase==="noMove")animationTimer=setTimeout(function(){if(state&&state.phase==="noMove")finishCard();},500);
  else if(state.phase==="resolving")animationTimer=setTimeout(completeResolvedAction,300);
  else maybeCpu();
  return true;
}
function loadGame(show){
  if(show&&window.ArcadeSave&&ArcadeSave.hasSave()){ArcadeSave.load();return true;}
  let data=null;
  try{data=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");}catch(e){}
  if(!applyLoadedGame(data&&data.state?data.state:data,show)){if(show)showToast("No saved game found.");return false;}
  if(data&&data.state&&data.state.version!==VERSION)saveGame(false);
  return true;
}
function validSave(s){return!!(s&&s.version===VERSION&&s.started&&Array.isArray(s.players)&&s.players.length>=2&&s.players.length<=4&&Array.isArray(s.pawns)&&s.pawns.length===s.players.length*3&&s.winner===null);}
function currentStateMeaningful(){return!!(state&&state.started&&state.winner===null);}
function holdCurrentSave(){if(!heldSave&&currentStateMeaningful())heldSave=cloneGame(state);}
function effectiveState(){return cloneGame(heldSave||state);}
function freshSetup(){
  clearTimeout(cpuTimer);clearTimeout(animationTimer);
  heldSave=null;state=null;undoStack=[];autoPlayerId=null;selectedPawnId=null;selectedTargetId=null;selectedAmount=null;selectedMode=null;lastBoardCard=null;
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
  hideKeyboard();el.menuOverlay.classList.add("hidden");el.rulesOverlay.classList.add("hidden");el.winOverlay.classList.add("hidden");el.setupOverlay.classList.remove("hidden");
  render();
}
function registerArcadeSave(){
  if(!window.ArcadeSave)return;
  window.ArcadeSave.register({
    id:"sorry",
    title:"Sorry!",
    version:VERSION,
    capture:effectiveState,
    restore:function(saved){if(!applyLoadedGame(saved,false))throw new Error("Invalid Sorry save");return true;},
    meaningful:function(){return!!heldSave||currentStateMeaningful();},
    summary:function(){
      const data=heldSave||state;if(!data||data.winner!==null)return"";
      const p=data.players[data.turn];const home=data.pawns.filter(function(x){return x.player===p.id&&x.zone==="home";}).length;
      return p.name+"'s turn · "+home+" of 3 pawns Home";
    },
    startFresh:freshSetup
  });
}
function openRules(){clearTimeout(toastTimer);el.toast.classList.remove("show");ruleIndex=0;renderRules();el.rulesOverlay.classList.remove("hidden");}
function renderRules(){const page=RULE_PAGES[ruleIndex];el.rulesPage.innerHTML="<h3>"+page.title+"</h3>"+page.html;el.rulesCount.textContent=(ruleIndex+1)+" of "+RULE_PAGES.length;el.rulesPrevBtn.disabled=ruleIndex===0;el.rulesNextBtn.disabled=ruleIndex===RULE_PAGES.length-1;}
function confetti(){
  const wrap=document.createElement("div");wrap.className="confetti";
  for(let i=0;i<55;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.setProperty("--h",String(Math.floor(Math.random()*360)));p.style.setProperty("--d",(1.8+Math.random()*2.2)+"s");p.style.setProperty("--r",Math.floor(Math.random()*180)+"deg");p.style.setProperty("--x",(Math.random()*160-80)+"px");p.style.animationDelay=Math.random()*.7+"s";wrap.appendChild(p);}
  document.body.appendChild(wrap);setTimeout(function(){wrap.remove();},4800);
}
function selectChoice(container,value){Array.from(container.querySelectorAll(".choice")).forEach(function(b){b.classList.toggle("active",b.dataset.value===String(value));});}
function updateSetupRows(){
  Array.from(document.querySelectorAll(".player-row")).forEach(function(row){row.classList.toggle("hidden",Number(row.dataset.player)>=setup.count);});
  updateSetupColors();
}
function updateSetupColors(){
  Array.from(document.querySelectorAll(".player-row")).forEach(function(row){
    const i=Number(row.dataset.player);const color=COLORS[setup.colors[i]];row.style.setProperty("--row-color",color.hex);
    const button=row.querySelector(".player-color");if(button){button.textContent=color.name.toUpperCase();button.setAttribute("aria-label","Change "+color.name+" player color");}
  });
}
function cyclePlayerColor(playerIndex){
  const oldColor=setup.colors[playerIndex];const nextColor=(oldColor+1)%COLORS.length;const owner=setup.colors.indexOf(nextColor);
  setup.colors[playerIndex]=nextColor;if(owner>=0&&owner!==playerIndex)setup.colors[owner]=oldColor;updateSetupColors();
}
function openKeyboard(input){
  activeInput=input;Array.from(document.querySelectorAll(".name-input")).forEach(function(x){x.classList.toggle("active-input",x===input);});el.keyboardDisplay.textContent=input.value||" ";el.keyboard.classList.add("open");el.keyboard.classList.remove("expanded");el.keyboard.setAttribute("aria-hidden","false");document.body.classList.add("keyboard-open");
}
function hideKeyboard(){if(activeInput)activeInput.classList.remove("active-input");activeInput=null;el.keyboard.classList.remove("open","expanded");el.keyboard.setAttribute("aria-hidden","true");document.body.classList.remove("keyboard-open");}
function keyboardInput(value,replace){
  if(!activeInput)return;
  if(replace)activeInput.value=value.slice(0,14);else activeInput.value=(activeInput.value+value).slice(0,14);
  el.keyboardDisplay.textContent=activeInput.value||" ";
  activeInput.dispatchEvent(new Event("input",{bubbles:true}));
}
function bind(){
  $("playerCountChoices").addEventListener("click",function(e){const b=e.target.closest(".choice");if(!b)return;setup.count=Number(b.dataset.value);selectChoice(this,setup.count);updateSetupRows();});
  $("modeChoices").addEventListener("click",function(e){const b=e.target.closest(".choice");if(!b)return;setup.mode=b.dataset.value;selectChoice(this,setup.mode);});
  $("skillChoices").addEventListener("click",function(e){const b=e.target.closest(".choice");if(!b)return;setup.skill=Number(b.dataset.value);selectChoice(this,setup.skill);});
  $("endpointChoices").addEventListener("click",function(e){const b=e.target.closest(".choice");if(!b)return;setup.showEndpoints=b.dataset.value==="on";selectChoice(this,b.dataset.value);});
  Array.from(document.querySelectorAll(".player-color")).forEach(function(b){b.addEventListener("click",function(){cyclePlayerColor(Number(this.dataset.player));});});
  Array.from(document.querySelectorAll(".type-toggle")).forEach(function(b){b.addEventListener("click",function(){const i=Number(this.dataset.player);setup.cpu[i]=!setup.cpu[i];this.textContent=setup.cpu[i]?"CPU":"Human";this.classList.toggle("active",setup.cpu[i]);});});
  Array.from(document.querySelectorAll(".name-input")).forEach(function(input){input.addEventListener("click",function(){openKeyboard(this);});input.addEventListener("pointerdown",function(e){e.preventDefault();openKeyboard(this);});});
  el.keyboard.addEventListener("click",function(e){const b=e.target.closest("button");if(!b)return;const name=b.dataset.kName;const char=b.dataset.kChar;const action=b.dataset.kAction;if(name)keyboardInput(name,true);else if(char)keyboardInput(char,false);else if(action==="space")keyboardInput(" ",false);else if(action==="back"&&activeInput){activeInput.value=activeInput.value.slice(0,-1);el.keyboardDisplay.textContent=activeInput.value||" ";}else if(action==="clear")keyboardInput("",true);else if(action==="letters")el.keyboard.classList.toggle("expanded");else if(action==="done")hideKeyboard();});
  $("startBtn").addEventListener("click",createGame);
  el.boardCard.addEventListener("click",function(){if(state&&state.phase==="draw"&&!currentPlayer().cpu)drawCard();});
  el.cardDisplay.addEventListener("click",function(){if(state&&state.phase==="draw"&&!currentPlayer().cpu)drawCard();});
  $("setupLoadBtn").addEventListener("click",function(){loadGame(true);});
  $("setupBackBtn").addEventListener("click",goToArcade);
  $("saveBtn").addEventListener("click",function(){saveGame(true);});
  $("loadBtn").addEventListener("click",function(){loadGame(true);});
  $("undoBtn").addEventListener("click",undoMove);
  $("autoBtn").addEventListener("click",autoPlayTurn);
  $("menuBtn").addEventListener("click",function(){el.menuOverlay.classList.remove("hidden");});
  $("resumeBtn").addEventListener("click",function(){el.menuOverlay.classList.add("hidden");});
  $("menuUndoBtn").addEventListener("click",undoMove);
  $("menuSaveBtn").addEventListener("click",function(){saveGame(true);el.menuOverlay.classList.add("hidden");});
  $("rulesBtn").addEventListener("click",function(){el.menuOverlay.classList.add("hidden");openRules();});
  $("newGameBtn").addEventListener("click",function(){el.menuOverlay.classList.add("hidden");el.setupOverlay.classList.remove("hidden");});
  $("arcadeBtn").addEventListener("click",goToArcade);
  $("openSetupBtn").addEventListener("click",function(){el.setupOverlay.classList.remove("hidden");});
  $("quickLoadBtn").addEventListener("click",function(){loadGame(true);});
  $("rulesCloseBtn").addEventListener("click",function(){el.rulesOverlay.classList.add("hidden");});
  el.rulesPrevBtn.addEventListener("click",function(){if(ruleIndex>0){ruleIndex--;renderRules();}});
  el.rulesNextBtn.addEventListener("click",function(){if(ruleIndex<RULE_PAGES.length-1){ruleIndex++;renderRules();}});
  $("playAgainBtn").addEventListener("click",function(){el.winOverlay.classList.add("hidden");el.setupOverlay.classList.remove("hidden");});
  $("winArcadeBtn").addEventListener("click",goToArcade);
  window.addEventListener("beforeunload",function(){saveGame(false);});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")saveGame(false);});
  window.addEventListener("pageshow",function(){render();});
}
function goToArcade(){
  clearTimeout(cpuTimer);clearTimeout(animationTimer);saveGame(false);
  const leave=function(){location.href="../index.html";};
  try{
    if(window.ArcadeSave&&typeof ArcadeSave.saveNow==="function"){
      Promise.resolve(ArcadeSave.saveNow()).then(leave,leave);
      return;
    }
  }catch(e){}
  leave();
}
function init(){
  buildBoard();bind();updateSetupRows();render();
  let wantsLoad=false;try{const q=new URLSearchParams(location.search);wantsLoad=q.get("load")==="1"||q.get("resume")==="1";}catch(e){}
  if(wantsLoad&&!loadGame(false))el.setupOverlay.classList.remove("hidden");
}
window.SorryGame={saveGame:function(){return saveGame(true);},loadGame:function(){return loadGame(true);},newGame:createGame,getState:function(){return state;}};
init();
registerArcadeSave();
})();
</script>
