function trimText(value){return String(value||'').replace(/^\s+|\s+$/g,'').replace(/\s+/g,' ');}
function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function randomItem(list){return list[Math.floor(Math.random()*list.length)];}
function announce(text){liveStatus.textContent='';window.setTimeout(function(){liveStatus.textContent=text;},20);}
function showScreen(screen){pickerScreen.className='screen panel hidden';wordsScreen.className='screen panel hidden';resultScreen.className='screen panel hidden';screen.className='screen panel';window.scrollTo(0,0);}
function filteredStoryIndexes(){var out=[];var i;for(i=0;i<stories.length;i++){if(activeCategory==='all'||stories[i].category===activeCategory){out.push(i);}}return out;}
function pickUnique(pool,count,avoid){var copy=[];var i;var value;avoid=trimText(avoid).toLowerCase();for(i=0;i<pool.length;i++){if(String(pool[i]).toLowerCase()!==avoid){copy.push(pool[i]);}}for(i=copy.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));value=copy[i];copy[i]=copy[j];copy[j]=value;}return copy.slice(0,Math.min(count,copy.length));}
function categoryById(id){var i;for(i=0;i<categories.length;i++){if(categories[i].id===id){return categories[i];}}return categories[0];}

function renderCategories(){categoryRow.innerHTML='';var i;for(i=0;i<categories.length;i++){(function(category){var button=document.createElement('button');button.type='button';button.className='category-button'+(category.id===activeCategory?' active':'');button.setAttribute('aria-pressed',category.id===activeCategory?'true':'false');button.textContent=category.icon+' '+category.label;button.onclick=function(){activeCategory=category.id;visibleLimit=18;renderCategories();renderStoryGrid();};categoryRow.appendChild(button);})(categories[i]);}}

function renderStoryGrid(){var indexes=filteredStoryIndexes();var shown=indexes.slice(0,visibleLimit);storyGrid.innerHTML='';var i;for(i=0;i<shown.length;i++){(function(index){var item=stories[index];var button=document.createElement('button');button.type='button';button.className='story-card';button.setAttribute('aria-label','Choose '+item.title);var icon=document.createElement('span');icon.className='story-card-icon';icon.setAttribute('aria-hidden','true');icon.textContent=item.icon;var title=document.createElement('span');title.className='story-card-title';title.textContent=item.title;button.appendChild(icon);button.appendChild(title);button.onclick=function(){startStory(index);};storyGrid.appendChild(button);})(shown[i]);}var category=categoryById(activeCategory);pickerCount.textContent=indexes.length+' '+(indexes.length===1?'story':'stories')+(activeCategory==='all'?'':' in '+category.label);moreStoriesButton.className=indexes.length>visibleLimit?'more-button':'more-button hidden';}

function getInputs(){return promptList.getElementsByTagName('input');}
function updateProgress(){var inputs=getInputs();var filled=0;var i;for(i=0;i<inputs.length;i++){if(trimText(inputs[i].value)){filled++;}}progressText.textContent=filled+' of '+inputs.length;progressFill.style.width=(inputs.length?Math.round((filled/inputs.length)*100):0)+'%';}

function populateIdeas(panel,input,type){panel.innerHTML='';var pool=suggestions[type]||[];var ideas=pickUnique(pool,6,input.value);var i;for(i=0;i<ideas.length;i++){(function(value){var chip=document.createElement('button');chip.type='button';chip.className='idea-chip';chip.textContent=value;chip.onclick=function(){input.value=value;updateProgress();panel.className='ideas-panel hidden';input.focus();announce(value+' selected');};panel.appendChild(chip);})(ideas[i]);}panel.className='ideas-panel';}

function buildPromptCard(index,prompt,total){var type=prompt[0];var info=meta[type]||{label:prompt[1]||type,hint:'a word',example:''};var card=document.createElement('div');card.className='prompt-card';var top=document.createElement('div');top.className='prompt-top';var number=document.createElement('div');number.className='prompt-number';number.textContent=String(index+1);var copy=document.createElement('div');copy.className='prompt-copy';var label=document.createElement('label');label.className='prompt-label';label.setAttribute('for','word_'+index);label.textContent=info.label;var hint=document.createElement('span');hint.className='prompt-hint';hint.id='hint_'+index;hint.textContent=info.hint+(info.example?' - like “'+info.example+'”':'');copy.appendChild(label);copy.appendChild(hint);top.appendChild(number);top.appendChild(copy);var row=document.createElement('div');row.className='prompt-input-row';var input=document.createElement('input');input.type='text';input.className='prompt-input';input.id='word_'+index;input.setAttribute('data-index',String(index));input.setAttribute('data-type',type);input.setAttribute('aria-describedby',hint.id);input.setAttribute('autocomplete','off');input.setAttribute('autocapitalize','none');input.setAttribute('autocorrect','off');input.setAttribute('spellcheck','false');input.setAttribute('inputmode','text');input.setAttribute('enterkeyhint',index===total-1?'done':'next');input.placeholder='Type a word';input.oninput=updateProgress;input.onkeydown=function(event){event=event||window.event;var key=event.key||event.keyCode;if(key==='Enter'||key===13){if(event.preventDefault){event.preventDefault();}var inputs=getInputs();if(index<inputs.length-1){inputs[index+1].focus();}else{makeStory();}return false;}};var ideasButton=document.createElement('button');ideasButton.type='button';ideasButton.className='idea-button';ideasButton.textContent='💡 Ideas';var panel=document.createElement('div');panel.className='ideas-panel hidden';ideasButton.onclick=function(){populateIdeas(panel,input,type);ideasButton.textContent='↻ More';};row.appendChild(input);row.appendChild(ideasButton);card.appendChild(top);card.appendChild(row);card.appendChild(panel);return card;}

function startStory(index){stopSpeaking();currentStoryIndex=index;var item=stories[index];wordsStoryIcon.textContent=item.icon;wordsStoryTitle.textContent=item.title;promptList.innerHTML='';var i;for(i=0;i<item.prompts.length;i++){promptList.appendChild(buildPromptCard(i,item.prompts[i],item.prompts.length));}updateProgress();showScreen(wordsScreen);announce(item.title+' selected. Fill in '+item.prompts.length+' words.');window.setTimeout(function(){var inputs=getInputs();if(inputs.length){inputs[0].focus();}},80);}

function fillEmpty(){if(currentStoryIndex<0){return;}var inputs=getInputs();var i;for(i=0;i<inputs.length;i++){if(!trimText(inputs[i].value)){var pool=suggestions[inputs[i].getAttribute('data-type')]||[];if(pool.length){inputs[i].value=randomItem(pool);}}}updateProgress();announce('All empty boxes were filled.');}

function makeStory(){if(currentStoryIndex<0){return;}stopSpeaking();var item=stories[currentStoryIndex];var inputs=getInputs();var values=[];var i;for(i=0;i<inputs.length;i++){var value=trimText(inputs[i].value);if(!value){var pool=suggestions[inputs[i].getAttribute('data-type')]||[];value=pool.length?randomItem(pool):meta[inputs[i].getAttribute('data-type')].example;inputs[i].value=value;}values.push(value);}updateProgress();var html=item.template.replace(/\{(\d+)\}/g,function(match,indexText){var value=values[parseInt(indexText,10)]||'';return '<span class="filled-word">'+escapeHtml(value)+'</span>';});storyOutput.innerHTML=html;lastStoryText=trimText(storyOutput.textContent||storyOutput.innerText||'');resultTitle.textContent=item.icon+' '+item.title;showScreen(resultScreen);announce('Your story is ready.');}

function speechSupported(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance);}
function makeSpeechChunks(text){var raw=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];var chunks=[];var current='';var i;for(i=0;i<raw.length;i++){var part=trimText(raw[i]);if(!part){continue;}if(current&&current.length+part.length+1>220){chunks.push(current);current=part;}else{current=current?current+' '+part:part;}}if(current){chunks.push(current);}return chunks;}
function resetSpeakButton(){speaking=false;speakButton.className='speak-button';speakButton.textContent='🔊 Read It Aloud';}
function stopSpeaking(){if(speechSupported()){window.speechSynthesis.cancel();}speechQueue=[];speechPosition=0;resetSpeakButton();}
function speakNext(){if(!speaking||speechPosition>=speechQueue.length){resetSpeakButton();return;}var utterance=new SpeechSynthesisUtterance(speechQueue[speechPosition]);utterance.rate=.93;utterance.pitch=1;utterance.volume=1;utterance.onend=function(){speechPosition++;speakNext();};utterance.onerror=function(){resetSpeakButton();};window.speechSynthesis.speak(utterance);}
function toggleSpeech(){if(!speechSupported()){window.alert('Reading aloud is not available in this browser.');return;}if(speaking){stopSpeaking();return;}var text=lastStoryText||trimText(storyOutput.textContent||storyOutput.innerText||'');if(!text){return;}window.speechSynthesis.cancel();speechQueue=makeSpeechChunks(text);speechPosition=0;speaking=true;speakButton.className='speak-button speaking';speakButton.textContent='■ Stop Reading';speakNext();}

randomStoryButton.onclick=function(){var indexes=filteredStoryIndexes();if(!indexes.length){indexes=[];var i;for(i=0;i<stories.length;i++){indexes.push(i);}}startStory(randomItem(indexes));};
moreStoriesButton.onclick=function(){visibleLimit+=18;renderStoryGrid();};
backToStoriesButton.onclick=function(){stopSpeaking();showScreen(pickerScreen);};
fillEmptyButton.onclick=fillEmpty;
makeStoryButton.onclick=makeStory;
editWordsButton.onclick=function(){stopSpeaking();showScreen(wordsScreen);};
pickAnotherButton.onclick=function(){stopSpeaking();showScreen(pickerScreen);};
speakButton.onclick=toggleSpeech;
window.onbeforeunload=stopSpeaking;

window.MadLibsAutosave={
id:'mad-libs',title:'Mad Libs',version:1,
capture:function(){
var values=[];var inputs=getInputs();var i;for(i=0;i<inputs.length;i++){values.push(inputs[i].value||'');}
var screen=resultScreen.className.indexOf('hidden')===-1?'result':(wordsScreen.className.indexOf('hidden')===-1?'words':'picker');
return{storyIndex:currentStoryIndex,activeCategory:activeCategory,visibleLimit:visibleLimit,values:values,screen:screen};
},
restore:function(saved){
if(!saved||typeof saved.storyIndex!=='number'||saved.storyIndex<0||saved.storyIndex>=stories.length){throw new Error('Invalid Mad Libs save');}
stopSpeaking();
activeCategory=categories.some(function(c){return c.id===saved.activeCategory;})?saved.activeCategory:'all';
visibleLimit=Math.max(18,Math.min(stories.length,parseInt(saved.visibleLimit,10)||18));
renderCategories();renderStoryGrid();startStory(saved.storyIndex);
var inputs=getInputs();var values=Array.isArray(saved.values)?saved.values:[];var i;
for(i=0;i<inputs.length;i++){inputs[i].value=String(values[i]||'').slice(0,120);}
updateProgress();
if(saved.screen==='result'){makeStory();}else if(saved.screen==='picker'){showScreen(pickerScreen);}else{showScreen(wordsScreen);}
},
meaningful:function(){return currentStoryIndex>=0;},
summary:function(){
if(currentStoryIndex<0||!stories[currentStoryIndex])return'';
var inputs=getInputs(),filled=0,i;for(i=0;i<inputs.length;i++){if(trimText(inputs[i].value))filled++;}
return stories[currentStoryIndex].title+' • '+filled+' of '+inputs.length+' words';
},
startFresh:function(){
stopSpeaking();currentStoryIndex=-1;activeCategory='all';visibleLimit=18;lastStoryText='';storyOutput.innerHTML='';promptList.innerHTML='';renderCategories();renderStoryGrid();showScreen(pickerScreen);
}
};

storyTotal.textContent=stories.length+' stories';
renderCategories();
renderStoryGrid();
})();
</script>
<script src="../arcade-save.js"></script>
<script>ArcadeSave.register(window.MadLibsAutosave);</script>
<button id="arcade-home-nav" type="button" aria-label="Back to Arcade">⌂</button><script>document.getElementById('arcade-home-nav').addEventListener('click',()=>{ArcadeSave.saveNow().finally(()=>{location.href='../index.html'});});</script></body>
</html>
