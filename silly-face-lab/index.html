<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="any">
    <title>Scarlett's Silly Face Lab</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5543d8;
            --accent: #00B894;
            --accent-dark: #009b7c;
            --danger: #ff7675;
            --bg: #dfe6e9;
            --panel: #ffffff;
            --text: #2d3436;
            --sun: #fdcb6e;
            --ink-soft: rgba(45, 52, 54, 0.16);
        }

        * { box-sizing: border-box; }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        button,
        input { font: inherit; }

        button:focus-visible,
        input:focus-visible {
            outline: 4px solid rgba(253, 203, 110, 0.9);
            outline-offset: 2px;
        }

        
        .controls-wrapper {
            background: var(--panel);
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            z-index: 20;
            display: flex;
            flex-direction: column;
            flex: 0 0 auto;
            max-height: 46vh;
        }

        
        .tabs-container {
            background: linear-gradient(135deg, var(--primary), #8e7cff);
            width: 100%;
            overflow: hidden;
            padding: 7px 10px 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .app-title {
            color: #fff;
            font-weight: 900;
            text-align: center;
            letter-spacing: 0.3px;
            line-height: 1;
            font-size: clamp(0.95rem, 2.2vw, 1.35rem);
            text-shadow: 0 2px 0 rgba(0,0,0,0.12);
        }

        .tabs-inner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
            gap: 5px;
            width: 100%;
            min-width: 0;
        }

        .tab-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.18);
            padding: 5px 7px;
            border-radius: 15px;
            font-weight: 900;
            font-size: clamp(0.58rem, 1.18vw, 0.86rem);
            cursor: pointer;
            transition: transform 0.12s, background 0.12s, color 0.12s;
            text-transform: uppercase;
            min-height: 30px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.32); transform: translateY(-1px); }
        .tab-btn.active {
            background: #fff;
            color: var(--primary);
            transform: scale(1.03);
            box-shadow: 0 3px 7px rgba(0,0,0,0.18);
        }

        
        .options-strip {
            height: clamp(94px, 16vh, 132px);
            border-bottom: 1px solid #eee;
            position: relative;
            background: #fff;
            width: 100%;
            overflow: hidden;
        }

        .section-view {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            align-content: center;
            overflow: hidden;
            padding: 6px 10px;
            gap: 7px;
            flex-wrap: wrap;
        }
        
        .horizontal-list {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
            padding: 0;
            min-width: 0;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
        }

        
        .option-card {
            width: clamp(44px, 6.4vw, 68px);
            height: clamp(44px, 6.4vw, 68px);
            flex: 0 0 auto;
            border: 3px solid #f0f0f0;
            border-radius: 13px;
            cursor: pointer;
            position: relative;
            background: white;
            transition: transform 0.1s, border-color 0.1s, background 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }
        .option-card canvas { width: 100%; height: 100%; display: block; }
        .option-card:hover { transform: translateY(-2px); border-color: #ccc; }
        .option-card.selected { border-color: var(--primary); background: #f0f0ff; transform: scale(1.05); }
        .option-card.selected::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            font-weight: 900;
        }

        .stickers-list { gap: 4px; }
        .sticker-card {
            width: clamp(30px, 4.8vw, 48px);
            height: clamp(30px, 4.8vw, 48px);
            border-width: 2px;
            border-radius: 11px;
            font-size: clamp(1.15rem, 3vw, 1.8rem);
            line-height: 1;
            background: linear-gradient(180deg, #ffffff, #fff8dc);
        }
        .sticker-card:active { transform: scale(0.96); }

        .preset-label {
            font-size: clamp(0.45rem, 0.8vw, 0.68rem);
            text-align: center;
            font-weight: 900;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255,255,255,0.9);
            pointer-events: none;
            line-height: 1.05;
            padding: 2px 1px;
            color: #2d3436;
        }

        
        .color-circle {
            width: clamp(30px, 4.6vw, 45px);
            height: clamp(30px, 4.6vw, 45px);
            flex: 0 0 auto;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.24);
            cursor: pointer;
            transition: transform 0.14s, border-color 0.14s;
        }
        .color-circle:hover { transform: translateY(-2px); }
        .color-circle.active { border-color: #2d3436; transform: scale(1.16); }

        .combo-group-title { display: none; }

        
        .bottom-toolbar {
            height: clamp(54px, 9vh, 76px);
            padding: 4px 12px;
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 3vw, 30px);
            overflow: hidden;
        }

        
        .tool-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }
        .tool-label { font-weight: 900; color: #555; font-size: clamp(0.62rem, 1.2vw, 0.8rem); text-transform: uppercase; }
        input[type=range] { width: clamp(115px, 20vw, 165px); accent-color: var(--primary); cursor: pointer; }
        input[type=range]:disabled { opacity: 0.35; cursor: default; }

        
        .nudge-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(3px, 0.8vw, 7px);
            flex-wrap: nowrap;
        }
        .move-btn {
            width: clamp(34px, 5.8vw, 50px);
            height: clamp(36px, 6.2vw, 50px);
            background: #e8e6ff;
            border: 2px solid rgba(108,92,231,0.16);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.05rem, 2.6vw, 1.42rem);
            line-height: 1;
            color: var(--primary);
            font-weight: 900;
            box-shadow: 0 3px 0 rgba(108,92,231,0.18);
            transition: transform 0.1s, background 0.12s, color 0.12s, opacity 0.12s;
        }
        .move-btn:hover:not(:disabled) { background: var(--primary); color: white; }
        .move-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(108,92,231,0.18); }
        .move-btn:disabled { cursor: default; opacity: 0.28; box-shadow: none; }
        .move-center { background: #fff3cf; color: #8a5a00; border-color: rgba(253,203,110,0.45); }

        
        .canvas-area {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg);
            transition: background 0.3s;
        }
        .canvas-area > canvas {
            max-height: calc(100% - 18px);
            max-width: min(96%, 720px);
            width: auto;
            height: auto;
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.22));
            touch-action: none;
            cursor: grab;
        }
        .canvas-area > canvas:active { cursor: grabbing; }

        .portrait-name{
            position:absolute;
            left:50%;
            top:10px;
            transform:translateX(-50%);
            background: rgba(255,255,255,0.94);
            border: 2px solid rgba(0,0,0,0.08);
            border-radius: 999px;
            padding: 7px 14px;
            font-weight: 900;
            letter-spacing: 0.3px;
            color: var(--text);
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            z-index: 6;
            min-width: 175px;
            text-align:center;
            pointer-events: none;
            font-size: clamp(0.78rem, 1.6vw, 1rem);
        }

        
        .utility-bar {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            z-index: 50;
        }
        .util-btn {
            width: clamp(39px, 6vw, 50px); height: clamp(39px, 6vw, 50px);
            border-radius: 13px; border: none;
            cursor: pointer;
            background: white;
            box-shadow: 0 4px 11px rgba(0,0,0,0.13);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, background 0.12s;
        }
        .util-btn:hover { transform: scale(1.05); }
        .util-btn:active { transform: scale(0.95); }
        .util-btn svg { width: 24px; height: 24px; fill: #555; }
        .btn-clear:hover svg { fill: var(--danger); }
        .btn-undo:hover svg { fill: var(--primary); }

        
        .fab-container { position: absolute; bottom: 17px; right: 17px; display: flex; flex-direction: column; gap: 12px; z-index: 45; }
        .fab {
            width: clamp(48px, 7.6vw, 60px); height: clamp(48px, 7.6vw, 60px); border-radius: 50%; border: none; color: white; cursor: pointer;
            box-shadow: 0 4px 11px rgba(0,0,0,0.32); transition: transform 0.1s; display: flex; align-items: center; justify-content: center;
        }
        .fab:hover { transform: scale(1.08); }
        .fab:active { transform: scale(0.95); }
        .fab svg { width: 31px; height: 31px; fill: white; }
        .fab-random { background: var(--accent); }
        .fab-save { background: var(--primary); }
        .fab-name { background: #0984e3; }

        .name-panel {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 10px;
            box-sizing: border-box;
        }
        .name-title { font-weight: 900; color: var(--primary); font-size: clamp(0.95rem, 1.8vw, 1.12rem); }
        .name-sub { font-size: clamp(0.72rem, 1.4vw, 0.86rem); color: #555; text-align: center; max-width: 430px; }
        .name-btn {
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.12);
        }
        .name-btn:hover { background: var(--primary-dark); }
        .name-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.12); }
        .name-display {
            display: none;
            font-weight: 900;
            font-size: clamp(0.9rem, 2vw, 1.15rem);
            letter-spacing: 0.5px;
            color: #222;
            padding: 4px 12px;
            border-radius: 14px;
            background: rgba(108, 92, 231, 0.08);
            border: 2px dashed rgba(108,92,231,0.35);
            min-width: 120px;
            text-align: center;
        }

        @media (max-height: 620px) {
            .app-title { display: none; }
            .tabs-container { padding: 5px 8px; }
            .tabs-inner { grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 4px; }
            .tab-btn { min-height: 24px; padding: 3px 5px; border-radius: 12px; }
            .options-strip { height: 82px; }
            .bottom-toolbar { height: 52px; }
            .move-btn { width: 38px; height: 38px; border-radius: 12px; font-size: 1.16rem; }
            .option-card { width: 42px; height: 42px; border-width: 2px; }
            .sticker-card { width: 30px; height: 30px; font-size: 1.06rem; border-radius: 9px; }
            .color-circle { width: 28px; height: 28px; border-width: 2px; }
            .portrait-name { top: 6px; padding: 5px 11px; min-width: 145px; }
            .utility-bar { top: 7px; right: 7px; }
            .fab-container { bottom: 10px; right: 10px; gap: 9px; }
            .name-sub { display: none; }
            .name-panel { gap: 5px; }
        }

        @media (max-width: 520px) {
            .tabs-inner { grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 4px; }
            .bottom-toolbar { justify-content: space-around; gap: 5px; padding-left: 6px; padding-right: 6px; }
            input[type=range] { width: 104px; }
            .nudge-controls { gap: 3px; }
            .move-btn { width: 40px; height: 40px; font-size: 1.18rem; border-radius: 12px; }
            .option-card { width: 40px; height: 40px; border-width: 2px; }
            .sticker-card { width: 30px; height: 30px; font-size: 1.06rem; border-radius: 9px; }
            .color-circle { width: 28px; height: 28px; border-width: 2px; }
            .horizontal-list { gap: 7px; }
            .preset-label { font-size: 0.42rem; }
            .portrait-name { max-width: 52vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        }


        @media (max-width: 360px) {
            .tabs-inner { grid-template-columns: repeat(auto-fit, minmax(40px, 1fr)); gap: 3px; }
            .tab-btn { font-size: 0.5rem; padding: 2px 3px; }
            input[type=range] { width: 92px; }
            .move-btn { width: 36px; height: 36px; font-size: 1.08rem; border-radius: 11px; }
            .option-card { width: 32px; height: 32px; border-width: 2px; border-radius: 9px; }
            .sticker-card { width: 28px; height: 28px; font-size: 0.98rem; border-radius: 8px; }
            .color-circle { width: 24px; height: 24px; }
            .horizontal-list { gap: 4px; }
            .option-card.selected::after { width: 14px; height: 14px; line-height: 14px; font-size: 10px; }
            .preset-label { display: none; }
        }

</style>
<style id="face-lab-studio-style">
    :root {
        --lab-ink: #241b47;
        --lab-muted: #746d8b;
        --lab-violet: #6c4ce7;
        --lab-violet-dark: #5033c7;
        --lab-mint: #20bf9f;
        --lab-yellow: #ffd369;
        --lab-pink: #ff6e9f;
        --lab-paper: #fffdf9;
        --lab-line: #e9e3f6;
        --lab-shadow: 0 14px 36px rgba(37, 23, 82, .18);
    }

    html, body { height: 100%; min-height: 100%; }
    body {
        display: block;
        background: #241753;
        color: var(--lab-ink);
        overscroll-behavior: none;
    }
    button { -webkit-tap-highlight-color: transparent; }
    .app-shell {
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        overflow: hidden;
        background:
            radial-gradient(circle at 12% 5%, rgba(255, 211, 105, .22), transparent 26%),
            radial-gradient(circle at 90% 92%, rgba(32, 191, 159, .17), transparent 30%),
            linear-gradient(145deg, #2b1a61, #171130);
    }
    .studio-header {
        position: relative;
        z-index: 30;
        color: #fff;
        padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
        background: linear-gradient(120deg, rgba(108, 76, 231, .97), rgba(137, 84, 238, .96));
        box-shadow: 0 8px 24px rgba(13, 7, 41, .28);
    }
    .topbar {
        min-height: 45px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
    }
    #arcade-home-nav {
        position: static;
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255, 255, 255, .35);
        border-radius: 14px;
        background: rgba(28, 18, 72, .36);
        color: #fff;
        font: 900 21px/1 system-ui;
        box-shadow: 0 5px 13px rgba(22, 10, 66, .2);
        cursor: pointer;
    }
    #arcade-home-nav:active { transform: scale(.95); }
    .brand { min-width: 0; }
    .app-title {
        color: #fff;
        text-align: left;
        font-size: clamp(1rem, 3.9vw, 1.34rem);
        line-height: 1.05;
        letter-spacing: -.02em;
        text-shadow: none;
    }
    .app-subtitle {
        margin-top: 2px;
        color: rgba(255, 255, 255, .79);
        font-size: clamp(.64rem, 2.1vw, .79rem);
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .quick-actions { display: flex; gap: 6px; }
    .quick-btn {
        min-width: 42px;
        height: 42px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, .32);
        border-radius: 14px;
        background: rgba(255, 255, 255, .15);
        color: #fff;
        font-weight: 900;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    .quick-btn.primary { background: #fff; color: var(--lab-violet-dark); }
    .quick-btn:active { transform: translateY(1px) scale(.97); }
    .quick-label { font-size: .75rem; }

    .tabs-inner {
        margin-top: 8px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 5px;
    }
    .tab-btn {
        min-width: 0;
        min-height: 38px;
        padding: 5px 4px;
        border: 1px solid rgba(255, 255, 255, .24);
        border-radius: 13px;
        background: rgba(35, 20, 89, .22);
        color: rgba(255, 255, 255, .82);
        text-transform: none;
        font-size: clamp(.6rem, 2.2vw, .78rem);
        line-height: 1.05;
        cursor: pointer;
        overflow: visible;
        white-space: normal;
    }
    .tab-btn .stage-icon { display: block; font-size: 1rem; line-height: 1; margin-bottom: 2px; }
    .tab-btn.active {
        background: #fff;
        color: var(--lab-violet-dark);
        border-color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 5px 12px rgba(37, 18, 100, .2);
    }

    .studio-main {
        min-height: 0;
        display: grid;
        grid-template-rows: minmax(245px, 48%) minmax(0, 1fr);
        gap: 10px;
        padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    .canvas-area {
        min-height: 0;
        flex: none;
        border: 2px solid rgba(255, 255, 255, .2);
        border-radius: 25px;
        box-shadow: var(--lab-shadow);
        isolation: isolate;
        overflow: hidden;
    }
    .canvas-area::before,
    .canvas-area::after {
        content: '';
        position: absolute;
        z-index: -1;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        border: 22px solid rgba(255, 255, 255, .13);
    }
    .canvas-area::before { left: -57px; top: -60px; }
    .canvas-area::after { right: -66px; bottom: -60px; }
    .canvas-frame {
        position: absolute;

        border: 1px solid rgba(255, 255, 255, .26);

        pointer-events: none;

    }

        background: rgba(255, 255, 255, .94);
        color: var(--lab-ink);
        font-size: clamp(.72rem, 2.4vw, .94rem);
        cursor: pointer;
        pointer-events: auto !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .canvas-hint {
        position: absolute;
        left: 50%;
        bottom: 8px;
        z-index: 6;
        transform: translateX(-50%);
        max-width: calc(100% - 26px);
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(36, 27, 71, .76);
        color: #fff;
        font-size: clamp(.58rem, 2vw, .72rem);
        font-weight: 800;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
    }

    .controls-wrapper {
        min-height: 0;
        max-height: none;
        flex: none;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 24px;
        background: var(--lab-paper);
        box-shadow: var(--lab-shadow);
    }
    .panel-heading {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 9px 12px 3px;
    }
    .stage-kicker {
        color: var(--lab-violet);
        font-size: .67rem;
        font-weight: 900;
        letter-spacing: .1em;
        text-transform: uppercase;
    }
    .panel-title { margin: 0; font-size: 1rem; line-height: 1.15; }
    .category-nav {
        display: flex;
        gap: 6px;
        padding: 5px 10px 7px;
        overflow-x: auto;
        scrollbar-width: none;
    }

        if(!st) return;

            ctx.save(); ctx.translate(0, 75); ctx.translate(state.mustacheX, state.mustacheY); ctx.scale(state.mustacheSize, state.mustacheSize); ASSETS.mustaches[state.mustacheStyle](ctx, state.facialHairColor); ctx.restore();

            
            ctx.save(); ctx.translate(0, -30 * fs); ctx.translate(state.hairX, state.hairY); let sF = fs * state.hairSize; ctx.scale(sF, sF); if(ASSETS.hairFront[state.hairStyle]) ASSETS.hairFront[state.hairStyle](ctx, state.hairColor); ctx.restore();
            ctx.save(); ctx.translate(0, -30); ctx.translate(state.glassesX, state.glassesY); ctx.scale(state.glassesSize, state.glassesSize); ASSETS.glasses[state.glassesStyle](ctx, state.glassesColor); ctx.restore();
            ctx.save(); ctx.translate(0, -70 * fs); ctx.translate(state.hatX, state.hatY); let sH = fs * state.hatSize; ctx.scale(sH, sH); ASSETS.hats[state.hatStyle](ctx, state.hatColor); ctx.restore();

            
            drawStickerLayer(ctx, state, currentTab && currentTab.id === 'stickers');

            ctx.restore();
        } catch(e) { console.log(e); }
    }

    
    
    function drawNameBadge(ctx2, name, w) {
        if(!ctx2 || !name) return;
        const safeName = String(name).trim().slice(0, 26);
        if(!safeName) return;
        ctx2.save();
        ctx2.font = '900 42px Segoe UI, Tahoma, sans-serif';
        ctx2.textAlign = 'center';
        ctx2.textBaseline = 'middle';
        const badgeW = Math.min(w - 80, Math.max(260, ctx2.measureText(safeName).width + 78));
        const badgeH = 72;
        const x = (w - badgeW) / 2;
        const y = 34;
        ctx2.fillStyle = 'rgba(255,255,255,0.94)';
        ctx2.strokeStyle = 'rgba(45,52,54,0.16)';
        ctx2.lineWidth = 4;
        ctx2.beginPath();
        ctx2.roundRect(x, y, badgeW, badgeH, 34);
        ctx2.fill();
        ctx2.stroke();
        ctx2.fillStyle = '#2d3436';
        ctx2.fillText(safeName, w / 2, y + badgeH / 2 + 1);
        ctx2.restore();
    }
    
    function renderFaceToCtx(ctx2, st, w, h, yOff, includeBackground) {
        if (!ctx2 || !st) return;
        if (yOff === undefined) yOff = 20;
        try {
            ctx2.clearRect(0, 0, w, h);
            if(includeBackground) {
                ctx2.fillStyle = st.bgColor || DEFAULTS.bgColor;
                ctx2.fillRect(0, 0, w, h);
            }
            
            ctx2.save();
            ctx2.translate(w/2, h/2 + yOff);

            const fs = st.faceSize;

            
            if(ASSETS.hairBack[st.hairStyle]) { 
                ctx2.save(); 
                ctx2.translate(st.hairX, st.hairY);
                let s = fs * st.hairSize; ctx2.scale(s, s);
                ASSETS.hairBack[st.hairStyle](ctx2, st.hairColor); 
                ctx2.restore(); 
            }
            
            
            ctx2.save(); 
            ctx2.translate(st.faceX, st.faceY);
            ASSETS.faces[st.faceShape](ctx2, fs, st.skinColor); 
            ctx2.restore();

            
            ctx2.save(); ctx2.translate(0, -30); ctx2.translate(st.eyeX, st.eyeY); ctx2.scale(st.eyeSize, st.eyeSize); ASSETS.eyes[st.eyeStyle](ctx2); ctx2.restore();
            ctx2.save(); ctx2.translate(0, -85); ctx2.translate(st.browX, st.browY); ctx2.scale(st.browSize, st.browSize); ASSETS.brows[st.browStyle](ctx2, st.browColor); ctx2.restore();
            ctx2.save(); ctx2.translate(0, 30); ctx2.translate(st.noseX, st.noseY); ctx2.scale(st.noseSize, st.noseSize); ASSETS.noses[st.noseStyle](ctx2); ctx2.restore();
            ctx2.save(); ctx2.translate(0, 50); ctx2.translate(st.beardX, st.beardY); ctx2.scale(st.beardSize, st.beardSize); ASSETS.beards[st.beardStyle](ctx2, st.facialHairColor); ctx2.restore();
            ctx2.save(); ctx2.translate(0, 85); ctx2.translate(st.mouthX, st.mouthY); ctx2.scale(st.mouthSize, st.mouthSize); ASSETS.mouths[st.mouthStyle](ctx2); ctx2.restore();
            ctx2.save(); ctx2.translate(0, 75); ctx2.translate(st.mustacheX, st.mustacheY); ctx2.scale(st.mustacheSize, st.mustacheSize); ASSETS.mustaches[st.mustacheStyle](ctx2, st.facialHairColor); ctx2.restore();

            
            ctx2.save(); ctx2.translate(0, -30 * fs); ctx2.translate(st.hairX, st.hairY); let sF = fs * st.hairSize; ctx2.scale(sF, sF); if(ASSETS.hairFront[st.hairStyle]) ASSETS.hairFront[st.hairStyle](ctx2, st.hairColor); ctx2.restore();
            ctx2.save(); ctx2.translate(0, -30); ctx2.translate(st.glassesX, st.glassesY); ctx2.scale(st.glassesSize, st.glassesSize); ASSETS.glasses[st.glassesStyle](ctx2, st.glassesColor); ctx2.restore();
            ctx2.save(); ctx2.translate(0, -70 * fs); ctx2.translate(st.hatX, st.hatY); let sH = fs * st.hatSize; ctx2.scale(sH, sH); ASSETS.hats[st.hatStyle](ctx2, st.hatColor); ctx2.restore();

            drawStickerLayer(ctx2, st, false);

            ctx2.restore();
            if(includeBackground) drawNameBadge(ctx2, st.faceName, w);
        } catch(e) {}
    }

    function addSticker(emoji, x, y, saveHistory = true) {
        ensureStickerState();
        if(saveHistory) pushHistory();
        const place = STICKER_START_POINTS[state.stickers.length % STICKER_START_POINTS.length];
        const sticker = makeSticker(emoji || selectedStickerEmoji, x ?? place.x, y ?? place.y);
        state.stickers.push(sticker);
        state.activeStickerId = sticker.id;
        selectedStickerEmoji = sticker.emoji;
        draw();
        refreshUI();
        if(saveHistory) showToast(`${sticker.emoji} sticker added. Drag it anywhere!`);
        return sticker;
    }

    function removeActiveSticker() {
        ensureStickerState();
        const active = getActiveSticker();
        if(!active) return;
        pushHistory();
        state.stickers = state.stickers.filter(s => s.id !== active.id);
        state.activeStickerId = state.stickers.length ? state.stickers[state.stickers.length - 1].id : null;
        draw();
        refreshUI();
        showToast('Sticker removed');
    }

    function getCurrentSizeValue() {
        if(currentTab && currentTab.id === 'stickers') {
            const active = getActiveSticker();
            return active ? ((active.size || STICKER_BASE_SIZE) / STICKER_BASE_SIZE) : 1;
        }
        if(currentTab && currentTab.sizeTarget) return state[currentTab.sizeTarget];
        return 1;
    }

    function setCurrentSizeValue(value) {
        const v = parseFloat(value);
        if(!Number.isFinite(v)) return;
        if(currentTab && currentTab.id === 'stickers') {
            const active = getActiveSticker();
            if(active) {
                active.size = Math.round(STICKER_BASE_SIZE * v);
                draw();
                if(sizeValue) sizeValue.textContent = `${Math.round(v * 100)}%`;
            }
            return;
        }
        if(currentTab && currentTab.sizeTarget) {
            state[currentTab.sizeTarget] = v;
            draw();
            if(sizeValue) sizeValue.textContent = `${Math.round(v * 100)}%`;
        }
    }

    function canMoveCurrentThing() {
        return !!(currentTab && (currentTab.posTarget || (currentTab.id === 'stickers' && getActiveSticker())));
    }

    function canSizeCurrentThing() {
        return !!(currentTab && (currentTab.sizeTarget || (currentTab.id === 'stickers' && getActiveSticker())));
    }

    function canRemoveCurrentThing() {
        if(!currentTab) return false;
        if(currentTab.id === 'stickers') return !!getActiveSticker();
        return !!(currentTab.type === 'grid' && currentTab.id !== 'shape' && currentTab.data &&
            Object.prototype.hasOwnProperty.call(currentTab.data, 'none') && state[currentTab.target] !== 'none');
    }

    function removeCurrentThing() {
        if(!currentTab) return;
        if(currentTab.id === 'stickers') {
            removeActiveSticker();
            return;
        }
        if(!canRemoveCurrentThing()) return;
        pushHistory();
        state[currentTab.target] = 'none';
        draw();
        refreshUI();
        showToast(`${currentTab.label} removed`);
    }

    function pushHistory() {
        ensureStickerState();
        if(historyStack.length >= 20) historyStack.shift();
        historyStack.push(JSON.parse(JSON.stringify(state)));
    }

    function syncNameUI() {
        const name = (state && state.faceName) ? String(state.faceName) : '';
        const disp = document.getElementById('nameDisplay');
        const portrait = document.getElementById('portraitName');
        if(disp) {
            disp.textContent = name || 'Not named yet';
            disp.style.display = 'block';
        }
        if(portrait) {
            portrait.textContent = name || 'Tap to name this face';
        }
    }

    function refreshUI() {
        updateToolbar(currentTab || UI_MAP[0]);
        updateSelectionVisuals();
        updateColorVisuals();
        syncNameUI();
    }

    function undo() {
        if(historyStack.length > 0) {
            state = historyStack.pop();
            draw();
            refreshUI();
            showToast('Last change undone');
        } else {
            showToast('Nothing to undo yet');
        }
    }

    function clearFace() {
        pushHistory();
        state = JSON.parse(JSON.stringify(DEFAULTS));
        draw();
        refreshUI();
        showToast('Fresh face, ready to create');
    }

    function friendlyLabel(value) {
        const labels = { none: 'None', pigtails: 'Pigtails', spacebuns: 'Space Buns', handlebar: 'Handlebar' };
        if(labels[value]) return labels[value];
        return String(value).replace(/[_-]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/\b\w/g, c => c.toUpperCase());
    }

    function appendOptionLabel(card, label, className = 'option-name') {
        const span = document.createElement('span');
        span.className = className;
        span.textContent = label;
        card.appendChild(span);
    }

    function drawOptionPreview(cat, key, context) {
        context.translate(50, 50);
        context.scale(.25, .25);
        if(cat.id === 'shape') ASSETS.faces[key](context, 1, '#ddd');
        else if(cat.id === 'hair') {
            ASSETS.faces.oval(context, 1, '#eee');
            if(ASSETS.hairBack[key]) ASSETS.hairBack[key](context, '#555');
            if(ASSETS.hairFront[key]) ASSETS.hairFront[key](context, '#555');
        } else if(cat.id === 'hats') {
            ASSETS.faces.oval(context, 1, '#eee');
            context.translate(0, -50);
            ASSETS.hats[key](context, state.hatColor);
        } else if(cat.id === 'brows') ASSETS.brows[key](context, '#333');
        else if(cat.id === 'nose') ASSETS.noses[key](context);
        else if(cat.id === 'beard') {
            ASSETS.faces.oval(context, 1, '#eee');
            context.translate(0, 50);
            ASSETS.beards[key](context, '#333');
        } else if(cat.id === 'mustache') {
            ASSETS.faces.oval(context, 1, '#eee');
            context.translate(0, 45);
            ASSETS.mustaches[key](context, '#333');
        } else if(cat.id === 'eyes') ASSETS.eyes[key](context);
        else if(cat.id === 'mouth') ASSETS.mouths[key](context);
        else if(cat.id === 'glasses') {
            ASSETS.faces.oval(context, 1, '#eee');
            context.translate(0, -20);
            ASSETS.glasses[key](context, '#333');
        }
    }

    function initUI() {
        const stageTabs = document.getElementById('tabsInner');
        const options = document.getElementById('optionsContainer');

        STAGES.forEach(stage => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'tab-btn stage-btn';
            button.dataset.stage = stage.id;
            button.innerHTML = `<span class="stage-icon" aria-hidden="true">${stage.icon}</span>${stage.label}`;
            button.onclick = () => switchStage(stage.id);
            stageTabs.appendChild(button);
        });

        UI_MAP.forEach(cat => {
            const section = document.createElement('div');
            section.className = 'section-view';
            section.id = `sec-${cat.id}`;
            section.style.display = 'none';
            const list = document.createElement('div');
            list.className = 'horizontal-list';

            if(cat.type === 'presets') {
                Object.keys(cat.data).forEach(key => {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'option-card';
                    card.setAttribute('aria-label', `Use ${friendlyLabel(key)} template`);
                    const preview = document.createElement('canvas');
                    preview.width = 100;
                    preview.height = 100;
                    card.appendChild(preview);
                    appendOptionLabel(card, friendlyLabel(key), 'preset-label');
                    const temp = JSON.parse(JSON.stringify(DEFAULTS));
                    Object.assign(temp, PRESETS[key]);
                    renderFaceToCtx(preview.getContext('2d'), temp, preview.width, preview.height, 32);
                    card.onclick = () => {
                        pushHistory();
                        state = JSON.parse(JSON.stringify(DEFAULTS));
                        Object.assign(state, PRESETS[key]);
                        draw();
                        refreshUI();
                        showToast(`${friendlyLabel(key)} template loaded`);
                    };
                    list.appendChild(card);
                });
            } else if(cat.type === 'name') {
                const panel = document.createElement('div');
                panel.className = 'name-panel';
                panel.innerHTML = `
                    <div class="name-title">Your creation is ready!</div>
                    <div class="name-sub">Give it a wonderfully odd name, make one more surprise, or save it as a picture.</div>
                    <div class="name-display" id="nameDisplay" aria-live="polite">Not named yet</div>
                    <div class="finish-actions">
                        <button class="name-btn" id="nameGenBtn" type="button">✨ New Name</button>
                        <button class="finish-btn pink" type="button" onclick="randomize()">🎲 Surprise</button>
                        <button class="finish-btn mint" type="button" onclick="downloadImage()">⬇ Save Picture</button>
                    </div>`;
                section.appendChild(panel);
            } else if(cat.type === 'stickers') {
                list.classList.add('stickers-list');
                STICKER_EMOJIS.forEach(emoji => {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = `option-card sticker-card ${selectedStickerEmoji === emoji ? 'selected' : ''}`;
                    card.dataset.emoji = emoji;
                    card.setAttribute('aria-label', `Add ${emoji} sticker`);
                    const symbol = document.createElement('span');
                    symbol.textContent = emoji;
                    symbol.setAttribute('aria-hidden', 'true');
                    card.appendChild(symbol);
                    appendOptionLabel(card, 'Add');
                    card.onclick = () => addSticker(emoji);
                    list.appendChild(card);
                });
            } else if(cat.type === 'grid') {
                Object.keys(cat.data).forEach(key => {
                    if(cat.id === 'shape' && key === 'none') return;
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = `option-card ${state[cat.target] === key ? 'selected' : ''}`;
                    card.dataset.val = key;
                    card.setAttribute('aria-label', `${cat.label}: ${friendlyLabel(key)}`);
                    const preview = document.createElement('canvas');
                    preview.width = 100;
                    preview.height = 100;
                    drawOptionPreview(cat, key, preview.getContext('2d'));
                    card.appendChild(preview);
                    appendOptionLabel(card, friendlyLabel(key));
                    card.onclick = () => {
                        pushHistory();
                        state[cat.target] = key;
                        draw();
                        refreshUI();
                    };
                    list.appendChild(card);
                });

                cat.colors.forEach(color => {
                    const normalized = color.toLowerCase();
                    const name = COLOR_NAMES[normalized] || 'Color';

                    card.type = 'button';
                    card.className = `color-option ${String(state[cat.target]).toLowerCase() === normalized ? 'active' : ''}`;
                    card.dataset.color = color;
                    card.setAttribute('aria-label', `${cat.label}: ${name}`);
                    const swatch = document.createElement('span');
                    swatch.className = 'color-circle';
                    swatch.style.backgroundColor = color;
                    card.appendChild(swatch);
                    appendOptionLabel(card, name, 'option-name color-name');
                    card.onclick = () => {
                        pushHistory();
                        state[cat.target] = color;
                        draw();
                        refreshUI();
                    };
                    list.appendChild(card);
                });

            if(cat.type !== 'name') section.appendChild(list);
            options.appendChild(section);

    function switchStage(stageId, preferredCategoryId) {
        const stage = STAGES.find(item => item.id === stageId) || STAGES[0];
        currentStageId = stage.id;
        document.querySelectorAll('.stage-btn').forEach(button => {
            button.classList.toggle('active', button.dataset.stage === stage.id);
        });
        const kicker = document.getElementById('stageKicker');
        if(kicker) kicker.textContent = stage.label;

        const categoryTabs = document.getElementById('categoryTabs');
        categoryTabs.replaceChildren();
        const preferred = stage.categories.includes(preferredCategoryId) ? preferredCategoryId : stage.categories[0];
        let selectedButton = null;
        stage.categories.forEach(categoryId => {
            const category = UI_MAP.find(item => item.id === categoryId);
            if(!category) return;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'category-btn';
            button.dataset.category = category.id;
            button.textContent = category.label;
            button.onclick = () => switchTab(category, button);
            categoryTabs.appendChild(button);
            if(category.id === preferred) selectedButton = button;
        });
        const selectedCategory = UI_MAP.find(item => item.id === preferred) || UI_MAP[0];
        switchTab(selectedCategory, selectedButton || categoryTabs.firstElementChild);
    }

    function openCategory(categoryId) {
        const stage = STAGES.find(item => item.categories.includes(categoryId)) || STAGES[0];
        switchStage(stage.id, categoryId);
    }

    function switchTab(cat, button) {
        document.querySelectorAll('.section-view').forEach(section => { section.style.display = 'none'; });
        const section = document.getElementById(`sec-${cat.id}`);
        if(section) section.style.display = 'flex';
        document.querySelectorAll('.category-btn').forEach(item => item.classList.remove('active'));
        if(button) {
            button.classList.add('active');
            button.scrollIntoView({block: 'nearest', inline: 'nearest'});
        }
        const title = document.getElementById('panelTitle');
        if(title) title.textContent = cat.label;
        updateToolbar(cat);
        updateColorVisuals();
        updateSelectionVisuals();
        syncNameUI();
        draw();
    }

    function updateToolbar(cat) {
        currentTab = cat;
        const hasSize = canSizeCurrentThing();
        const currentSize = getCurrentSizeValue();
        sizeSlider.disabled = !hasSize;
        sizeSlider.value = currentSize;
        sliderLabel.textContent = 'Size';
        if(sizeValue) sizeValue.textContent = hasSize ? `${Math.round(currentSize * 100)}%` : '—';

        const canMove = canMoveCurrentThing();
        document.querySelectorAll('.move-btn').forEach(button => { button.disabled = !canMove; });
        const center = document.getElementById('moveCenterBtn');
        if(center) {
            center.textContent = '↺';
            center.title = canMove ? 'Center this part' : 'Choose a movable part';
            center.setAttribute('aria-label', center.title);
        }
        const moveLabel = document.getElementById('moveLabel');
        if(moveLabel) moveLabel.textContent = 'Move';
        const selected = document.getElementById('selectedPartLabel');
        if(selected) selected.textContent = cat ? cat.label : '';
        const remove = document.getElementById('removePartBtn');
        if(remove) {
            remove.disabled = !canRemoveCurrentThing();
            remove.textContent = cat && cat.id === 'stickers' ? 'Remove Sticker' : 'Remove';
        }
    }

    function updateSelectionVisuals() {
        UI_MAP.forEach(cat => {
            const section = document.getElementById(`sec-${cat.id}`);
            if(!section) return;
            if(cat.type === 'grid') {
                section.querySelectorAll('.option-card').forEach(card => {
                    card.classList.toggle('selected', card.dataset.val === state[cat.target]);
                });
            } else if(cat.type === 'stickers') {
                section.querySelectorAll('.sticker-card').forEach(card => {
                    card.classList.toggle('selected', card.dataset.emoji === selectedStickerEmoji);
                });
            }
        });
    }

    function updateColorVisuals() {
        UI_MAP.filter(cat => cat.type === 'color').forEach(cat => {
            const section = document.getElementById(`sec-${cat.id}`);
            if(!section) return;
            section.querySelectorAll('.color-option').forEach(card => {
                card.classList.toggle('active', String(card.dataset.color).toLowerCase() === String(state[cat.target]).toLowerCase());
            });
        });
    }


    
    let sliderEditing = false;
    function beginSliderEdit() {
        if(!sliderEditing && canSizeCurrentThing() && !sizeSlider.disabled) {
            pushHistory();
            sliderEditing = true;
        }
    }
    function endSliderEdit() { sliderEditing = false; }
    sizeSlider.addEventListener('pointerdown', beginSliderEdit);
    sizeSlider.addEventListener('keydown', beginSliderEdit);
    sizeSlider.addEventListener('pointerup', endSliderEdit);
    sizeSlider.addEventListener('change', endSliderEdit);
    sizeSlider.oninput = (e) => setCurrentSizeValue(e.target.value);

    function move(x, y) {
        if(currentTab && currentTab.id === 'stickers') {
            const active = getActiveSticker();
            if(active) {
                pushHistory();
                active.x += x;
                active.y += y;
                draw();
            }
            return;
        }
        if(currentTab && currentTab.posTarget) {
            pushHistory();
            state[currentTab.posTarget + 'X'] += x;
            state[currentTab.posTarget + 'Y'] += y;
            draw();
        }
    }

    function resetPos() {
        if(currentTab && currentTab.id === 'stickers') {
            const active = getActiveSticker();
            if(!active) return;
            pushHistory();
            active.x = 0;
            active.y = 0;
            draw();
            showToast('Sticker centered');
            return;
        }
        if(currentTab && currentTab.posTarget) {
            pushHistory();
            state[currentTab.posTarget + 'X'] = 0;
            state[currentTab.posTarget + 'Y'] = 0;
            draw();
            showToast(`${currentTab.label} centered`);
        }
    }

    function getCanvasPoint(evt) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (evt.clientX - rect.left) * (canvas.width / rect.width),
            y: (evt.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function canvasPointToFacePoint(p) {
        return { x: p.x - canvas.width / 2, y: p.y - (canvas.height / 2 + FACE_ORIGIN_Y) };
    }

    function findStickerAt(facePoint) {
        ensureStickerState();
        for(let i = state.stickers.length - 1; i >= 0; i--) {
            const s = state.stickers[i];
            const size = Math.max(22, Math.min(170, s.size || STICKER_BASE_SIZE));
            const hit = Math.max(34, size * 0.72);
            if(Math.abs(facePoint.x - (s.x || 0)) <= hit && Math.abs(facePoint.y - (s.y || 0)) <= hit) return s;
        }
        return null;
    }

    // Two-finger resizing works on the currently selected facial feature or
    // sticker. Capture-phase listeners take over only when a real pinch begins,
    // so ordinary one-finger dragging keeps its existing behavior.
    const pinchPointers = new Map();
    let pinchGesture = null;
    function pinchDistance() {
        const pts = Array.from(pinchPointers.values());
        return pts.length < 2 ? 0 : Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
    canvas.addEventListener('pointerdown', (evt) => {
        pinchPointers.set(evt.pointerId, {x:evt.clientX, y:evt.clientY});
        if(pinchPointers.size !== 2 || !canSizeCurrentThing()) return;
        const distance = pinchDistance();
        if(distance < 8) return;
        pushHistory();
        pointerDrag = null;
        pinchGesture = { startDistance:distance, startSize:Number(getCurrentSizeValue()) || 1 };
        try { canvas.setPointerCapture?.(evt.pointerId); } catch(e) {}
        evt.preventDefault();
        evt.stopImmediatePropagation();
    }, true);
    canvas.addEventListener('pointermove', (evt) => {
        if(!pinchPointers.has(evt.pointerId)) return;
        pinchPointers.set(evt.pointerId, {x:evt.clientX, y:evt.clientY});
        if(!pinchGesture || pinchPointers.size < 2) return;
        const ratio = pinchDistance() / pinchGesture.startDistance;
        const next = Math.max(0.5, Math.min(2.5, pinchGesture.startSize * ratio));
        setCurrentSizeValue(next);
        sizeSlider.value = String(next);
        evt.preventDefault();
        evt.stopImmediatePropagation();
    }, true);
    function endPinchPointer(evt) {
        const wasPinching = !!pinchGesture;
        pinchPointers.delete(evt.pointerId);
        if(pinchPointers.size < 2) pinchGesture = null;
        if(wasPinching) {
            refreshUI();
            evt.preventDefault();
            evt.stopImmediatePropagation();
        }
    }
    canvas.addEventListener('pointerup', endPinchPointer, true);
    canvas.addEventListener('pointercancel', endPinchPointer, true);

    canvas.addEventListener('pointerdown', (evt) => {
        if(evt.button !== undefined && evt.button !== 0) return;
        const canvasPoint = getCanvasPoint(evt);
        const facePoint = canvasPointToFacePoint(canvasPoint);
        const hitSticker = findStickerAt(facePoint);

        if(hitSticker) {
            state.activeStickerId = hitSticker.id;
            selectedStickerEmoji = hitSticker.emoji;
            pointerDrag = { mode: 'sticker', id: hitSticker.id, last: facePoint, changed: false };
            try { canvas.setPointerCapture?.(evt.pointerId); } catch(e) {}
            evt.preventDefault();
            if(!currentTab || currentTab.id !== 'stickers') openCategory('stickers');
            else refreshUI();
            draw();
            return;
        }

        if(currentTab && currentTab.id === 'stickers') {
            addSticker(selectedStickerEmoji, facePoint.x, facePoint.y, true);
            const active = getActiveSticker();
            if(active) {
                pointerDrag = { mode: 'sticker', id: active.id, last: facePoint, changed: true };
                try { canvas.setPointerCapture?.(evt.pointerId); } catch(e) {}
            }
            evt.preventDefault();
            return;
        }

        if(currentTab && currentTab.posTarget) {
            pointerDrag = { mode: 'part', posTarget: currentTab.posTarget, last: facePoint, changed: false };
            try { canvas.setPointerCapture?.(evt.pointerId); } catch(e) {}
            evt.preventDefault();
        }
    });

    canvas.addEventListener('pointermove', (evt) => {
        if(!pointerDrag) return;
        const canvasPoint = getCanvasPoint(evt);
        const facePoint = canvasPointToFacePoint(canvasPoint);
        const dx = facePoint.x - pointerDrag.last.x;
        const dy = facePoint.y - pointerDrag.last.y;
        if(Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25) return;

        if(!pointerDrag.changed) {
            pushHistory();
            pointerDrag.changed = true;
        }

        if(pointerDrag.mode === 'sticker') {
            const active = state.stickers.find(s => s.id === pointerDrag.id);
            if(active) {
                active.x += dx;
                active.y += dy;
            }
        } else if(pointerDrag.mode === 'part') {
            state[pointerDrag.posTarget + 'X'] += dx;
            state[pointerDrag.posTarget + 'Y'] += dy;
        }
        pointerDrag.last = facePoint;
        draw();
        evt.preventDefault();
    });

    function endPointerDrag(evt) {
        if(pointerDrag) {
            pointerDrag = null;
            refreshUI();
            if(evt) evt.preventDefault();
        }
    }
    canvas.addEventListener('pointerup', endPointerDrag);
    canvas.addEventListener('pointercancel', endPointerDrag);
    canvas.addEventListener('lostpointercapture', endPointerDrag);

    function randomize() {
        pushHistory();
        const r = (obj, allowNone=false) => {
            const k = Object.keys(obj).filter(key => allowNone || key !== 'none');
            return k[Math.floor(Math.random()*k.length)];
        };
        const rc = (arr) => arr[Math.floor(Math.random()*arr.length)];
        const hairOptions = {...ASSETS.hairFront, ...ASSETS.hairBack};
        
        state.faceShape = r(ASSETS.faces);
        state.skinColor = rc(SKIN_TONES.slice(0, 12)); 
        state.hairStyle = Math.random() > 0.18 ? r(hairOptions, true) : 'none';
        state.hairColor = rc(HAIR_COLORS);
        state.eyeStyle = r(ASSETS.eyes);
        state.noseStyle = Math.random() > 0.08 ? r(ASSETS.noses) : 'none';
        state.mouthStyle = r(ASSETS.mouths);
        state.browStyle = Math.random() > 0.18 ? r(ASSETS.brows) : 'none';
        state.beardStyle = Math.random()>0.72 ? r(ASSETS.beards) : 'none';
        state.mustacheStyle = Math.random()>0.78 ? r(ASSETS.mustaches) : 'none';
        state.glassesStyle = Math.random()>0.78 ? r(ASSETS.glasses) : 'none';
        state.hatStyle = Math.random()>0.78 ? r(ASSETS.hats) : 'none';
        state.hatColor = rc(['#D32F2F', '#111111', '#0984e3', '#00B894', '#fdcb6e', '#e84393', '#6C5CE7', '#f1c40f']);
        state.glassesColor = rc(['#111111', '#333333', '#d4af37', '#0984e3', '#e84393', '#ffffff']);
        state.bgColor = rc(['#dfe6e9', '#74b9ff', '#ff7675', '#55efc4', '#a29bfe', '#fdcb6e']);
        state.hairSeed = Math.floor(Math.random()*1e9);
        state.faceName = makeName();
        state.stickers = [];
        state.activeStickerId = null;
        if(Math.random() > 0.35) {
            const count = 1 + Math.floor(Math.random() * 3);
            for(let i = 0; i < count; i++) {
                const place = STICKER_START_POINTS[(i + Math.floor(Math.random() * STICKER_START_POINTS.length)) % STICKER_START_POINTS.length];
                const sticker = makeSticker(rc(STICKER_EMOJIS), place.x + Math.floor(Math.random()*31 - 15), place.y + Math.floor(Math.random()*31 - 15), 0.86 + Math.random() * 0.5);
                state.stickers.push(sticker);
                state.activeStickerId = sticker.id;
                selectedStickerEmoji = sticker.emoji;
            }
        }
        
        ['face','hair','eye','brow','nose','mouth','beard','mustache','glasses','hat'].forEach(p => {
            state[p+'X'] = 0; state[p+'Y'] = 0;
        });

        state.faceSize = 0.85 + Math.random()*0.35;
        state.hairSize = 0.9 + Math.random()*0.2;
        state.eyeSize = 0.9 + Math.random()*0.25;
        state.browSize = 0.9 + Math.random()*0.2;
        state.noseSize = 0.9 + Math.random()*0.25;
        state.mouthSize = 0.9 + Math.random()*0.25;
        state.beardSize = 0.8 + Math.random()*0.4;
        state.mustacheSize = 0.8 + Math.random()*0.4;
        state.hatSize = 0.9 + Math.random()*0.2;
        state.glassesSize = 0.9 + Math.random()*0.2;

        draw();
        refreshUI();
        showToast('A brand-new weird face appeared!');
    }

    function downloadImage() {
        const getTimestamp = () => {
            const now = new Date();
            return now.toISOString().replace(/[:.]/g, '-');
        };
        const fileSafeName = (state.faceName || 'silly-face').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'silly-face';
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = 800;
        exportCanvas.height = 900;
        const exportCtx = exportCanvas.getContext('2d');
        renderFaceToCtx(exportCtx, state, exportCanvas.width, exportCanvas.height, 72, true);
        try {
            const dataUrl = exportCanvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = `${fileSafeName}-${getTimestamp()}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Picture saved!');
        } catch (e) {
            const dataUrl = exportCanvas.toDataURL("image/png");
            const win = window.open();
            if(win && win.document) win.document.write('<img src="' + dataUrl + '" style="width:100%" alt="Saved silly face"/>');
        }
    }

    initUI();
    syncNameUI();
    draw();
    window.addEventListener('resize', draw);

    
    const NAME_FIRST = ['ai','ea','oi','a','','','','e','','','i','','o','','','u','','','','','','','','','',''];
    const NAME_SECOND = ['b','c','d','f','g','h','j','k','l','m','n','p','qu','r','s','t','v','w','x','y','z','br','bl','cr','cl','ch','dr','fr','fl','gr','gl','gh','kl','kr','kn','ll',"l'","pr","pl","ph","rh","st","sl","sh","sh'","sc","sk","sw","tr","th","tw","wr","x-","zh",'','','','','','','','','','',''];
    const NAME_THIRD = ['a','aa','ae','au','ai','e','ea','ei','eu','i','iu','o','oe','oi','oa','ou','u','ui','ue'];
    const NAME_FOURTH = ['b','c','d','f','g','h','k','l','m','n','p','r','s','t','v','w','x','y','z','ch','gh','mp','mt','nd','nt','pt','rt','rm','rk','st','sk','sh','th','ts','','','','','','','','','','','','','',''];
    const NAME_FIFTH = ['a','aa','ae','au','ai','e','ea','ei','eu','i','iu','o','oe','oi','oa','ou','u','ui','ue','','','','','','','','','','',''];

    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] ?? ''; }

    function compactName(s){
        
        return (s || '').replace(/\s+/g,'').replace(/\-\-/g,'-');
    }

    function titleCase(s){
        if(!s) return s;
        return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function makeName(){
        const longname = compactName(pick(NAME_FIRST)+pick(NAME_SECOND)+pick(NAME_THIRD)+pick(NAME_FOURTH)+pick(NAME_FIFTH));
        const shortname = compactName(pick(NAME_SECOND)+pick(NAME_THIRD)+pick(NAME_FOURTH));
        const rand = 1 + Math.floor(Math.random()*4); 
        const nm = (rand === 1) ? longname : (rand > 2 ? shortname : longname);
        return titleCase(nm);
    }


    function generateName(saveHistory = true){
        let name = '';
        let tries = 0;
        do {
            name = makeName();
            tries++;
        } while(tries < 25 && (!name || name.length < 3));

        if(saveHistory) pushHistory();
        state.faceName = name || 'Unnamed';
        syncNameUI();
        draw();
        showToast(`Meet ${state.faceName}!`);
        return state.faceName;
    }

    document.addEventListener('click', (e) => {
        const t = e.target;
        if(t && t.id === 'nameGenBtn'){
            generateName(true);
        }
    });


    
    window.generateName = generateName;

    window.SillyFaceAutosave = {
        id: 'silly-face-lab',
        title: 'Silly Face Lab',
        version: 1,
        capture: function(){
            return {
                state: JSON.parse(JSON.stringify(state)),
                history: historyStack.slice(-20).map(item=>JSON.parse(JSON.stringify(item))),
                tab: currentTab ? currentTab.id : UI_MAP[0].id
            };
        },
        restore: function(saved){
            if(!saved || !saved.state || typeof saved.state!=='object') throw new Error('Invalid Silly Face save');
            state=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(JSON.stringify(saved.state)));
            ensureStickerState();
            state.stickers=state.stickers.slice(0,30).filter(s=>s&&STICKER_EMOJIS.includes(s.emoji)).map(s=>({
                id:String(s.id||('st_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7))),
                emoji:s.emoji,
                x:Math.max(-260,Math.min(260,Number(s.x)||0)),
                y:Math.max(-300,Math.min(300,Number(s.y)||0)),
                size:Math.max(22,Math.min(170,Number(s.size)||STICKER_BASE_SIZE)),
                rotation:Math.max(-Math.PI,Math.min(Math.PI,Number(s.rotation)||0))
            }));
            ensureStickerState();
            historyStack=Array.isArray(saved.history)?saved.history.slice(-20).filter(item=>item&&typeof item==='object'):[];
            pointerDrag=null;
            const savedTab=UI_MAP.some(cat=>cat.id===saved.tab)?saved.tab:UI_MAP[0].id;
            openCategory(savedTab);
            draw();refreshUI();
        },
        meaningful: function(){ return JSON.stringify(state)!==JSON.stringify(DEFAULTS); },
        summary: function(){ return state.faceName ? String(state.faceName).slice(0,40) : 'Custom face'; },
        startFresh: function(){
            state=JSON.parse(JSON.stringify(DEFAULTS));historyStack=[];pointerDrag=null;openCategory('presets');draw();refreshUI();
        }
    };

</script>
<script src="../arcade-save.js"></script>
<script>ArcadeSave.register(window.SillyFaceAutosave);</script>
<script>document.getElementById('arcade-home-nav').addEventListener('click',()=>{ArcadeSave.saveNow().finally(()=>{location.href='../index.html'});});</script></body>
