<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1e">
<title>Visual Patterns</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../arcade-ui.css">
<style>
.stats{justify-self:end;display:flex;gap:5px}.stats .arcade-pill{font-size:12px;padding:5px 8px;min-height:34px}
.game{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
.prompt{padding:9px 14px;text-align:center;color:var(--arcade-muted);font-weight:900;font-size:clamp(16px,3.8vmin,24px)}
.puzzle{min-height:0;padding:clamp(9px,2.3vmin,20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(9px,2.2vmin,18px);overflow:auto}
.sequence,.visual-answers,.pair-row,.group-row{display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.6vw,12px);flex-wrap:wrap;max-width:100%}
.visual-answers{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.visual-card{min-width:0;min-height:clamp(74px,15vmin,126px);border:2px solid rgba(255,255,255,.14);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));display:grid;place-items:center;padding:7px;position:relative;color:#fff;touch-action:manipulation}
button.visual-card:active{transform:scale(.97);background:rgba(255,255,255,.14)}
.visual-card.blank{border-style:dashed;border-color:rgba(33,220,255,.55);background:rgba(33,220,255,.08);font-size:clamp(31px,8vmin,60px);font-weight:1000;color:var(--arcade-cyan)}
.visual-card.correct{border-color:var(--arcade-green);box-shadow:0 0 0 3px rgba(114,239,128,.2) inset}.visual-card.wrong{border-color:var(--arcade-red);animation:shake .25s}
.shape{display:block;width:calc(74px * var(--size,1));height:calc(74px * var(--size,1));max-width:86%;max-height:86%;background:var(--c,#21dcff);transform:rotate(var(--rot,0deg));filter:drop-shadow(0 5px 5px rgba(0,0,0,.3));transition:.2s}
.shape.circle{border-radius:50%}.shape.square{border-radius:13%}.shape.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}.shape.diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.shape.star{clip-path:polygon(50% 0,61% 34%,98% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,2% 35%,39% 34%)}.shape.arrow{clip-path:polygon(0 34%,58% 34%,58% 5%,100% 50%,58% 95%,58% 66%,0 66%)}
.arrow-mark{font-size:clamp(28px,6vmin,48px);color:var(--arcade-gold);font-weight:1000}.pair{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--arcade-line);border-radius:19px;background:rgba(0,0,0,.2)}
.feedback{min-height:62px;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:800;color:var(--arcade-muted)}
.feedback strong{color:#fff}.feedback[hidden]{visibility:hidden;display:flex!important}.next{min-width:110px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(max-width:520px){.visual-answers{grid-template-columns:repeat(2,minmax(0,1fr))}.visual-card{min-height:77px;border-radius:14px}.shape{width:56px;height:56px}.puzzle{justify-content:flex-start}.feedback{font-size:12px;min-height:54px;padding:7px}}
@media(max-height:520px){.prompt{padding:5px;font-size:15px}.game{gap:5px}.puzzle{padding:5px;gap:6px}.visual-card{min-height:57px;border-radius:12px}.shape{width:44px;height:44px}.visual-answers{gap:5px;grid-template-columns:repeat(4,minmax(0,1fr))}.feedback{min-height:43px;padding:5px;font-size:11px}.pair{padding:4px}}
</style>
</head>
<body class="arcade-shell"><main class="arcade-app">
<header class="arcade-top"><button class="arcade-btn arcade-home" id="home">⌂ <span class="label">Arcade</span></button><h1 class="arcade-title">Visual Patterns</h1><div class="stats"><span class="arcade-pill" id="score">⭐ 0</span><button class="arcade-btn" id="menu">Menu</button></div></header>
<section class="game"><div class="prompt arcade-panel" id="prompt">Look closely...</div><div class="puzzle arcade-panel" id="puzzle"></div><div class="feedback arcade-panel" id="feedback" hidden><span id="feedbackText"></span><button class="arcade-btn primary next" id="next">Next</button></div></section>
</main>
<div class="arcade-overlay" id="start"><div class="arcade-dialog arcade-panel"><h1>Visual Patterns</h1><p>Shapes, colors, sizes, directions, and sneaky visual rules. No number homework here.</p><div class="arcade-segments" id="difficulty"><button class="arcade-btn active" data-d="easy">Easy</button><button class="arcade-btn" data-d="regular">Regular</button><button class="arcade-btn" data-d="hard">Hard</button></div><div style="height:10px"></div><button class="arcade-btn gold" id="play" style="width:100%;font-size:19px">Play</button><button class="arcade-btn" id="load" style="width:100%;margin-top:7px">Load Saved Game</button><button class="arcade-btn" id="back" style="width:100%;margin-top:7px">Back to Arcade</button></div></div>
<script>
(() => {
'use strict';
const COLORS=[{n:'blue',h:'#21dcff'},{n:'pink',h:'#ff5ac8'},{n:'yellow',h:'#ffce3a'},{n:'green',h:'#72ef80'},{n:'purple',h:'#9b7cff'},{n:'orange',h:'#ff8a3d'}];
const SHAPES=['circle','square','triangle','diamond','star','arrow'];
const SIZES=[.68,.88,1.08],ROTS=[0,90,180,270];
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o)),pick=a=>a[(Math.random()*a.length)|0],shuf=a=>{for(let i=a.length-1;i;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let difficulty='easy',score=0,streak=0,puzzle=null,answered=false,pickedIndex=-1;
function token(shape=pick(SHAPES),color=pick(COLORS),size=pick(SIZES),rot=pick(ROTS)){return{shape,color:color.n,hex:color.h,size,rot}}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function different(base,amount=1){const t=clone(base),attrs=shuf(['shape','color','size','rot'].slice()).slice(0,amount);attrs.forEach(a=>{if(a==='shape')t.shape=pick(SHAPES.filter(x=>x!==t.shape));if(a==='color'){const c=pick(COLORS.filter(x=>x.n!==t.color));t.color=c.n;t.hex=c.h}if(a==='size')t.size=pick(SIZES.filter(x=>x!==t.size));if(a==='rot')t.rot=pick(ROTS.filter(x=>x!==t.rot))});return t}
function choices(answer,hard=false){const out=[clone(answer)];while(out.length<4){const t=different(answer,hard&&Math.random()<.35?2:1);if(!out.some(x=>same(x,t)))out.push(t)}return shuf(out)}
function makeNext(){const count=difficulty==='easy'?2:difficulty==='regular'?3:4;const base=token();const pattern=[base];for(let i=1;i<count;i++)pattern.push(different(base,difficulty==='hard'?2:1));const shown=[];const len=difficulty==='easy'?5:6;for(let i=0;i<len;i++)shown.push(clone(pattern[i%count]));const answer=clone(pattern[len%count]);return{type:'next',prompt:'What comes next?',shown,answer,choices:choices(answer,difficulty==='hard'),explain:`The same ${count}-picture pattern repeats.`}}
function makeMissing(){const count=difficulty==='easy'?2:3,base=token(),pattern=[base];for(let i=1;i<count;i++)pattern.push(different(base,difficulty==='hard'?2:1));const len=6,shown=[];for(let i=0;i<len;i++)shown.push(clone(pattern[i%count]));const missing=difficulty==='easy'?3:((Math.random()*4)|0)+1,answer=shown[missing];shown[missing]=null;return{type:'missing',prompt:'Which picture fills the empty spot?',shown,missing,answer,choices:choices(answer,difficulty==='hard'),explain:'The pictures on both sides show which part of the repeating pattern is missing.'}}
function makeOdd(){const rule=pick(['shape','color','size','rot']),base=token(),items=[];for(let i=0;i<5;i++){const t=clone(base);if(rule!=='shape')t.shape=pick(SHAPES);if(rule!=='color'){const c=pick(COLORS);t.color=c.n;t.hex=c.h}if(rule!=='size')t.size=pick(SIZES);if(rule!=='rot')t.rot=pick(ROTS);items.push(t)}const odd=(Math.random()*5)|0;items[odd]=different(items[odd],1);if(rule==='shape')items[odd].shape=pick(SHAPES.filter(x=>x!==base.shape));if(rule==='color'){const c=pick(COLORS.filter(x=>x.n!==base.color));items[odd].color=c.n;items[odd].hex=c.h}if(rule==='size')items[odd].size=pick(SIZES.filter(x=>x!==base.size));if(rule==='rot')items[odd].rot=pick(ROTS.filter(x=>x!==base.rot));return{type:'odd',prompt:'Which one does not belong?',items,answerIndex:odd,explain:`Four match by ${rule}. One breaks that visual rule.`}}
function makeGroup(){const rule=pick(difficulty==='easy'?['shape','color']:['shape','color','size','rot']),base=token(),group=[];for(let i=0;i<3;i++){const t=clone(base);if(rule!=='shape')t.shape=pick(SHAPES);if(rule!=='color'){const c=pick(COLORS);t.color=c.n;t.hex=c.h}if(rule!=='size')t.size=pick(SIZES);if(rule!=='rot')t.rot=pick(ROTS);group.push(t)}const answer=clone(base);if(rule!=='shape')answer.shape=pick(SHAPES);if(rule!=='color'){const c=pick(COLORS);answer.color=c.n;answer.hex=c.h}if(rule!=='size')answer.size=pick(SIZES);if(rule!=='rot')answer.rot=pick(ROTS);const opts=[answer];while(opts.length<4){const t=token();if(t[rule]!==base[rule]&&!opts.some(x=>same(x,t)))opts.push(t)}return{type:'group',prompt:'Which picture belongs with this group?',group,answer,choices:shuf(opts),explain:`Every picture in the group has the same ${rule}.`}}
function makeTransform(){const a=token(),ops=difficulty==='easy'?[pick(['color','rot','size'])]:shuf(['color','rot','size','shape']).slice(0,difficulty==='hard'?2:1),b=clone(a);ops.forEach(op=>{if(op==='color'){const c=pick(COLORS.filter(x=>x.n!==b.color));b.color=c.n;b.hex=c.h}if(op==='rot')b.rot=(b.rot+90)%360;if(op==='size')b.size=b.size===SIZES[2]?SIZES[0]:SIZES[SIZES.indexOf(b.size)+1];if(op==='shape')b.shape=pick(SHAPES.filter(x=>x!==b.shape))});const c=token();if(ops.includes('color')&&c.color===b.color){const other=pick(COLORS.filter(x=>x.n!==b.color));c.color=other.n;c.hex=other.h}if(ops.includes('shape')&&c.shape===b.shape)c.shape=pick(SHAPES.filter(x=>x!==b.shape));const answer=clone(c);ops.forEach(op=>{if(op==='color'){answer.color=b.color;answer.hex=b.hex}if(op==='rot')answer.rot=(answer.rot+90)%360;if(op==='size')answer.size=answer.size===SIZES[2]?SIZES[0]:SIZES[SIZES.indexOf(answer.size)+1];if(op==='shape')answer.shape=b.shape});return{type:'transform',prompt:'The first picture changes. Make the same change to the second.',a,b,c,answer,choices:choices(answer,true),explain:`The change was: ${ops.map(x=>x==='rot'?'turn it':`change ${x}`).join(' and ')}.`}}
function generate(){const types=difficulty==='easy'?['next','missing','odd','group']:['next','missing','odd','group','transform'],type=pick(types);return type==='next'?makeNext():type==='missing'?makeMissing():type==='odd'?makeOdd():type==='group'?makeGroup():makeTransform()}
function visual(t,button=false,index=''){const el=document.createElement(button?'button':'div');if(button)el.type='button';el.className='visual-card';if(button){el.dataset.choice=index;el.setAttribute('aria-label','Answer choice')}if(!t){el.classList.add('blank');el.textContent='?';return el}const s=document.createElement('span');s.className='shape '+t.shape;s.style.setProperty('--c',t.hex);s.style.setProperty('--size',t.size);s.style.setProperty('--rot',t.rot+'deg');el.appendChild(s);return el}
function answerGrid(list){const g=document.createElement('div');g.className='visual-answers';list.forEach((t,i)=>g.appendChild(visual(t,true,String(i))));return g}
function render(){answered=false;$('feedback').hidden=true;$('puzzle').replaceChildren();$('prompt').textContent=puzzle.prompt;$('score').textContent='⭐ '+score+(streak>1?'  🔥'+streak:'');const root=$('puzzle');
  if(puzzle.type==='next'||puzzle.type==='missing'){const seq=document.createElement('div');seq.className='sequence';puzzle.shown.forEach(t=>seq.appendChild(visual(t)));root.append(seq,answerGrid(puzzle.choices))}
  else if(puzzle.type==='odd'){const row=document.createElement('div');row.className='visual-answers';puzzle.items.forEach((t,i)=>row.appendChild(visual(t,true,String(i))));root.append(row)}
  else if(puzzle.type==='group'){const row=document.createElement('div');row.className='group-row';puzzle.group.forEach(t=>row.appendChild(visual(t)));root.append(row,answerGrid(puzzle.choices))}
  else{const row=document.createElement('div');row.className='pair-row';const p1=document.createElement('div');p1.className='pair';p1.append(visual(puzzle.a),mark(),visual(puzzle.b));const p2=document.createElement('div');p2.className='pair';p2.append(visual(puzzle.c),mark(),visual(null));row.append(p1,p2);root.append(row,answerGrid(puzzle.choices))}
  root.querySelectorAll('button.visual-card').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.choice),b)));if(window.ArcadeSave)ArcadeSave.touch(400)}
function mark(){const m=document.createElement('span');m.className='arrow-mark';m.textContent='→';return m}
function choose(index,el,award=true){if(answered)return;answered=true;pickedIndex=index;const correct=puzzle.type==='odd'?index===puzzle.answerIndex:same(puzzle.choices[index],puzzle.answer);el.classList.add(correct?'correct':'wrong');if(!correct){const right=puzzle.type==='odd'?puzzle.answerIndex:puzzle.choices.findIndex(x=>same(x,puzzle.answer));const b=$('puzzle').querySelector(`[data-choice="${right}"]`);if(b)b.classList.add('correct');if(award)streak=0}else if(award){score++;streak++}$('score').textContent='⭐ '+score+(streak>1?'  🔥'+streak:'');$('feedbackText').innerHTML=`<strong>${correct?'Nice!':'Almost!'}</strong> ${puzzle.explain}`;$('feedback').hidden=false;if(window.ArcadeSave)ArcadeSave.touch(100)}
function next(){puzzle=generate();pickedIndex=-1;render()}
function setDiff(d){difficulty=d;document.querySelectorAll('#difficulty button').forEach(b=>b.classList.toggle('active',b.dataset.d===d))}
document.querySelectorAll('#difficulty button').forEach(b=>b.addEventListener('click',()=>setDiff(b.dataset.d)));$('play').addEventListener('click',()=>{$('start').hidden=true;score=0;streak=0;next()});$('next').addEventListener('click',next);$('menu').addEventListener('click',()=>{$('start').hidden=false});$('home').addEventListener('click',leave);$('back').addEventListener('click',leave);$('load').addEventListener('click',()=>{if(window.ArcadeSave)ArcadeSave.load()});function leave(){const go=()=>location.href='../index.html';window.ArcadeSave?ArcadeSave.saveNow().finally(go):go()}
window.PatternsAutosave={id:'patterns',title:'Visual Patterns',version:2,capture:()=>puzzle?{difficulty,score,streak,puzzle,answered,pickedIndex}:undefined,restore:s=>{if(!s||!s.puzzle)throw new Error('Invalid patterns save');difficulty=['easy','regular','hard'].includes(s.difficulty)?s.difficulty:'easy';score=Math.max(0,Number(s.score)||0);streak=Math.max(0,Number(s.streak)||0);puzzle=s.puzzle;const wasAnswered=!!s.answered,savedPick=Math.max(0,Math.min(4,Number(s.pickedIndex)||0));setDiff(difficulty);pickedIndex=-1;$('start').hidden=true;render();if(wasAnswered){const buttons=$('puzzle').querySelectorAll('button.visual-card');if(buttons[savedPick])choose(savedPick,buttons[savedPick],false)}return true},meaningful:()=>!!puzzle,summary:()=>`${score} solved • ${difficulty}`,startFresh:()=>{puzzle=null;score=streak=0;answered=false;pickedIndex=-1;$('start').hidden=false}};
window.PatternsDebug={generateFor:d=>{const old=difficulty;difficulty=['easy','regular','hard'].includes(d)?d:'easy';const out=generate();difficulty=old;return out},same};
setDiff('easy');
})();
</script><script src="../arcade-save.js"></script><script>ArcadeSave.register(window.PatternsAutosave);</script>
</body></html>
