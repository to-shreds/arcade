name: Deploy MultiBooker Worker Bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-multibooker-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multibooker-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out MultiBooker
        uses: actions/checkout@v6
        with:
          repository: to-shreds/MultiBooker
          ref: main
          path: multibooker
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare MultiBooker static assets
        run: |
          mkdir -p multibooker/worker/public
          cp multibooker/index.html multibooker/styles.css multibooker/app.js multibooker/manifest.webmanifest multibooker/worker/public/

      - name: Install and test MultiBooker Worker
        working-directory: multibooker/worker
        run: npm install && npm run check

      - name: Deploy MultiBooker Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: multibooker/worker
          command: deploy

      - name: Verify deployed Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if body="$(curl --fail --silent --show-error https://multibooker-api.jonathanjablon.workers.dev/health)"; then
              printf '%s\n' "$body"
              if curl --fail --silent --show-error https://multibooker-api.jonathanjablon.workers.dev/ | grep -q "MultiBooker"; then
                exit 0
              fi
            fi
            sleep 2
          done
          exit 1

      - name: Smoke test MultiBooker scheduling API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://multibooker-api.jonathanjablon.workers.dev"
          CODE="SMOKE${GITHUB_RUN_ID}"
          PIN="4268"
          CREATED=$(curl --fail --silent --show-error -X POST "$BASE/api/groups" -H 'content-type: application/json' --data "{\"code\":\"$CODE\",\"name\":\"Deployment smoke test\",\"organizerName\":\"Smoke One\",\"requiredPeople\":2,\"pin\":\"$PIN\",\"timezone\":\"America/New_York\",\"round\":{\"startDate\":\"2026-09-21\",\"endDate\":\"2026-09-21\",\"durationMinutes\":60,\"weekdayStart\":\"18:00\",\"weekdayEnd\":\"20:00\",\"weekendStart\":\"08:00\",\"weekendEnd\":\"10:00\",\"allowedDays\":[1]}}")
          FIRST=$(printf '%s' "$CREATED" | jq -r '.participantId')
          ROUND=$(printf '%s' "$CREATED" | jq -r '.round.id')
          JOINED=$(curl --fail --silent --show-error -X POST "$BASE/api/groups/$CODE/participants" -H 'content-type: application/json' --data '{"name":"Smoke Two"}')
          SECOND=$(printf '%s' "$JOINED" | jq -r '.participantId')
          for PERSON in "$FIRST" "$SECOND"; do
            curl --fail --silent --show-error -X PUT "$BASE/api/groups/$CODE/availability" -H 'content-type: application/json' --data "{\"roundId\":\"$ROUND\",\"participantId\":\"$PERSON\",\"updates\":{\"2026-09-21T18:00\":\"yes\",\"2026-09-21T18:30\":\"yes\"}}" >/dev/null
          done
          STATE=$(curl --fail --silent --show-error "$BASE/api/groups/$CODE")
          printf '%s' "$STATE" | jq -e '.candidates[] | select(.startKey == "2026-09-21T18:00" and .classification == "ready" and (.yesIds | length) >= 2)' >/dev/null
          CONFIRMED=$(curl --fail --silent --show-error -X POST "$BASE/api/groups/$CODE/confirm" -H 'content-type: application/json' --data "{\"pin\":\"$PIN\",\"roundId\":\"$ROUND\",\"startKey\":\"2026-09-21T18:00\",\"participantIds\":[\"$FIRST\",\"$SECOND\"]}")
          printf '%s' "$CONFIRMED" | jq -e '.round.confirmed.startKey == "2026-09-21T18:00" and (.round.confirmed.participantIds | length) == 2' >/dev/null
          echo "Production scheduling smoke test passed for $CODE"

