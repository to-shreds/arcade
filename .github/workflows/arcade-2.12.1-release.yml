name: Package Arcade 2.12.1

on:
  push:
    branches: [work/arcade-2.12.1-release]

permissions:
  contents: write

concurrency:
  group: arcade-2.12.1-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify release source and package
        run: |
          npm ci --prefix cloudflare/chess-worker
          node -e "if(require('./package.json').version!=='2.12.1')throw Error('Expected Arcade 2.12.1')"
          npm run test:tanks
          npm run test:new-games:models
          node tools/test-activity-save-contract.mjs
          node tools/test-native-keyboard.mjs
          node tools/test-shell-navigation.mjs
          node tools/test-android-wrapper.mjs
          node tools/test-offline-runtime.mjs
          python3 tools/package-web-release.py --output "$RUNNER_TEMP/arcade-2.12.1-web.zip" > "$RUNNER_TEMP/package.json"
      - name: Publish the verified download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP'])
          package = json.loads((output / 'package.json').read_text())
          manifest = json.loads(Path('offline-manifest.json').read_text())
          package.update(filename='arcade-2.12.1-web.zip', source_commit=os.environ['GITHUB_SHA'],
                         runtime_files=manifest['fileCount'], runtime_bytes=manifest['totalBytes'],
                         github_run=os.environ['GITHUB_RUN_ID'])
          (output / 'arcade-2.12.1-provenance.json').write_text(json.dumps(package, indent=2) + '\n')
          print(json.dumps(package))
          PY
          gh release create arcade-v2.12.1 "$RUNNER_TEMP/arcade-2.12.1-web.zip" "$RUNNER_TEMP/arcade-2.12.1-provenance.json" --target "$GITHUB_SHA" --title 'Arcade 2.12.1' --notes 'Tank Tactics now always uses all 132 weapons, adds bounded physical knockback for strong hits, and provides precise one-step arrow buttons next to all three sliders. Existing saves and multiplayer are retained; see the verification report for tests and device limits.'

      - name: Retain the downloadable ZIP and provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-2.12.1-web
          path: |
            ${{ runner.temp }}/arcade-2.12.1-web.zip
            ${{ runner.temp }}/arcade-2.12.1-provenance.json
          retention-days: 30
