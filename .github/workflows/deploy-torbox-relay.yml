name: Deploy TorBox Relay Backup
# relay-source: torbox-web-player 2.2.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-torbox-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torbox-relay-backup
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out TorBox Web Player relay source
        uses: actions/checkout@v6
        with:
          repository: to-shreds/torbox-web-player
          ref: main
          path: torbox-src

      - name: Show TorBox relay source revision
        working-directory: torbox-src
        run: git rev-parse HEAD

      - name: Deploy TorBox backup relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: torbox-src/relay/cloudflare
          command: deploy

      - name: Verify deployed relay health and Cinemeta fallback
        shell: bash
        run: |
          set -euo pipefail
          base="https://torbox-web-player-relay.jonathanjablon.workers.dev"
          for i in {1..10}; do
            if curl --fail --silent --show-error -H "Origin: https://to-shreds.github.io" "$base/relay/health" >/tmp/health.json; then
              cat /tmp/health.json
              echo
              break
            fi
            if [ "$i" = 10 ]; then
              echo "Cloudflare relay health check failed" >&2
              exit 1
            fi
            sleep 3
          done

          curl --fail --silent --show-error -G             -H "Origin: https://to-shreds.github.io"             --data-urlencode "path=/meta/series/tt0182576.json"             "$base/relay/cinemeta" > /tmp/meta.json
          node -e "const x=require('/tmp/meta.json'); if(x?.meta?.id!=='tt0182576'||x?.meta?.type!=='series') process.exit(1)"

          curl --fail --silent --show-error -G             -H "Origin: https://to-shreds.github.io"             --data-urlencode "path=/catalog/movie/top.json"             "$base/relay/cinemeta" > /tmp/catalog.json
          node -e "const x=require('/tmp/catalog.json'); if(!Array.isArray(x?.metas)||!x.metas.length) process.exit(1)"

          curl --fail --silent --show-error -G             -H "Origin: https://to-shreds.github.io"             --data-urlencode "path=/catalog/series/top/search=Elena%20of%20avalor.json"             "$base/relay/cinemeta" > /tmp/search.json
          node -e "const x=require('/tmp/search.json'); if(!Array.isArray(x?.metas)||x.metas.some(m=>!String(m?.name||'').toLowerCase().includes('elena'))) process.exit(1)"
