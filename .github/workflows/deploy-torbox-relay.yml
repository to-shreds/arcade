name: Deploy TorBox Relay Backup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-torbox-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torbox-relay-backup
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out TorBox Web Player relay source
        uses: actions/checkout@v6
        with:
          repository: to-shreds/torbox-web-player
          ref: main
          path: torbox-src

      - name: Show TorBox relay source revision
        working-directory: torbox-src
        run: git rev-parse HEAD

      - name: Deploy TorBox backup relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: torbox-src/relay/cloudflare
          command: deploy

      - name: Verify deployed relay health
        shell: bash
        run: |
          set -euo pipefail
          url="https://torbox-web-player-relay.jonathanjablon.workers.dev/relay/health"
          for i in {1..10}; do
            if curl --fail --silent --show-error -H "Origin: https://to-shreds.github.io" "$url"; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo "Cloudflare relay health check failed" >&2
          exit 1
