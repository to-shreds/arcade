name: Verify Published Arcade

on:
  push:
    branches:
      - arcade-production-verification-20261004

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out verified Arcade
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify published release and Worker health
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const expected = JSON.parse(await readFile('offline-manifest.json', 'utf8'));
          const response = await fetch('https://to-shreds.github.io/arcade/offline-manifest.json');
          assert.equal(response.status, 200);
          assert.deepEqual(await response.json(), expected);
          const health = await fetch('https://arcade-chess.jonathanjablon.workers.dev/health');
          assert.equal(health.status, 200);
          assert.equal((await health.json()).ok, true);
          console.log('Published manifest exactly matches verified source and Worker health passes.');
          NODE

      - name: Verify actual public rooms and images
        run: |
          node tools/test-production-browser.mjs
          node -e "const report = require('./test-results/production-browser/report.json'); if (report.status !== 'passed') throw new Error(report.reason || report.status);"

      - name: Retain production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-production-browser-checks
          path: test-results/production-browser/
          retention-days: 7
