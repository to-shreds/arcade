name: Upwords preflight

on:
  push:
    branches:
      - 'codex/upwords-*'

permissions:
  contents: read

concurrency:
  group: upwords-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix cloudflare/chess-worker
          npx playwright install --with-deps chromium
      - name: Verify rules, authority, client recovery, and packaged runtime
        run: |
          npm run test:upwords
          npm test --prefix cloudflare/chess-worker
          node --test multiplayer/test/*.test.mjs
          node tools/test-native-keyboard.mjs
          node tools/test-shell-navigation.mjs
          node tools/test-offline-runtime.mjs
      - name: Verify playable browser, saves, and both transports
        run: npm run test:upwords:browser
      - name: Verify catalog and existing shell
        run: |
          node tools/test-catalog-browser.mjs
          node tools/test-shell-browser.mjs
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upwords-preflight-evidence
          path: test-results/
          retention-days: 7
