name: Upwords fix preflight
on:
  push:
    branches: [fix/upwords-fit-words]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --prefix cloudflare/chess-worker && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:upwords && npm test --prefix cloudflare/chess-worker
      - run: npm run test:upwords:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: upwords-fix-evidence
          path: test-results/upwords-browser/
