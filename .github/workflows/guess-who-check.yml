name: Guess Who verification
on:
  push:
    branches: [work/guess-who-20260907]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guess-who-prepublish
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply exact tested implementation
        id: patch
        run: |
          if [ ! -f .github/guess-who-update.b64 ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'present=true' >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import base64,gzip,hashlib,pathlib
          patch=gzip.decompress(base64.b64decode(pathlib.Path('.github/guess-who-update.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == 'adcac4079faf633391d09aa76362bf31e1726d45ebfc214c1e942d88ecbe5f0e', 'Delivery hash mismatch'
          pathlib.Path('/tmp/guess-who.patch').write_bytes(patch)
          PY
          git apply --check /tmp/guess-who.patch
          git apply /tmp/guess-who.patch
      - uses: actions/setup-node@v6
        if: steps.patch.outputs.present == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        if: steps.patch.outputs.present == 'true'
        with:
          python-version: '3.13'
      - name: Test complete Arcade and Guess Who runtime
        if: steps.patch.outputs.present == 'true'
        run: |
          npm ci --prefix cloudflare/chess-worker
          npm test --prefix cloudflare/chess-worker
          node --test multiplayer/test/*.test.mjs
          node --test sorry/test.cjs checkers/online.test.mjs dots/online.test.mjs
          node memory/test-online.cjs
          node memory/online.browser.test.mjs
          node tic-tac-toe/test-online.cjs
          node tic-tac-toe/online.browser.test.mjs
          node tools/test-native-keyboard.mjs
          node tools/test-shell-navigation.mjs
          node tools/test-android-wrapper.mjs
          node tools/test-offline-runtime.mjs
      - name: Prepare actual browser tests
        if: steps.patch.outputs.present == 'true'
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test two browsers with the actual Durable Object
        if: steps.patch.outputs.present == 'true'
        run: |
          node guess-who/test-server.mjs > /tmp/guess-who-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8788/health && break || sleep 1; done
          python guess-who/test-browser.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.patch.outputs.present == 'true'
        with:
          name: guess-who-browser-checks
          path: |
            test-results/guess-who
            /tmp/guess-who-server.log
          retention-days: 3
      - name: Commit tested source to the isolated branch
        if: success() && steps.patch.outputs.present == 'true'
        run: |
          rm .github/guess-who-update.b64 .github/workflows/guess-who-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/guess-who-check.yml .github/guess-who-update.b64
          git add .github/workflows/guess-who-browser.yml CHANGELOG.md README.md arcade-shell.js catalog.json cloudflare/chess-worker/test guess-who multiplayer offline-manifest.json sw.js
          git diff --cached --check
          git commit -m 'feat: add authoritative multiplayer Guess Who'
          git push origin HEAD:work/guess-who-20260907
