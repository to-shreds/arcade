name: Build and verify Monster Forge 2
on:
  push:
    branches: [work/monster-forge-v2]
    paths: ['tools/forge-v2-*', '.github/workflows/forge-v2-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/monster-forge-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify and apply reviewed source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          p=pathlib.Path
          data=base64.b64decode(''.join(p(f'tools/forge-v2-{i}.b64').read_text() for i in range(4)))
          assert hashlib.sha256(data).hexdigest()=='1f756457556f768c127382f16888eab0b6faaa04a0c442c401fd1acc2cf1fee3'
          patch=lzma.decompress(data)
          exclude='--exclude=.github/workflows/monster-forge-checks.yml'
          subprocess.run(['git','apply',exclude,'--check','-'],input=patch,check=True)
          subprocess.run(['git','apply',exclude,'-'],input=patch,check=True)
          f=p('tools/test-monster-forge-browser.mjs');s=f.read_text()
          assert 'assert(m.items.length>=8);' in s
          s=s.replace('assert(m.items.length>=8);','assert.equal(m.items.length,await page.evaluate(id=>ForgeParts.recipe(id).items.length,id));')
          needle="assert.equal((await snap(page)).name,'Saved dragon');"
          assert needle in s
          s=s.replace(needle,"await page.waitForFunction(()=>MonsterForgeAutosave.capture().monster.name==='Saved dragon'&&document.getElementById('collection').hidden);"+needle)
          f.write_text(s)
          print('Applied verified runtime source without changing workflow permissions')
          PY
      - name: Install browser dependencies
        run: npm ci && npx playwright install chromium
      - name: Test all monster parts, touch, saves, exports and navigation
        run: |
          node --check monster-forge/game.js
          node --check monster-forge/parts.js
          node tools/test-monster-forge-browser.mjs
          node tools/test-shell-navigation.mjs
          node --test tools/test-comic-library-core.mjs
          node tools/test-comic-library-browser.mjs
      - name: Document verified release and refresh offline snapshot
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          p=pathlib.Path
          assert json.loads(p('test-results/monster-forge/report.json').read_text())['passed'] is True
          sw=p('sw.js');sw.write_text(re.sub(r"const WORKER_VERSION = '[^']+';", "const WORKER_VERSION = '2026-11-16-monster-forge-v2';",sw.read_text(),count=1))
          note='''# Monster Forge 2.0, Arcade 2.13.2 (2026-11-16)

          Source: monster-forge/ in this repository. This release adds 50
          illustrated anatomical pieces and six fully editable starter creatures.
          Existing saved v1 parts retain their original artwork through the
          per-piece artVersion field. New pieces have recognizable teeth, claws,
          feathers, wing membranes, suckers, joints, tails and robotic details.
          The blank drawing canvas remains available. Larger cropped previews
          and a separate selected-part panel make size, color, rotation, copy,
          flip, mirror-copy and layering accessible without browsing past parts.

          Also repaired: incremental live stroke rendering, geometry-based
          picking, collection fallback preservation beyond fifty saves, safety
          when saving before switching creatures, and 1800x1200 PNG export.
          Preserve old storage keys, creature IDs, artVersion=1 rendering,
          all existing games, Comic Library and multiplayer behavior.

          Verification: tools/test-monster-forge-browser.mjs passed actual
          Chromium checks at 320x568, 390x844, 832x384 and 1280x800; all 50
          insertions; six starters; mouse/touch drawing; part transforms;
          old-save artwork; IndexedDB collection and autosave reload; fallback
          save failure protection; PNG dimensions; effects and shell Home.
          Shell navigation and Comic Library core/browser regressions passed.
          The offline manifest and complete ZIP are generated and validated.
          No all-project green or physical Android tablet testing is claimed.
          Next: play it on the children's tablets and report any device issue.
          ProjectStatus records publication and final artifact fingerprints.

          ---

          '''
          hand=p('HANDOFF.md');hand.write_text(note+hand.read_text())
          readme=p('README.md');text=readme.read_text();pos=text.find('## Release ')
          intro='''## Release 2.13.2

          Monster Forge now has 50 illustrated parts and six editable starter
          creatures, larger previews, direct part editing and smoother drawing.
          Existing monsters retain their original artwork. Mix new anatomy,
          draw over it, save a collection and export 1800x1200 pictures.
          See monster-forge/README.md for controls and compatibility details.

          '''
          readme.write_text(text[:pos]+intro+text[pos:])
          for f in p('tools').glob('forge-v2-*'):f.unlink()
          PY
          node tools/generate-offline-manifest.mjs --version 2.13.2+20261116.1
          node tools/test-offline-runtime.mjs
      - name: Commit verified runtime changes on work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code -- .github/workflows
          git add monster-forge tools/test-monster-forge-browser.mjs 'tools/forge-v2-*' HANDOFF.md README.md sw.js offline-manifest.json
          git commit -m 'Improve Monster Forge with illustrated anatomy, editable starters and verified save compatibility'
          git push origin HEAD:work/monster-forge-v2
      - name: Package complete Arcade and standalone HTML
        run: |
          python3 tools/package-web-release.py --output "$RUNNER_TEMP/Arcade-2.13.2-Monster-Forge.zip"
          python3 - <<'PY'
          import pathlib,os,zipfile,hashlib,json,re
          p=pathlib.Path;out=p(os.environ['RUNNER_TEMP'])
          html=p('monster-forge/index.html').read_text()
          html=html.replace('<link rel="stylesheet" href="style.css">','<style>'+p('monster-forge/style.css').read_text()+'</style>')
          for name in ['parts.js','game.js','../arcade-save.js']:
              code=(p('monster-forge')/name).read_text()
              html=html.replace('<script src="'+name+'"></script>','<script>'+code+'</script>')
          html=html.replace('<head>','<head><script>window.MONSTER_FORGE_STANDALONE=true;</script>')
          assert not re.search(r'<(?:script|link)\b[^>]*(?:src|href)="(?:parts\.js|game\.js|style\.css|\.\./arcade-save\.js)"',html)
          (out/'Monster-Forge-2.0.html').write_text(html)
          with zipfile.ZipFile(out/'Monster-Forge-2.0-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in sorted(p('monster-forge').glob('*')):
                  if f.is_file():z.write(f,str(f))
          records=[]
          for name in ['Arcade-2.13.2-Monster-Forge.zip','Monster-Forge-2.0.html','Monster-Forge-2.0-source.zip']:
              b=(out/name).read_bytes();records.append(dict(name=name,bytes=len(b),sha256=hashlib.sha256(b).hexdigest()))
          (out/'Monster-Forge-2.0-artifacts.json').write_text(json.dumps(records,indent=2)+'\n')
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-forge-v2-results
          path: |
            test-results/monster-forge/
            ${{ runner.temp }}/Arcade-2.13.2-Monster-Forge.zip
            ${{ runner.temp }}/Monster-Forge-2.0.html
            ${{ runner.temp }}/Monster-Forge-2.0-source.zip
            ${{ runner.temp }}/Monster-Forge-2.0-artifacts.json
          retention-days: 7
