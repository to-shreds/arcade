<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07142f">
  <title>Logan and Jenkins: Operation Giggle</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #06112a;
      --night-2: #0d2145;
      --card: rgba(13, 31, 66, 0.94);
      --card-2: rgba(18, 42, 83, 0.96);
      --ink: #f8fbff;
      --muted: #bfd0ee;
      --line: rgba(184, 211, 255, 0.2);
      --yellow: #ffd45d;
      --coral: #ff806f;
      --mint: #60e0bd;
      --blue: #62a8ff;
      --purple: #aa8cff;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: ui-rounded, "Trebuchet MS", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(98, 168, 255, 0.18), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(170, 140, 255, 0.16), transparent 30%),
        radial-gradient(circle at 58% 105%, rgba(96, 224, 189, 0.13), transparent 38%),
        linear-gradient(145deg, var(--night), var(--night-2));
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .app {
      width: min(1240px, 100%);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(5px, 0.8vh, 9px);
    }

    .topbar {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 31px;
    }

    .top-phase {
      min-width: 0;
      overflow: hidden;
      color: var(--yellow);
      font-size: clamp(10px, 1.25vw, 12px);
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home { flex-shrink: 0; color: var(--yellow); text-decoration: none; }
    .home:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

    .tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool {
      min-height: 30px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.055);
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease, color 140ms ease;
    }

    .tool:hover:not(:disabled) {
      color: var(--ink);
      border-color: rgba(98, 168, 255, 0.58);
      background: rgba(98, 168, 255, 0.12);
    }

    .tool:active:not(:disabled) { transform: translateY(1px) scale(0.98); }
    .tool:disabled { opacity: 0.38; cursor: default; }
    .tool.stop { color: #ffd2cc; }

    .story-card {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid rgba(184, 211, 255, 0.2);
      border-radius: var(--radius);
      background: linear-gradient(160deg, var(--card-2), var(--card));
      box-shadow: var(--shadow);
    }

    .scene-heading {
      padding: clamp(8px, 1.3vh, 13px) clamp(14px, 2.2vw, 25px) clamp(7px, 1vh, 10px);
      border-bottom: 1px solid rgba(184, 211, 255, 0.11);
    }

    .scene-heading h2 {
      margin: 0;
      font-size: clamp(19px, 3vw, 29px);
      line-height: 1.08;
      letter-spacing: -0.018em;
    }

    .story-scroll {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-color: rgba(98, 168, 255, 0.48) transparent;
      scrollbar-width: thin;
      padding: clamp(10px, 1.6vh, 17px) clamp(14px, 2.2vw, 25px) clamp(7px, 1vh, 11px);
    }

    .story-scroll.paginated {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .story-scroll.paginated.single-page {
      grid-template-rows: minmax(0, 1fr);
    }

    .story-copy {
      min-height: 0;
      overflow: hidden;
    }

    .story-copy p,
    .story-measure p {
      max-width: 86ch;
      margin: 0 0 0.7em;
      color: #edf4ff;
      font-size: clamp(16px, 1.8vw, 20px);
      line-height: 1.48;
    }

    .story-copy p:last-child,
    .story-measure p:last-child { margin-bottom: 0; }

    .story-measure {
      position: absolute;
      left: 0;
      top: 0;
      z-index: -1;
      visibility: hidden;
      pointer-events: none;
      overflow: visible;
    }

    .page-nav {
      min-height: 30px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-top: 1px solid rgba(184, 211, 255, 0.09);
      padding-top: 5px;
    }

    .page-nav.collapsed { display: none; }

    .page-button {
      min-width: 68px;
      min-height: 27px;
      padding: 3px 8px;
      border: 1px solid rgba(98, 168, 255, 0.36);
      border-radius: 9px;
      color: #f8fbff;
      background: rgba(98, 168, 255, 0.1);
      cursor: pointer;
      font-size: 12px;
      font-weight: 850;
    }

    .page-button:disabled { opacity: 0.3; cursor: default; }

    .page-status {
      min-width: 46px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      font-weight: 800;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(5px, 0.8vh, 8px);
      transition: opacity 120ms ease;
    }

    .choices.waiting {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .choice {
      position: relative;
      min-width: 0;
      min-height: clamp(47px, 7vh, 61px);
      padding: 8px 11px 8px 43px;
      overflow: hidden;
      border: 1px solid rgba(184, 211, 255, 0.23);
      border-radius: 14px;
      color: #f8fbff;
      background: linear-gradient(145deg, rgba(31, 67, 123, 0.96), rgba(20, 45, 88, 0.98));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      text-align: left;
      font-size: clamp(13px, 1.5vw, 16px);
      font-weight: 850;
      line-height: 1.25;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .choice:hover {
      transform: translateY(-2px);
      border-color: rgba(96, 224, 189, 0.68);
      background: linear-gradient(145deg, rgba(38, 83, 146, 0.98), rgba(25, 57, 106, 0.98));
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
    }

    .choice:active { transform: translateY(1px) scale(0.992); }

    .choice-number {
      position: absolute;
      left: 9px;
      top: 50%;
      width: 25px;
      height: 25px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #07142f;
      background: var(--yellow);
      font-size: 12px;
      font-weight: 950;
      box-shadow: 0 4px 12px rgba(255, 212, 93, 0.2);
    }

    .ending-choice {
      grid-column: 1 / -1;
      max-width: 560px;
      width: 100%;
      justify-self: center;
      text-align: center;
      padding-left: 15px;
      border-color: rgba(255, 212, 93, 0.42);
      background: linear-gradient(145deg, rgba(126, 91, 36, 0.96), rgba(82, 55, 26, 0.98));
    }

    .scene-enter { animation: sceneIn 230ms ease-out both; }

    @keyframes sceneIn {
      from { opacity: 0.2; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    .noscript {
      max-width: 680px;
      margin: 20vh auto;
      padding: 24px;
      border-radius: 20px;
      background: #132f5f;
      color: white;
      text-align: center;
      font-size: 18px;
    }

    @media (max-width: 720px) {
      .app { gap: 5px; padding: max(5px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
      .tools { gap: 4px; }
      .tool { min-height: 28px; padding: 3px 6px; font-size: 10px; border-radius: 8px; }
      .story-card { border-radius: 18px; }
      .scene-heading { padding: 8px 13px 7px; }
      .story-scroll { padding: 8px 13px 6px; }
      .choice { min-height: 45px; padding: 7px 8px 7px 39px; border-radius: 12px; }
      .choice-number { left: 8px; width: 23px; height: 23px; }
    }

    @media (max-width: 540px) and (orientation: portrait) {
      .topbar { gap: 7px; }
      .top-phase { max-width: 29vw; }
      .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .choice { min-height: 51px; font-size: clamp(11.5px, 3.25vw, 13px); line-height: 1.18; }
      .scene-heading h2 { font-size: clamp(18px, 5.8vw, 24px); }
      .story-copy p, .story-measure p { font-size: clamp(15px, 4vw, 17px); line-height: 1.42; }
    }

    @media (min-width: 820px), (orientation: landscape) and (max-height: 720px) {
      .choices { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .choice { min-height: clamp(45px, 10vh, 60px); }
    }

    @media (max-height: 590px) {
      .app { padding-top: 4px; padding-bottom: 4px; gap: 4px; }
      .topbar { min-height: 26px; }
      .tool { min-height: 25px; padding: 2px 6px; font-size: 10px; }
      .scene-heading { padding-top: 6px; padding-bottom: 5px; }
      .scene-heading h2 { font-size: clamp(17px, 4.7vh, 23px); }
      .story-scroll { padding-top: 6px; padding-bottom: 4px; }
      .story-copy p, .story-measure p { font-size: clamp(14px, 3.5vh, 16px); line-height: 1.34; margin-bottom: 0.55em; }
      .page-nav { min-height: 25px; margin-top: 3px; padding-top: 3px; }
      .page-button { min-height: 23px; font-size: 10px; }
      .choice { min-height: 39px; padding-top: 5px; padding-bottom: 5px; font-size: clamp(10.5px, 3vh, 13px); }
      .choice-number { width: 21px; height: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Logan and Jenkins choose your own adventure">
    <header class="topbar">
      <button class="tool home" id="homeButton" type="button" title="Return to Arcade">⌂ Arcade</button>
      <span class="top-phase" id="sceneKicker">A family adventure</span>
      <nav class="tools" aria-label="Adventure controls">
        <button class="tool" id="backButton" type="button" title="Undo the last decision">← Back</button>
        <button class="tool" id="restartButton" type="button" title="Start over">↻ Restart</button>
        <button class="tool" id="readButton" type="button" title="Read or stop this scene">🔊 Read</button>
        <button id="stopButton" type="button" hidden tabindex="-1" aria-hidden="true">Stop reading</button>
      </nav>
    </header>

    <article class="story-card" id="storyCard">
      <div class="scene-heading">
        <h2 id="sceneTitle">Loading the mystery...</h2>
      </div>
      <div class="story-scroll paginated" id="storyViewport">
        <div class="story-copy" id="storyText" aria-live="polite"></div>
        <nav class="page-nav collapsed" id="pageNav" aria-label="Story pages">
          <button class="page-button" id="previousPageButton" type="button">‹ Previous</button>
          <span class="page-status" id="pageStatus" aria-live="polite">1 / 1</span>
          <button class="page-button" id="nextPageButton" type="button">Next ›</button>
        </nav>
      </div>
      <div class="story-measure" id="storyMeasure" aria-hidden="true"></div>
    </article>

    <section class="choices" id="choices" aria-label="What should Logan do?"></section>
  </main>

  <noscript><div class="noscript">This adventure needs JavaScript turned on.</div></noscript>

  <script>
  (() => {
    "use strict";

    const START_NODE = "opening";
    const INITIAL_STATE = Object.freeze({
      firstSearch: "",
      clueStyle: "",
      approach: "",
      project: "",
      projectName: "",
      supplyRoute: "",
      constructionFix: "",
      hidingSpot: "",
      scarlettPlan: "",
      adultPlan: "",
      revealLocation: "",
      revealStyle: "",
      password: "",
      items: [],
      clues: [],
      helpers: [],
      momKnows: false,
      dadKnows: false,
      recruitedMom: false,
      recruitedDad: false,
      promisedClean: false,
      usedFort: false,
      hasCookie: false,
      hasTape: false,
      hasAcorn: false,
      hasSockPuppet: false,
      foundShoes: false,
      jenkinsCalm: false,
      vacuumDeputy: false,
      balloonDiplomat: false,
      shoeCode: false,
      paradeMarshal: false,
      moonbeamBadge: false,
      pancakeTreaty: false,
      acornWitness: false,
      laundryPilot: false,
      mess: 0,
      clever: 0,
      honest: 0,
      chaos: 0,
      suspicion: 0,
      callbacks: [],
      storyPath: [],
      episodeOneOutcome: "",
      episodeTwoOutcome: "",
      director: {
        runNumber: 0,
        seed: 0,
        stamp: "OG-000",
        codename: "Operation Giggle",
        jenkinsTitle: "Chief Giggle Officer",
        recurringBit: "striped leadership spoon",
        monsterRule: "Secret plans require at least one unnecessary salute.",
        signalSound: "plink",
        connections: { afterMission: "side_shoe_radio_1", afterBuild: "side_acorn_1" },
        recipeSignature: "test-recipe"
      }
    });

    const C = (label, next, effect = {}, when = null) => ({ label, next, effect, when });
    const N = (phase, title, text, choices, targets = null) => ({ phase, title, text, choices, targets, ending: false });
    const END = (title, text) => ({ phase: "A happy ending", title, text, choices: [], targets: [], ending: true });

    /* STORY DIRECTOR
       This is the game's internal connections layer. It stays inside the one
       offline file, but is kept separate from the hand-written scene map. */
    const REPLAY_STORAGE_KEY = "logan.operationGiggle.director.v2";
    const PRE_PROJECT_EPISODES = Object.freeze([
      "side_vacuum_1", "side_balloon_1", "side_shoe_radio_1", "side_block_parade_1"
    ]);
    const POST_BUILD_EPISODES = Object.freeze([
      "side_moonbeam_1", "side_pancake_guard_1", "side_acorn_1", "side_laundry_rally_1"
    ]);
    const PRE_PROJECT_FINALS = Object.freeze([
      "side_vacuum_3", "side_balloon_3", "side_shoe_radio_3", "side_block_parade_3"
    ]);
    const POST_BUILD_FINALS = Object.freeze([
      "side_moonbeam_3", "side_pancake_guard_3", "side_acorn_3", "side_laundry_rally_3"
    ]);
    const STORY_CONNECTIONS = Object.freeze({
      project_select: { slot: "afterMission", targets: PRE_PROJECT_EPISODES },
      hide_select: { slot: "afterBuild", targets: POST_BUILD_EPISODES }
    });

    const CODENAME_FIRST = Object.freeze([
      "Secret", "Sneaky", "Happy", "Kind", "Clever", "Silly", "Purple", "Golden",
      "Cozy", "Brave", "Bright", "Quiet", "Smiling", "Sparkly", "Bouncy", "Super"
    ]);
    const CODENAME_SECOND = Object.freeze([
      "Giggle", "Surprise", "Smile", "Pancake", "Blanket", "Balloon", "Crown", "Cookie",
      "Treasure", "Spoon", "Fort", "Picture", "Waffle", "Acorn", "Moon", "High-Five"
    ]);
    const JENKINS_TITLES = Object.freeze([
      "Chief Giggle Officer", "Tape Expert", "Blanket Fort Captain", "Snack Guard",
      "Secret Door Helper", "Surprise Assistant", "Quiet Mission Coach", "Official Jenkins"
    ]);
    const RECURRING_BITS = Object.freeze([
      "striped leadership spoon", "paper cup helmet", "brave little clothespin", "cardboard whisper tube",
      "suspicious purple mitten", "silver ribbon badge", "rubber duck inspector", "tiny caped acorn"
    ]);
    const MONSTER_RULES = Object.freeze([
      "A secret plan needs one quiet salute.",
      "A snack can be gear if Logan says it can.",
      "A blanket fort is a real fort during a mission.",
      "A whisper only works when Scarlett cannot hear it.",
      "A hard problem gets one calm wiggle, then a real plan.",
      "Tape is useful, but only when a grown-up says yes.",
      "A hiding place is no good if it has a giant sign.",
      "No one may panic. Logan gets to pick the next step."
    ]);
    const SIGNAL_SOUNDS = Object.freeze(["ding", "boop", "tap", "buzz", "pop", "beep", "toot", "click"]);

    let memoryReplayRecord = null;
    let replayStorage = undefined;

    function hash32(value) {
      let hash = 2166136261;
      const text = String(value);
      for (let i = 0; i < text.length; i += 1) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      hash += hash << 13;
      hash ^= hash >>> 7;
      hash += hash << 3;
      hash ^= hash >>> 17;
      hash += hash << 5;
      return hash >>> 0;
    }

    function mulberry32(seed) {
      let value = seed >>> 0;
      return () => {
        value += 0x6D2B79F5;
        let result = value;
        result = Math.imul(result ^ result >>> 15, result | 1);
        result ^= result + Math.imul(result ^ result >>> 7, result | 61);
        return ((result ^ result >>> 14) >>> 0) / 4294967296;
      };
    }

    function randomToken() {
      try {
        if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
          const values = new Uint32Array(2);
          crypto.getRandomValues(values);
          return `${values[0].toString(36)}${values[1].toString(36)}`;
        }
      } catch (error) {
        // A clock and Math.random still give the local fallback a fresh identity.
      }
      return `${Date.now().toString(36)}${Math.floor(Math.random() * 0xFFFFFFFF).toString(36)}`;
    }

    function usableStorage(name) {
      try {
        if (typeof window === "undefined") return null;
        const storage = window[name];
        const probe = `${REPLAY_STORAGE_KEY}.probe.${randomToken()}`;
        storage.setItem(probe, "1");
        storage.removeItem(probe);
        return storage;
      } catch (error) {
        return null;
      }
    }

    function getReplayStorage() {
      if (replayStorage !== undefined) return replayStorage;
      replayStorage = usableStorage("localStorage") || usableStorage("sessionStorage") || null;
      return replayStorage;
    }

    function blankReplayRecord() {
      return { schema: 2, installationId: randomToken(), runCount: 0, recipes: [], recentPairs: [] };
    }

    function sanitizeReplayRecord(value) {
      if (!value || value.schema !== 2 || typeof value.installationId !== "string") return blankReplayRecord();
      const storedCount = Number(value.runCount);
      return {
        schema: 2,
        installationId: value.installationId,
        runCount: Number.isSafeInteger(storedCount) && storedCount >= 0 ? storedCount : 0,
        recipes: Array.isArray(value.recipes) ? value.recipes.filter(item => typeof item === "string").slice(-256) : [],
        recentPairs: Array.isArray(value.recentPairs) ? value.recentPairs.filter(item => typeof item === "string").slice(-15) : []
      };
    }

    function loadReplayRecord() {
      const storage = getReplayStorage();
      if (storage) {
        try {
          const parsed = JSON.parse(storage.getItem(REPLAY_STORAGE_KEY) || "null");
          const record = sanitizeReplayRecord(parsed);
          memoryReplayRecord = record;
          return record;
        } catch (error) {
          // Continue with the in-memory copy if this browser blocks file storage.
        }
      }
      if (!memoryReplayRecord) memoryReplayRecord = blankReplayRecord();
      return sanitizeReplayRecord(memoryReplayRecord);
    }

    function saveReplayRecord(record) {
      memoryReplayRecord = sanitizeReplayRecord(record);
      const storage = getReplayStorage();
      if (!storage) return;
      try {
        storage.setItem(REPLAY_STORAGE_KEY, JSON.stringify(memoryReplayRecord));
      } catch (error) {
        replayStorage = usableStorage("sessionStorage") || null;
        if (replayStorage) {
          try { replayStorage.setItem(REPLAY_STORAGE_KEY, JSON.stringify(memoryReplayRecord)); } catch (ignored) { replayStorage = null; }
        }
      }
    }

    function pickWith(random, values) {
      return values[Math.floor(random() * values.length) % values.length];
    }

    function makeStoryPlan(installationId, runNumber, recentPairs = [], usedRecipes = [], startingSalt = 0) {
      const pairs = [];
      for (const before of PRE_PROJECT_EPISODES) {
        for (const after of POST_BUILD_EPISODES) pairs.push(`${before}|${after}`);
      }
      const recent = new Set(recentPairs.slice(-15));
      const unusedPairs = pairs.filter(pair => !recent.has(pair));
      const pairPool = unusedPairs.length ? unusedPairs : pairs;

      for (let salt = startingSalt; salt < startingSalt + 2048; salt += 1) {
        const seed = hash32(`${installationId}|${runNumber}|${salt}|Operation Giggle`);
        const random = mulberry32(seed);
        const pair = pairPool[Math.floor(random() * pairPool.length) % pairPool.length];
        const [afterMission, afterBuild] = pair.split("|");
        const codename = `Operation ${pickWith(random, CODENAME_FIRST)} ${pickWith(random, CODENAME_SECOND)}`;
        const jenkinsTitle = pickWith(random, JENKINS_TITLES);
        const recurringBit = pickWith(random, RECURRING_BITS);
        const monsterRule = pickWith(random, MONSTER_RULES);
        const signalSound = pickWith(random, SIGNAL_SOUNDS);
        const recipeSignature = [pair, codename, jenkinsTitle, recurringBit, monsterRule, signalSound, salt % 97].join("|");
        if (!usedRecipes.includes(recipeSignature)) {
          const familyCode = hash32(installationId).toString(36).toUpperCase().slice(-3).padStart(3, "0");
          const runCode = runNumber.toString(36).toUpperCase().padStart(3, "0");
          return {
            runNumber,
            seed,
            stamp: `OG-${familyCode}-${runCode}`,
            codename,
            jenkinsTitle,
            recurringBit,
            monsterRule,
            signalSound,
            connections: { afterMission, afterBuild },
            recipeSignature,
            pair
          };
        }
      }
      throw new Error("The story director could not prepare a fresh adventure.");
    }

    function reserveStoryPlan() {
      const record = loadReplayRecord();
      const runNumber = record.runCount + 1;
      const plan = makeStoryPlan(record.installationId, runNumber, record.recentPairs, record.recipes);
      record.runCount = runNumber;
      record.recipes = [...record.recipes, plan.recipeSignature].slice(-256);
      record.recentPairs = [...record.recentPairs, plan.pair].slice(-15);
      saveReplayRecord(record);
      const cleanPlan = { ...plan };
      delete cleanPlan.pair;
      return cleanPlan;
    }

      return hash32(`${seed}|${nodeId}|${slot}`) % length;

      if (!connection) return raw;

    function sceneGroup(nodeId) {

      if (/^late_crisis_/.test(nodeId)) return "repair";
      if (/^reveal_/.test(nodeId)) return "reveal";
      if (/^ending_/.test(nodeId)) return "ending";

    function sceneVariation(node, state) {

      const storyBeat = nodeId === "opening" || nodeId === "mission_reveal" || nodeId === "project_select" || nodeId === "reveal_setup" || nodeId.startsWith("ending_");
      if (!storyBeat) return "";
      const group = sceneGroup(nodeId);
      const options = SCENE_VARIATIONS[group] || SCENE_VARIATIONS.default;
      const chosen = options[deterministicIndex(state, nodeId, `scene:${group}`, options.length)];
      return typeof chosen === "function" ? chosen(state) : chosen;
    }

        "The ribbon was tied to three things beneath the couch: Dad's missing shoe, Scarlett's purple block, and a small envelope labeled POSSIBLE GIGGLE IDEAS. Jenkins had apparently used the balloon as a bookmark, a shoe finder, and a secret filing cabinet at the same time. \"One object should always have seven jobs,\" he explained. \"That is monster tidiness.\"",
        (s) => s.balloonDiplomat ? "Scarlett waited at her balloon station, drawing pretend tickets. She had unknowingly become the best lookout in the house." : s.dadKnows ? "Dad knelt beside Logan and whispered, \"Agent Balloon Support ready.\" Jenkins immediately promoted him to Deputy String." : "Scarlett's footsteps came closer. The balloon bobbed in a way that seemed much too pleased with itself.",
        "The knot could be untangled patiently. Logan could slide the shoe out first and use it to hold the ribbon. He could rescue Scarlett's block and return it before she missed it. Or Jenkins could crawl under the couch, although his first attempt had left only his feet visible and his whisper sounded like it came from a very talkative sofa."
      ], [
        C("Untangle the three loops one at a time", "side_balloon_3", { inc: { clever: 2 }, addItems: ["purple ribbon"], addCallbacks: ["Logan solved the three-loop knot"] }),
        C("Use Dad's shoe as a gentle ribbon anchor", "side_balloon_3", { set: { foundShoes: true, shoeCode: true }, addItems: ["purple ribbon"], addCallbacks: ["Dad's shoe anchored the balloon"] }),
        C("Return Scarlett's block before she notices", "side_balloon_3", { inc: { honest: 1 }, addItems: ["purple ribbon"], addCallbacks: ["Scarlett's purple block came home"] }),
        C("Guide Jenkins through a couch-cave rescue", "side_balloon_3", { inc: { chaos: 1, clever: 1 }, addItems: ["purple ribbon"], addCallbacks: ["Jenkins survived the couch cave"] })
      ]),

      side_balloon_3: N("A side mission", "The Great Balloon Cover Story", [
        "The shoe, block, and envelope came free. The balloon floated to the ceiling but remained safely tied to Logan's hand. Then Scarlett arrived and read the giant words on its side. \"What surprise?\" she asked. Jenkins froze so dramatically that his cheeks puffed out. He looked like he was trying to become a second balloon.",
        "Logan did not need to tell a lie. The balloon really could become part of something else: a silly weather station, a welcome sign for the family room, or a practice decoration with no clue about the final plan. Dad could also carry it away while pretending it belonged to his newly recovered shoe, though Dad's face suggested the shoe would not enjoy that explanation.",
        "Scarlett waited with one eyebrow raised in a perfect copy of Mom. Jenkins whispered, \"Deploy advanced vagueness.\" Logan could choose an answer that protected the future surprise while giving the balloon a cheerful job right now."
      ], [
        C("Call it a practice balloon for a future nice thing", "project_select", { inc: { honest: 2, suspicion: 1 }, addCallbacks: ["Scarlett knew a nice thing was coming someday"] }),
        C("Make Scarlett Official Balloon Weather Reporter", "project_select", { set: { balloonDiplomat: true }, inc: { clever: 1 }, addItems: ["balloon weather ribbon"], addCallbacks: ["Scarlett reported indoor balloon weather"] }),
        C("Ask Dad to lead the shoe-and-balloon parade", "project_select", { set: { foundShoes: true, dadKnows: true }, inc: { chaos: 1 }, addHelpers: ["Dad"], addCallbacks: ["Dad led the shoe balloon parade"] }),
        C("Let Jenkins announce a completely real ceiling festival", "project_select", { inc: { chaos: 2, suspicion: 1 }, addCallbacks: ["The ceiling festival became family history"] })
      ]),

      side_shoe_radio_1: N("A side mission", "A Message From Dad's Shoe", [
        "A faint squeak came from beneath the dining table. Jenkins dropped to his knees and pressed one ear to Dad's missing sneaker. \"A transmission,\" he whispered loudly. \"The shoe people have contacted us.\" Dad passed the doorway wearing one slipper and one bare foot. He looked at his feet as if they had arranged this situation without him.",
        "The squeak came again. Logan spotted the real cause: a tiny voice recorder from one of Scarlett's toys had become wedged inside the sneaker. Each time the shoe shifted, it played half a sentence in Scarlett's voice: \"Logan, look at my...\" The rest was cut off. Jenkins gasped. \"A coded warning from the future!\"",
        "Dad was still searching, Scarlett was nearby, and a secret mission meeting needed to happen soon. Logan could solve the shoe mystery openly, investigate the recording first, or let Jenkins test his theory without making Dad's perfectly good sneaker seem haunted."
      ], [
        C("Show Dad the sneaker and explain the toy recorder", "side_shoe_radio_2", { set: { foundShoes: true, dadKnows: true }, inc: { honest: 2 }, addHelpers: ["Dad"], addCallbacks: ["Dad recovered the talking shoe"] }),
        C("Remove the recorder carefully and play the full message", "side_shoe_radio_2", { inc: { clever: 2 }, addItems: ["tiny voice recorder"], addClues: ["unfinished Scarlett message"] }),
        C("Ask Scarlett whether one of her toys is missing a voice", "side_shoe_radio_2", { inc: { honest: 1, suspicion: 1 }, addCallbacks: ["Scarlett investigated a missing toy voice"] }),
        C("Allow one careful Jenkins shoe-radio test", "side_shoe_radio_2", { set: { shoeCode: true }, inc: { chaos: 1 }, addCallbacks: ["Jenkins tested the shoe radio"] })
      ]),

      side_shoe_radio_2: N("A side mission", "The Unfinished Message", [
        "Outside the sneaker, the little recorder played clearly. Scarlett's complete message was: \"Logan, look at my butterfly when you have time. I fixed the wing.\" Logan remembered the torn paper butterfly Jenkins had mentioned. Scarlett had repaired it with one strip of tape and drawn seven extra spots. The message was not a warning. It was an invitation.",
        "Jenkins became very quiet. For him, very quiet meant almost normal talking volume. \"Our surprise should say we notice her things,\" he said. Dad had found the other sneaker behind a chair and now stood nearby with both shoes, looking relieved and interested. He did not know the whole plan, but he understood why the message mattered.",
        "The recorder could become a useful tool later, but Scarlett would want it back. Logan could record a secret code first, ask Dad to remember the butterfly detail, return the recorder immediately, or have Jenkins write a reminder on one of his tiny cards."
      ], [
        C("Record a three-word mission code", "side_shoe_radio_3", { set: { shoeCode: true }, inc: { clever: 1 }, addClues: ["voice mission code"], addCallbacks: ["The tiny recorder held a mission code"] }),
        C("Ask Dad to remember the repaired butterfly", "side_shoe_radio_3", { set: { dadKnows: true }, inc: { honest: 1 }, addHelpers: ["Dad"], addCallbacks: ["Dad remembered Scarlett's repaired butterfly"] }),
        C("Return the recorder to Scarlett right away", "side_shoe_radio_3", { inc: { honest: 2 }, addCallbacks: ["Logan returned Scarlett's recorder"] }),
        C("Let Jenkins make a butterfly reminder card", "side_shoe_radio_3", { inc: { chaos: 1 }, addItems: ["butterfly reminder card"], addCallbacks: ["Jenkins drew a butterfly with eleven wings"] })
      ]),

      side_shoe_radio_3: N("A side mission", "Operation Notice the Little Things", [
        "Logan found Scarlett near the window, holding up the repaired butterfly so sunlight shone through its paper wings. He stopped long enough to admire all seven new spots. \"This one is the captain spot,\" Scarlett explained, pointing to the largest. \"It tells the other spots where to sit.\" Jenkins nodded as if receiving instructions from a decorated officer.",
        "Dad put on both shoes at last. \"Mystery solved,\" he said. Jenkins corrected him. \"Mystery upgraded. The shoes delivered an important kindness message.\" Dad agreed that this sounded better, though he asked Jenkins not to put electronics in footwear again. Jenkins wrote NO RADIO SHOES on a card, paused, and added WITHOUT PERMISSION.",
        "The side mission had changed the surprise in one important way. Whatever Logan chose to build, it could include a small detail that showed he had truly noticed Scarlett. He could keep the butterfly idea, promote Dad to a quiet helper, save the shoe code, or give Jenkins responsibility for exactly one sensible reminder."
      ], [
        C("Add a butterfly detail to the future surprise", "project_select", { inc: { honest: 2 }, addCallbacks: ["The surprise included Scarlett's repaired butterfly"] }),
        C("Recruit Dad as Keeper of Little Details", "project_select", { set: { dadKnows: true, recruitedDad: true }, inc: { honest: 1 }, addHelpers: ["Dad"], addCallbacks: ["Dad became Keeper of Little Details"] }),
        C("Keep the voice code for the final reveal", "project_select", { set: { shoeCode: true }, inc: { clever: 1 }, addItems: ["three-word voice code"], addCallbacks: ["The shoe-radio code waited for the reveal"] }),
        C("Trust Jenkins with the butterfly reminder", "project_select", { inc: { chaos: 1 }, addItems: ["eleven-wing butterfly card"], addCallbacks: ["Jenkins guarded the eleven-wing butterfly"] })
      ]),

      side_block_parade_1: N("A side mission", "Scarlett's Parade Takes the Rug", [
        "Just as Logan and Jenkins prepared to choose a project, Scarlett marched into the family room carrying a block tower, a stuffed rabbit, and a wooden spoon. \"Parade starting now!\" she announced. Her route crossed the exact rug where Jenkins had hidden every idea card beneath a cushion.",
        "Mom followed with a basket of folded towels and smiled. \"A parade sounds excellent, but it needs a safe path.\" Jenkins whispered, \"We also need a path that does not march over our classified spoons.\" He had forgotten that one of Scarlett's parade props was their striped leadership spoon. It wore a ribbon and rode on top of her tower like a tiny mayor.",
        "Logan could not simply stop Scarlett's game. The surprise was meant to make her feel special, not shove her out of the room. He could help redesign the route, join the parade while quietly moving the cards, ask Mom to open a new destination, or trust Jenkins to become a distraction float."
      ], [
        C("Map a safer parade route around the couch", "side_block_parade_2", { set: { paradeMarshal: true }, inc: { clever: 2 }, addCallbacks: ["Logan mapped Scarlett's parade route"] }),
        C("Join the parade and collect cards on each lap", "side_block_parade_2", { inc: { clever: 1, honest: 1 }, addCallbacks: ["Logan rescued cards during the parade"] }),
        C("Ask Mom to open a towel-castle destination", "side_block_parade_2", { set: { momKnows: true }, inc: { honest: 1 }, addHelpers: ["Mom"], addCallbacks: ["Mom built the towel-castle destination"] }),
        C("Let Jenkins become the Official Monster Float", "side_block_parade_2", { inc: { chaos: 2 }, addCallbacks: ["Jenkins served as the parade float"] })
      ]),

      side_block_parade_2: N("A side mission", "The Wobbling Mayor", [
        "The parade turned the room into a cheerful traffic problem. Scarlett led with Doctor Sock. Mom held up two towels as an arch. Jenkins shuffled behind them with three paper cups on his head, making trumpet sounds through a cardboard tube. Each trumpet noise was louder than the one before because Jenkins believed music should climb stairs even when there were no stairs.",
        (s) => s.paradeMarshal ? "Logan's new route kept everyone away from the hidden idea cards, but the tower still wobbled at the sharp turn beside the couch." : s.momKnows ? "Mom's towel castle drew the parade away from the secret rug, but the tower leaned as it entered the arch." : "Logan had recovered most of the idea cards, but one purple corner still peeked from beneath the cushion.",
        "The striped leadership spoon slid across the top of Scarlett's block tower. Catching it might reveal why Logan cared about that particular spoon. Ignoring it might send the wooden mayor tumbling. Logan could steady the tower, turn the wobble into a parade stop, use Jenkins as a soft landing, or give Scarlett a clever instruction that let her solve it herself."
      ], [
        C("Steady the tower and explain that mayors need seat belts", "side_block_parade_3", { inc: { honest: 1 }, addItems: ["parade ribbon"], addCallbacks: ["The leadership spoon got a ribbon seat belt"] }),
        C("Call an official statue stop while moving the card", "side_block_parade_3", { inc: { clever: 2 }, addCallbacks: ["The parade's statue stop saved the secret"] }),
        C("Ask Jenkins to become a furry landing cushion", "side_block_parade_3", { inc: { chaos: 1 }, addCallbacks: ["Jenkins became a certified spoon cushion"] }),
        C("Tell Scarlett to lower the tall block carefully", "side_block_parade_3", { set: { paradeMarshal: true }, inc: { clever: 1, honest: 1 }, addCallbacks: ["Scarlett fixed her own parade tower"] })
      ]),

      side_block_parade_3: N("A side mission", "The Award Nobody Expected", [
        "The parade finished beneath Mom's towel arch. Scarlett placed the leadership spoon on a cushion and announced an award ceremony. Doctor Sock won Best Doctor. Mr. Bun won Best Rabbit. Jenkins won Loudest Person Who Was Not Using Words. He accepted with a bow so deep that all three paper cups rolled from his head.",
        "Then Scarlett turned to Logan. \"You win Best Parade Helper,\" she said, tying a short ribbon around his wrist. Logan had managed to protect the secret without treating Scarlett like an obstacle. Jenkins looked at the ribbon and whispered, \"A medal from the mission recipient. This is extremely classified and also very nice.\"",
        "Scarlett carried her tower away to rebuild it. The rug was free again, the idea cards were safe, and the striped spoon had returned to the meeting. Logan could keep the ribbon for a later callback, make a team rule based on the parade, recruit Mom after her helpful arch, or allow Jenkins one tiny trumpet salute before the planning began."
      ], [
        C("Keep Scarlett's ribbon as a lucky mission medal", "project_select", { set: { paradeMarshal: true }, addItems: ["Scarlett's parade ribbon"], addCallbacks: ["Scarlett's parade medal stayed with Logan"] }),
        C("Make inclusion an official team rule", "project_select", { inc: { honest: 2 }, addCallbacks: ["The parade taught the team not to leave Scarlett out"] }),
        C("Recruit Mom as Architect of Helpful Towel Arches", "project_select", { set: { momKnows: true, recruitedMom: true }, inc: { honest: 1 }, addHelpers: ["Mom"], addCallbacks: ["Mom became the towel-arch architect"] }),
        C("Permit one extremely tiny cardboard trumpet salute", "project_select", { inc: { chaos: 1 }, addItems: ["cardboard trumpet"], addCallbacks: ["Jenkins attempted the world's smallest trumpet salute"] })
      ]),

      side_moonbeam_1: N("An unexpected detour", "Jenkins Finally Catches Maybe Moon", [
        (s) => `The ${s.projectName} had passed its first test when a bright rectangle of afternoon sunlight slid across the floor. Jenkins gasped and pulled out the old card marked MAYBE MOON. \"It has arrived early,\" he said. \"Quick, offer it a chair.\" Logan explained that it was sunlight from the window, not a visiting moon, but Jenkins had already placed a paper cup at the edge of the light.`,
        "A shiny gift bag reflected a soft patch of light onto the wall. It made the project cast a huge, unmistakable shadow. Scarlett's voice drifted from the hallway: \"What is that giant bumpy shape?\" Dad was adjusting a window blind nearby, while Mom carried a stack of books past the door.",
        "Nobody was in danger, and Logan knew not to focus sunlight with glass. He only needed to block, redirect, or explain an ordinary beam before its shadow gave away the surprise. Jenkins offered to stand in front of it. His shadow had ears and was somehow even more suspicious."
      ], [
        C("Angle the harmless gift bag toward the ceiling", "side_moonbeam_2", { inc: { clever: 2 }, addItems: ["shiny gift bag"], addCallbacks: ["The ceiling caught Maybe Moon"] }),
        C("Ask Dad to lower the blind halfway", "side_moonbeam_2", { set: { dadKnows: true }, inc: { honest: 1 }, addHelpers: ["Dad"], addCallbacks: ["Dad dimmed Maybe Moon"] }),
        C("Turn the shadow into a quick guessing game", "side_moonbeam_2", { inc: { clever: 1, suspicion: 1 }, addCallbacks: ["Scarlett played the mystery-shadow game"] }),
        C("Let Jenkins make one improved shadow shape", "side_moonbeam_2", { inc: { chaos: 2 }, addCallbacks: ["Jenkins performed the moon moose"] })
      ]),

      side_moonbeam_2: N("An unexpected detour", "The Moon Moose Problem", [
        "The project's shadow disappeared, but Jenkins's did not. He raised both hands, bent one ear, and announced that he was making a rabbit. The wall displayed something closer to a moose carrying two umbrellas. Scarlett stepped into the doorway and laughed. \"Do it again!\" she said. Jenkins whispered to Logan, \"Excellent. The decoy has requested a second performance. I have no second performance.\"",
        (s) => s.dadKnows ? "Dad kept one hand on the blind and waited for Logan's signal. Agent Dad understood that changing the light too soon might reveal what stood behind Jenkins." : "Dad studied the blind cord, unaware that he was controlling the world's most important patch of afternoon light.",
        "Logan could invent a sequence of shadow animals that moved everyone away from the project. He could invite Scarlett to create one while Jenkins quietly covered the surprise. He could ask Mom for a book that made a perfect screen. Or he could use the saved shiny bag to make a harmless star on the ceiling and end the show with style."
      ], [
        C("Lead a shadow-animal march down the hall", "side_moonbeam_3", { inc: { clever: 2 }, addCallbacks: ["The shadow animals marched away from the project"] }),
        C("Invite Scarlett to invent the next shadow", "side_moonbeam_3", { inc: { honest: 1, suspicion: 1 }, addCallbacks: ["Scarlett invented the double-headed duck shadow"] }),
        C("Ask Mom for a large picture book screen", "side_moonbeam_3", { set: { momKnows: true }, inc: { honest: 1 }, addHelpers: ["Mom"], addCallbacks: ["Mom's picture book blocked the clue"] }),
        C("Finish with a silver star on the ceiling", "side_moonbeam_3", { set: { moonbeamBadge: true }, inc: { clever: 1 }, addItems: ["silver paper star"], addCallbacks: ["Maybe Moon became a ceiling star"] })
      ]),

      side_moonbeam_3: N("An unexpected detour", "A Badge for the Night Shift", [
        "The shadow show ended with Scarlett's applause and Jenkins trying to bow to his own silhouette. When she skipped away, Logan checked the project. It was still safe. The sunlight had moved on, leaving the paper cup in an ordinary square of floor. Jenkins picked it up and sighed. \"Maybe Moon has returned to space. Very professional.\"",
        "Dad found a scrap of silver paper near the window. Mom supplied a short piece of string. Together they could become a tiny star badge, a curtain pull, or a marker for the final route. None of those things had been in the original plan, which made Jenkins deeply impressed. \"We have recycled astronomy,\" he said.",
        "Before choosing a hiding place, Logan could decide how this detour would matter later. A star badge might honor Scarlett. A shadow signal could cue the reveal. The gift bag could disguise a bright project piece. Or Jenkins could keep the paper cup as an official moon chair, a choice with no practical value but enormous monster dignity."
      ], [
        C("Make Scarlett a silver Night-Shift Star badge", "hide_select", { set: { moonbeamBadge: true }, inc: { honest: 1 }, addItems: ["silver star badge"], addCallbacks: ["Scarlett's Night-Shift Star badge waited for the finale"] }),
        C("Save the double-hand shadow as a reveal signal", "hide_select", { inc: { clever: 1 }, addClues: ["moon moose signal"], addCallbacks: ["The moon moose became the reveal cue"] }),
        C("Wrap one bright edge in the shiny gift bag", "hide_select", { inc: { clever: 2 }, addItems: ["shiny disguise wrap"], addCallbacks: ["Maybe Moon disguised a bright project edge"] }),
        C("Let Jenkins keep the official moon chair", "hide_select", { inc: { chaos: 1 }, addItems: ["paper cup moon chair"], addCallbacks: ["Jenkins saved a chair for Maybe Moon"] })
      ]),

      side_pancake_guard_1: N("An unexpected detour", "Pancake Guard Number Seven Returns", [
        (s) => `As Logan prepared to hide the ${s.projectName}, Jenkins opened a lunch container with enormous ceremony. Inside lay ${s.project === "pancake" ? "one small practice pancake with a blueberry face" : "a round cardboard pancake left from his first plan"}. A paper flag stood in the middle: PANCAKE GUARD NUMBER SEVEN. \"He has requested an assignment,\" Jenkins said.`,
        "Mom entered carrying a clean plate. She looked at the guard, then at Jenkins. \"Is that food being used responsibly?\" she asked. Jenkins whispered to Logan, \"Define responsibly using only monster law.\" Scarlett called from the next room that she smelled something interesting, even though the cardboard version smelled mostly like marker.",
        "The guard could not simply sit beside the secret. If it was food, it needed a clean plate and a sensible plan. If it was cardboard, its giant label might still reveal the mission. Logan could give it a real job, retire it kindly, recruit Mom to inspect it, or let Jenkins present the guard's extremely serious list of demands."
      ], [
        C("Give the guard a clean plate and lookout job", "side_pancake_guard_2", { set: { pancakeTreaty: true }, inc: { honest: 1 }, addItems: ["clean guard plate"], addCallbacks: ["Pancake Guard Seven stood lookout"] }),
        C("Retire the guard to a covered container", "side_pancake_guard_2", { inc: { clever: 1 }, addCallbacks: ["Pancake Guard Seven received a quiet retirement"] }),
        C("Ask Mom for an official safety inspection", "side_pancake_guard_2", { set: { momKnows: true }, inc: { honest: 2 }, addHelpers: ["Mom"], addCallbacks: ["Mom inspected Pancake Guard Seven"] }),
        C("Hear Jenkins read the guard's demands", "side_pancake_guard_2", { inc: { chaos: 2 }, addCallbacks: ["The pancake guard opened negotiations"] })
      ]),

      side_pancake_guard_2: N("An unexpected detour", "The Breakfast Treaty", [
        "Jenkins unfolded a card titled PANCAKE WORKING CONDITIONS. Number one: no catapults. Number two: regular plate breaks. Number three: one blueberry helmet. Number four: guards may retire by being eaten, but only if they are real pancakes and everybody agrees. Mom read the list and said number one was excellent advice for every breakfast.",
        (s) => s.promisedClean ? "Logan pointed to Jenkins's no-mess promise. One crumb sat beside the container. Jenkins picked it up immediately and whispered, \"The treaty inspector sees everything.\"" : "A single crumb escaped onto the floor. Jenkins placed a paper cup over it and called that containment. Mom handed him a cloth and called that step one.",
        "Scarlett's footsteps approached. The flag still said PANCAKE GUARD, which was harmless, but the next line read SECRET SURPRISE SECURITY. Logan could fold the flag into a safer message, distract Scarlett with a snack question, ask Mom to move the container, or let the guard become part of an ordinary pretend restaurant."
      ], [
        C("Fold the flag so it reads KINDNESS GUARD", "side_pancake_guard_3", { set: { pancakeTreaty: true }, inc: { clever: 2 }, addItems: ["Kindness Guard flag"], addCallbacks: ["The flag changed jobs without changing paper"] }),
        C("Ask Scarlett to choose tomorrow's breakfast fruit", "side_pancake_guard_3", { inc: { honest: 1, suspicion: 1 }, addCallbacks: ["Scarlett selected tomorrow's breakfast fruit"] }),
        C("Let Mom carry the covered container to safety", "side_pancake_guard_3", { set: { momKnows: true }, inc: { honest: 1 }, addHelpers: ["Mom"], addCallbacks: ["Mom relocated the breakfast guard"] }),
        C("Open a ten-second pretend restaurant", "side_pancake_guard_3", { inc: { chaos: 1 }, addCallbacks: ["The ten-second restaurant served invisible soup"] })
      ]),

      side_pancake_guard_3: N("An unexpected detour", "Guard of the Kind Part", [
        "Scarlett peeked into the room just as Pancake Guard Seven completed the shortest restaurant shift in history. Jenkins handed her an empty spoon and said, \"Your invisible soup, madam.\" She tasted it seriously. \"Needs more invisible salt,\" she decided, then hurried away to find some. The secret project remained unseen.",
        "Mom helped Logan clear the plate and every crumb. The guard's flag now carried a safer title. Jenkins saluted it. \"A promotion from breakfast security to kindness security. Very rare. Usually it goes the other direction.\" Logan was not sure what the other direction meant and decided not to ask.",
        "The little treaty could still affect the reveal. Logan might use the Kindness Guard flag as a tiny sign. He might remember the no-catapult rule when Jenkins became excited. He could save the clean plate as a useful tray. Or he could let Scarlett's invisible-salt joke become a secret family callback. Then it would be time to choose where the real surprise should hide."
      ], [
        C("Save the KINDNESS GUARD flag for the finale", "hide_select", { set: { pancakeTreaty: true }, inc: { honest: 1 }, addItems: ["Kindness Guard flag"], addCallbacks: ["Pancake Guard Seven protected the kind part"] }),
        C("Make NO CATAPULTS an official mission rule", "hide_select", { inc: { clever: 1 }, addCallbacks: ["The breakfast treaty banned catapults"] }),
        C("Keep the clean plate as a carrying tray", "hide_select", { inc: { clever: 2 }, addItems: ["clean carrying plate"], addCallbacks: ["The guard's plate became a project tray"] }),
        C("Save the phrase invisible salt for the reveal", "hide_select", { inc: { chaos: 1 }, addCallbacks: ["Scarlett's invisible salt returned later"] })
      ]),

      side_acorn_1: N("An unexpected detour", "The Case of Sir Oakley", [
        (s) => `${s.hasAcorn ? "The caped acorn in Logan's supplies" : "A caped acorn from Jenkins's first idea box"} was gone. In its place lay a tiny note: BORROWED FOR IMPORTANT SQUIRREL BUSINESS. Jenkins read it and gasped. \"Sir Oakley has been recruited by the windowsill kingdom. We must hold a tribunal.\" Logan suggested looking around first.`,
        "A trail of blue thread crossed the floor toward Scarlett's collection box. It contained leaves, smooth stones, two bottle caps, and one acorn-shaped space. Scarlett was nearby explaining to Mom that every treasure needed a proper home. Mom listened with the thoughtful face she used when a story was silly and important at the same time.",
        "The acorn might have rolled into the box, Jenkins might have borrowed it and forgotten, or Scarlett might have found it without knowing it belonged to the mission. Logan could follow the evidence, ask Scarlett a careful question, inspect Jenkins's pockets, or invite Mom to serve as the calm judge of a very small case."
      ], [
        C("Follow the blue thread before asking questions", "side_acorn_2", { inc: { clever: 2 }, addClues: ["blue thread trail"], addCallbacks: ["Logan followed Sir Oakley's thread trail"] }),
        C("Ask Scarlett whether she found a caped acorn", "side_acorn_2", { inc: { honest: 2, suspicion: 1 }, addCallbacks: ["Logan asked Scarlett about Sir Oakley"] }),
        C("Check Jenkins's many suspicious pockets", "side_acorn_2", { inc: { clever: 1, chaos: 1 }, addItems: ["tiny clothespin"], addCallbacks: ["Jenkins's pockets faced inspection"] }),
        C("Recruit Mom as Judge of Acorn Matters", "side_acorn_2", { set: { momKnows: true }, inc: { honest: 1 }, addHelpers: ["Mom"], addCallbacks: ["Mom became Judge of Acorn Matters"] })
      ]),

      side_acorn_2: N("An unexpected detour", "Evidence With a Tiny Cape", [
        "The blue thread did not end in Scarlett's collection box. It looped behind it and continued to Jenkins's own foot. A loose strand from Sir Oakley's cape had caught on his fur. Jenkins checked the pocket he had already checked twice and found the acorn inside. He stared at it. \"The suspect has used my pocket as a secret tunnel,\" he said.",
        (s) => s.momKnows ? "Judge Mom ruled that nobody was in trouble because the missing acorn had been found and the evidence was hilarious." : "Mom smiled from the doorway but let Logan decide how the case should end.",
        "Scarlett noticed the tiny cape and asked whether Sir Oakley could visit her treasure collection. Logan could lend the acorn for one minute, explain that it was needed for a kind project, offer Scarlett another interesting object, or create an official visitor pass. Each answer could protect the surprise without acting as if Scarlett had done something wrong. Jenkins whispered that monster courts always ended with snacks, but there was no evidence for this claim."
      ], [
        C("Lend Sir Oakley to the collection for one minute", "side_acorn_3", { set: { acornWitness: true }, inc: { honest: 2, suspicion: 1 }, addCallbacks: ["Sir Oakley visited Scarlett's treasure box"] }),
        C("Say the acorn is needed for a kind project", "side_acorn_3", { set: { acornWitness: true }, inc: { honest: 2, suspicion: 1 }, addCallbacks: ["Scarlett learned Sir Oakley had a kind job"] }),
        C("Trade a shiny bottle cap for temporary safekeeping", "side_acorn_3", { inc: { clever: 1 }, addItems: ["silver bottle cap"], addCallbacks: ["A bottle-cap trade settled the case"] }),
        C("Make Sir Oakley an official visitor pass", "side_acorn_3", { set: { acornWitness: true }, inc: { clever: 2 }, addItems: ["tiny visitor pass"], addCallbacks: ["Sir Oakley received proper paperwork"] })
      ]),

      side_acorn_3: N("An unexpected detour", "The Smallest Important Witness", [
        "Scarlett returned Sir Oakley exactly when promised. She had added one gold dot to his paper cape. \"That means visitor,\" she explained. Jenkins examined the dot with great respect. \"He has traveled abroad and returned decorated.\" The abroad country had been a box three feet away, but Sir Oakley still looked impressive.",
        "Logan tucked the acorn safely beside the project. The case had revealed something useful: Scarlett liked tiny objects with big jobs. Mom suggested that this was probably why she enjoyed Jenkins too. Jenkins thanked her, then realized what she meant and spent several seconds deciding whether he had been complimented.",
        "Before choosing a hiding place, Logan could assign Sir Oakley one final duty. The acorn could guard the surprise, become a clue, carry Scarlett's gold visitor dot into the ending, or remain with Mom as a backup token. Any choice would let this ridiculous little tribunal return later, which was exactly the kind of connection Jenkins considered advanced storytelling."
      ], [
        C("Make Sir Oakley the official surprise guard", "hide_select", { set: { hasAcorn: true, acornWitness: true }, addItems: ["caped acorn guard"], addCallbacks: ["Sir Oakley guarded the finished project"] }),
