        C("Let the paper-star trail lead to the next clue", "hallway_signal", { addClues: ["paper star trail"], inc: { chaos: 1 } })
      ]),

      yard_entry: N("The backyard trail", "Footprints With Too Many Toes", [
        "The muddy marks crossed the patio and marched into the grass. Each print had five round toes, plus one extra mark that looked like Jenkins had been dragging a wooden spoon. Beside the first print lay a notecard: OUTDOOR OPERATION. WEATHER: SKY. DANGER LEVEL: ONE SUSPICIOUS SQUIRREL.",
        "A hedge rustled. \"Caw,\" Jenkins said softly. It was the least birdlike caw Logan had ever heard. A squirrel on the fence stared at the hedge, perhaps insulted on behalf of all animals.",
        "Dad stood near the garden hose, trying to untangle a knot that seemed to have tied two more knots while he watched. Scarlett drew chalk arrows on the patio. One arrow pointed at the hedge. \"I am mapping mysterious noises,\" she announced. Logan was not the only detective today."
      ], [
        C("Study the strange prints before they get smudged", "yard_tracks", { set: { clueStyle: "curious" }, addClues: ["six-toed tracks"], inc: { clever: 1 } }),
        C("Approach the talking hedge with official bird manners", "yard_bushes", { set: { clueStyle: "funny", password: "Caw Caw" }, inc: { chaos: 1 } }),
        C("Help Dad untangle the hose while watching the hedge", "yard_tracks", { set: { clueStyle: "helpful" }, addCallbacks: ["Logan helped with the hose"], inc: { honest: 1 } }),
        C("Compare Scarlett's chalk map with the muddy trail", "yard_bushes", { set: { clueStyle: "teamwork" }, addClues: ["Scarlett's chalk map"], inc: { clever: 1 } })
      ]),

      yard_tracks: N("The backyard trail", "Dad Versus the Garden Hose", [
        "The tracks looped around the lawn chair twice, crossed themselves, and ended beside Dad. Logan realized Jenkins had probably gotten lost in a yard he could see all at once. This was impressive in the wrong direction.",
        "Dad pulled one loop of hose free. The other end sprang up and watered his shoe. Dad looked down at his feet like he had forgotten feet existed. \"Well,\" he said, \"at least now I know where one of my shoes is.\" He had apparently been looking for the pair all afternoon while wearing half of it.",
        "Under the hose lay a smooth acorn wearing a tiny paper cape. A note called it THE EMERGENCY ROYAL NUT. Jenkins' trail continued behind the lawn chair. Logan could take the acorn, help Dad, or ask Dad to cover the investigation."
      ], [
        C("Take the caped acorn because emergencies are unpredictable", "yard_exit", { set: { hasAcorn: true }, addItems: ["caped acorn"], addClues: ["royal clue"] }),
        C("Finish untangling the hose with Dad", "yard_exit", { addCallbacks: ["Logan defeated the hose"], inc: { clever: 1 } }),
        C("Tell Dad Jenkins is planning something for Scarlett", "yard_exit", { set: { dadKnows: true }, addCallbacks: ["Dad heard about the plan"], inc: { honest: 1 } }),
        C("Point out the shoe Dad is already wearing", "yard_exit", { set: { foundShoes: true }, addCallbacks: ["Dad found one shoe"], inc: { chaos: 1 } })
      ]),

      yard_bushes: N("The backyard trail", "The Shrubbery Supply Drop", [
        "Behind the hedge, Jenkins had built a supply station from a flowerpot, a frisbee, and two clothespins. The frisbee was labeled LANDING PLATFORM. A paper bag sat in the flowerpot with a note: FOR SCARLETT. NOT A BAG OF ROCKS.",
        "The bag did contain rocks, but each one had a smiling face drawn on it. One wore a tiny crown. Another held a toothpick sign that said YOU ARE GREAT. Logan smiled. Jenkins might have strange methods, but the secret was clearly meant to be kind.",
        "Scarlett's chalk arrow reached around the hedge. \"I know a clue is back there,\" she called. Jenkins flattened himself against the bush and whispered, \"Activate Leaf Mode.\" He held two leaves beside his face. Leaf Mode needed help."
      ], [
        C("Pick up the caped acorn beside the rock family", "yard_exit", { set: { hasAcorn: true }, addItems: ["caped acorn"], inc: { clever: 1 } }),
        C("Add a chalk arrow that sends Scarlett toward her blocks", "yard_exit", { set: { scarlettPlan: "chalk detour" }, inc: { suspicion: 1, clever: 1 } }),
        C("Tell Scarlett this clue belongs to Jenkins for now", "yard_exit", { inc: { honest: 1, suspicion: 1 }, addClues: ["Scarlett trusts Logan"] }),
        C("Join Leaf Mode with two more leaves", "yard_exit", { inc: { chaos: 2 }, addCallbacks: ["Leaf Mode"] })
      ]),

      yard_exit: N("The backyard trail", "The Lawn-Chair Plant", [
        "Jenkins crouched behind the lawn chair wearing the paper bag over his head. Two eyeholes had been cut much too high, so he could not see. \"I am a lawn-chair plant,\" he whispered. \"A rare one. Do not water me.\"",
        "The hose twitched. Jenkins squeaked and ran three steps, still blind, then wrapped himself in the chair. Dad calmly turned off the water before anyone got soaked. \"Your plant seems energetic,\" Dad said. Jenkins froze in a pose no plant had ever attempted.",
        (s) => s.hasAcorn ? "The tiny caped acorn rested in Logan's pocket. Jenkins saw it and gasped. \"You found Sir Oakley! He has no useful skills, but his cape is magnificent.\"" : "A caped acorn rolled past Jenkins' foot. He saluted it. Logan was now certain that every object in this mission had either a title or a hat."
      ], [
        C("Free Jenkins from the chair and demand a meeting", "hallway_signal", { set: { clueStyle: "direct" }, inc: { honest: 1 } }),
        C("Ask Dad to guide the blind lawn-chair plant inside", "hallway_signal", { set: { dadKnows: true }, addCallbacks: ["Dad guided the plant"], inc: { clever: 1 } }),
        C("Use Scarlett's chalk arrows to mark a safe escape route", "hallway_signal", { addClues: ["chalk escape route"], inc: { clever: 1 } }),
        C("Whisper the password and let Jenkins lead", "hallway_signal", { inc: { chaos: 1 }, addCallbacks: ["Jenkins led while blind"] })
      ]),

      hallway_signal: N("The clues connect", "The Mobile Hiding Cylinder", [
        (s) => `Whatever route Logan had taken through the ${s.firstSearch}, it ended in the hallway. A tall laundry hamper was sliding across the floor by itself. It stopped when Logan stopped. Logan stepped left. The hamper slid left. He stepped right. It slid right, bumped the wall, and whispered, \"The wall moved.\"`,
        "Logan lifted the lid. Jenkins was folded inside with three paper cups on his head and a wooden spoon tucked under one arm. He looked like a knight whose armor had been chosen by a kitchen drawer. \"Ah, Captain Logan,\" he said. \"You have discovered the Mobile Hiding Cylinder.\"",
        (s) => s.hasCookie ? "Jenkins noticed the emergency cookie in Logan's pocket. His eyes widened. \"You have brought official meeting supplies. I knew I chose the correct Chief Giggle Officer.\"" : s.password ? `Logan whispered, \"${s.password}.\" Jenkins gasped. \"The password! I was hoping I had remembered it, but this is even better.\"` : "From the next room, Scarlett called, \"Why is the hamper talking?\" Jenkins sank lower. \"We require a better meeting room, and perhaps a hamper driver.\""
      ], [
        C("Wheel Jenkins calmly into the quiet hallway", "mission_reveal", { set: { approach: "helpful" }, inc: { clever: 1 } }),
        C("Make Jenkins explain while he is still stuck", "mission_reveal", { set: { approach: "direct" }, inc: { honest: 1 } }),
        C("Use the secret password and offer an official meeting", "mission_reveal", { set: { approach: "playful" }, inc: { chaos: 1 } }),
        C("Call to Scarlett, \"The hamper is practicing for a show!\"", "mission_reveal", { set: { approach: "sneaky" }, inc: { suspicion: 1, clever: 1 } })
      ]),

      mission_reveal: N("The secret mission", "Why Scarlett Needs a Surprise", [
        "Logan and Jenkins squeezed into the quiet corner behind the couch. Jenkins unfolded himself from the hamper one elbow at a time. Then he produced a stack of tiny notecards from somewhere in his fur. Each card had the same heading: REASONS SCARLETT IS EXCELLENT.",
        "\"She shared her red crayon with me,\" Jenkins said, flipping a card. \"She made me soup out of blocks. It was terrible soup, but the bowl was outstanding. Also, this morning she looked a little sad when her paper butterfly tore. So I am planning a secret surprise that will make her feel special and produce the squeaky giggle.\"",
        "His original plan involved seventeen balloons, a pancake catapult, and the vacuum. Logan explained that the vacuum ate crumbs like a robot shark and did not belong in any catapult plan. Jenkins nodded seriously. \"This is why every mission needs a Logan. Will you be my partner?\""
      ], [
        C("Join immediately as Captain Logan", "join_fast", { set: { approach: "enthusiastic" }, inc: { chaos: 1 } }),
        C("Ask Jenkins a few important questions first", "ask_questions", { set: { approach: "careful" }, inc: { clever: 1 } }),
        C("Join, but make Jenkins promise to control the mess", "set_rules", { set: { approach: "practical", promisedClean: true }, inc: { honest: 1 } }),
        C("Inspect the original plan before agreeing", "inspect_plan", { set: { approach: "curious" }, inc: { clever: 1 } })
      ]),

      join_fast: N("The secret mission", "The Chief Giggle Officer", [
        "Jenkins snapped a paper badge onto Logan's shirt. It said CHIEF GIGGLE OFFICER in purple marker. Under that, in smaller letters, it said ALSO IN CHARGE OF THINGS I FORGOT. \"Your authority is enormous,\" Jenkins said. \"Possibly more enormous than mine, but let us not make this uncomfortable.\"",
        "Logan agreed to help. Jenkins performed a victory dance with four steps: hop, wiggle, salute, bump into couch. He claimed the last step was traditional. The couch did not comment.",
        "Before choosing the surprise, Logan could decide how the team would work. A little planning might reduce chaos. On the other hand, Jenkins was already putting the paper cups into a backpack and calling them emergency helmets."
      ], [
        C("Let Jenkins handle fun while Logan handles the plan", "project_select", { set: { approach: "balanced" }, inc: { clever: 1 } }),
        C("Use a cookie break whenever Jenkins gets too excited", "project_select", { set: { jenkinsCalm: true }, addCallbacks: ["official cookie breaks"] }),
        C("Make a team rule: nobody gets left out", "project_select", { addCallbacks: ["nobody gets left out"], inc: { honest: 1 } }),
        C("Accept the emergency helmets and begin immediately", "project_select", { inc: { chaos: 2 }, addItems: ["paper cup helmet"] })
      ]),

      ask_questions: N("The secret mission", "Three Important Questions", [
        "Logan held up one finger. \"First, does Scarlett like the surprise? Second, can we make it safely? Third, do we need an adult?\" Jenkins opened his mouth, closed it, and looked through his notecards. None of them covered sensible questions.",
        "\"Scarlett likes laughing, crowns, stories, pictures, pancakes, treasure, and telling people where to sit,\" he said at last. \"Safety plan: no catapults. Adult plan: perhaps. Secret plan: extremely secret, except you, me, four paper cups, and one suspicious squirrel.\"",
        "Those answers were not perfect, but they were a beginning. Logan could recruit someone now, keep the team small, or collect a useful tool before choosing the project. Jenkins waited with the serious expression of a monster pretending his first plan had not involved the vacuum."
      ], [
        C("Recruit Dad early as Agent Dad", "project_select", { set: { dadKnows: true, recruitedDad: true }, addHelpers: ["Dad"], inc: { honest: 1 } }),
        C("Tell Mom only that a safe surprise is underway", "project_select", { set: { momKnows: true }, addHelpers: ["Mom"], inc: { honest: 1 } }),
        C("Keep the mission to Logan and Jenkins for now", "project_select", { set: { approach: "independent" }, inc: { clever: 1 } }),
        C("Get tape before Jenkins calls it advanced equipment again", "project_select", { set: { hasTape: true }, addItems: ["tape"], inc: { clever: 1 } })
      ]),

      set_rules: N("The secret mission", "The Monster Promise", [
        "Jenkins placed one hand over his heart and the other on the roll of tape. \"I promise there will be no mess,\" he declared. A paper cup fell out of his fur. \"No new mess,\" he corrected. A spoon clattered behind him. \"No large new mess that cannot be explained by gravity.\"",
        "Logan waited. Jenkins sighed. \"Fine. I promise to ask before using food, clean anything we spill, and never attach the vacuum to wheels.\" It was a good promise. Jenkins wrote it on a notecard, then accidentally taped the card to his own elbow.",
        "They still needed one more team rule. Logan could keep an adult partly informed, protect Scarlett's feelings, or prepare a calm-down plan for Jenkins."
      ], [
        C("Tell Mom they are making a safe surprise", "project_select", { set: { momKnows: true }, addHelpers: ["Mom"], inc: { honest: 1 } }),
        C("Promise to include Scarlett even if she discovers them early", "project_select", { addCallbacks: ["include Scarlett if discovered"], inc: { honest: 1 } }),
        C("Use the emergency cookie as Jenkins' calm-down button", "project_select", { set: { jenkinsCalm: true }, addCallbacks: ["cookie calm-down plan"] }),
        C("Put Logan in charge of all tape decisions", "project_select", { set: { hasTape: true }, addItems: ["tape"], inc: { clever: 1 } })
      ]),

      inspect_plan: N("The secret mission", "Seventeen Plans at Once", [
        "Jenkins spread his first plan across the rug. It was less like one plan and more like seventeen plans that had crashed into one another at an intersection. Arrows led from PANCAKES to CROWN to PUPPET DRAGON to MAYBE MOON. One arrow simply said RUN.",
        "Logan found three problems immediately. The balloon tunnel would block the hallway. The pancake catapult would launch breakfast near a lamp. The final step, SURPRISE SCARLETT WITH A NICE THING, was the only part written in calm letters.",
        "Jenkins peered over his shoulder. \"It may need one or two tiny improvements.\" Logan could save a useful piece, rescue a strange prop, or throw away the dangerous parts while keeping the kind idea underneath."
      ], [
        C("Keep the roll of tape and cross out the catapult", "project_select", { set: { hasTape: true }, addItems: ["tape"], inc: { clever: 2 } }),
        C("Save a sock puppet labeled ASSISTANT DRAGON", "project_select", { set: { hasSockPuppet: true }, addItems: ["sock puppet"], inc: { chaos: 1 } }),
        C("Keep the map arrow labeled RUN as an emergency route", "project_select", { addItems: ["emergency route map"], inc: { clever: 1 } }),
        C("Ask Jenkins to explain every arrow, including MAYBE MOON", "project_select", { addCallbacks: ["Maybe Moon"], inc: { chaos: 2 } })
      ]),

      project_select: N("Choose the surprise", "Four Excellent Ideas", [
        "Jenkins arranged four idea cards across the rug. He placed a spoon beside each one, because he believed spoons made meetings official. Logan read the choices carefully. Each could make Scarlett feel special, but each would need different supplies and a very different plan.",
        "The first was a tennis-ball crown with royal decorations. The second was a pancake trophy that could be presented and then eaten. The third was a giant monster portrait of Scarlett as the brave queen of a friendly creature kingdom. The fourth was a tiny treasure hunt ending in a goofy puppet show.",
        "\"All four are perfect,\" Jenkins said. \"This is inconvenient because we can only build one before dinner. Chief Giggle Officer, choose our destiny. Also choose the spoon. The striped spoon has leadership experience.\""
      ], [
        C("Build the legendary tennis-ball crown", "crown_intro", { set: { project: "crown", projectName: "tennis-ball crown" }, addItems: ["striped leadership spoon"] }),
        C("Create the magnificent pancake trophy", "pancake_intro", { set: { project: "pancake", projectName: "pancake trophy" }, addItems: ["striped leadership spoon"] }),
        C("Paint Scarlett's giant monster portrait", "portrait_intro", { set: { project: "portrait", projectName: "monster portrait" }, addItems: ["striped leadership spoon"] }),
        C("Plan a tiny treasure hunt and puppet finale", "treasure_intro", { set: { project: "treasure", projectName: "tiny treasure hunt" }, addItems: ["striped leadership spoon"] })
      ])
,crown_intro: N("Build the Surprise", "Operation Royal Bounce", [
  "Jenkins spread a dish towel across the floor like it was a royal map. On it he had drawn Scarlett wearing a crown taller than Scarlett herself. Six tennis balls, three spoons, and one puzzled duck appeared to be attached to it.",
  "“Why is there a duck?” Logan asked. Jenkins checked a tiny notecard. “Every royal drawing needs a duck. Monster rule forty-two.” He flipped the card over. The back said BUY PICKLES.",
  "The real plan was better than the drawing. They would build Scarlett a tennis-ball crown because she liked bright colors, being in charge, and wearing things on her head that were not meant to go there. They needed tennis balls, a crown base, decorations, and a way to hold everything together without turning Scarlett into a walking sports shelf.",
  "The garage had sports equipment and Dad’s missing things. The attic closet held old hats and craft boxes. The backyard had swallowed at least two tennis balls. Jenkins saluted with the dish towel. It slid over his face. “Choose our supply kingdom, Captain Logan.”"
], [
  C("Search the garage and act completely normal", "crown_garage", {set:{project:"crown", projectName:"Tennis-Ball Crown", supplyRoute:"garage"}, inc:{clever:1}}),
  C("Explore the attic closet for a perfect crown base", "crown_attic", {set:{project:"crown", projectName:"Tennis-Ball Crown", supplyRoute:"attic"}, inc:{clever:1}}),
  C("Sneak into the backyard and recover the lost tennis balls", "crown_yard", {set:{project:"crown", projectName:"Tennis-Ball Crown", supplyRoute:"yard"}, inc:{chaos:1}})
])
,crown_garage: N("Gather Supplies", "The Sports Equipment Jungle", [
  "The garage smelled like grass, cardboard, and projects Dad planned to finish “this weekend.” Logan found a basket of tennis balls under a shelf. Unfortunately, it was trapped behind a folded chair, a rake, and one of Dad’s missing shoes.",
  "“We have entered the Equipment Jungle,” Jenkins announced. He picked up a bicycle pump. “This is clearly a snake telescope.” Logan explained that it put air in tires. Jenkins looked disappointed. “Humans waste everything.”",
  (s)=>s.recruitedDad ? "Dad appeared and whispered, “Agent Dad reporting.” Jenkins gasped. “He remembers the code!” Dad did not remember any code, but he looked pleased anyway." : "Dad’s footsteps came from the hall. He was saying, “I know I have two shoes. That is how shoes work.” Logan had only a moment before Dad reached the garage.",
  "The tape dispenser sat on the workbench, shining like treasure. Jenkins stared at it with deep respect. “Humanity’s greatest wheel,” he breathed. Logan could be honest, stay quiet, or recruit Dad for a very specific shoe-related mission."
], [
  C((s) => s.foundShoes ? "Ask Dad for help and tell him about Scarlett's surprise" : "Give Dad his shoe and tell him about Scarlett's surprise", "crown_design", {set:{foundShoes:true, dadKnows:true, hasTape:true}, inc:{honest:1}, addItems:["tennis balls","strong tape"], addHelpers:["Dad"], addCallbacks:["Dad helped during the crown mission"]}),
  C("Slide out the basket without moving anything else", "crown_design", {set:{hasTape:true}, inc:{clever:1}, addItems:["tennis balls","strong tape"], addCallbacks:["Logan crossed the Equipment Jungle without a crash"]}),
  C((s) => s.foundShoes ? "Recruit Dad as Agent Helper" : "Recruit Dad as Agent Shoefinder", "crown_design", {set:{foundShoes:true, dadKnows:true, recruitedDad:true, hasTape:true}, addItems:["tennis balls","strong tape"], addHelpers:["Dad"], addCallbacks:["Agent Dad joined the crown mission"]}),
  C("Let Jenkins distract Dad with the bicycle pump", "crown_design", {set:{hasTape:true}, inc:{chaos:1, mess:1}, addItems:["tennis balls","strong tape"], addCallbacks:["Jenkins performed the mysterious bicycle-pump squeak"]})
])
,crown_attic: N("Gather Supplies", "The Closet of Former Fashion", [
  "The attic closet opened with a long creak, as if it had been saving that sound all week. Inside were winter coats, old costumes, and a hat box labeled FANCY? The question mark made Jenkins nervous. “Never trust a box that doubts itself,” he said.",
  "Logan opened it anyway. Inside were a floppy sunhat, bright ribbon, and a plastic tiara with only three shiny stones left. The sunhat could make a perfect base. Jenkins put it on backward, walked gently into a hanging coat, and announced that the hat had attacked first.",
  "Then Scarlett’s voice floated up the stairs. “Logan? Are you finding something?” A craft bin on the high shelf held cardboard, markers, and tape, but pulling it down might make noise.",
  (s)=>s.hasCookie ? "The cookie in Logan’s pocket gave a tiny crackle. Jenkins turned toward it as if his ears had become cookie radar. It might keep him perfectly still for once." : "Jenkins froze with one foot raised and both arms wide. He looked less like a secret agent and more like a coat rack having a surprising thought."
], [
  C("Call down that you are looking for an old hat", "crown_design", {set:{hasTape:true}, inc:{honest:1, suspicion:1}, addItems:["sunhat","bright ribbon","strong tape"], addClues:["Scarlett heard Logan mention an old hat"], addCallbacks:["Scarlett knew an old hat was involved"]}),
  C("Wait silently behind the winter coats", "crown_design", {inc:{clever:1}, addItems:["sunhat","bright ribbon","cardboard"], addCallbacks:["Logan and Jenkins survived the attic coat ambush"]}),
  C("Slide the hat box to Jenkins and grab the craft bin", "crown_design", {set:{hasTape:true}, inc:{chaos:1}, addItems:["sunhat","bright ribbon","strong tape"], addCallbacks:["The doubtful FANCY? box bumped the wall"]}),
  C("Use the cookie to keep Jenkins completely still", "crown_design", {set:{hasCookie:false, jenkinsCalm:true, hasTape:true}, inc:{clever:1}, addItems:["sunhat","bright ribbon","strong tape"], addCallbacks:["A cookie taught Jenkins the meaning of calm hands"]})
])
,crown_yard: N("Gather Supplies", "The Bush That Collected Everything", [
  "The backyard looked peaceful, which meant it was probably hiding something. Logan and Jenkins crept toward the bush where lost balls went to begin new lives. Jenkins wore a mixing bowl as a helmet. “In case the bush recognizes me,” he explained.",
  "Under the branches, Logan found two fuzzy tennis balls, a blue ribbon, a smooth acorn, and a spoon nobody remembered losing. One ball was wedged between two roots. Jenkins picked up the acorn and whispered, “A tiny hat wearing a tiny hat. Powerful.”",
  "Scarlett came outside carrying sidewalk chalk. “What are you doing?” Jenkins dropped flat on the grass. He was still wearing the shiny bowl and looked less like a hidden agent than a dropped kitchen.",
  "Logan could give Scarlett an interesting job somewhere else, tell a strange but almost true story about the bush, or let Jenkins handle the conversation. The acorn would make a funny crown jewel, if Jenkins stopped trying to hatch it."
], [
  C("Ask Scarlett to draw a giant royal castle on the patio", "crown_design", {set:{hasAcorn:true}, inc:{clever:1}, addItems:["tennis balls","blue ribbon","acorn"], addCallbacks:["Scarlett unknowingly drew a castle for her own royal surprise"]}),
  C("Say you are helping the bush return borrowed objects", "crown_design", {set:{hasAcorn:true}, inc:{honest:1, suspicion:1}, addItems:["tennis balls","acorn","mystery spoon"], addClues:["Scarlett heard the story of the borrowing bush"], addCallbacks:["The bush returned a mystery spoon"]}),
  C("Start a race to find something yellow", "crown_design", {set:{hasAcorn:true}, inc:{clever:1}, addItems:["tennis balls","blue ribbon","acorn"], addCallbacks:["A yellow-object race saved the yard mission"]}),
  C("Let Jenkins negotiate with the bush", "crown_design", {set:{hasAcorn:true}, inc:{chaos:1, mess:1}, addItems:["tennis balls","acorn","important leaf"], addCallbacks:["Jenkins signed a peace treaty with a bush"]})
])
,crown_design: N("Design the Crown", "The Royal Supply Meeting", [
  "Back in the project room, Jenkins arranged every object in a straight line. Then he arranged himself at the end and waited to be counted. “Tennis balls, decorations, Jenkins,” Logan counted. Jenkins nodded. “Excellent. Nothing missing.”",
  (s)=>s.supplyRoute==="garage" ? "The garage route had given them strong tape and enough tennis balls for a bold crown. Jenkins had already awarded the tape a medal." : s.supplyRoute==="attic" ? "The attic route had given them a floppy sunhat and bright ribbon. Jenkins still blamed the hat for walking him into a coat." : "The yard route had given them an acorn jewel and whatever the bush had decided to return. Jenkins promoted the acorn to Deputy Nut of Sparkle.",
  "They still had to choose the base. A cardboard band would be light and fit Scarlett neatly. The sunhat could become a wide, bouncy royal hat. Jenkins’ mixing-bowl helmet was strongest, but it was also a bowl, which was a serious point against it and somehow also Jenkins’ favorite point.",
  "Logan placed one tennis ball on the table. It rolled off, bounced once, and landed in a shoe. Jenkins wrote this down as a successful test. Each crown design would create a different building problem."
], [
  C("Build a light cardboard band with tennis-ball points", "crown_cardboard", {set:{constructionFix:"cardboard band"}, addItems:["cardboard"], addCallbacks:["Logan chose the light cardboard crown design"]}),
  C("Turn the floppy sunhat into a giant royal sports crown", "crown_sunhat", {set:{constructionFix:"sunhat base"}, addItems:["sunhat"], addCallbacks:["Logan chose the wide sunhat crown design"]}),
  C("Use Jenkins’ mixing-bowl helmet as the strongest base", "crown_bowl", {set:{constructionFix:"mixing bowl base"}, addItems:["mixing bowl"], inc:{chaos:1}, addCallbacks:["Jenkins donated his adventure-tested bowl helmet"]})
])
,crown_cardboard: N("Construct the Crown", "The Crown That Kept Becoming a Tube", [
  "Logan cut a strip of cardboard and curled it into a circle. Jenkins held the ends together, or at least he was supposed to. He became interested in looking through the circle like a telescope. “I can see the future,” he announced. “In the future, there is tape.”",
  "Logan taped the strip, then made three points. The first stood straight. The second leaned. The third folded down and looked tired. Each tennis ball made the cardboard bend until the crown slowly became a tube.",
  (s)=>s.hasTape ? "The good tape from earlier held the first joint firm. Jenkins patted it proudly. “Civilization continues.”" : "They had only little scraps of ordinary tape, so every joint needed a smarter kind of support.",
  (s)=>s.hasAcorn ? "The acorn fit perfectly at the center point like a tiny brown jewel. Jenkins bowed to it. The jewel was stable. The tennis balls were not." : "Jenkins offered a fourth plan involving a ladle and “royal gravity.” Logan quietly moved the stapler away before the plan gained any more parts."
], [
  C("Fold a second cardboard band inside the first", "crown_crisis", {set:{constructionFix:"reinforced cardboard"}, inc:{clever:2}, addCallbacks:["The crown had a secret second cardboard band"]}),
  C("Tie ribbon across the top as a hidden support bridge", "crown_crisis", {set:{constructionFix:"ribbon support bridge"}, inc:{clever:1}, addCallbacks:["A ribbon bridge held up the tennis balls"]}),
  C("Use fewer balls and dangle the extras on ribbons", "crown_crisis", {set:{constructionFix:"dangling tennis balls"}, inc:{chaos:1}, addCallbacks:["Extra tennis balls became swinging royal jewels"]}),
  C("Try Jenkins’ ladle plan under close supervision", "crown_crisis", {set:{constructionFix:"ladle counterweight"}, inc:{chaos:2, mess:1}, addItems:["royal ladle"], addCallbacks:["A ladle became part of advanced crown engineering"]})
])
,crown_sunhat: N("Construct the Crown", "The Hat With Too Many Opinions", [
  "The sunhat already fit like a crown, but its brim flopped whenever Logan added a tennis ball. One side rose proudly while the other drooped toward the floor. It looked like a hat trying to listen through a wall.",
  "Jenkins held it at arm’s length. “Very royal. Kings are always sideways.” Logan set it on a stuffed bear while he worked. The bear immediately tipped over. Jenkins wrote BEAR OVERWHELMED BY MAJESTY on a notecard.",
  (s)=>s.callbacks.includes("Scarlett knew an old hat was involved") ? "From the hall, Scarlett called, “Did you find the old hat?” Logan and Jenkins stared at the door. Their secret now had a hat-shaped clue." : "The hallway stayed quiet, but Jenkins practiced freezing whenever the floor creaked. Each freeze was more dramatic and less useful than the last.",
  "Ribbon could stiffen the brim, little loops could hold the balls lower, or the old plastic tiara could become a centerpiece. Jenkins tried the crown. It fell over his eyes. “Perfect visibility,” he said, walking into the same chair twice."
], [
  C("Weave ribbon tightly around the brim", "crown_crisis", {set:{constructionFix:"woven ribbon brim"}, inc:{clever:2}, addCallbacks:["Bright ribbon made the floppy brim strong"]}),
  C("Make ribbon loops that hold the balls around the edge", "crown_crisis", {set:{constructionFix:"tennis-ball loops"}, inc:{clever:1}, addCallbacks:["The crown gained a bouncy ring of tennis balls"]}),

,crown_bowl: N("Construct the Crown", "The Bowl of Supreme Royalness", [
  "The mixing bowl was strong, shiny, and much too smooth for tape. Every tennis ball Logan attached stayed for three seconds, then slid down with a soft plop. Jenkins caught each one and announced its score. “Seven points! Excellent rolling! Terrible crowning!”",
  "The bowl was also too large for Scarlett’s head. If she wore it as it was, she would see only the inside of a bowl. Logan imagined explaining that the surprise was temporary darkness. Not ideal.",
  (s)=>s.promisedClean ? "A ball knocked over the spoon cup. Jenkins gasped. “That was not a mess. That was a spoon meeting.” He quickly put every spoon back." : "A ball knocked over the spoon cup. Jenkins called it a useful test of sound and made no move to pick anything up until Logan looked at him.",
  (s)=>s.items.includes("mystery spoon") ? "The spoon from the bush fit through the bowl handle and could become a ridiculous royal feather." : "They could pad the inside, build a fitted ring underneath, or stop treating the bowl as a hat and make it a crown-shaped shoulder cape. Jenkins loved the cape idea immediately."
], [
  C("Pad the inside with a soft rolled towel", "crown_crisis", {set:{constructionFix:"soft bowl padding"}, addItems:["dish towel"], addCallbacks:["A dish towel made the royal bowl fit safely"]}),

  C("Add a spoon as an enormous royal feather", "crown_crisis", {set:{constructionFix:"spoon plume"}, inc:{chaos:2}, addItems:["royal spoon plume"], addCallbacks:["A mystery spoon became the crown’s proudest feather"]})
])
,crown_crisis: N("Solve the Crisis", "The Great Crown Wobble", [
  "The crown was finally standing. It was bright, ridiculous, and exactly the sort of thing Scarlett might wear while giving orders to furniture. Then Jenkins performed his victory dance too early.",
  "His elbow bumped the table. The crown began to wobble. Logan caught it, but one tennis ball came loose and rolled toward the door. At that exact moment, Scarlett’s shadow appeared beneath it. “Why do I hear bouncing?” she asked.",
  (s)=>s.recruitedDad ? "Dad called from the hall, “Scarlett, I need an expert opinion on my shoes!” The shadow paused. Agent Dad had provided cover at exactly the right time." : s.momKnows ? "Mom began asking Scarlett a long question about which cup was the most cup-like. It was strange, but it bought Logan several precious seconds." : "Jenkins reached for the rolling ball and somehow knocked a second ball loose. “The rescue has developed a sequel,” he whispered.",
  (s)=>s.jenkinsCalm ? "Jenkins remembered the cookie lesson. “Calm hands,” he told himself. For once, his hands actually listened." : "Jenkins froze dramatically. He was not small, and he was standing beside a tennis-ball crown. This did not help."
], [
  C("Catch the ball with a ribbon loop and make it a swinging jewel", "crown_test", {set:{constructionFix:"swinging ribbon jewel"}, inc:{clever:2}, addCallbacks:["The escaped ball became a swinging crown jewel"]}),
  C("Press every piece down with the strongest tape", "crown_test", {set:{hasTape:false, constructionFix:"double-taped crown"}, inc:{clever:1}, removeItems:["strong tape"], addCallbacks:["The last strong tape secured the crown"]}),
  C("Roll the ball under the door as an ordinary hallway ball", "crown_test", {inc:{clever:1, suspicion:1}, addClues:["Scarlett found a mysterious tennis ball"], addCallbacks:["One crown ball became a hallway decoy"]}),
  C("Put the crown on Jenkins and make him freeze as a statue", "crown_test", {inc:{chaos:2}, addCallbacks:["Jenkins survived as the Royal Crown Statue"]})
])
,crown_test: N("Test the Surprise", "The Royal Inspection", [
  "When Scarlett’s footsteps faded, Logan performed the final crown inspection. He shook it gently. Nothing fell. He tilted it left, then right. Something wiggled, but Jenkins said royal objects were allowed one wiggle.",
  (s)=>"The " + s.constructionFix + " held. Jenkins read from a notecard: “Strength: excellent. Sparkle: aggressive. Ability to make Scarlett feel important: enormous.”",
  (s)=>s.hasAcorn ? "The acorn still sat at the center like a tiny jewel. Jenkins bowed. “Deputy Nut of Sparkle never abandoned the mission.”" : s.foundShoes ? "Dad peeked in wearing both recovered shoes. “That looks fantastic,” he whispered. The crown mission had improved fashion and footwear at the same time." : "Jenkins added one final paper badge reading CHIEF OF EVERYTHING EXCEPT BEDTIME. Logan moved it slightly so it did not cover the best part.",
  "They needed one last decision before hiding it. Logan could make the crown look perfectly polished, leave one wonderfully strange Jenkins detail, or prepare a royal line to say at the reveal. Whatever he chose would return when Scarlett finally saw it."
], [
  C("Polish it into the grandest crown possible", "hide_select", {addCallbacks:["The tennis-ball crown passed a grand royal inspection"]}),
  C("Keep one odd Jenkins detail because it makes the crown funnier", "hide_select", {inc:{chaos:1}, addCallbacks:["The crown proudly kept one unmistakable Jenkins detail"]}),
  C("Practice announcing Scarlett as Chief of Everything", "hide_select", {inc:{honest:1}, addCallbacks:["Logan prepared Scarlett’s royal announcement"]})
])
,pancake_intro: N("Build the Surprise", "A Trophy You Can Butter", [
  "Jenkins’ next drawing showed Scarlett holding a trophy made of pancakes. It was taller than the refrigerator, and syrup poured from the top like a waterfall. “We are not making that much syrup,” Logan said. Jenkins nodded. “Correct. We would need a permit from the breakfast mayor.”",
  "The smaller plan was possible. They could stack tiny pancakes into a cup, add handles, and decorate it just before the reveal. It would be a prize for being Scarlett. Jenkins had already written WORLD CHAMPION OF BEING SCARLETT AND ALSO OTHER THINGS.",
  "They needed ingredients, something sturdy, and a way to practice without Scarlett smelling breakfast too early. The kitchen had everything but was busy. The pantry had dry ingredients and excellent hiding corners. Mom could help them cook safely, but telling her would bring another person into the secret.",
  "Jenkins pulled a whisk from behind his back. “I secured the spinning food antenna.” Logan told him it was a whisk. “That is its public name,” Jenkins replied."
], [
  C("Search the kitchen while acting completely normal", "pancake_kitchen", {set:{project:"pancake", projectName:"Pancake Trophy", supplyRoute:"kitchen"}, inc:{clever:1}}),
  C("Explore the pantry and build a quiet ingredient kit", "pancake_pantry", {set:{project:"pancake", projectName:"Pancake Trophy", supplyRoute:"pantry"}, inc:{clever:1}}),
  C("Tell Mom the plan and ask for safe cooking help", "pancake_mom", {set:{project:"pancake", projectName:"Pancake Trophy", supplyRoute:"Mom", momKnows:true, recruitedMom:true}, inc:{honest:1}, addHelpers:["Mom"]})
])
,pancake_kitchen: N("Gather Supplies", "The Suspicious Flour Mission", [
  "The kitchen was empty for exactly four seconds. Logan opened the cabinet while Jenkins crouched beside the island. Jenkins was trying to hide behind a paper-towel roll. Only his nose was hidden.",
  "Logan found pancake mix, a measuring cup, and colorful sprinkles. The small pan sat on the stove, but taking it would be difficult to explain if anyone walked in. Dad walked in. He looked at Logan holding pancake mix, then at Jenkins pretending to be furniture. “Breakfast?” Dad asked.",
  (s)=>s.recruitedDad ? "“Mission breakfast,” Logan whispered. Dad immediately stood in the doorway like a cheerful security guard. Jenkins gasped. “He remembers the flour code.”" : "“Possibly,” Jenkins whispered at the volume of a parade. The refrigerator hummed behind Dad, and strawberries waited inside.",
  "Logan could tell Dad enough to gain help, collect supplies while Dad made a snack, or let Jenkins explain. Letting Jenkins explain anything was like opening an umbrella indoors and hoping for weather. The cookie jar also waited nearby, and cookies had proven useful for managing Jenkins."
], [
  C("Tell Dad about Scarlett’s pancake trophy", "pancake_design", {set:{dadKnows:true}, inc:{honest:1}, addItems:["pancake mix","small pan","strawberries"], addHelpers:["Dad"], addCallbacks:["Dad learned about the breakfast trophy"]}),
  C("Ask Dad for apple slices while collecting the supplies", "pancake_design", {inc:{clever:1}, addItems:["pancake mix","small pan","sprinkles"], addCallbacks:["Logan completed the suspicious flour mission quietly"]}),
  C("Let Jenkins explain everything to Dad", "pancake_design", {set:{dadKnows:true}, inc:{chaos:1}, addItems:["pancake mix","small pan","strawberries"], addCallbacks:["Jenkins requested a permit from the breakfast mayor"]}),
  C("Take a cookie as an emergency Jenkins-calming device", "pancake_design", {set:{hasCookie:true}, addItems:["pancake mix","small pan","sprinkles","cookie"], addCallbacks:["Logan packed an emergency cookie"]})
])
,pancake_pantry: N("Gather Supplies", "The Tower of Cans", [
  "The pantry was narrow and packed with boxes. Jenkins entered sideways because secret agents were “thinner from that direction.” Logan found pancake mix, syrup, and cupcake liners that could make tiny pancake cups.",
  "Between them stood a tower of soup cans. Nobody had built it on purpose, but it had the worried look of something that knew Jenkins was nearby. Logan warned him not to breathe toward it. Jenkins held his breath so dramatically that his cheeks puffed out. Then he hiccupped.",
  "The cans wobbled. Logan caught the top one. Jenkins caught the bottom one, which was not useful because the others no longer had a bottom. Somehow they stopped the tower without a crash, but they were stuck holding it together.",
  "Scarlett skipped past. “Why are you both in there?” Logan could tell an almost true story, ask for help without revealing the supplies, rebuild the tower by size, or use Jenkins’ unusual crawling talents."
], [
  C("Say you are fixing a wobbly can tower", "pancake_design", {inc:{honest:1, suspicion:1}, addItems:["pancake mix","cupcake liners"], addClues:["Scarlett saw the pantry can rescue"], addCallbacks:["The pantry can tower survived"]}),
  C("Ask Scarlett to get Dad because Jenkins is holding up lunch", "pancake_design", {set:{dadKnows:true}, inc:{chaos:1}, addItems:["pancake mix","cupcake liners"], addHelpers:["Dad"], addCallbacks:["Jenkins temporarily held up lunch"]}),
  C("Rebuild the tower with the largest cans at the bottom", "pancake_design", {inc:{clever:2}, addItems:["pancake mix","cupcake liners","syrup"], addCallbacks:["Careful stacking saved the pantry"]}),
  C("Let Jenkins crawl out while Logan steadies everything", "pancake_design", {inc:{chaos:2, mess:1}, addItems:["pancake mix","cupcake liners"], addCallbacks:["Jenkins performed the Great Pantry Crawl"]})
])
,pancake_mom: N("Gather Supplies", "Breakfast Engineer Mom", [
  "Mom listened while Logan explained the pancake trophy. Her eyebrows rose at “stacked,” higher at “edible handles,” and highest at Jenkins’ plan to use warm syrup as glue. “Syrup is not glue,” Mom said. Jenkins checked a notecard. “Then why is it so committed to tables?”",
  "Mom agreed to help if Logan remained project leader and Jenkins obeyed the warm-pan rules. She found pancake mix, a small pan, strawberries, and wooden skewers that could hold the trophy safely. Then she gave Jenkins an apron. It reached his ankles. “A scientist robe,” he said.",
  "Scarlett wandered toward the kitchen. Mom smoothly blocked the counter with a grocery bag and asked whether Scarlett’s stuffed animals needed a checkup. Scarlett hurried away. “That bought three minutes,” Mom said. “Four if the giraffe has a fever.”",
  "Logan could cook beside Mom, make a blueprint while she prepared the pan, teach Jenkins the safety rules, or reserve a hiding shelf in the refrigerator."
], [
  C("Cook the first tiny batch with Mom", "pancake_design", {set:{momKnows:true, recruitedMom:true}, addItems:["pancake mix","small pan","strawberries"], addHelpers:["Mom"], addCallbacks:["Mom helped cook even little pancakes"]}),
  C("Draw a trophy blueprint while Mom warms the pan", "pancake_design", {set:{momKnows:true, recruitedMom:true}, inc:{clever:1}, addItems:["pancake mix","small pan","wooden skewers"], addCallbacks:["Logan made a pancake-trophy blueprint"]}),
  C("Teach Jenkins three warm-pan safety rules", "pancake_design", {set:{momKnows:true, recruitedMom:true, jenkinsCalm:true}, inc:{honest:1}, addItems:["pancake mix","small pan","strawberries"], addCallbacks:["Jenkins learned that an apron is not wings"]}),
  C("Reserve a refrigerator shelf for the finished trophy", "pancake_design", {set:{momKnows:true, recruitedMom:true}, addItems:["pancake mix","small pan","wooden skewers"], addHelpers:["Mom"], addCallbacks:["Mom reserved a secret refrigerator landing zone"]})
])
,pancake_design: N("Design the Trophy", "The Batter Conference", [
  "Logan mixed the batter. Jenkins insisted on stirring exactly thirteen times because “fourteen wakes the flour.” On stir seven, he became dizzy and sat down. The batter waited in the bowl like it knew important breakfast decisions were coming.",
  (s)=>s.recruitedMom ? "Mom showed Logan how to make small, even circles. Jenkins watched with the serious face of someone witnessing moon science." : "Logan knew the pan needed calm hands and careful timing. Jenkins volunteered his calmest hands, then dropped the whisk into the bowl.",
  (s)=>s.hasCookie ? "Jenkins noticed the emergency cookie. “A building material?” he asked. Logan called it an emergency supply. Jenkins nodded. “All cookies are.”" : s.promisedClean ? "One drop landed on the counter. Jenkins covered it with his hand. “No mess exists here.” Logan handed him a cloth." : "A dot of batter reached the counter. Jenkins called it a very small practice pancake.",
  "A tall stack would look grand but might lean. A fruit-filled cup would be sturdy. Spiral pancakes could make a wild monster trophy. They had enough batter for one real design."
], [
  C("Build a tall cup from many tiny pancakes", "pancake_tall", {set:{constructionFix:"tall pancake stack"}, addCallbacks:["Logan chose the tallest trophy design"]}),
  C("Build a sturdy trophy with a strawberry center", "pancake_fruit", {set:{constructionFix:"fruit-filled pancake cup"}, addCallbacks:["Logan chose the secret-fruit trophy design"]}),
  C("Build a twisty trophy from spiral pancakes", "pancake_spiral", {set:{constructionFix:"spiral pancake trophy"}, inc:{chaos:1}, addCallbacks:["Logan chose the wild spiral trophy design"]})
])
,pancake_tall: N("Construct the Trophy", "The Leaning Tower of Breakfast", [
  "The tiny pancakes came out warm and golden. Logan stacked the widest at the bottom. Jenkins stood beside the plate calling measurements. “Height: magnificent. Smell: magnificent. Chance I eat it by accident: rising.”",
  "At pancake six, the stack leaned left. At pancake seven, it leaned farther, like it had remembered an appointment across the room. Jenkins held both hands around it without touching. “I am providing emotional support.”",
  (s)=>s.callbacks.includes("Careful stacking saved the pantry") ? "The can-tower rescue gave Logan an idea: the broadest pieces belonged low, and every layer needed a steady center." : s.callbacks.includes("Logan made a pancake-trophy blueprint") ? "The blueprint showed that Jenkins had placed the handle too high. Catching that now prevented a breakfast landslide." : "The stack needed support before one more pancake could be added.",
  "A skewer could hold the center, cupcake liners could grip the layers, strawberries could widen the base, or the emergency cookie could become a platform. Jenkins looked troubled by the cookie option on professional grounds."
], [
  C("Use a wooden skewer through the center", "pancake_crisis", {set:{constructionFix:"center-skewer stack"}, inc:{clever:1}, addCallbacks:["A hidden skewer steadied the tall trophy"]}),
  C("Fold cupcake liners between the slippery layers", "pancake_crisis", {set:{constructionFix:"cupcake-liner grips"}, inc:{clever:2}, addCallbacks:["Cupcake liners became pancake engineering"]}),
  C("Build a wide strawberry base", "pancake_crisis", {set:{constructionFix:"strawberry foundation"}, addItems:["strawberry base"], addCallbacks:["Strawberries formed a bright trophy foundation"]}),
  C("Use the emergency cookie as a flat platform", "pancake_crisis", {set:{hasCookie:false, constructionFix:"cookie platform"}, removeItems:["cookie"], inc:{clever:1}, addCallbacks:["The emergency cookie became structural support"]})
])
,pancake_fruit: N("Construct the Trophy", "The Trophy With a Secret Middle", [
  "Logan placed one sturdy pancake on the plate, arranged strawberries in a ring, and added another pancake. The middle became a hidden bowl full of fruit. “A trophy with treasure inside,” Jenkins said. “Scarlett will never suspect vitamins.”",
  "The handles were harder. Two curved pancake strips were supposed to attach to the sides, but the first tore. Jenkins held the broken piece beneath his nose. “I have become a breakfast detective.”",
  (s)=>s.callbacks.includes("Careful stacking saved the pantry") ? "The pantry lesson returned: delicate pieces needed support underneath, just like the nervous soup cans." : s.jenkinsCalm ? "Jenkins stayed away from the warm pan and repeated, “Hot means stop. Spatula means ask. Apron is not wings.” The final rule had been added recently." : "Jenkins suggested syrup glue again. Logan reminded him that they had already held a meeting about that.",
  "Strawberries could become curved handles. Cupcake liners could make colorful handles that would not tear. The broken pieces could become a ribbon on top. Mom could also cook stronger handles if she knew the plan."
], [
  C("Curve strawberry slices into bright red handles", "pancake_crisis", {set:{constructionFix:"strawberry handles"}, addItems:["strawberry handles"], addCallbacks:["The trophy gained bright fruit handles"]}),
  C("Use folded cupcake liners as sturdy handles", "pancake_crisis", {set:{constructionFix:"cupcake-liner handles"}, inc:{clever:2}, addCallbacks:["Cupcake liners rescued the torn handles"]}),
  C("Turn the broken pancakes into a ribbon on top", "pancake_crisis", {set:{constructionFix:"pancake ribbon"}, inc:{clever:1, chaos:1}, addCallbacks:["Broken handles became a breakfast ribbon"]}),
  C("Ask Mom to cook two stronger curved handles", "pancake_crisis", {set:{momKnows:true, constructionFix:"Mom’s curved handles"}, addHelpers:["Mom"], addCallbacks:["Mom quietly cooked the trophy handles"]})
])
,pancake_spiral: N("Construct the Trophy", "The Pancake That Escaped the Circle", [
  "Logan poured batter in a spiral. It curled around itself, crossed the middle, and grew one unexpected tail. When he flipped it, it looked like a snail wearing a necktie. Jenkins stared. “Better than the drawing. The drawing was limited by knowing what it was.”",
  "Three spirals could form a twisty trophy, but their open spaces made them fragile. One broke when Jenkins applauded near it. Another stuck briefly to the spatula and waved as Logan lifted it.",
  (s)=>s.items.includes("sprinkles") ? "Sprinkles could mark eyes, buttons, or a glittery path. Jenkins called them “tiny celebration gravel.”" : "Strawberry bits or little paper flags could decorate the gaps without making the spirals heavier.",
  "They could overlap the spirals like a nest, fill the gaps, or stop trying to make a normal trophy and build a smiling pancake creature holding an award sign. Jenkins said monsters had given awards for centuries and had never once used a normal cup."
], [
  C("Overlap the spirals into a strong woven cup", "pancake_crisis", {set:{constructionFix:"woven spiral cup"}, inc:{clever:2}, addCallbacks:["Fragile spirals became a strong pancake nest"]}),
  C("Fill every gap with fruit and sprinkles", "pancake_crisis", {set:{constructionFix:"filled spiral trophy"}, addItems:["fruit decorations"], addCallbacks:["Every spiral gap gained a colorful surprise"]}),
  C("Make a smiling pancake creature holding the award", "pancake_crisis", {set:{constructionFix:"pancake trophy creature"}, inc:{chaos:2}, addCallbacks:["The trophy unexpectedly became a pancake creature"]}),
  C("Let Jenkins name the spirals before stacking them", "pancake_crisis", {set:{constructionFix:"named spiral stack"}, inc:{chaos:1}, addCallbacks:["The spirals were named Kevin, Other Kevin, and Susan"]})
])
,pancake_crisis: N("Solve the Crisis", "The Smell of Discovery", [
  "The trophy was built. It might have been tall, fruity, twisty, or suspiciously alive-looking, but it was wonderful. Then the smell escaped. It drifted out of the kitchen and down the hall.",
  "Scarlett’s voice came closer. “Are there pancakes?” Jenkins looked horrified. “She has scent powers.”",
  (s)=>s.recruitedDad ? "Dad called, “I smell toast!” with the confidence of a man saying something untrue. Scarlett answered, “That is not toast.” Agent Dad needed a better plan." : s.recruitedMom ? "Mom opened the refrigerator and cleared a shelf in one smooth motion. “Breakfast landing zone ready,” she whispered." : "Jenkins lifted an empty plate as if he could convince Scarlett that the smell had come from a plate with nothing on it.",
  (s)=>s.callbacks.includes("The emergency cookie became structural support") ? "The cookie platform held the whole tower steady. Jenkins gave it a respectful nod and did not bite it. This was possibly his greatest act of self-control." : "Logan needed to cool, cover, or move the trophy before Scarlett reached the doorway."
], [
  C("Slide it into the refrigerator behind a BROCCOLI sign", "pancake_test", {inc:{clever:2}, addCallbacks:["The pancake trophy hid behind a broccoli sign"]}),
  C("Cover it with the biggest mixing bowl", "pancake_test", {addItems:["covering bowl"], addCallbacks:["A mixing bowl disguised the breakfast trophy"]}),
  C("Give Scarlett one practice pancake while a helper moves it", "pancake_test", {inc:{honest:1}, addHelpers:["available parent"], addCallbacks:["Scarlett received a mysterious practice pancake"]}),
  C("Send Jenkins past her shouting WRONG BREAKFAST", "pancake_test", {inc:{chaos:2, suspicion:1}, addCallbacks:["Jenkins performed the Wrong Breakfast decoy"]})
])
,pancake_test: N("Test the Surprise", "The Breakfast Inspection", [
  "Once the hallway was safe, Logan uncovered the pancake trophy and checked it carefully. The layers stayed put. The handles held. The whole thing smelled like a Saturday morning wearing a fancy hat.",
  (s)=>"The " + s.constructionFix + " survived a gentle plate turn. Jenkins announced, “Structural breakfast confirmed.”",
  (s)=>s.recruitedMom ? "Mom checked that everything was cool, safe, and ready to serve. Then she handed the project back to Logan because he was still the leader." : s.dadKnows ? "Dad peeked around the corner. “That is the finest pancake trophy I have ever seen.” Jenkins whispered, “How many have you seen?” Dad admitted this was the first." : "Jenkins leaned close enough to smell it, then leaned back before his nose touched. Logan counted that as excellent progress.",
  "They could add a neat award card, keep the funniest crooked detail, or plan a champion’s fanfare for the reveal. The final touch would decide whether Scarlett’s trophy felt grand, silly, or perfectly both."

  C("Add a WORLD CHAMPION OF BEING SCARLETT card", "hide_select", {inc:{honest:1}, addCallbacks:["The trophy carried Scarlett’s champion title"]}),
  C("Keep one crooked pancake because it looks cheerful", "hide_select", {inc:{chaos:1}, addCallbacks:["One cheerful crooked pancake remained on the trophy"]}),
  C("Practice a breakfast-champion fanfare with Jenkins", "hide_select", {inc:{chaos:1}, addCallbacks:["Logan and Jenkins prepared the breakfast fanfare"]})

,portrait_intro: N("Build the Surprise", "A Picture Worth Several Giggles", [
  "Jenkins unrolled a drawing of Scarlett riding a purple monster through space while the family waved from a toast castle. Jenkins stood in the corner holding a sign that said ART. “Why the sign?” Logan asked. “So people know it is art.”",
  "Logan liked the idea of a giant funny portrait. It could show Scarlett as a hero, a monster queen, or leader of a ridiculous family quest. Jenkins promised not to lick any markers “unless they looked extremely lemony.”",
  "They needed paper, colors, decorations, and ideas. The craft drawer had markers and glue. The family-photo shelf held funny true details. The backyard offered leaves, chalk, and tiny natural treasures. Jenkins said every acorn was a helmet waiting for employment.",
  "The picture would be easier to hide while flat, but Jenkins had already suggested twelve pockets, movable eyebrows, and a bell. Logan decided to begin with one supply route and prevent the portrait from becoming furniture."
], [
  C("Raid the craft drawer for serious art equipment", "portrait_crafts", {set:{project:"portrait", projectName:"Magnificent Monster Portrait", supplyRoute:"craft drawer"}, inc:{clever:1}}),
  C("Study family photos for funny true details", "portrait_photos", {set:{project:"portrait", projectName:"Magnificent Monster Portrait", supplyRoute:"family photos"}, inc:{honest:1}}),
  C("Collect outdoor colors and decorations", "portrait_yard", {set:{project:"portrait", projectName:"Magnificent Monster Portrait", supplyRoute:"yard art"}, inc:{clever:1}})
])
,portrait_crafts: N("Gather Supplies", "The Drawer That Would Not Close", [
  "The craft drawer held seventeen markers, six wrapperless crayons, glue sticks, tape, yarn, stickers, and one clothespin wearing a face. Nobody remembered drawing the face. Jenkins shook its tiny hand. “This is Mr. Pin, our art lawyer.”",
  "Logan found a paper roll at the back. When he pulled it, everything shifted forward. The drawer opened farther, made a tiny avalanche sound, and refused to close.",
  (s)=>s.momKnows ? "Mom leaned around the corner, saw the supplies, and whispered, “I will ask whether somebody is using the craft drawer in a less suspicious voice.”" : "Mom’s footsteps approached. “Is somebody using the craft drawer?” Jenkins braced both feet against the cabinet and whispered, “I trained for this.” He clearly had not.",
  "Logan could be honest, sort everything properly, grab only essentials while Jenkins held the drawer, or bring Mr. Pin as an inspector. The last choice seemed unnecessary, which made Jenkins love it."
], [
  C("Tell Mom it is a secret Scarlett project", "portrait_design", {set:{momKnows:true}, inc:{honest:1}, addItems:["paper roll","markers","yarn"], addHelpers:["Mom"], addCallbacks:["Mom learned about the giant portrait"]}),
  C("Sort the supplies and close the drawer properly", "portrait_design", {inc:{clever:2}, addItems:["paper roll","markers","stickers"], addCallbacks:["Logan repaired the craft-drawer avalanche"]}),
  C("Let Jenkins hold the drawer while Logan grabs supplies", "portrait_design", {set:{hasTape:true}, inc:{chaos:1}, addItems:["paper roll","markers","tape"], addCallbacks:["Jenkins heroically held back the craft drawer"]}),
  C("Bring Mr. Pin as official art inspector", "portrait_design", {inc:{chaos:1}, addItems:["paper roll","markers","Mr. Pin clothespin"], addCallbacks:["Mr. Pin became the portrait’s art lawyer"]})
])
,portrait_photos: N("Gather Supplies", "The Shelf of Excellent Faces", [
  "Logan opened the family album while Jenkins watched. There was Scarlett wearing sunglasses upside down, Scarlett asleep with one sock, and Scarlett holding a spoon like she had won it in a contest. “She has lived many lives,” Jenkins said.",
  "They found the family making pancakes, Logan and Scarlett building a blanket fort, and Dad looking beneath the couch for something he was already holding. Jenkins called it “a classic human mystery.”",
  "A loose photo slid under the couch just as Scarlett entered. “Are you looking at pictures without me?” Logan needed a funny detail and a way to rescue the photograph without revealing why.",

  C("Distract her with the puzzled Dad photo", "portrait_design", {inc:{clever:1}, addCallbacks:["Dad’s puzzled photo became an art reference"]}),
  C("Send Jenkins under the couch for the loose photo", "portrait_design", {inc:{chaos:1}, addItems:["lost button"], addCallbacks:["Jenkins found a useful button beneath the couch"]}),
  C("Memorize the spoon, fort, and sunglasses", "portrait_design", {inc:{clever:1}, addCallbacks:["Three true family memories entered the portrait plan"]})
])
,portrait_yard: N("Gather Supplies", "Colors From the Kingdom of Outside", [
  "Logan carried a paper bag into the yard. Jenkins followed with a magnifying glass because collecting required “scientific squinting.” They found red leaves, yellow petals from the ground, a feather, and an acorn with a perfect cap.",
  "“A hat wearing a hat,” Jenkins said. “Powerful.” They could rub leaves beneath paper, use the feather on a costume, and color the sky with sidewalk chalk.",
  "Jenkins stepped onto damp grass, slid one foot forward, waved both arms, and landed sitting down without dropping the bag. “Planned sample collection,” he said. A muddy handprint appeared on the bag. Scarlett opened the back door. “Why is Jenkins sitting in mud?”",
  "Logan could answer vaguely, give Scarlett an errand, preserve the handprint as art, or use the acorn cap as a stamp. The mess might become the funniest part if Logan treated it as an opportunity."

])
,portrait_design: N("Design the Portrait", "Who Will Scarlett Be?", [
  "Logan rolled out the paper. It covered most of the table and curled at both ends. Jenkins placed a book on one corner and his own foot on the other. “I am part of the equipment,” he explained.",
  (s)=>s.supplyRoute==="craft drawer" ? "Markers and yarn suggested a bright cape and a bold title. Mr. Pin, if present, requested more purple through Jenkins." : s.supplyRoute==="family photos" ? "The family memories gave Logan real expressions, objects, and jokes that Scarlett would recognize." : "Leaves, chalk, feathers, and perhaps a muddy handprint made the picture feel like a friendly monster kingdom.",
  (s)=>s.callbacks.includes("Scarlett unknowingly selected her portrait expression") ? "Best of all, Scarlett had unknowingly selected her own funniest face. That would make the reveal feel like a secret echo." : "Jenkins wanted to begin with the eyebrows because “eyebrows tell the audience whether art means business.”",
  "Logan needed the whole scene first. Super Scarlett could save the house from runaway pillows. Monster Queen Scarlett could rule a cheerful kingdom. Or the whole family could sail through a ridiculous quest together."

])
,portrait_hero: N("Construct the Portrait", "Super Scarlett and the Pillow Storm", [
  "Logan drew Scarlett flying over the living room in a cape. Pillows bounced through the air like enormous popcorn. Dad held a laundry basket as a shield. Mom pointed toward a safe landing. Logan operated a pillow-catching machine. Jenkins yelled advice from a lamp.",
  "“Accurate,” Jenkins said. “I am famous for lamp advice.” The cape needed something special. Yarn could lift it from the page. A feather could become a heroic plume. Upside-down sunglasses could give Scarlett secret vision.",
  "While Jenkins colored the storm, his marker slipped and made a purple line across the sky. He stared at it. “A surprise hallway?”",
  (s)=>s.callbacks.includes("Logan repaired the craft-drawer avalanche") ? "Logan remembered how calmly he had sorted the drawer. This mistake could also become useful." : "They could turn the mark into lightning, a zip line, or a bright title banner. If they had kept the muddy stamp, it could become a pillow monster."
], [
  C("Turn the purple line into superhero lightning", "portrait_crisis", {set:{constructionFix:"purple-lightning hero portrait"}, inc:{clever:2}, addCallbacks:["A marker slip became superhero lightning"]}),
  C("Make it Super Scarlett’s high-speed zip line", "portrait_crisis", {set:{constructionFix:"zip-line hero portrait"}, inc:{clever:1}, addCallbacks:["Super Scarlett gained a purple zip line"]}),
  C("Cover it with a SUPER SISTER title banner", "portrait_crisis", {set:{constructionFix:"Super Sister banner portrait"}, addCallbacks:["A bright SUPER SISTER banner crossed the sky"]}),
  C("Add a muddy handprint pillow monster", "portrait_crisis", {set:{constructionFix:"pillow-monster hero portrait"}, inc:{chaos:1}, addCallbacks:["Jenkins’ muddy hand became the pillow monster"]})
])
,portrait_monster: N("Construct the Portrait", "The Kingdom of Queen Scarlett", [
  "Logan drew Scarlett on a couch-cushion throne. Her crown had leaf points and a feather. Friendly monsters brought gifts: a singing spoon, a bouncing shoe, and an important acorn. Jenkins named the smallest monster Minister of Snacks.",
  "“What does the minister do?” Logan asked. “Mostly asks when snacks are.” Jenkins pressed a hand shape onto the corner to make a helper, then added three extra fingers. “More official.”",
  "The paper curled and stamped part of the wet print onto Scarlett’s throne. Now a purple blob covered the royal seat. Jenkins studied it. “The kingdom is expanding.”",
  (s)=>s.promisedClean ? "He quickly added, “This is not a mess. It is a planned border that began in the middle.”" : "Logan could make it a pet, cover it with a blanket-fort pattern, repeat prints around the edge, or attach a secret flap with a clothespin."
], [
  C("Turn the blob into Scarlett’s round purple pet", "portrait_crisis", {set:{constructionFix:"purple-pet queen portrait"}, inc:{clever:2}, addCallbacks:["The royal ink blob became a purple pet"]}),
  C("Draw a blanket-fort pattern over the throne", "portrait_crisis", {set:{constructionFix:"fort-throne queen portrait", usedFort:true}, addCallbacks:["Scarlett’s blanket fort became a royal throne"]}),
  C("Add matching monster prints around the border", "portrait_crisis", {set:{constructionFix:"handprint-border queen portrait"}, inc:{chaos:1}, addCallbacks:["Jenkins’ handprints surrounded the monster kingdom"]}),
  C("Clip a secret picture-door over the mistake", "portrait_crisis", {set:{constructionFix:"secret-door queen portrait"}, inc:{clever:1}, addCallbacks:["Mr. Pin guarded a secret portrait door"]})
])
,portrait_family: N("Construct the Portrait", "The Family Quest Gets Crowded", [
  "Logan drew everyone sailing across a carpet ocean in a laundry-basket boat. Mom held the map. Dad paddled with a broom. Scarlett stood at the front in a captain’s hat. Logan pointed toward a pancake-shaped island.",
  "Jenkins was supposed to watch for sea monsters, but he drew himself six times. “Those are my highly trained cousins,” he said. The picture became so crowded that there was barely room for the treasure island.",
  (s)=>s.callbacks.includes("Dad’s puzzled photo became an art reference") ? "Logan gave picture-Dad the same puzzled face from the album. Dad was paddling backward and only just noticing." : s.items.includes("lost button") ? "The lost button could become the boat’s steering wheel, giving Jenkins’ couch expedition a reason at last." : "Jenkins offered to draw the island on the ceiling. Logan reminded him that the ceiling was not part of the paper.",
  "The extra Jenkinses could become rowers. A fold-out flap could hold the island. A button could steer the ship. Or Logan could keep the crowd because family adventures were supposed to feel full."
], [
  C("Make the extra Jenkinses the rowing team", "portrait_crisis", {set:{constructionFix:"Jenkins-rower family portrait"}, inc:{chaos:1}, addCallbacks:["Six Jenkins cousins rowed the family boat"]}),
  C("Add a fold-out flap for the treasure island", "portrait_crisis", {set:{constructionFix:"fold-out island portrait"}, inc:{clever:2}, addCallbacks:["The family quest gained a secret fold-out island"]}),
  C("Use the lost button as the steering wheel", "portrait_crisis", {set:{constructionFix:"button-wheel family portrait"}, inc:{clever:1}, addCallbacks:["A couch button steered the family adventure"]}),
  C("Keep it crowded because family adventures are crowded", "portrait_crisis", {set:{constructionFix:"joyfully crowded family portrait"}, inc:{honest:1}, addCallbacks:["Every family member stayed in the crowded picture"]})
])
,portrait_crisis: N("Solve the Crisis", "The Portrait Rolls Away", [
  "The portrait was finished, colorful, and large enough to cover half a wall. Logan lifted one book from the corner so they could move it. The paper rolled itself up with a mighty fwup. Jenkins vanished inside.",
  "“I have become a message!” his voice called from the tube. Worse, the roll moved across the table toward the open door. Scarlett was in the hall, humming. Logan grabbed one end while two Jenkins feet stuck out of the other.",
  (s)=>s.items.includes("yarn") ? "The yarn from the craft drawer lay within reach and could bind the roll safely." : s.usedFort ? "The blanket fort offered a flat hiding place beneath its rug." : s.momKnows || s.dadKnows ? "A knowing parent waited near the hall and could carry the suspicious tube away." : "Jenkins suggested calling it a telescope, despite being visibly trapped inside it.",
  "Logan had seconds to secure the art and preserve the surprise. Whatever disguise he chose might become part of the reveal later."
], [
  C("Tie it with yarn and label it VERY BORING PAPER", "portrait_test", {inc:{clever:2}, addCallbacks:["The portrait hid as Very Boring Paper"]}),
  C("Slide it flat beneath the blanket-fort rug", "portrait_test", {set:{usedFort:true}, addCallbacks:["The blanket fort protected the giant portrait"]}),
  C("Pretend the roll is Jenkins’ giant telescope", "portrait_test", {inc:{chaos:2}, addCallbacks:["Jenkins became part of a giant telescope disguise"]}),
  C("Signal a knowing parent to carry it away", "portrait_test", {addHelpers:["available parent"], addCallbacks:["A parent guarded the rolled portrait"]})
])
,portrait_test: N("Test the Surprise", "The Gallery Inspection", [
  "When the hall was safe, Logan unrolled the portrait one last time. Jenkins emerged with paper-static hair and bowed as if this had been his plan. The picture stretched across the floor in a bright river of family jokes.",
  (s)=>"The " + s.constructionFix + " looked even better from several steps away. The mistake that Logan had fixed no longer looked like a mistake at all.",

,treasure_intro: N("Build the Surprise", "The Tiny Treasure Theater", [
  "Jenkins opened a shoebox. Inside were two socks with paper eyes, a wooden spoon wearing yarn, and a folded program reading SCARLETT’S VERY IMPORTANT TREASURE SHOW. “Is it a treasure hunt or a puppet show?” Logan asked. Jenkins nodded. “Exactly both.”",
  "Their surprise would begin with tiny clues around the house. Each clue would lead Scarlett closer to a little treasure. At the final spot, sock puppets would pop up and perform a goofy ending made just for her.",
  "They needed puppet bodies, clue cards, a tiny stage, and safe hiding places. The unmatched-sock basket held actors. The recycling bin offered boxes and tubes. The blanket fort could become the final theater, but Scarlett visited it whenever she felt like it.",
  "Jenkins placed a striped sock on his hand. “I am Detective Footington, and I demand cheese.” Logan reminded him that the story did not exist yet. “Detective Footington rejects time,” the sock replied."
], [
  C("Search the unmatched-sock basket for the cast", "treasure_socks", {set:{project:"treasure", projectName:"Tiny Treasure Puppet Hunt", supplyRoute:"sock basket"}, inc:{clever:1}}),
  C("Search recycling for clue and stage materials", "treasure_recycling", {set:{project:"treasure", projectName:"Tiny Treasure Puppet Hunt", supplyRoute:"recycling"}, inc:{clever:1}}),
  C("Claim the blanket fort as the final theater", "treasure_fort", {set:{project:"treasure", projectName:"Tiny Treasure Puppet Hunt", supplyRoute:"blanket fort", usedFort:true}, inc:{chaos:1}})
])
,treasure_socks: N("Gather Supplies", "The Unmatched Auditions", [
  "The basket contained a striped sock, a fuzzy blue sock, a tiny yellow sock, and one of Dad’s long black socks. Jenkins placed them in a row. “Auditions begin. State your talents.”",
  "The striped sock could detect crumbs. The blue sock claimed to have visited the moon. Dad’s sock spoke in a deep Jenkins voice: “Where is my other sock?” Dad walked past and stopped. “That is an excellent question.”",
  (s)=>s.recruitedDad ? "Agent Dad stepped sideways to block Scarlett’s view. “No show here,” he said. “Only an important sock meeting.”" : "Scarlett called from the hall, “What show?” The tiny yellow sock would make a good Scarlett puppet, but seeing it now might reveal too much.",
  "Logan could recruit Dad’s voice, return his sock for smaller actors, hide the basket behind a laundry explanation, or let Jenkins hold one final noisy audition as a distraction."
], [
  C("Recruit Dad and his deep puppet voice", "treasure_story", {set:{dadKnows:true, recruitedDad:true, hasSockPuppet:true}, addItems:["striped sock puppet","blue sock puppet","Dad sock puppet"], addHelpers:["Dad"], addCallbacks:["Dad joined the finale as the Deep Voice"]}),
  C("Return Dad’s sock and choose two smaller socks", "treasure_story", {set:{foundShoes:true, hasSockPuppet:true}, inc:{honest:1}, addItems:["striped sock puppet","blue sock puppet","yellow sock puppet"], addCallbacks:["Logan returned Dad’s missing sock"]}),
  C("Call it laundry sorting and hide the cast", "treasure_story", {set:{hasSockPuppet:true}, inc:{clever:1, suspicion:1}, addItems:["striped sock puppet","blue sock puppet"], addClues:["Scarlett saw a suspicious laundry meeting"]}),
  C("Let Jenkins conduct one final loud audition", "treasure_story", {set:{hasSockPuppet:true}, inc:{chaos:2}, addItems:["striped sock puppet","blue sock puppet","Dad sock puppet"], addCallbacks:["Jenkins held the Great Sock Audition"]})
])
,treasure_recycling: N("Gather Supplies", "The Cardboard Department", [
  "Logan found a cereal box for the final stage, paper tubes for clue containers, and a clean egg carton that Jenkins immediately wore as shoulder armor. “Recycling has made me powerful,” he said.",
  "The cereal box needed to be flattened. Jenkins pulled one side while Logan held the other. It opened suddenly and launched a cardboard flap across the room. The flap landed at Mom’s feet.",
  (s)=>s.momKnows ? "Mom looked at Jenkins’ armor. “I assume this is part of the mission.” Jenkins shook his head. “No. This is formal clothing.”" : "Mom picked up the flap. “Building something?” Scarlett’s footsteps sounded in the hall behind her.",
  "Logan could tell Mom, stay vague with a cardboard-television story, ask only for a safe stage window, or turn the flying flap into a treasure sign. A bottle cap nearby would make an excellent clue bell."
], [
  C("Tell Mom about the treasure show", "treasure_story", {set:{momKnows:true, recruitedMom:true, hasSockPuppet:true}, inc:{honest:1}, addItems:["cereal-box stage","paper tubes","sock puppet"], addHelpers:["Mom"], addCallbacks:["Mom cut a safe puppet-stage window"]}),
  C("Call it a cardboard television", "treasure_story", {set:{hasSockPuppet:true}, inc:{clever:1}, addItems:["cereal-box stage","paper tubes","sock puppet"], addCallbacks:["The puppet stage hid as a cardboard television"]}),

  C("Turn the flying flap into a treasure sign", "treasure_story", {set:{hasSockPuppet:true}, inc:{clever:2}, addItems:["cereal-box stage","paper tubes","treasure sign","sock puppet"], addCallbacks:["A flying cardboard flap became the treasure sign"]})
])
,treasure_fort: N("Gather Supplies", "The Theater Already Has Blankets", [
  "The blanket fort had two chairs, a roof, and a doorway just wide enough for Logan. Jenkins crawled in with a flashlight beneath his chin. “Welcome to the Royal National Blanket Theater,” he boomed. One clothespin popped loose, and the roof sagged onto his head.",
  "The fort was perfect for the final puppet reveal if they could add a curtain and keep Scarlett away. Logan found a scarf, couch cushions, clothespins, and a wooden spoon Jenkins had hidden during an earlier “soup emergency.”",
  "Scarlett’s voice came from outside the blanket. “Can I come in my fort?” Jenkins pressed a finger to his lips, then whispered “BE NATURAL” loudly enough to move the wall.",
  "Logan could borrow the fort honestly, build Scarlett a temporary reading fort, announce a five-minute roof inspection, or let Jenkins explain Blanket Law. Any answer would affect how suspicious Scarlett became."
], [
  C("Ask to borrow the fort for ten minutes", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{honest:1, suspicion:1}, addItems:["scarf curtain","wooden-spoon puppet"], addCallbacks:["Scarlett unknowingly loaned the final theater"]}),
  C("Build Scarlett a tiny reading fort nearby", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{clever:2}, addItems:["scarf curtain","sock puppet"], addCallbacks:["A second tiny fort protected the surprise"]}),
  C("Announce a five-minute roof inspection", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{clever:1}, addItems:["scarf curtain","clothespins","sock puppet"], addCallbacks:["The fort passed a suspicious safety inspection"]}),
  C("Let Jenkins explain Blanket Law", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{chaos:2, suspicion:1}, addItems:["wooden-spoon puppet","scarf curtain"], addClues:["Scarlett heard Jenkins invent Blanket Law"]})
])
,treasure_story: N("Design the Hunt", "Choose the Most Important Nonsense", [
  "Logan placed three blank clue cards in a row. Each needed to send Scarlett somewhere familiar without making the answer obvious. The last clue would bring her to the hidden puppet stage, where the story would finish.",
  (s)=>s.supplyRoute==="sock basket" ? "The striped sock was ready to become Detective Stripe, and the blue sock kept claiming it had moon experience." : s.supplyRoute==="recycling" ? "Paper tubes could hide rolled clues, and the cereal-box stage had room for a tiny final scene." : "The blanket theater already had a curtain. Jenkins kept bowing through it before any audience existed.",
  "A detective hunt could search for Scarlett’s missing giggle. A space hunt could recover three lost moon objects. A royal hunt could find the Golden Joke and save the Kingdom of Laughs.",
  "Jenkins wanted every clue to rhyme with “pickle.” Logan explained that this would make the answers either too easy or completely impossible. They agreed that only one clue could mention a pickle, and only if absolutely necessary."
], [
  C("Create the Case of the Missing Giggle", "treasure_detective", {set:{constructionFix:"detective giggle hunt"}, addCallbacks:["Detective Stripe opened the Case of the Missing Giggle"]}),
  C("Create a mission to the Moon of Lost Toys", "treasure_space", {set:{constructionFix:"lost-toy space hunt"}, addCallbacks:["Captain Blue launched the Moon of Lost Toys mission"]}),
  C("Create a quest for the Kingdom’s Golden Joke", "treasure_royal", {set:{constructionFix:"Golden Joke royal hunt"}, inc:{chaos:1}, addCallbacks:["Queen Spoonella began the Golden Joke quest"]})
])
,treasure_detective: N("Build the Clues", "Detective Stripe Loses the Evidence", [
  "Clue one sent Scarlett to the place where cold food slept. Clue two pointed toward Dad’s shoes. Clue three would reveal the puppet theater. Jenkins drew a paper cookie as the detective’s most important evidence and wrote DO NOT EAT.",
  "During rehearsal, the cookie vanished. Logan checked behind the stage. Jenkins checked his pockets. Then they both looked at his mouth. He opened it. The paper cookie was inside, slightly bent. “I protected it in the mouth vault,” he said.",
  (s)=>s.hasCookie ? "Logan still had a real cookie. It could become a delicious clue, though Jenkins’ eyes widened dangerously." : s.foundShoes ? "Dad’s recovered shoe could hide a clue, paying back the earlier shoe mystery." : "A bottle cap, lost button, or ordinary paper star could become the evidence instead.",
  "They needed one clue object that would survive Jenkins and make Scarlett laugh when Detective Stripe explained it during the finale."

  C("Use the cookie as evidence, real if available and paper if not", "treasure_crisis", {set:{hasCookie:false}, removeItems:["cookie"], addClues:["Detective Stripe’s cookie evidence"], addCallbacks:["The cookie clue survived Jenkins’ mouth vault"]}),

  C("Let Dad’s deep-voiced sock become a surprise witness", "treasure_crisis", {set:{dadKnows:true}, inc:{chaos:1}, addHelpers:["Dad"], addClues:["The sock witness clue"], addCallbacks:["The Deep Voice testified about the missing giggle"]})
])
,treasure_space: N("Build the Clues", "The Rocket With a Snack Compartment", [
  "Logan turned a paper tube into a rocket. Captain Blue would deliver each clue from a new planet: Refrigerator Planet, Couch-Cushion Moon, and the final Puppet Base. Jenkins supplied engine noises until Mom asked whether a lawn mower was inside.",

], [
