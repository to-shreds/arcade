    '"That was meant to stay attached," Logan said. Scarlett was coming down the hall. Logan could tell Mom about the show, call it a cardboard TV, or ask her to cut one window. The loose flap could still become a sign. Jenkins quietly stopped pulling things.'
  ]},
  treasure_fort: { title: 'It Is Scarlett’s Fort', text: [
    'The fort had a pillow wall and a scarf curtain. Jenkins crawled inside to test the stage. Scarlett arrived before he crawled out. "Why are you in my fort?" Jenkins looked at Logan. That part had not been tested.',
    'Logan could ask to borrow it, build Scarlett a smaller reading spot, or check the roof with her. Jenkins wanted to explain a made-up blanket rule. He already had a speech ready. Logan could decide whether anyone needed to hear it.'
  ], labels: { 'Let Jenkins explain Blanket Law': 'Let Jenkins explain his made-up blanket rule' }},
  treasure_story: { title: 'Choose the Puppet Story', text: [
    'Logan laid three clue cards on the table. Each one needed to point to a place Scarlett knew. The puppets could solve a missing-giggle case, visit pretend planets, or look for a joke in a make-believe kingdom.',
    'Whatever he picked, the hunt would stay inside the house. Jenkins wanted a clue in the fridge and a clue in the cookie jar. "Those are both snack stops," Logan said. Jenkins said that was why the plan was good.'
  ], labels: { 'Create a mission to the Moon of Lost Toys': 'Make a pretend space hunt through the house', 'Create a quest for the Kingdom’s Golden Joke': 'Make a pretend kingdom hunt for a joke' }},
  treasure_detective: { title: 'Do Not Eat the Evidence', text: [
    'Logan drew a cookie on a clue card and wrote DO NOT EAT. During practice, the card disappeared. Jenkins checked his pockets. Logan checked Jenkins’s mouth. There it was. "It is safer in there." Logan disagreed.',
    (s) => `${s.hasCookie ? 'The real cookie could replace the drawing, if Logan kept hold of it.' : s.foundShoes ? 'Dad’s recovered shoe could hide the next clue.' : 'A bottle cap or paper cookie could be the missing object.'} They could also add a sock witness. First, the evidence needed somewhere dry to wait.`
  ], labels: { 'Use a bottle cap as the magical Giggle Button': 'Use a bottle cap as the missing Giggle Button' }},
  treasure_space: { title: 'The Rocket Keeps Rolling', text: [
    'Logan made a pretend rocket from a paper tube. Its stops were the fridge, the couch, and the puppet stage. Jenkins made engine noises. Mom asked whether the vacuum was broken.',
    'The rocket rolled sideways every time Logan set it down. Bottle caps or clothespins could make feet. An egg carton could hold it steady. They could even keep the sideways landing in the show. Jenkins offered a cracker as a foot, then ate it before Logan answered.'
  ]},
  treasure_royal: { title: 'The Missing Joke', text: [
    'In this puppet story, Scarlett was a queen looking for the Golden Joke. Jenkins gave the spoon queen a grand voice. Then she fell over. "She is resting." Logan stood her back up.',
    'They needed one clue Scarlett could solve and something small for the treasure. A riddle on a paper scroll could work. The acorn might be the prize. Scarlett could supply the joke herself, or the falling spoon could stay in the show. At least that part was easy to repeat.'
  ], labels: { 'Use the acorn as the Golden Joke treasure': 'Use the acorn as the hunt’s pretend treasure' }},
  treasure_crisis: { title: 'The Clues Are Out of Order', text: [
    'Jenkins bowed to an empty room and bumped the table. The clue cards fell. He picked them up and handed them to Logan. Now the first clue led straight to the last clue.',
    'Scarlett’s footsteps were getting closer. Logan could match the pictures, number the cards, or let her choose the order. A puppet could buy them a minute. Jenkins offered to bow again. Logan moved the cards out of reach before answering. They had enough work to do already.'
  ]},
  treasure_test: { title: 'Try the Hunt Once', text: [
    (s) => `Logan followed the ${displayProjectName(s)} himself. The clues led to the right places, and the stage stayed up. Jenkins watched the curtain instead of watching for Scarlett. Logan reminded him which job mattered first.`,
    'They could add a note with Scarlett’s name, save her a puppet, or put one last clue over the stage. Jenkins had also prepared a short victory dance. It involved turning around without looking. Logan made him move away from the table.'
  ], labels: { 'Plan Jenkins’ ridiculous victory dance for the finale': 'Save Jenkins’s dance for the end' }},
  hide_select: { title: 'Where Can It Wait?', text: [
    (s) => `The ${displayProjectName(s)} was ready. Scarlett was not meant to see it yet. Jenkins suggested hiding it behind himself. Logan checked. He could still see most of it. They needed an actual place.`,
    'The fort was nearby, but Scarlett used it. The upstairs closet had boxes. The laundry basket could move without warning. Under the table, somebody might kick it. Logan needed a place where the gift would stay safe until the show. Jenkins offered to stand wider.'
  ], labels: { 'Use the blanket fort as a cloth castle': 'Hide it in the blanket fort' }},
  hide_fort: { title: 'Just a Pillow', text: [
    (s) => `The ${displayProjectName(s)} fit behind a couch cushion in the fort. Jenkins put up a sign: JUST A PILLOW. Logan took it down. Nothing else in the room had a sign saying what it was.`,
    'The roof sagged at one corner. Scarlett’s rabbit sat by the entrance, and Scarlett might come back for him. Logan could add a cushion wall, fix the roof, or use a puppet guard. Leaving a side tunnel would let Scarlett play without reaching the gift.'
  ]},
  hide_attic: { title: 'Behind the Winter Hats', text: [
    (s) => `Logan found a low shelf behind two game boxes for the ${displayProjectName(s)}. Nothing heavy could fall on it. Jenkins tried on a coat from the hook. The sleeves reached almost to the floor.`,
    'Scarlett called from the stairs, asking what they were doing. Logan could brace the gift, cover it with hats, or tell Mom which shelf to leave alone. Jenkins offered to pretend he was a coat display. He would have to stop waving first.'
  ]},
  hide_laundry: { title: 'The Wrong Laundry Basket', text: [
    (s) => `Logan covered the ${displayProjectName(s)} in a clean laundry basket. Jenkins wanted to sit on top. Logan moved him aside. Scarlett passed with Dad’s sock on her hand. "Doctor Sock is doing rounds," she said.`,
    'The towel hid the gift, but the basket still looked like something Mom might carry away. Logan could set up a quick escape, add more towels, give Doctor Sock a hallway job, or leave Mom a small note. Jenkins asked for a checkup.'
  ]},
  hide_table: { title: 'Watch Your Feet', text: [
    (s) => `Logan slid the ${displayProjectName(s)} behind a chair under the dining table. The cloth hid it well. Jenkins crawled in to help and immediately bumped his head. "I found the table."`,
    (s) => `${s.foundShoes ? 'Dad walked by in both shoes. Jenkins tried to move an old slipper into the hiding place.' : 'Dad walked by in one shoe. The other was under the table beside Jenkins.'} Logan needed to keep feet and chairs away from the gift. He could plan a route, mark the edges, add a screen, or explain enough to Dad.`
  ]},
  trouble_fort: { title: 'The Roof Comes Down', text: [
    (s) => `Scarlett lifted the pillow door. "Mr. Bun is moving in." The roof slipped, covering the ${displayProjectName(s)}. Logan caught one corner. Jenkins caught another and somehow trapped himself under a cushion. "I am holding it."`,
    (s) => `${s.momKnows || s.dadKnows ? 'A parent who knew the plan waited for Logan’s signal.' : 'Mom and Dad were nearby but had not seen what happened.'} Scarlett crawled toward a loose piece. Logan could make a tunnel game, lift the roof, ask for help, or let Jenkins roll himself free.`
  ], labels: { 'Let Jenkins roll out wrapped like a monster burrito': 'Let Jenkins roll free of the blanket' }},
  trouble_attic: { title: 'Mom Needs the Fan', text: [
    (s) => `Mom needed the fan behind the ${displayProjectName(s)}. Scarlett came upstairs to help. Jenkins moved a hat box, and three hats fell out. One small piece of the gift rolled into the hall. Scarlett went after it.`,
    'Logan could reach the piece first or trust the game boxes to hold everything while he helped Mom. Making the cleanup into a search might keep Scarlett busy. Jenkins could also take his coat-display act downstairs. Mom looked at the hats. "Excellent timing."'
  ]},
  trouble_laundry: { title: 'Mom Picks Up the Basket', text: [
    (s) => `Mom reached for the basket holding the ${displayProjectName(s)}. Logan caught the handle. A ribbon slid out, followed by a marker. Scarlett reached for the towel. Jenkins held his breath so loudly that Mom looked at him.`,
    (s) => `A small piece had caught on Dad’s sock. Logan could follow it, start a color-sorting game, or explain the basket to Mom. ${s.hasCookie ? 'The saved cookie might keep Jenkins busy while Logan gathered things.' : 'An apple slice might keep Jenkins busy while Logan gathered things.'} Jenkins looked ready to provide an explanation nobody had requested.`
  ]},
  trouble_table: { title: 'Snack Time', text: [
    (s) => `Dad brought apple slices to the table. Mom brought cups. Scarlett picked the chair beside the ${displayProjectName(s)}. Under the cloth, Jenkins passed Logan a ribbon. Then Dad pulled out a chair and found them both.`,
    'Scarlett leaned down to look. Logan could ask Dad for help, use the sliding route, or give Scarlett a job sorting the apples. Jenkins proposed inspecting the spoons while Logan moved the gift. Dad waited. "Should I ask, or would that make this take longer?"'
  ]},
  scarlett_patrol: { title: 'Scarlett Wants an Answer', text: [
    (s) => `The ${displayProjectName(s)} was safe again. Scarlett stood in the hall with her rabbit. "Is this for me?" Jenkins stepped behind Logan. His arms stuck out on both sides. Scarlett looked directly at him. "I can see you."`,
    'Logan could give her part of the truth, start a real game, or ask for an idea without showing the gift. Jenkins could try answering too. He raised one hand. Logan had heard several of his answers already.'
  ], labels: { 'Create a fun distraction that is also a real family activity': 'Start a quick family game' }},
  response_truthish: { title: 'Part of the Truth', text: [
    '"We are making something," Logan said. "You can see it soon." Scarlett asked if it was a robot. Jenkins said no much too quickly. She asked if it was food. Jenkins looked at Logan before answering this time.',
    'Logan could admit it was for Scarlett and ask her to wait. He could keep the name secret, give her a password for the reveal, or show one harmless supply. Scarlett waited for an answer. Jenkins was finally doing the same.'
  ]},
  response_distract: { title: 'Buy a Few Minutes', text: [
    (s) => `${s.foundShoes ? 'Dad could help Scarlett put on a short shoe parade.' : 'Dad still needed help finding his shoes.'} A puppet interview or a hallway color hunt would also give Logan a few minutes. Jenkins suggested a snack break. He suggested that fairly often.`,
    'Scarlett wanted something worth doing, not a job that sent her away for no reason. Logan could pick a game and join in before finishing the gift. Jenkins checked whether joining in the snack break was required. He was prepared either way.'
  ]},
  response_help: { title: 'Ask Scarlett', text: [
    '"I need your opinion," Logan told Scarlett. She set down her rabbit. Jenkins started to explain the whole project. Logan handed him the rabbit instead. "Hold this." Jenkins held it with both hands.',
    (s) => `Scarlett could pick a color, ${s.hasTape ? 'find the tape' : 'find a ribbon'}, or decide whether ${s.hasAcorn ? 'the acorn' : 'a button'} looked like a jewel or a nose. She could also choose a puppet voice. Logan needed one answer without showing her everything yet.`
  ]},
  response_jenkins: { title: 'Too Much Information', text: [
    '"There is no secret present for you," Jenkins told Scarlett. Logan closed his eyes. Scarlett smiled. "I did not ask about a present." Jenkins looked at Logan. "I may have added a detail."',
    'She still did not know what it was. Logan could stop everyone for ten seconds, make Jenkins try one quiet truth, or let him blame the nearby lamp. A sock puppet could speak for him instead. Scarlett folded her arms and waited to see what came next.'
  ], labels: { 'Invoke Monster Rule Twenty-Two: never question a lamp': 'Let Jenkins blame the lamp', 'Let Inspector Sock declare the lampshade innocent': 'Let Inspector Sock speak for Jenkins' }},
  adult_crossroads: { title: 'Who Can Help?', text: [
    (s) => `The ${displayProjectName(s)} needed one last repair and a safe trip to the reveal. Logan looked at the loose pieces. Jenkins looked at the door. Neither of them had another hand to spare.`,
    'Mom could check the small parts. Dad could carry things and watch the hall. They could both help, or Logan could keep the last fix between himself and Jenkins. The choice was whose help he needed. Jenkins said he could manage. He was standing on a ribbon.'
  ], labels: { 'Recruit Mom as practical Mission Control': 'Ask Mom for practical help', 'Brief both parents and form a five-person team': 'Explain the plan to both parents' }},
  helper_mom: { title: 'Mom Sees the Loose Part', text: [
    (s) => `Logan showed Mom the ${displayProjectName(s)}. She noticed a loose part before Jenkins finished saying it was ready. "How long has that been loose?" Jenkins looked at the ceiling. "Not a useful amount of time."`,
    (s) => `${s.promisedClean && s.mess > 0 ? 'Mom pointed out the mess they had promised to clear.' : 'Mom moved a drink away from the work.'} She found a tray and waited for Logan to choose her job. She could inspect the repair, tidy up, keep Scarlett busy, or clear a spot for the show.`
  ]},
  helper_dad: { title: 'Dad Is Available', text: [
    'Dad listened to the plan and nodded. "Agent Dad. Ready." He leaned on the light switch. The room went dark. He switched it back on. Jenkins asked if that was part of the plan. Dad said it was not.',
    (s) => `${s.foundShoes ? 'They could stage another shoe hunt, even though Dad now had both shoes.' : 'A shoe hunt could keep Scarlett busy.'} Dad could also carry the tray, watch the hall, or check a loose part. Logan needed to give him one job before Jenkins assigned him four.`
  ], labels: { 'Order a dramatic missing-shoe diversion': 'Ask Dad to start a shoe hunt' }},
  helper_both: { title: 'One Job Each', text: [
    (s) => `Mom moved cups away from the ${displayProjectName(s)}. Dad cleared the path to the door. Jenkins tried to clear it too and moved a chair back where Dad had just found it. "I was helping." Dad moved it again.`,
    'Scarlett could pick music in the next room while they finished. Logan could give everyone a job, keep one of Jenkins’s additions, or let Dad watch the hall while Mom checked the repair. He could hear their ideas first. He still had to choose which ones worked.'
  ]},
  helper_solo: { title: 'Just Logan and Jenkins', text: [
    (s) => `Logan and Jenkins laid the parts of the ${displayProjectName(s)} in a row. Jenkins moved one. Logan put it back. "We are counting first." Jenkins said he had been checking whether Logan noticed. Logan noticed.`,
    (s) => `They could repair the loose parts, use ${s.hasAcorn ? 'the acorn' : 'a button'} as a replacement, or practice carrying the gift. Jenkins wanted to add one small joke. Logan would need to watch that job. Jenkins’s idea of small had caused problems before.`
  ]},
  late_crisis_crown: { title: 'One Ball Comes Loose', text: [
    'A tennis ball came loose from the crown. Logan caught the frame while Jenkins went after the ball. Jenkins brought it back and held it against the empty spot. "Fixed." It fell again when he let go.',
    (s) => `${s.hasTape ? 'The saved tape could secure the frame.' : 'Tight ribbon loops could secure the frame.'} They could remove some weight, hang the ball lower, or put the crown on Jenkins while Scarlett passed. ${s.hasAcorn ? 'The acorn could fill the middle.' : 'A small paper shape could fill the middle.'} Logan checked what would hold before letting Jenkins wear it.`
  ], labels: { 'Remove one heavy ball and make a lighter royal crown': 'Remove one ball to make the crown lighter', 'Hang the runaway ball as a swinging royal jewel': 'Hang the loose ball lower on the crown', 'Put the crown on Jenkins and use him as a royal statue': 'Put the crown on Jenkins while Scarlett passes' }},
  late_crisis_pancake: { title: 'It Is Leaning Again', text: [
    'The pancake prize leaned left. Jenkins leaned left too. Logan asked him to hold the tray flat instead. One strawberry rolled toward the edge, and Logan caught it before it reached the floor.',
    (s) => `${s.promisedClean ? 'Jenkins wiped the syrup off the tray, as promised.' : 'Logan kept the food away from the art supplies.'} ${s.hasCookie ? 'The cookie could make a firm base.' : 'An upside-down bowl could make a firm base.'} They could also serve a smaller prize, keep the wobble in the show, or carry it slowly with Logan giving directions.`
  ]},
  late_crisis_portrait: { title: 'The Corner Curls', text: [
    'A corner of the picture curled over Scarlett’s face. Jenkins pressed it down and moved a moon sticker onto her shoulder. He looked at the result. "She has a moon now." Logan asked him to leave it alone for a minute.',
    (s) => `${s.hasTape ? 'A hidden loop of tape' : 'A folded paper brace'} could flatten the corner. It could also become a flap with a message. ${s.hasAcorn ? 'The acorn could decorate the picture.' : callbackHas(s, "Scarlett's tiny jewel idea") ? 'Scarlett’s chosen button could decorate the picture.' : 'A button could decorate the picture.'} Logan could keep the moved sticker and give it one short line.`
  ], labels: { 'Keep the polite moon and give it one tiny speech bubble': 'Give the misplaced moon a speech bubble', "Add the acorn as the portrait's royal jewel": 'Add the acorn to the picture', "Add Scarlett's chosen button as a royal jewel": 'Add the button Scarlett helped choose', "Add a small button as the portrait's royal jewel": 'Add a small button to the picture' }},
  late_crisis_treasure: { title: 'Check Jenkins’s Back', text: [
    'Jenkins had hidden the last clue somewhere very safe. He could not remember where. Logan asked him to turn around. The card was stuck to his back. "Nobody would check there," Jenkins said. Logan had just checked there.',
    (s) => `${s.hasSockPuppet ? 'Inspector Sock could deliver it.' : 'A sock puppet could deliver it.'} They could leave it on Jenkins or replace it with a shoe riddle. ${callbackHas(s, "Scarlett's chosen color") || callbackHas(s, "Scarlett's tiny jewel idea") ? 'Scarlett’s earlier art idea could supply the answer.' : 'Scarlett could choose a color for the answer.'} ${s.password ? `Their password was still "${s.password}."` : 'Logan could add a short password too.'}`
  ]},
  reveal_setup: { title: 'Pick the Place', text: [
    (s) => `The ${displayProjectName(s)} was ready to move. Logan checked the path and the loose pieces. Jenkins checked for Scarlett. He used an actual whisper this time. Logan asked him to keep using that one.`,
    (s) => `${s.adultPlan === 'both' ? 'Mom and Dad waited for their jobs.' : s.adultPlan === 'Mom' ? 'Mom had made a clear path.' : s.adultPlan === 'Dad' ? 'Dad waited to help carry it.' : 'Logan and Jenkins would handle the move.'} The living room had space. The kitchen had a table. The yard could hold a chalk trail. The fort already had a curtain. Logan needed to choose where to begin.`
  ], labels: { 'Use the living room for a grand open-space reveal': 'Use the living room', 'Turn the kitchen into a tiny award ceremony': 'Give the award in the kitchen', 'Return to the blanket fort for the final secret': 'Finish in the blanket fort' }},
  reveal_living: { title: 'Everybody Looks Normal', text: [
    (s) => `Logan put the ${displayProjectName(s)} behind ${s.usedFort ? 'a blanket from the fort' : 'a blue blanket'}. Jenkins hid behind the couch. His feet did not fit. ${s.hasSockPuppet ? 'Inspector Sock waited on Logan’s hand.' : 'A paper-cup puppet waited beside Logan.'} Everything was ready except for Jenkins’s feet.`,
    'Scarlett walked in. Dad examined a lamp. Mom held an empty cup. "Are you being weird on purpose?" Scarlett asked. Logan could count down, bring the family together, let Dad announce it, or give Jenkins his cue. Jenkins had been waiting a long time to stand up.'
  ], labels: { 'Bring Mom and Dad in for a whole-family parade': 'Bring the whole family into the reveal' }},
  reveal_kitchen: { title: 'Scarlett’s Seat', text: [
    (s) => `Logan covered the ${displayProjectName(s)} on the kitchen table. Jenkins set out spoons, then asked whether they needed more spoons. They did not. Scarlett sat in the chair with her name on it. "That is my usual chair."`,
    'Mom waited by the cloth. Dad was trying not to smile. Logan could give a short speech, ask Mom to lift the cover, or lead everyone around the table. If something wobbled, he could make it part of the show. Jenkins was still holding a spoon.'
  ], labels: { 'March around the table as a five-person award parade': 'Lead everyone around the table' }},
  reveal_yard: { title: 'Follow the Arrows', text: [
    'Logan drew chalk arrows across the patio. The last one pointed at a bush. Jenkins crouched behind it. "Can she see me?" he called. Logan told him that being quiet might help.',
    (s) => `${s.firstSearch === 'backyard' ? 'The trail crossed the place where Logan had found his first clue.' : 'Logan added one fuzzy footprint beside the arrows.'} ${s.hasAcorn ? 'The acorn marked the last stop.' : 'A paper star marked the last stop.'} Scarlett followed the trail. Logan could guide her, use Dad’s shoes for the last clue, give Jenkins his cue, or bring everyone along.`
  ], labels: { 'Let Jenkins burst from the bush in full Leaf Mode': 'Let Jenkins emerge wearing his leaf disguise' }},
  reveal_fort: { title: 'Can I Come into My Fort?', text: [
    (s) => `Logan put the ${displayProjectName(s)} at the back of the fort. The sign said WELCOME, SCARLETT. Jenkins held up the roof. He had picked a job with no easy way to leave.`,
    'Scarlett stopped at the entrance. "Can I come into my own fort?" Logan could welcome her, start the puppet show, or let her lift the cover herself. The curtain caught on Jenkins’s arm. Logan could also change the plan. Jenkins said he was comfortable. He did not look comfortable.'
  ], labels: { 'Let Scarlett lift the blanket and discover it one beat early': 'Let Scarlett lift the cover herself' }},
  ending_perfect: { title: 'Right on Time', text: [
    (s) => `Logan gave the signal. Scarlett saw the ${displayProjectName(s)}. ${projectPayoff(s)} She looked at the details, then at Logan. "You made all this?" Jenkins lifted a hand. "Some of the damage was mine."`,
    (s) => `${s.hasAcorn ? 'Scarlett found the acorn among the decorations.' : callbackHas(s, 'shoe') ? 'Dad explained why his shoes had kept appearing in the plan.' : 'Jenkins put down his notes. The work was finished.'} Scarlett hugged Logan and gave the small squeaky laugh they had been waiting for. Jenkins waited until she finished before starting his dance.`
  ]},
  ending_chaos: { title: 'Nearly as Planned', text: [
    (s) => `The ${displayProjectName(s)} stayed still for about four seconds. Jenkins moved too soon. A spoon rolled under Dad’s foot, and Mom caught a loose part. Logan told everyone where to hold it. Scarlett sat down laughing. ${projectPayoff(s)}`,
    (s) => `${s.promisedClean ? 'Jenkins remembered his promise and picked up the scraps.' : 'Jenkins helped gather the loose pieces.'} "Was that part planned?" Scarlett asked. Logan said no. Jenkins said most of it was. They did not agree on how much most meant. Scarlett asked to see it again.`
  ]},
  ending_early: { title: 'Scarlett Finds It First', text: [
    (s) => `Scarlett lifted the cover before Logan gave the signal. There was the ${displayProjectName(s)}. Jenkins was still hiding in plain sight. "I knew you were making something," she said. Jenkins asked if they could do the reveal again.`,
    (s) => `${projectPayoff(s)} Logan let Scarlett add the last small detail. Then Dad counted down from three anyway. "Surprise," everybody said to the girl who had already seen it. Scarlett laughed, and Jenkins called that close enough. Logan agreed with him for once.`
  ]},
  ending_family: { title: 'Everybody Has a Job', text: [
    (s) => `Mom cleared the way. Dad welcomed Scarlett. Jenkins carried the ${displayProjectName(s)}, exactly as Logan had told him. Scarlett followed the last clue. ${projectPayoff(s)} "What is the occasion?" she asked. "Tuesday," Dad said.`,
    'Logan told her it was just for her. She laughed and hugged him. Jenkins asked whether he could have an award for carrying things without dropping them. Mom said he could start by putting the supplies away. He considered that a change to the deal.'
  ]},
  ending_agent_dad: { title: 'Dad Makes the Announcement', text: [
    (s) => `Dad stepped forward. "Scarlett, you have won an award." Jenkins whispered that it was meant to sound more secret. Dad lowered his voice so far that nobody heard the next sentence. Logan brought out the ${displayProjectName(s)}. ${projectPayoff(s)}`,
    'Scarlett laughed and asked Dad how they had kept it hidden. "Logan made the plan," Dad said. "I stood in the hall." Jenkins gave him a paper badge for that. Scarlett hugged Logan, then asked if Agent Dad was going to keep wearing the badge. Dad said yes.'
  ]},
  ending_mom_save: { title: 'Mom Catches It', text: [
    (s) => `As Logan showed the ${displayProjectName(s)}, one part slipped. Mom caught it without stepping in front of Scarlett. Jenkins stared. "You knew that would happen?" "I saw it moving," Mom said. Logan finished the reveal. ${projectPayoff(s)}`,
    'Scarlett laughed and hugged Logan. Mom held the loose part until he could put it back. Jenkins said he had almost caught it too. His hands had been in his pockets. Logan handed him a box of supplies to put away. This time, Jenkins caught the box.'
  ]},
  ending_jenkins: { title: 'Jenkins Misses His Cue', text: [
    (s) => `Jenkins was meant to do one small thing. Instead, he ${s.revealLocation === 'backyard' ? 'stepped out of the bush wearing half its leaves' : s.revealLocation === 'blanket fort' ? 'got caught in the curtain' : 'stood up with part of the cover still on him'}. Scarlett started laughing before Logan showed the ${displayProjectName(s)}. Jenkins waited. "Am I finished?"`,
    (s) => `${projectPayoff(s)} Logan made Jenkins’s mistake part of the introduction. Scarlett hugged Logan and asked Jenkins to do it again. Jenkins wanted to know whether making mistakes was now his job. "You do not need more practice," Logan said.`
  ]},
  ending_improvise: { title: 'Skip the Curtain', text: [
    (s) => `The curtain caught, and the first plan stopped working. Logan looked at Scarlett, then at the ${displayProjectName(s)}. He started a new show. ${s.hasSockPuppet ? 'Inspector Sock introduced it.' : 'Logan made a quick talking puppet with his hand.'} Jenkins supplied noises from behind the stuck cloth.`,
    (s) => `${s.hasAcorn ? 'The acorn marked the last stop.' : s.hasTape ? 'The saved tape turned the loose cloth into a banner.' : 'A spoon served as the pretend microphone.'} ${projectPayoff(s)} Scarlett laughed. Logan took a bow. Jenkins tried to take one too. He was still attached to the curtain, so his was shorter.`
  ]}
};

    const GROUNDED_STORY = { ...GROUNDED_A, ...GROUNDED_B };
    for (const [id, prose] of Object.entries(GROUNDED_STORY)) {
      const node = STORY[id];
      if (!node) throw new Error(`Unknown grounded scene: ${id}`);
      node.title = prose.title;
      node.text = prose.text;
      if (prose.labels) {
        const relabel = choice => {
          if (typeof choice.label === "string" && prose.labels[choice.label]) choice.label = prose.labels[choice.label];
          else if (typeof choice.label === "function") {
            const oldLabel = choice.label;
            choice.label = state => { const old = oldLabel(state); return prose.labels[old] || old; };
          }
          return choice;
        };
        if (Array.isArray(node.choices)) node.choices.forEach(relabel);
        else {
          const oldChoices = node.choices;
          node.choices = state => oldChoices(state).map(relabel);
        }
      }
    }

    // Dad has both shoes by this point on every recorder route.
    for (const id of ["side_shoe_radio_2", "side_shoe_radio_3"]) {
      for (const choice of STORY[id].choices) {
        choice.effect.set = { ...choice.effect.set, foundShoes: true };
      }
    }

    for (const [id, node] of Object.entries(STORY)) node.id = id;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function freshState(plan = testStoryPlan()) {
      const next = clone(INITIAL_STATE);
      next.director = clone(plan);
      return next;
    }

    function newAdventureState() {
      return freshState(reserveStoryPlan());
    }

    function resolve(value, state) {
      return typeof value === "function" ? value(state) : value;
    }

    const READER_WORDS = Object.freeze([
      [/\bwhispered\b/gi, "said softly"],
      [/\bannounced\b/gi, "said"],
      [/\bbeneath\b/gi, "under"],

    function validPlain(value) {

    function validateProgress(value) {

    function verifyBridgeSave(expected) {

          const fallback = JSON.parse(window.localStorage.getItem("arcade.autosave.data.v1.adventure") || "null");

        try {
          const request = window.indexedDB.open("arcade-autosaves", 1);
          request.onerror = () => finish(false);
          request.onsuccess = () => {
            const db = request.result;

            read.onsuccess = () => { db.close(); finish(Boolean(read.result && sameValue(read.result.data, expected))); };

      stopReading();
      state = clean.state;
      currentNodeId = clean.nodeId;
      history = clean.history;
      pageAnchor = clean.pageAnchor;

      dom.resume.hidden = false;
      showSaveStatus("Saved adventure");
      dom.continue.focus();
    }

    function initializeProgress() {
      pendingProgress = readLocalProgress();
      const finish = () => {
        if (!bootingProgress) return;
        bootingProgress = false;
        if (pendingProgress) {
          const params = new URLSearchParams(location.search);
          if (params.get("resume") === "1" || params.get("load") === "1") restoreProgress(pendingProgress);
          else offerContinue();
        } else beginNewAdventure();
      };
      const registerBridge = () => {
        if (!window.ArcadeSave || !bootingProgress) return finish();
        try {
          window.ArcadeSave.setExternalSession(true);
          const ready = window.ArcadeSave.register({
            id: "adventure", title: "Adventure", version: 1,
            capture: captureProgress,
            restore: restoreProgress,
            meaningful: () => runActive && !pendingProgress && !bootingProgress,
            summary: () => `${resolve(STORY[currentNodeId].title, state)} · ${history.length} choices`,
            startFresh: beginNewAdventure
          });
          const timeout = setTimeout(() => { window.ArcadeSave.setExternalSession(false); finish(); }, 1500);
          Promise.resolve(ready).then(() => {
            bridgeReady = true;
            if (!bootingProgress) return;
            window.ArcadeSave.setExternalSession(false);
            return window.ArcadeSave.hasSave() ? window.ArcadeSave.load().catch(() => false) : false;
          }).then(() => { clearTimeout(timeout); finish(); }, () => { clearTimeout(timeout); window.ArcadeSave.setExternalSession(false); finish(); });
        } catch (_) { finish(); }
      };
      if (window.ArcadeSave) return registerBridge();
      const script = document.createElement("script");
      script.src = "../arcade-save.js";
      const timeout = setTimeout(finish, 1500);
      script.onload = () => { clearTimeout(timeout); registerBridge(); };
      script.onerror = () => { clearTimeout(timeout); finish(); };
      document.head.appendChild(script);
    }

    function speakPage(index, token) {
      if (!narrationActive || token !== narrationToken) return;
      showStoryPage(index, true);
      if (typeof speechSynthesis === "undefined" || typeof SpeechSynthesisUtterance === "undefined") return;
      const node = STORY[currentNodeId];
      const isLast = index === storyPages.length - 1;
      const labels = isLast ? availableChoices(node, state).map((choice, i) => `Choice ${i + 1}. ${visibleChoiceLabel(choice, state)}`) : [];
      const script = [index === 0 ? resolve(node.title, state) : "", ...(storyPages[index] || []), ...labels].filter(Boolean).join(" ");
      try {
        const speech = new SpeechSynthesisUtterance(script);
        speech.rate = 0.93;
        speech.pitch = 1.03;
        speech.volume = 1;
        speech.onend = () => {
          if (!narrationActive || token !== narrationToken) return;
          if (index < storyPages.length - 1) speakPage(index + 1, token);
          else stopReading();
        };
        speech.onerror = () => {
          if (token === narrationToken) stopReading();
        };
        speechSynthesis.speak(speech);
      } catch (error) {
        console.warn("Read Aloud is not available in this browser.", error);
        stopReading();
      }
    }

    function toggleReading() {
      if (narrationActive) {
        stopReading();
        return;
      }
      if (typeof speechSynthesis === "undefined" || typeof SpeechSynthesisUtterance === "undefined") return;
      narrationActive = true;
      narrationToken += 1;
      const token = narrationToken;
      dom.read.textContent = "■ Stop";
      dom.read.classList.add("stop");
      dom.read.setAttribute("aria-pressed", "true");
      speakPage(storyPageIndex, token);
    }

    function repaginate() {
      if (!renderedSceneLines.length) return;
      storyPages = paginateLines(renderedSceneLines);
      storyPageIndex = pageForAnchor(pageAnchor);
      renderStoryPage();
      saveProgress();
    }

    function nodeTargets(node) {
      const expand = target => {
        if (typeof target !== "string") return [];
        if (target.startsWith("direct:")) return [target.slice(7)];
        const connection = STORY_CONNECTIONS[target];
        return connection ? [...connection.targets] : [target];
      };
      if (Array.isArray(node.targets)) return [...new Set(node.targets.flatMap(expand))];
      if (!Array.isArray(node.choices)) return [];
      return [...new Set(node.choices.flatMap(choice => expand(choice.next)))];
    }

    function validateStory() {
      const errors = [];
      const warnings = [];
      const ids = Object.keys(STORY);
      if (!STORY[START_NODE]) errors.push(`Start node ${START_NODE} is missing.`);

      for (const [id, node] of Object.entries(STORY)) {
        if (!node.title || !node.text) errors.push(`${id} is missing a title or text.`);
        const targets = nodeTargets(node);
        if (node.ending) {
          if (targets.length) errors.push(`${id} is an ending but has destinations.`);
        } else {
          if (Array.isArray(node.choices) && node.choices.length < 3) errors.push(`${id} has fewer than three choices.`);
          if (!Array.isArray(node.choices) && !node.targets) errors.push(`${id} uses dynamic choices without declared targets.`);
          for (const target of targets) if (!STORY[target]) errors.push(`${id} points to missing node ${target}.`);
        }
      }

      const seen = new Set();
      const queue = [START_NODE];
      while (queue.length) {
        const id = queue.shift();
        if (seen.has(id) || !STORY[id]) continue;
        seen.add(id);
        queue.push(...nodeTargets(STORY[id]));
      }
      for (const id of ids) if (!seen.has(id)) warnings.push(`${id} is unreachable in the structural graph.`);

      const depthMemo = new Map();
      const depthStack = new Set();
      function depthsFrom(id) {
        if (depthMemo.has(id)) return depthMemo.get(id);
        if (depthStack.has(id)) {
          errors.push(`A cycle was detected near ${id}.`);
          return { min: Infinity, max: Infinity };
        }
        const node = STORY[id];
        if (!node) return { min: Infinity, max: Infinity };
        if (node.ending) return { min: 0, max: 0 };
        depthStack.add(id);
        const childDepths = nodeTargets(node).map(depthsFrom).filter(result => Number.isFinite(result.min));
        depthStack.delete(id);
        const result = childDepths.length ? {
          min: 1 + Math.min(...childDepths.map(item => item.min)),
          max: 1 + Math.max(...childDepths.map(item => item.max))
        } : { min: Infinity, max: Infinity };
        depthMemo.set(id, result);
        return result;
      }
      const endingDepths = STORY[START_NODE] ? depthsFrom(START_NODE) : { min: Infinity, max: Infinity };
      if (!Number.isFinite(endingDepths.min)) errors.push("No ending is reachable.");
      if (Number.isFinite(endingDepths.min) && endingDepths.min < 28) errors.push(`An ending is reachable after only ${endingDepths.min} decisions.`);
      if (Number.isFinite(endingDepths.max) && endingDepths.max > 36) warnings.push(`The longest structural path is ${endingDepths.max} decisions.`);

      return {
        ok: errors.length === 0,
        nodeCount: ids.length,
        endingCount: ids.filter(id => STORY[id].ending).length,
        reachableCount: seen.size,
        minDecisions: Number.isFinite(endingDepths.min) ? endingDepths.min : null,
        maxDecisions: Number.isFinite(endingDepths.max) ? endingDepths.max : null,
        errors,
        warnings
      };
    }

    const api = {
      STORY, INITIAL_STATE, START_NODE, STORY_CONNECTIONS, PRE_PROJECT_EPISODES, POST_BUILD_EPISODES,
      PRE_PROJECT_FINALS, POST_BUILD_FINALS,
      freshState, testStoryPlan, makeStoryPlan, connectedDestination, availableChoices, applyEffect,
      nodeTargets, validateStory, textLines, sceneVariation, validateProgress, paginateLines, MAX_PAGE_WORDS, STORY_VERSION, PROGRESS_STORAGE_KEY
    };
    const debugApi = {
      story: STORY,
      startId: START_NODE,
      createInitialState: () => freshState(testStoryPlan()),
      createTestPlan: testStoryPlan,
      getChoices: (node, testState) => resolve(node.choices, testState) || [],
      isChoiceAvailable: (choice, testState) => !choice.when || choice.when(testState),
      transition: (node, choice, testState) => {
        const nextState = clone(testState);
        applyEffect(nextState, choice.effect);
        const choiceIndex = Array.isArray(node.choices) ? node.choices.indexOf(choice) : -1;
        if (PRE_PROJECT_FINALS.includes(node.id)) nextState.episodeOneOutcome = visibleChoiceLabel(choice, nextState);
        if (POST_BUILD_FINALS.includes(node.id)) nextState.episodeTwoOutcome = visibleChoiceLabel(choice, nextState);
        nextState.storyPath.push(`${node.id}:${choiceIndex}`);
        const nextId = connectedDestination(resolve(choice.next, nextState), nextState);
        return { nextId, state: nextState };
      },
      isEnding: node => Boolean(node.ending),
      stateKey: (nodeId, testState) => JSON.stringify([
        nodeId,
        testState.project,
        testState.hidingSpot,
        Boolean(testState.dadKnows || testState.recruitedDad),
        Math.min(5, Number(testState.suspicion) || 0),
        Math.min(8, Number(testState.chaos) || 0),
        testState.director && testState.director.connections.afterMission,
        testState.director && testState.director.connections.afterBuild
      ]),
      engine: {
        restart,
        choose,
        back: goBack,
        snapshot: () => clone({ nodeId: currentNodeId, state, history }),
        getVisibleChoices: () => currentChoices.map((choice, index) => index),
        pagination: () => clone({ pages: storyPages, pageIndex: storyPageIndex }),
        nextPage: () => showStoryPage(storyPageIndex + 1),
        previousPage: () => showStoryPage(storyPageIndex - 1),
        captureSave: captureProgress,
        restoreSave: restoreProgress,
        validateSave: validateProgress,
        save: saveProgress,
        pageAnchor: () => pageAnchor,
        isReady: () => !bootingProgress && runActive
      }
    };
    if (typeof globalThis !== "undefined") {
      globalThis.__LOGAN_ADVENTURE__ = api;
      globalThis.__LOGAN_CYOA_DEBUG__ = debugApi;
    }

    if (hasDOM) {
      dom.home.addEventListener("click", goHome);
      dom.save.addEventListener("click", saveProgress);
      dom.continue.addEventListener("click", () => restoreProgress(pendingProgress));
      dom.newAdventure.addEventListener("click", () => { stopReading(); dom.restartDialog.hidden = false; dom.cancelRestart.focus(); });
      dom.confirmRestart.addEventListener("click", beginNewAdventure);
      dom.cancelRestart.addEventListener("click", () => { dom.restartDialog.hidden = true; (pendingProgress ? dom.continue : dom.restart).focus(); });
      dom.back.addEventListener("click", goBack);
      dom.restart.addEventListener("click", restart);
      dom.read.addEventListener("click", toggleReading);
      if (dom.stop) dom.stop.addEventListener("click", stopReading);
      if (dom.previousPage) dom.previousPage.addEventListener("click", () => showStoryPage(storyPageIndex - 1));
      if (dom.nextPage) dom.nextPage.addEventListener("click", () => showStoryPage(storyPageIndex + 1));
      document.addEventListener("keydown", event => {
        if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
        if (pendingProgress || !dom.restartDialog.hidden || bootingProgress) {
          if (event.key === "Tab" && (pendingProgress || !dom.restartDialog.hidden)) {
            const dialog = dom.restartDialog.hidden ? dom.resume : dom.restartDialog;
            const buttons = [...dialog.querySelectorAll("button")].filter(button => !button.disabled);
            const current = buttons.indexOf(document.activeElement);
            const next = (current + (event.shiftKey ? -1 : 1) + buttons.length) % buttons.length;
            event.preventDefault();
            buttons[next].focus();
          }
          if (event.key === "Escape" && !dom.restartDialog.hidden) { event.preventDefault(); dom.cancelRestart.click(); }
          return;
        }
        if (event.key === "ArrowLeft" && storyPages.length > 1) {
          event.preventDefault();
          showStoryPage(storyPageIndex - 1);
          return;
        }
        if (event.key === "ArrowRight" && storyPages.length > 1) {
          event.preventDefault();
          showStoryPage(storyPageIndex + 1);
          return;
        }
        if (event.key === "Escape" && narrationActive) {
          event.preventDefault();
          stopReading();
          return;
        }
        if (/^[1-4]$/.test(event.key)) {
          const index = Number(event.key) - 1;
          if (storyPageIndex === storyPages.length - 1 && currentChoices[index]) {
            event.preventDefault();
            choose(index);
          }
        }
      });
      window.addEventListener("resize", () => {
        if (resizeFrame && typeof cancelAnimationFrame === "function") cancelAnimationFrame(resizeFrame);
        const schedule = typeof requestAnimationFrame === "function" ? requestAnimationFrame : callback => setTimeout(callback, 0);
        resizeFrame = schedule(() => {
          resizeFrame = 0;
          stopReading();
          repaginate();
        });
      });
      window.addEventListener("pagehide", () => { stopReading(); saveProgress(); });
      window.addEventListener("arcadepause", () => { stopReading(); saveProgress(); });
      document.addEventListener("arcadepause", () => { stopReading(); saveProgress(); });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) { stopReading(); saveProgress(); }
      });
      window.addEventListener("message", event => {
        if (event.source !== window.parent || event.origin !== window.location.origin) return;
        if (event.data && event.data.scope === "arcade-shell" && event.data.version === 1 && event.data.type === "pause") { stopReading(); saveProgress(); }
      });
      const report = validateStory();
      if (!report.ok) console.error("Adventure validation failed", report);
      render();
      initializeProgress();
    }
  })();
  </script>
</body>
</html>
