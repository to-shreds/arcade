    // Dad has both shoes by this point on every recorder route.
    for (const id of ["side_shoe_radio_2", "side_shoe_radio_3"]) {
      for (const choice of STORY[id].choices) {
        choice.effect.set = { ...choice.effect.set, foundShoes: true };
      }
    }

    for (const [id, node] of Object.entries(STORY)) node.id = id;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function freshState(plan = testStoryPlan()) {
      const next = clone(INITIAL_STATE);
      next.director = clone(plan);
      return next;
    }

    function newAdventureState() {
      return freshState(reserveStoryPlan());
    }

    function resolve(value, state) {
      return typeof value === "function" ? value(state) : value;
    }

    const READER_WORDS = Object.freeze([
      [/\bwhispered\b/gi, "said softly"],
      [/\bannounced\b/gi, "said"],
      [/\bbeneath\b/gi, "under"],
      [/\bunderneath\b/gi, "under"],
      [/\bordinary\b/gi, "normal"],
      [/\bexactly\b/gi, "just"],
      [/\bimportant\b/gi, "special"],
      [/\bexcellent\b/gi, "great"],
      [/\bsuspicious\b/gi, "strange"],
      [/\benormous\b/gi, "huge"],
      [/\bimmediately\b/gi, "right away"],
      [/\bextremely\b/gi, "very"],
      [/\bseveral\b/gi, "a few"],
      [/\bfinally\b/gi, "at last"],
      [/\bvanished\b/gi, "was gone"],
      [/\brequested\b/gi, "asked for"],
      [/\badvanced\b/gi, "fancy"],
      [/\bclassified\b/gi, "secret"],
      [/\bcomplicated\b/gi, "hard"],
      [/\bsolution\b/gi, "fix"],
      [/\binconvenient\b/gi, "tricky"],
      [/\bresponsibly\b/gi, "safely"],
      [/\bnecessary\b/gi, "needed"],
      [/\bridiculous\b/gi, "silly"],
      [/\bunbelievably\b/gi, "very"],
      [/\btraditional\b/gi, "usual"],
      [/\bceremonial\b/gi, "fancy"],
      [/\bceremony\b/gi, "show"],
      [/\bperformance\b/gi, "show"],
      [/\bperformed\b/gi, "did"],
      [/\btribunal\b/gi, "meeting"],
      [/\bclearance\b/gi, "permission"],
      [/\bemergencies\b/gi, "problems"],
      [/\bemergency\b/gi, "backup"],
      [/\bunpredictable\b/gi, "hard to guess"],
      [/\bpermit\b/gi, "allow"],
      [/\bdecorations\b/gi, "art"],
      [/\bdecoration\b/gi, "art"],
      [/\bimprovise\b/gi, "make up a new plan"],
      [/\bofficial\b/gi, "special"],
      [/\binspection\b/gi, "check"],
      [/\binspect\b/gi, "check"],
      [/\boriginal\b/gi, "first"],
      [/\btemporary\b/gi, "short"],
      [/\bfinale\b/gi, "ending"],
      [/\bmagnificent\b/gi, "great"],
      [/\bannouncement\b/gi, "message"],
      [/\bannouncing\b/gi, "telling"],
      [/\bannounce\b/gi, "say"],
      [/\bdiversion\b/gi, "game"],
      [/\brefrigerator\b/gi, "fridge"],
      [/\bimaginary\b/gi, "pretend"],
      [/\bsatisfy\b/gi, "follow"],
      [/\bchallenge\b/gi, "game"],
      [/\bequipment\b/gi, "tools"],
      [/\bsupervision\b/gi, "help"],
      [/\bpersist\b/gi, "keep going"],
      [/\bpreserve\b/gi, "keep"],
      [/\bprotective\b/gi, "safe"],
      [/\bfastener\b/gi, "clip"],
      [/\bcreative\b/gi, "new"],
      [/\bresponsible\b/gi, "safe"],
      [/\bdeclare\b/gi, "say"],
      [/\btranslation\b/gi, "talk"],
      [/\bdestination\b/gi, "place"],
      [/\bdramatic\b/gi, "big"],
      [/\binvestigation\b/gi, "search"],
      [/\binvestigate\b/gi, "check"],
      [/\bdevice\b/gi, "tool"],
      [/\bpractical\b/gi, "helpful"],
      [/\bdiscover\b/gi, "find"],
      [/\bcontribution\b/gi, "idea"]
    ]);

    function keepCase(source, replacement) {
      if (source === source.toUpperCase()) return replacement.toUpperCase();
      return /^[A-Z]/.test(source) ? replacement.charAt(0).toUpperCase() + replacement.slice(1) : replacement;
    }

    function readerText(value) {
      let text = String(value || "");
      for (const [pattern, replacement] of READER_WORDS) {
        text = text.replace(pattern, match => keepCase(match, replacement));
      }
      text = text.replace(/\ban (special|huge|normal|great|strange|backup|helpful|short|fancy|safe|big)\b/gi, (match, word) => `${/^[A-Z]/.test(match) ? "A" : "a"} ${word}`);
      text = text.replace(/;\s*/g, ". ");
      text = text.replace(/([^.!?]{60,}),\s+(but|so)\s+/gi, (match, first, link) => `${first}. ${link.charAt(0).toUpperCase() + link.slice(1).toLowerCase()} `);
      return text;
    }

    function visibleChoiceLabel(choice, currentState) {
      return readerText(resolve(choice.label, currentState));
    }

    function textLines(node, state) {
      const source = resolve(node.text, state);
      const lines = (Array.isArray(source) ? source : [source])
        .map(line => resolve(line, state))
        .filter(line => typeof line === "string" && line.trim());
      const extra = sceneVariation(node, state);
      const recurring = recurringVariation(node.id || "", state);
      const payoff = node.ending ? sideAdventurePayoff(state) : "";
      const additions = [payoff, extra, recurring].filter(line => typeof line === "string" && line.trim());
      const insertion = node.ending
        ? lines.length
        : node.id === START_NODE
          ? Math.min(lines.length, 2)
          : Math.min(lines.length, 1 + deterministicIndex(state, node.id || "unknown", "paragraph-position", 2));
      lines.splice(insertion, 0, ...additions);
      return lines.map(readerText);
    }

    function availableChoices(node, state) {
      const source = resolve(node.choices, state) || [];
      return source.filter(choice => !choice.when || choice.when(state));
    }

    function addUnique(array, values) {
      for (const value of values || []) {
        if (!array.includes(value)) array.push(value);
      }
    }

    function applyEffect(state, effect = {}) {
      effect = resolve(effect, state) || {};
      if (effect.set) Object.assign(state, clone(effect.set));
      for (const [key, amount] of Object.entries(effect.inc || {})) {
        state[key] = (Number(state[key]) || 0) + amount;
      }
      addUnique(state.items, effect.addItems);
      addUnique(state.clues, effect.addClues);
      addUnique(state.helpers, effect.addHelpers);
      addUnique(state.callbacks, effect.addCallbacks);
      for (const value of effect.removeItems || []) {
        state.items = state.items.filter(item => item !== value);
      }
    }

    let state = newAdventureState();
    let currentNodeId = START_NODE;
    let history = [];
    let currentChoices = [];
    let choiceLocked = false;
    let renderedSceneLines = [];
    let storyPages = [[]];
    let storyPageIndex = 0;
    let narrationActive = false;
    let narrationToken = 0;
    let resizeFrame = 0;
    const defer = typeof queueMicrotask === "function" ? queueMicrotask : callback => Promise.resolve().then(callback);

    const hasDOM = typeof document !== "undefined";
    const dom = hasDOM ? {
      card: document.getElementById("storyCard"),
      kicker: document.getElementById("sceneKicker"),
      title: document.getElementById("sceneTitle"),
      viewport: document.getElementById("storyViewport"),
      text: document.getElementById("storyText"),
      measure: document.getElementById("storyMeasure"),
      pageNav: document.getElementById("pageNav"),
      previousPage: document.getElementById("previousPageButton"),
      nextPage: document.getElementById("nextPageButton"),
      pageStatus: document.getElementById("pageStatus"),
      choices: document.getElementById("choices"),
      back: document.getElementById("backButton"),
      restart: document.getElementById("restartButton"),
      read: document.getElementById("readButton"),
      stop: document.getElementById("stopButton"),
      home: document.getElementById("homeButton")
    } : null;

    function stopReading() {
      narrationToken += 1;
      narrationActive = false;
      if (typeof speechSynthesis !== "undefined") speechSynthesis.cancel();
      if (dom && dom.read) {
        dom.read.textContent = "🔊 Read";
        dom.read.classList.remove("stop");
        dom.read.setAttribute("aria-pressed", "false");
      }
    }

    function goHome() {
      stopReading();
      if (window.ArcadeMultiplayer && typeof ArcadeMultiplayer.goHome === "function") return ArcadeMultiplayer.goHome();
      if (window.ArcadeSave && typeof ArcadeSave.goHome === "function") return ArcadeSave.goHome();
      try {
        if (window.parent !== window && window.parent.ArcadeShell && typeof window.parent.ArcadeShell.goHome === "function") return window.parent.ArcadeShell.goHome();
      } catch (_) {}
      if (window.ArcadeNative && typeof ArcadeNative.goHome === "function") return ArcadeNative.goHome();
      window.location.href = "../index.html";
    }

    function putParagraphs(container, lines) {
      if (!container) return;
      container.replaceChildren();
      for (const line of lines) {
        const paragraph = document.createElement("p");
        paragraph.textContent = line;
        container.appendChild(paragraph);
      }
    }

    function pageFits(lines, availableHeight) {
      if (!dom.measure || !dom.text || typeof dom.text.clientHeight !== "number" || dom.text.clientHeight <= 0) return true;
      dom.measure.style.width = `${dom.text.clientWidth}px`;
      putParagraphs(dom.measure, lines);
      return dom.measure.scrollHeight <= availableHeight + 1;
    }

    function paginateLines(lines) {
      if (!dom.viewport || !dom.pageNav || typeof dom.text.clientHeight !== "number") return [[...lines]];

      dom.pageNav.classList.add("collapsed");
      dom.viewport.classList.add("single-page");
      void dom.text.offsetHeight;
      if (pageFits(lines, dom.text.clientHeight)) return [[...lines]];

      dom.pageNav.classList.remove("collapsed");
      dom.viewport.classList.remove("single-page");
      void dom.text.offsetHeight;
      const availableHeight = Math.max(1, dom.text.clientHeight);
      const pages = [];
      let page = [];

      for (const line of lines) {
        let words = String(line).trim().split(/\s+/).filter(Boolean);
        while (words.length) {
          let low = 1;
          let high = words.length;
          let best = 0;
          while (low <= high) {
            const middle = Math.floor((low + high) / 2);
            const fragment = words.slice(0, middle).join(" ");
            if (pageFits([...page, fragment], availableHeight)) {
              best = middle;
              low = middle + 1;
            } else {
              high = middle - 1;
            }
          }

          if (best === words.length) {
            page.push(words.join(" "));
            words = [];
          } else if (best > 0) {
            page.push(words.slice(0, best).join(" "));
            pages.push(page);
            page = [];
            words = words.slice(best);
          } else if (page.length) {
            pages.push(page);
            page = [];
          } else {
            page.push(words.shift());
            pages.push(page);
            page = [];
          }
        }
      }
      if (page.length) pages.push(page);
      return pages.length ? pages : [[]];
    }

    function setChoicesReady(ready) {
      dom.choices.classList[ready ? "remove" : "add"]("waiting");
      dom.choices.setAttribute("aria-hidden", ready ? "false" : "true");
      for (const button of dom.choices.children) button.tabIndex = ready ? 0 : -1;
    }

    function renderStoryPage() {
      const page = storyPages[storyPageIndex] || [];
      putParagraphs(dom.text, page);
      const hasSeveralPages = storyPages.length > 1;
      if (dom.pageNav && dom.viewport) {
        dom.pageNav.classList[hasSeveralPages ? "remove" : "add"]("collapsed");
        dom.viewport.classList[hasSeveralPages ? "remove" : "add"]("single-page");
        dom.previousPage.disabled = storyPageIndex === 0;
        dom.nextPage.disabled = storyPageIndex >= storyPages.length - 1;
        dom.pageStatus.textContent = `${storyPageIndex + 1} / ${storyPages.length}`;
      }
      setChoicesReady(storyPageIndex === storyPages.length - 1);
    }

    function showStoryPage(index, keepNarration = false) {
      const nextIndex = Math.max(0, Math.min(storyPages.length - 1, index));
      if (nextIndex === storyPageIndex) return;
      if (!keepNarration) stopReading();
      storyPageIndex = nextIndex;
      renderStoryPage();
    }

    function renderChoiceButtons(node) {
      dom.choices.replaceChildren();
      if (node.ending) {
        const again = document.createElement("button");
        again.type = "button";
        again.className = "choice ending-choice";
        again.textContent = "↻ Play another adventure";
        again.addEventListener("click", restart);
        dom.choices.appendChild(again);
        return;
      }

      currentChoices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.setAttribute("aria-keyshortcuts", String(index + 1));
        button.setAttribute("aria-label", `Choice ${index + 1}: ${visibleChoiceLabel(choice, state)}`);
        const number = document.createElement("span");
        number.className = "choice-number";
        number.setAttribute("aria-hidden", "true");
        number.textContent = String(index + 1);
        const label = document.createElement("span");
        label.textContent = visibleChoiceLabel(choice, state);
        button.append(number, label);
        button.addEventListener("click", () => choose(index));
        dom.choices.appendChild(button);
      });
    }

    function render() {
      const node = STORY[currentNodeId];
      if (!node) throw new Error(`Missing story node: ${currentNodeId}`);
      stopReading();
      currentChoices = availableChoices(node, state);

      dom.kicker.textContent = node.phase;
      dom.title.textContent = resolve(node.title, state);
      renderChoiceButtons(node);
      renderedSceneLines = textLines(node, state);
      storyPageIndex = 0;
      storyPages = paginateLines(renderedSceneLines);
      renderStoryPage();

      dom.back.disabled = history.length === 0;
      dom.read.disabled = typeof speechSynthesis === "undefined" || typeof SpeechSynthesisUtterance === "undefined";
      dom.card.classList.remove("scene-enter");
      void dom.card.offsetWidth;
      dom.card.classList.add("scene-enter");
    }

    function choose(index) {
      const node = STORY[currentNodeId];
      if (!node || node.ending || choiceLocked || storyPageIndex !== storyPages.length - 1) return;
      const choice = currentChoices[index];
      if (!choice) return;
      choiceLocked = true;
      const snapshot = { nodeId: currentNodeId, state: clone(state) };
      try {
        const draft = clone(state);
        applyEffect(draft, choice.effect);
        if (PRE_PROJECT_FINALS.includes(currentNodeId)) draft.episodeOneOutcome = visibleChoiceLabel(choice, draft);
        if (POST_BUILD_FINALS.includes(currentNodeId)) draft.episodeTwoOutcome = visibleChoiceLabel(choice, draft);
        draft.storyPath.push(`${currentNodeId}:${index}`);
        const destination = connectedDestination(resolve(choice.next, draft), draft);
        const nextNode = STORY[destination];
        if (!nextNode) throw new Error(`Choice from ${currentNodeId} points to missing node ${destination}`);
        textLines(nextNode, draft);
        const nextChoices = availableChoices(nextNode, draft);
        if (!nextNode.ending && (nextChoices.length < 3 || nextChoices.length > 4)) {
          throw new Error(`${destination} has ${nextChoices.length} available choices.`);
        }
        history.push(snapshot);
        state = draft;
        currentNodeId = destination;
        render();
      } catch (error) {
        state = clone(snapshot.state);
        currentNodeId = snapshot.nodeId;
        console.error("The choice could not be completed.", error);
        render();
      } finally {
        defer(() => { choiceLocked = false; });
      }
    }

    function goBack() {
      const snapshot = history.pop();
      if (!snapshot) return;
      state = clone(snapshot.state);
      currentNodeId = snapshot.nodeId;
      render();
    }

    function restart() {
      stopReading();
      state = newAdventureState();
      currentNodeId = START_NODE;
      history = [];
      choiceLocked = false;
      render();
    }

    function speakPage(index, token) {
      if (!narrationActive || token !== narrationToken) return;
      showStoryPage(index, true);
      if (typeof speechSynthesis === "undefined" || typeof SpeechSynthesisUtterance === "undefined") return;
      const node = STORY[currentNodeId];
      const isLast = index === storyPages.length - 1;
      const labels = isLast ? availableChoices(node, state).map((choice, i) => `Choice ${i + 1}. ${visibleChoiceLabel(choice, state)}`) : [];
      const script = [index === 0 ? resolve(node.title, state) : "", ...(storyPages[index] || []), ...labels].filter(Boolean).join(" ");
      try {
        const speech = new SpeechSynthesisUtterance(script);
        speech.rate = 0.93;
        speech.pitch = 1.03;
        speech.volume = 1;
        speech.onend = () => {
          if (!narrationActive || token !== narrationToken) return;
          if (index < storyPages.length - 1) speakPage(index + 1, token);
          else stopReading();
        };
        speech.onerror = () => {
          if (token === narrationToken) stopReading();
        };
        speechSynthesis.speak(speech);
      } catch (error) {
        console.warn("Read Aloud is not available in this browser.", error);
        stopReading();
      }
    }

    function toggleReading() {
      if (narrationActive) {
        stopReading();
        return;
      }
      if (typeof speechSynthesis === "undefined" || typeof SpeechSynthesisUtterance === "undefined") return;
      narrationActive = true;
      narrationToken += 1;
      const token = narrationToken;
      dom.read.textContent = "■ Stop";
      dom.read.classList.add("stop");
      dom.read.setAttribute("aria-pressed", "true");
      speakPage(storyPageIndex, token);
    }

    function repaginate() {
      if (!renderedSceneLines.length) return;
      const wasLast = storyPageIndex === storyPages.length - 1;
      const oldIndex = storyPageIndex;
      storyPages = paginateLines(renderedSceneLines);
      storyPageIndex = wasLast ? storyPages.length - 1 : Math.min(oldIndex, storyPages.length - 1);
      renderStoryPage();
    }

    function nodeTargets(node) {
      const expand = target => {
        if (typeof target !== "string") return [];
        if (target.startsWith("direct:")) return [target.slice(7)];
        const connection = STORY_CONNECTIONS[target];
        return connection ? [...connection.targets] : [target];
      };
      if (Array.isArray(node.targets)) return [...new Set(node.targets.flatMap(expand))];
      if (!Array.isArray(node.choices)) return [];
      return [...new Set(node.choices.flatMap(choice => expand(choice.next)))];
    }

    function validateStory() {
      const errors = [];
      const warnings = [];
      const ids = Object.keys(STORY);
      if (!STORY[START_NODE]) errors.push(`Start node ${START_NODE} is missing.`);

      for (const [id, node] of Object.entries(STORY)) {
        if (!node.title || !node.text) errors.push(`${id} is missing a title or text.`);
        const targets = nodeTargets(node);
        if (node.ending) {
          if (targets.length) errors.push(`${id} is an ending but has destinations.`);
        } else {
          if (Array.isArray(node.choices) && node.choices.length < 3) errors.push(`${id} has fewer than three choices.`);
          if (!Array.isArray(node.choices) && !node.targets) errors.push(`${id} uses dynamic choices without declared targets.`);
          for (const target of targets) if (!STORY[target]) errors.push(`${id} points to missing node ${target}.`);
        }
      }

      const seen = new Set();
      const queue = [START_NODE];
      while (queue.length) {
        const id = queue.shift();
        if (seen.has(id) || !STORY[id]) continue;
        seen.add(id);
        queue.push(...nodeTargets(STORY[id]));
      }
      for (const id of ids) if (!seen.has(id)) warnings.push(`${id} is unreachable in the structural graph.`);

      const depthMemo = new Map();
      const depthStack = new Set();
      function depthsFrom(id) {
        if (depthMemo.has(id)) return depthMemo.get(id);
        if (depthStack.has(id)) {
          errors.push(`A cycle was detected near ${id}.`);
          return { min: Infinity, max: Infinity };
        }
        const node = STORY[id];
        if (!node) return { min: Infinity, max: Infinity };
        if (node.ending) return { min: 0, max: 0 };
        depthStack.add(id);
        const childDepths = nodeTargets(node).map(depthsFrom).filter(result => Number.isFinite(result.min));
        depthStack.delete(id);
        const result = childDepths.length ? {
          min: 1 + Math.min(...childDepths.map(item => item.min)),
          max: 1 + Math.max(...childDepths.map(item => item.max))
        } : { min: Infinity, max: Infinity };
        depthMemo.set(id, result);
        return result;
      }
      const endingDepths = STORY[START_NODE] ? depthsFrom(START_NODE) : { min: Infinity, max: Infinity };
      if (!Number.isFinite(endingDepths.min)) errors.push("No ending is reachable.");
      if (Number.isFinite(endingDepths.min) && endingDepths.min < 28) errors.push(`An ending is reachable after only ${endingDepths.min} decisions.`);
      if (Number.isFinite(endingDepths.max) && endingDepths.max > 36) warnings.push(`The longest structural path is ${endingDepths.max} decisions.`);

      return {
        ok: errors.length === 0,
        nodeCount: ids.length,
        endingCount: ids.filter(id => STORY[id].ending).length,
        reachableCount: seen.size,
        minDecisions: Number.isFinite(endingDepths.min) ? endingDepths.min : null,
        maxDecisions: Number.isFinite(endingDepths.max) ? endingDepths.max : null,
        errors,
        warnings
      };
    }

    const api = {
      STORY, INITIAL_STATE, START_NODE, STORY_CONNECTIONS, PRE_PROJECT_EPISODES, POST_BUILD_EPISODES,
      PRE_PROJECT_FINALS, POST_BUILD_FINALS,
      freshState, testStoryPlan, makeStoryPlan, connectedDestination, availableChoices, applyEffect,
      nodeTargets, validateStory, textLines, sceneVariation
    };
    const debugApi = {
      story: STORY,
      startId: START_NODE,
      createInitialState: () => freshState(testStoryPlan()),
      createTestPlan: testStoryPlan,
      getChoices: (node, testState) => resolve(node.choices, testState) || [],
      isChoiceAvailable: (choice, testState) => !choice.when || choice.when(testState),
      transition: (node, choice, testState) => {
        const nextState = clone(testState);
        applyEffect(nextState, choice.effect);
        const choiceIndex = Array.isArray(node.choices) ? node.choices.indexOf(choice) : -1;
        if (PRE_PROJECT_FINALS.includes(node.id)) nextState.episodeOneOutcome = visibleChoiceLabel(choice, nextState);
        if (POST_BUILD_FINALS.includes(node.id)) nextState.episodeTwoOutcome = visibleChoiceLabel(choice, nextState);
        nextState.storyPath.push(`${node.id}:${choiceIndex}`);
        const nextId = connectedDestination(resolve(choice.next, nextState), nextState);
        return { nextId, state: nextState };
      },
      isEnding: node => Boolean(node.ending),
      stateKey: (nodeId, testState) => JSON.stringify([
        nodeId,
        testState.project,
        testState.hidingSpot,
        Boolean(testState.dadKnows || testState.recruitedDad),
        Math.min(5, Number(testState.suspicion) || 0),
        Math.min(8, Number(testState.chaos) || 0),
        testState.director && testState.director.connections.afterMission,
        testState.director && testState.director.connections.afterBuild
      ]),
      engine: {
        restart,
        choose,
        back: goBack,
        snapshot: () => clone({ nodeId: currentNodeId, state, history }),
        getVisibleChoices: () => currentChoices.map((choice, index) => index),
        pagination: () => clone({ pages: storyPages, pageIndex: storyPageIndex }),
        nextPage: () => showStoryPage(storyPageIndex + 1),
        previousPage: () => showStoryPage(storyPageIndex - 1)
      }
    };
    if (typeof globalThis !== "undefined") {
      globalThis.__LOGAN_ADVENTURE__ = api;
      globalThis.__LOGAN_CYOA_DEBUG__ = debugApi;
    }

    if (hasDOM) {
      dom.home.addEventListener("click", goHome);
      dom.back.addEventListener("click", goBack);
      dom.restart.addEventListener("click", restart);
      dom.read.addEventListener("click", toggleReading);
      if (dom.stop) dom.stop.addEventListener("click", stopReading);
      if (dom.previousPage) dom.previousPage.addEventListener("click", () => showStoryPage(storyPageIndex - 1));
      if (dom.nextPage) dom.nextPage.addEventListener("click", () => showStoryPage(storyPageIndex + 1));
      document.addEventListener("keydown", event => {
        if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
        if (event.key === "ArrowLeft" && storyPages.length > 1) {
          event.preventDefault();
          showStoryPage(storyPageIndex - 1);
          return;
        }
        if (event.key === "ArrowRight" && storyPages.length > 1) {
          event.preventDefault();
          showStoryPage(storyPageIndex + 1);
          return;
        }
        if (event.key === "Escape" && narrationActive) {
          event.preventDefault();
          stopReading();
          return;
        }
        if (/^[1-4]$/.test(event.key)) {
          const index = Number(event.key) - 1;
          if (storyPageIndex === storyPages.length - 1 && currentChoices[index]) {
            event.preventDefault();
            choose(index);
          }
        }
      });
      window.addEventListener("resize", () => {
        if (resizeFrame && typeof cancelAnimationFrame === "function") cancelAnimationFrame(resizeFrame);
        const schedule = typeof requestAnimationFrame === "function" ? requestAnimationFrame : callback => setTimeout(callback, 0);
        resizeFrame = schedule(() => {
          resizeFrame = 0;
          stopReading();
          repaginate();
        });
      });
      window.addEventListener("pagehide", stopReading);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopReading();
      });
      window.addEventListener("message", event => {
        if (event.source !== window.parent || event.origin !== window.location.origin) return;
        if (event.data && event.data.scope === "arcade-shell" && event.data.version === 1 && event.data.type === "pause") stopReading();
      });
      const report = validateStory();
      if (!report.ok) console.error("Adventure validation failed", report);
      render();
    }
  })();
  </script>
</body>
</html>
