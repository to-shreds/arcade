])
,treasure_intro: N("Build the Surprise", "The Tiny Treasure Theater", [
  "Jenkins opened a shoebox. Inside were two socks with paper eyes, a wooden spoon wearing yarn, and a folded program reading SCARLETT’S VERY IMPORTANT TREASURE SHOW. “Is it a treasure hunt or a puppet show?” Logan asked. Jenkins nodded. “Exactly both.”",
  "Their surprise would begin with tiny clues around the house. Each clue would lead Scarlett closer to a little treasure. At the final spot, sock puppets would pop up and perform a goofy ending made just for her.",
  "They needed puppet bodies, clue cards, a tiny stage, and safe hiding places. The unmatched-sock basket held actors. The recycling bin offered boxes and tubes. The blanket fort could become the final theater, but Scarlett visited it whenever she felt like it.",
  "Jenkins placed a striped sock on his hand. “I am Detective Footington, and I demand cheese.” Logan reminded him that the story did not exist yet. “Detective Footington rejects time,” the sock replied."
], [
  C("Search the unmatched-sock basket for the cast", "treasure_socks", {set:{project:"treasure", projectName:"Tiny Treasure Puppet Hunt", supplyRoute:"sock basket"}, inc:{clever:1}}),
  C("Search recycling for clue and stage materials", "treasure_recycling", {set:{project:"treasure", projectName:"Tiny Treasure Puppet Hunt", supplyRoute:"recycling"}, inc:{clever:1}}),
  C("Claim the blanket fort as the final theater", "treasure_fort", {set:{project:"treasure", projectName:"Tiny Treasure Puppet Hunt", supplyRoute:"blanket fort", usedFort:true}, inc:{chaos:1}})
])
,treasure_socks: N("Gather Supplies", "The Unmatched Auditions", [
  "The basket contained a striped sock, a fuzzy blue sock, a tiny yellow sock, and one of Dad’s long black socks. Jenkins placed them in a row. “Auditions begin. State your talents.”",
  "The striped sock could detect crumbs. The blue sock claimed to have visited the moon. Dad’s sock spoke in a deep Jenkins voice: “Where is my other sock?” Dad walked past and stopped. “That is an excellent question.”",
  (s)=>s.recruitedDad ? "Agent Dad stepped sideways to block Scarlett’s view. “No show here,” he said. “Only an important sock meeting.”" : "Scarlett called from the hall, “What show?” The tiny yellow sock would make a good Scarlett puppet, but seeing it now might reveal too much.",
  "Logan could recruit Dad’s voice, return his sock for smaller actors, hide the basket behind a laundry explanation, or let Jenkins hold one final noisy audition as a distraction."
], [
  C("Recruit Dad and his deep puppet voice", "treasure_story", {set:{dadKnows:true, recruitedDad:true, hasSockPuppet:true}, addItems:["striped sock puppet","blue sock puppet","Dad sock puppet"], addHelpers:["Dad"], addCallbacks:["Dad joined the finale as the Deep Voice"]}),
  C("Return Dad’s sock and choose two smaller socks", "treasure_story", {set:{foundShoes:true, hasSockPuppet:true}, inc:{honest:1}, addItems:["striped sock puppet","blue sock puppet","yellow sock puppet"], addCallbacks:["Logan returned Dad’s missing sock"]}),
  C("Call it laundry sorting and hide the cast", "treasure_story", {set:{hasSockPuppet:true}, inc:{clever:1, suspicion:1}, addItems:["striped sock puppet","blue sock puppet"], addClues:["Scarlett saw a suspicious laundry meeting"]}),
  C("Let Jenkins conduct one final loud audition", "treasure_story", {set:{hasSockPuppet:true}, inc:{chaos:2}, addItems:["striped sock puppet","blue sock puppet","Dad sock puppet"], addCallbacks:["Jenkins held the Great Sock Audition"]})
])
,treasure_recycling: N("Gather Supplies", "The Cardboard Department", [
  "Logan found a cereal box for the final stage, paper tubes for clue containers, and a clean egg carton that Jenkins immediately wore as shoulder armor. “Recycling has made me powerful,” he said.",
  "The cereal box needed to be flattened. Jenkins pulled one side while Logan held the other. It opened suddenly and launched a cardboard flap across the room. The flap landed at Mom’s feet.",
  (s)=>s.momKnows ? "Mom looked at Jenkins’ armor. “I assume this is part of the mission.” Jenkins shook his head. “No. This is formal clothing.”" : "Mom picked up the flap. “Building something?” Scarlett’s footsteps sounded in the hall behind her.",
  "Logan could tell Mom, stay vague with a cardboard-television story, ask only for a safe stage window, or turn the flying flap into a treasure sign. A bottle cap nearby would make an excellent clue bell."
], [
  C("Tell Mom about the treasure show", "treasure_story", {set:{momKnows:true, recruitedMom:true, hasSockPuppet:true}, inc:{honest:1}, addItems:["cereal-box stage","paper tubes","sock puppet"], addHelpers:["Mom"], addCallbacks:["Mom cut a safe puppet-stage window"]}),
  C("Call it a cardboard television", "treasure_story", {set:{hasSockPuppet:true}, inc:{clever:1}, addItems:["cereal-box stage","paper tubes","sock puppet"], addCallbacks:["The puppet stage hid as a cardboard television"]}),
  C("Ask Mom only for one safe rectangle", "treasure_story", {set:{momKnows:true, hasSockPuppet:true}, addItems:["cereal-box stage","bottle-cap bell","sock puppet"], addHelpers:["Mom"], addCallbacks:["Mom made the neat stage window"]}),
  C("Turn the flying flap into a treasure sign", "treasure_story", {set:{hasSockPuppet:true}, inc:{clever:2}, addItems:["cereal-box stage","paper tubes","treasure sign","sock puppet"], addCallbacks:["A flying cardboard flap became the treasure sign"]})
])
,treasure_fort: N("Gather Supplies", "The Theater Already Has Blankets", [
  "The blanket fort had two chairs, a roof, and a doorway just wide enough for Logan. Jenkins crawled in with a flashlight beneath his chin. “Welcome to the Royal National Blanket Theater,” he boomed. One clothespin popped loose, and the roof sagged onto his head.",
  "The fort was perfect for the final puppet reveal if they could add a curtain and keep Scarlett away. Logan found a scarf, couch cushions, clothespins, and a wooden spoon Jenkins had hidden during an earlier “soup emergency.”",
  "Scarlett’s voice came from outside the blanket. “Can I come in my fort?” Jenkins pressed a finger to his lips, then whispered “BE NATURAL” loudly enough to move the wall.",
  "Logan could borrow the fort honestly, build Scarlett a temporary reading fort, announce a five-minute roof inspection, or let Jenkins explain Blanket Law. Any answer would affect how suspicious Scarlett became."
], [
  C("Ask to borrow the fort for ten minutes", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{honest:1, suspicion:1}, addItems:["scarf curtain","wooden-spoon puppet"], addCallbacks:["Scarlett unknowingly loaned the final theater"]}),
  C("Build Scarlett a tiny reading fort nearby", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{clever:2}, addItems:["scarf curtain","sock puppet"], addCallbacks:["A second tiny fort protected the surprise"]}),
  C("Announce a five-minute roof inspection", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{clever:1}, addItems:["scarf curtain","clothespins","sock puppet"], addCallbacks:["The fort passed a suspicious safety inspection"]}),
  C("Let Jenkins explain Blanket Law", "treasure_story", {set:{usedFort:true, hasSockPuppet:true}, inc:{chaos:2, suspicion:1}, addItems:["wooden-spoon puppet","scarf curtain"], addClues:["Scarlett heard Jenkins invent Blanket Law"]})
])
,treasure_story: N("Design the Hunt", "Choose the Most Important Nonsense", [
  "Logan placed three blank clue cards in a row. Each needed to send Scarlett somewhere familiar without making the answer obvious. The last clue would bring her to the hidden puppet stage, where the story would finish.",
  (s)=>s.supplyRoute==="sock basket" ? "The striped sock was ready to become Detective Stripe, and the blue sock kept claiming it had moon experience." : s.supplyRoute==="recycling" ? "Paper tubes could hide rolled clues, and the cereal-box stage had room for a tiny final scene." : "The blanket theater already had a curtain. Jenkins kept bowing through it before any audience existed.",
  "A detective hunt could search for Scarlett’s missing giggle. A space hunt could recover three lost moon objects. A royal hunt could find the Golden Joke and save the Kingdom of Laughs.",
  "Jenkins wanted every clue to rhyme with “pickle.” Logan explained that this would make the answers either too easy or completely impossible. They agreed that only one clue could mention a pickle, and only if absolutely necessary."
], [
  C("Create the Case of the Missing Giggle", "treasure_detective", {set:{constructionFix:"detective giggle hunt"}, addCallbacks:["Detective Stripe opened the Case of the Missing Giggle"]}),
  C("Create a mission to the Moon of Lost Toys", "treasure_space", {set:{constructionFix:"lost-toy space hunt"}, addCallbacks:["Captain Blue launched the Moon of Lost Toys mission"]}),
  C("Create a quest for the Kingdom’s Golden Joke", "treasure_royal", {set:{constructionFix:"Golden Joke royal hunt"}, inc:{chaos:1}, addCallbacks:["Queen Spoonella began the Golden Joke quest"]})
])
,treasure_detective: N("Build the Clues", "Detective Stripe Loses the Evidence", [
  "Clue one sent Scarlett to the place where cold food slept. Clue two pointed toward Dad’s shoes. Clue three would reveal the puppet theater. Jenkins drew a paper cookie as the detective’s most important evidence and wrote DO NOT EAT.",
  "During rehearsal, the cookie vanished. Logan checked behind the stage. Jenkins checked his pockets. Then they both looked at his mouth. He opened it. The paper cookie was inside, slightly bent. “I protected it in the mouth vault,” he said.",
  (s)=>s.hasCookie ? "Logan still had a real cookie. It could become a delicious clue, though Jenkins’ eyes widened dangerously." : s.foundShoes ? "Dad’s recovered shoe could hide a clue, paying back the earlier shoe mystery." : "A bottle cap, lost button, or ordinary paper star could become the evidence instead.",
  "They needed one clue object that would survive Jenkins and make Scarlett laugh when Detective Stripe explained it during the finale."
], [
  C("Use the cookie as evidence, real if available and paper if not", "treasure_crisis", {set:{hasCookie:false}, removeItems:["cookie"], addClues:["Detective Stripe’s cookie evidence"], addCallbacks:["The cookie clue survived Jenkins’ mouth vault"]}),
  C("Hide the second clue beside Dad’s recovered things", "treasure_crisis", {inc:{clever:1}, addClues:["The mysterious shoe clue"], addCallbacks:["Dad’s missing things became treasure-hunt evidence"]}),
  C("Use a bottle cap as the magical Giggle Button", "treasure_crisis", {inc:{clever:2}, addItems:["Giggle Button"], addClues:["The Giggle Button clue"], addCallbacks:["A bottle cap became the Giggle Button"]}),
  C("Let Dad’s deep-voiced sock become a surprise witness", "treasure_crisis", {set:{dadKnows:true}, inc:{chaos:1}, addHelpers:["Dad"], addClues:["The sock witness clue"], addCallbacks:["The Deep Voice testified about the missing giggle"]})
])
,treasure_space: N("Build the Clues", "The Rocket With a Snack Compartment", [
  "Logan turned a paper tube into a rocket. Captain Blue would deliver each clue from a new planet: Refrigerator Planet, Couch-Cushion Moon, and the final Puppet Base. Jenkins supplied engine noises until Mom asked whether a lawn mower was inside.",
  "“Stealth engines,” Jenkins whispered, lowering the volume. The rocket rolled across the stage whenever the puppet climbed in. A treasure clue could not arrive properly if its rocket kept escaping sideways.",
  (s)=>s.foundShoes ? "Dad appeared and silently offered two clothespins, thankful that at least one missing item had returned." : s.items.includes("bottle-cap bell") ? "The bottle cap could become a landing foot or ring when each clue arrived." : "An egg-carton launchpad, paper feet, or an intentional sideways crash could solve the trouble.",
  "Jenkins suggested crackers as rocket fuel. Logan said rockets did not use crackers. Jenkins wrote this down under FACTS TO QUESTION LATER."
], [
  C("Add bottle-cap landing feet", "treasure_crisis", {inc:{clever:2}, addItems:["bottle-cap rocket"], addClues:["Rocket landing clue"], addCallbacks:["Bottle caps steadied Captain Blue’s rocket"]}),
  C("Build an egg-carton moon launchpad", "treasure_crisis", {inc:{clever:1}, addItems:["moon launchpad"], addClues:["Moon launchpad clue"], addCallbacks:["Recycling became the Moon of Lost Toys"]}),
  C("Make the sideways crash part of the story", "treasure_crisis", {inc:{chaos:2}, addClues:["Sideways rocket clue"], addCallbacks:["Captain Blue’s sideways landing became intentional"]}),
  C("Use clothespins as rocket legs", "treasure_crisis", {set:{dadKnows:true}, inc:{clever:1}, addHelpers:["Dad"], addClues:["Clothespin rocket clue"], addCallbacks:["Dad’s clothespins became rocket landing gear"]})
])
,treasure_royal: N("Build the Clues", "The Kingdom That Forgot to Laugh", [
  "The wooden spoon became Queen Spoonella, ruler of a kingdom where every joke had vanished. Detective Stripe became a knight. The blue sock became a dragon who was supposed to roar, but Jenkins gave it a tiny squeak.",
  "“Dragons have many voices,” Jenkins said. “This one swallowed a mouse trumpet.” Three clues would lead Scarlett past the royal pantry, the blanket castle, and finally to the hidden theater where she could restore laughter.",
  (s)=>s.hasAcorn ? "The acorn could become the Golden Joke itself. Jenkins polished it and named it Sir Crunch of Nuttingham." : s.items.includes("treasure sign") ? "The flying cardboard sign now fit perfectly above the final Kingdom of Laughs stage." : "A tiny riddle scroll or audience joke could become the treasure.",
  "During rehearsal, Queen Spoonella slipped from Jenkins’ hand and bonked the stage. “The queen has fainted from seriousness,” he explained. Logan could keep that accident if it made the ending funnier."
], [
  C("Write a tiny scroll containing a royal riddle", "treasure_crisis", {addItems:["Golden Riddle scroll"], addClues:["Royal riddle clue"], addCallbacks:["The Golden Joke hid inside a royal riddle"]}),
  C("Use the acorn as the Golden Joke treasure", "treasure_crisis", {set:{hasAcorn:false}, removeItems:["acorn"], addItems:["Golden Acorn"], addClues:["Golden Acorn clue"], addCallbacks:["Sir Crunch became the Golden Joke"]}),
  C("Ask Scarlett to supply the final joke", "treasure_crisis", {inc:{honest:1}, addClues:["The audience holds the final joke"], addCallbacks:["Scarlett would complete her own treasure hunt"]}),
  C("Keep the queen’s accidental faint in the finale", "treasure_crisis", {inc:{chaos:2}, addClues:["The fainting queen clue"], addCallbacks:["Queen Spoonella fainted from seriousness"]})
])
,treasure_crisis: N("Solve the Crisis", "The Clue Shuffle", [
  "The three clues were ready. Jenkins stacked them in order, bowed, bumped the table, and sent every card fluttering to the floor. When he gathered them, the order was wrong. The final clue now came first, and one middle clue pointed toward a hiding place that no longer existed.",

  C("Send Detective Stripe out to distract Scarlett", "treasure_test", {inc:{chaos:2, suspicion:1}, addClues:["Scarlett met one puppet early"], addCallbacks:["Detective Stripe performed an emergency decoy"]})

,treasure_test: N("Test the Surprise", "The Secret Dress Rehearsal", [

  C("Save one puppet for Scarlett to control", "hide_select", {addCallbacks:["Scarlett would join the puppet finale herself"]}),

, hide_select: N("Keep the secret", "Choose a Hiding Place", [
  (s) => `The ${s.projectName} was finally built, but it still had to survive the most difficult part of any secret mission: living in a house where people actually used the rooms. Scarlett was nearby, Mom was moving from room to room, and Dad was still asking whether anyone had seen his shoes. Jenkins unfolded a card marked HIDING SCIENCE. It showed a blanket, a question mark, and what might have been a potato.`,
  "“Chief Giggle Officer,” Jenkins whispered at the volume of a school announcement, “we require a location of extreme hiddenness.” Logan looked around. The blanket fort was cozy but belonged to Scarlett. The attic closet was quiet but full of boxes. The laundry basket looked ordinary until someone needed laundry. Beneath the dining table offered a tablecloth, chair legs, and far too many family feet.",
  "No place was perfect. That was what made the choice interesting. Logan could pick the spot that matched his style, then solve whatever problem came with it. Jenkins offered to hide the project under his shirt. Logan explained that Jenkins was already shaped like Jenkins, and adding a large surprise would not improve his disguise."
], [
  C("Use the blanket fort as a cloth castle", "hide_fort", { set: { hidingSpot: "fort", usedFort: true }, inc: { clever: 1 }, addCallbacks: ["blanket fort headquarters"] }),
  C("Carry it carefully to the attic closet", "hide_attic", { set: { hidingSpot: "attic" }, inc: { honest: 1 }, addClues: ["attic shelf"] }),

, hide_fort: N("Keep the secret", "Fort Maximum Security", [
  (s) => `The blanket fort spread across the family room like a small country made entirely of cushions. Jenkins called it Fort Maximum Security and saluted the pillow door. The ${s.projectName} fit behind a couch cushion, although one ${s.project === "crown" ? "bright tennis-ball point" : s.project === "pancake" ? "suspicious breakfast smell" : s.project === "portrait" ? "paper corner" : "tiny clue envelope"} kept peeking out.`,
  "Jenkins made a sign that said DEFINITELY JUST A PILLOW. Logan removed it. “But the sign explains everything,” Jenkins protested. Logan explained that signs sometimes explained too much. They rebuilt the entrance so it looked like Scarlett's normal fort instead of a secret laboratory designed by someone who had recently discovered capital letters.",
  (s) => `${s.hasTape ? "The saved tape could strengthen one roof corner, but using it now might leave none for a later wobble." : "There was no tape ready, so Logan could use cushions, ribbon, or careful folding instead."} Scarlett's stuffed rabbit sat outside the entrance like a tiny guard. Jenkins whispered that rabbits could not be trusted with clearance. Logan had to choose how the fort would hide the surprise without making Scarlett feel locked out of her own creation.`
], [
  C("Build a second cushion wall behind the project", "trouble_fort", { inc: { clever: 1 }, addCallbacks: ["double cushion wall"] }),
  C("Use a neat fastener on one wobbly roof corner", "trouble_fort", { set: { hasTape: false }, removeItems: ["tape"], inc: { clever: 1 }, addCallbacks: ["tape or ribbon roof repair"] }),
  C("Make Inspector Sock the official door guard", "trouble_fort", { set: { hasSockPuppet: true }, addItems: ["sockPuppet"], addCallbacks: ["Inspector Sock"] }),
  C("Leave a small side tunnel so Scarlett can still use part of the fort", "trouble_fort", { inc: { honest: 1 }, addCallbacks: ["kind fort tunnel"] })
])

, hide_attic: N("Keep the secret", "The Closet of Former Things", [
  (s) => `The attic closet was not a true attic, but Jenkins insisted that the word made it forty-seven percent more secret. Logan placed the ${s.projectName} behind a box labeled LIGHT BULBS. Around it stood winter hats, old games, a fan, and several objects nobody remembered owning but everyone might suddenly need.`,
  "Jenkins tried to become part of the closet by putting on three hats and standing beside a coat. He looked like a mayor elected by winter clothing. “Nobody will notice,” he whispered. One hat slid over his eyes. He walked gently into the fan box, which answered with a hollow bonk.",
  (s) => `${s.momKnows ? "Mom already knew enough to give Logan a helpful look from the hall." : "Mom had not been briefed, so any question from her would require a careful answer."} Logan noticed that the project shelf tilted slightly toward the door. He could secure the shelf, disguise the project, create a truthful reason to be there, or turn Jenkins into a ridiculous decoy. Whatever he chose would decide what happened when the closet was needed at exactly the wrong moment.`
], [
  C("Brace the project between two sturdy game boxes", "trouble_attic", { inc: { clever: 1 }, addClues: ["game box brace"] }),
  C("Cover it with winter hats and one very ordinary scarf", "trouble_attic", { inc: { chaos: 1 }, addCallbacks: ["mayor of winter hats"] }),
  C("Tell Mom there is a kind surprise stored on one shelf", "trouble_attic", { set: { momKnows: true }, inc: { honest: 2 }, addHelpers: ["mom"] }),
  C("Let Jenkins pretend to be a coat display", "trouble_attic", { inc: { chaos: 2 }, addCallbacks: ["Jenkins coat display"] })
])

, hide_laundry: N("Keep the secret", "The Chariot of Socks", [
  (s) => `The laundry basket had tall sides, strong handles, and a natural disguise made of towels. Jenkins saluted it. “The Chariot of Socks is ready.” Logan reminded him that a chariot usually had wheels. Jenkins checked beneath the basket and looked honestly disappointed. The ${s.projectName} settled inside, covered by one blue towel and three shirts.`,
  "Scarlett passed the doorway wearing one of Dad's socks on her hand. “This is Doctor Sock,” she announced. Jenkins bowed to the sock as if meeting a famous doctor. The basket disguise worked, but it created a new problem. In this house, laundry baskets did not sit quietly for long. Mom might fill it, Dad might move it, and Scarlett might decide Doctor Sock needed a towel hospital.",
  (s) => `${s.promisedClean ? "Jenkins tapped his no-mess promise card and promised the towels would remain in towel condition." : "Jenkins proposed adding a sign that said NO LAUNDRY, which Logan rejected before the marker touched paper."} Logan could organize a fast escape route, add a harmless decoy layer, recruit Doctor Sock, or place one clue where a grown-up would understand it. Each plan protected the secret differently.`
], [
  C("Arrange the handles for one quick, quiet move", "trouble_laundry", { inc: { clever: 1 }, addClues: ["basket escape route"] }),
  C("Add a top layer of ordinary folded towels", "trouble_laundry", { inc: { honest: 1 }, addCallbacks: ["perfect towel disguise"] }),
  C("Ask Scarlett's Doctor Sock to guard the hallway", "trouble_laundry", { set: { hasSockPuppet: true }, addItems: ["sockPuppet"], inc: { suspicion: 1 }, addCallbacks: ["Doctor Sock guard"] }),

])

, hide_table: N("Keep the secret", "Under-the-Table Headquarters", [
  (s) => `The dining table offered a hanging tablecloth, a fence of chairs, and enough shadow to hide the ${s.projectName}. Jenkins crawled underneath and looked around with approval. “Excellent ceiling,” he said, patting the underside of the table. “Very close to the floor.” Logan slid the project behind the chair nobody usually chose.`,
  "Dad walked past wearing one slipper and one bare foot. He looked down as if his feet had made separate plans without asking him. A second later, one missing shoe appeared beneath the table beside Jenkins. Jenkins quietly pushed it behind his back, which was not suspicious except for everything about it.",
  (s) => `${s.foundShoes ? "Logan had already solved part of Dad's shoe mystery, so the remaining footwear could become a useful callback." : "The missing shoes were still a family mystery, and this hiding place appeared to know more than it was saying."} The table would work only if Logan planned for chairs, snacks, and curious feet. He could map a sliding route, use the shoes as harmless markers, build a low cardboard screen, or brief Dad before he accidentally discovered headquarters with his toes.`
], [
  C("Plan a chair-to-chair sliding route", "trouble_table", { inc: { clever: 2 }, addClues: ["chair route"] }),
  C((s) => s.foundShoes ? "Ask Dad for spare slippers as boundary markers" : "Use Dad's shoes as secret boundary markers", "trouble_table", { set: { foundShoes: true }, addCallbacks: ["Dad's footwear markers"], addClues: ["shoe route"] }),
  C("Build a low screen from a spare cardboard box", "trouble_table", { inc: { clever: 1 }, addItems: ["cardboard screen"] }),
  C("Tell Dad enough to keep his feet out of headquarters", "trouble_table", { set: { dadKnows: true }, inc: { honest: 2 }, addHelpers: ["dad"] })
])

, trouble_fort: N("The complication", "The Great Blanket Fold", [
  (s) => `The fort worked perfectly for almost two minutes. Then Scarlett arrived with a stuffed rabbit and announced, “Mr. Bun is moving in.” She lifted the pillow door. At the same moment, the roof blanket slipped from the couch and folded inward like a sleepy sandwich. Logan caught one corner. Jenkins caught another. The ${s.projectName} vanished beneath a soft mountain.`,
  "“No one move,” Jenkins whispered. “We are supporting advanced architecture.” Scarlett crawled under the loose edge to help. One important part of the surprise had slid near her knee, while another cushion rested across Jenkins like a very comfortable trap. Mr. Bun stared at him with the calm confidence of a rabbit who had expected this all along.",
  (s) => `${s.momKnows || s.dadKnows ? "A grown-up who knew the plan appeared at the doorway and waited for Logan's signal instead of taking over." : "Mom and Dad were close, but neither understood why one blanket suddenly required four people and a rabbit."} Logan needed to rescue the project and keep the game friendly. He could turn the collapse into fun, use the old fort work, ask for help, or let Jenkins perform one risky monster maneuver.`
], [
  C("Turn the collapse into a crawling tunnel game", "scarlett_patrol", { set: { scarlettPlan: "tunnel decoy" }, inc: { clever: 2 }, addCallbacks: ["fort collapse game"] }),
  C("Use the reinforced corner to lift the roof safely", "scarlett_patrol", { inc: { clever: 1 }, addCallbacks: ["roof repair paid off"] }),
  C("Ask a knowing grown-up to hold one cushion", "scarlett_patrol", { inc: { honest: 1 }, addCallbacks: ["quiet grown-up assist"] }),
  C("Let Jenkins roll out wrapped like a monster burrito", "scarlett_patrol", { inc: { chaos: 2, suspicion: 1 }, addCallbacks: ["monster burrito"] })
])

, trouble_attic: N("The complication", "The Soft Attic Avalanche", [
  (s) => `The attic hiding place worked until Mom needed the fan from the exact shelf behind the ${s.projectName}. Scarlett followed her up the stairs, eager to help. Jenkins reached for the surprise box. Logan reached for a loose piece. The closet contributed three winter hats, a board game, and a bag of bows, all tumbling down in a soft avalanche.`,
  "Nobody was hurt. Jenkins caught one hat on his head and another on each hand. “I have become mayor of winter,” he announced. The project remained on the shelf, but one important piece bounced through the doorway and rolled down the hall. Scarlett chased it, calling, “I found a mystery thing!”",
  (s) => `${s.momKnows ? "Mom immediately shielded the shelf and calmly asked Logan which part needed saving first." : "Mom did not know the plan, but she saw Logan protecting something and asked whether he needed help or privacy."} Jenkins could follow the rolling piece, but his hat-covered eyes made him a poor choice. Logan could trust Mom, use the earlier brace, turn cleanup into a search, or send a silly decoy in the opposite direction.`
], [
  C("Follow the rolling piece before Scarlett reaches it", "scarlett_patrol", { inc: { clever: 1, suspicion: 1 }, addClues: ["rolling project piece"] }),
  C("Trust the game-box brace and help Mom clear the floor", "scarlett_patrol", { set: { momKnows: true }, inc: { honest: 2 }, addHelpers: ["mom"], addCallbacks: ["safe attic cleanup"] }),
  C("Wear the fallen hats and make cleanup a search game", "scarlett_patrol", { inc: { clever: 1, chaos: 2 }, addCallbacks: ["mayor of winter"] }),
  C("Send Jenkins downstairs as a walking coat display", "scarlett_patrol", { inc: { chaos: 2, suspicion: 1 }, addCallbacks: ["walking coat decoy"] })
])

, trouble_laundry: N("The complication", "Laundry Begins at the Worst Time", [
  (s) => `The basket disguise held until the washing machine beeped. Mom entered with an armful of clothes and said, “Perfect, I was looking for that basket.” Scarlett followed with Doctor Sock on her hand. Jenkins sat on the top towel and smiled as if sitting were an official kind of laundry. Beneath him waited the ${s.projectName}.`,
  "Logan grabbed one handle. Jenkins grabbed the other. The basket caught on a towel, tipped, and slid across the smooth floor. Markers rolled away. A ribbon followed. One paper piece attached itself to Dad's sock as he passed the doorway. Mom pressed pause on the washer before anything important could go near it.",
  (s) => `${s.promisedClean ? "Jenkins's no-mess promise card fluttered onto the scattered supplies. “The card has become sarcastic,” he said." : "Jenkins described the spill as a supply parade, although even he began gathering markers."} Scarlett reached for the towel covering the project. Logan could turn cleanup into a game, follow Dad's sock, trust Mom with the secret, or use a calm snack to stop Jenkins from inventing a second problem.`
], [
  C("Make cleanup an official color-sorting race", "scarlett_patrol", { set: { scarlettPlan: "helpful cleanup" }, inc: { clever: 2, mess: 1 }, addCallbacks: ["laundry cleanup race"] }),
  C("Follow the project piece riding on Dad's sock", "scarlett_patrol", { set: { foundShoes: true }, inc: { clever: 1 }, addClues: ["sock carried piece"], addCallbacks: ["traveling shoe clue"] }),
  C("Tell Mom what is under the towel and ask for one tray", "scarlett_patrol", { set: { momKnows: true }, inc: { honest: 2, mess: 1 }, addHelpers: ["mom"], addCallbacks: ["Mom stopped the washer"] }),
  C((s) => s.hasCookie ? "Give Jenkins the saved cookie and gather calmly" : "Give Jenkins an apple slice and gather calmly", "scarlett_patrol", { set: { hasCookie: false, jenkinsCalm: true }, removeItems: ["cookie"], inc: { clever: 1 }, addCallbacks: ["emergency calm snack"] })
])

, trouble_table: N("The complication", "The Tabletop Takeover", [
  (s) => `The table hiding place worked until Dad carried in apple slices and announced a quick family snack. Mom brought cups. Scarlett began choosing everybody's seats, and her chosen chair placed both feet inches from the ${s.projectName}. Beneath the table, Jenkins passed Logan a ribbon, a marker, and then a spoon that did not belong to any known plan.`,
  "“Why a spoon?” Logan whispered. “Every mission becomes a soup mission eventually,” Jenkins replied. Dad pulled out the last chair. If he knew the plan, he dropped a napkin and crouched down to help. If he did not, his face appeared beneath the table and he said, “Hello. This is more crowded than I expected.”",
  (s) => `${s.foundShoes ? "The recovered shoe marker blocked one rolling piece exactly as Logan had hoped." : "One project piece stuck to Dad's sock, making the missing-shoe mystery even stranger."} Scarlett leaned down. Four faces looked at one another beneath the same table. Logan could recruit Dad, use the planned chair route, give Scarlett a harmless table job, or slide everything out during the snack commotion.`
], [
  C("Recruit Dad and point out the piece on his sock", "scarlett_patrol", { set: { dadKnows: true, recruitedDad: true, foundShoes: true }, inc: { honest: 2 }, addHelpers: ["dad"], addCallbacks: ["Agent Dad sock rescue"] }),
  C("Use the chair-to-chair route exactly as planned", "scarlett_patrol", { inc: { clever: 2 }, addCallbacks: ["chair route success"] }),
  C("Ask Scarlett to arrange apple slices by color", "scarlett_patrol", { set: { scarlettPlan: "harmless help" }, inc: { clever: 1 }, addCallbacks: ["apple slice assignment"] }),
  C("Slide the project out while Jenkins starts a spoon inspection", "scarlett_patrol", { inc: { chaos: 2, suspicion: 1 }, addCallbacks: ["Doctor Spoon diversion"] })
])

, scarlett_patrol: N("Keep the secret", "Scarlett's Four Questions", [
  (s) => `The ${s.projectName} was safe again, but Scarlett had noticed enough to begin an investigation of her own. She stood in the hallway with Mr. Bun tucked under one arm and asked, “Why are you moving blankets, hats, laundry, or table things? Why is Jenkins walking like furniture? Why did Dad's sock have art on it? Is this for me?”`,
  "Jenkins froze behind Logan. Jenkins was larger than Logan. This made Logan look as if he had suddenly grown a worried monster backpack. “I am not here,” Jenkins whispered. Scarlett pointed out that people who were not there usually did less whispering.",
  (s) => `${s.suspicion >= 3 ? "Scarlett's eyes had the bright, certain look of someone who was already assembling the clues." : "Scarlett was curious rather than upset, and Logan wanted to keep it that way."} A kind answer could protect the big reveal without shutting her out. Logan could offer a careful piece of truth, create a genuine distraction, give Scarlett a harmless helping job, or trust Jenkins to improvise. None was automatically wrong, but each would shape what she expected next.`
], [
  C("Say something true without giving away the surprise", "response_truthish", { set: { scarlettPlan: "truthish" }, inc: { honest: 1 } }),
  C("Create a fun distraction that is also a real family activity", "response_distract", { set: { scarlettPlan: "distract" }, inc: { clever: 1 } }),
  C("Ask Scarlett for harmless help without saying why", "response_help", { set: { scarlettPlan: "ask Scarlett for harmless help" }, inc: { honest: 1, clever: 1 } }),
  C("Let Jenkins improvise one explanation", "response_jenkins", { set: { scarlettPlan: "let Jenkins improvise" }, inc: { chaos: 2, suspicion: 1 } })
])

, response_truthish: N("Keep the secret", "A Truth With a Curtain Around It", [
  (s) => `Logan decided not to build the secret out of a big lie. “We are making something kind,” he said. “I cannot show you yet because the surprise part matters.” That answer was true. It also did not launch the ${s.projectName} into the hallway like a party cannon. Scarlett considered it with the seriousness of a detective choosing a sandwich.`,
  "“Is it a robot?” she asked. Logan said no. “A robot sandwich?” Still no. Jenkins took out a tiny card and wrote ROBOT SANDWICH, NEXT MISSION. Mom passed the doorway and smiled at Logan's careful answer. Dad said, “Then I officially know nothing,” in a voice that suggested he knew at least one thing.",
  (s) => `${s.suspicion >= 3 ? "Scarlett was close to guessing, so honesty might move the surprise earlier without ruining its kindness." : "Scarlett seemed willing to wait if Logan gave her a fair rule."} Logan could tell her the gift was for someone she loved, admit that it was for her but keep the design hidden, use the password as a promise, or explain one ridiculous supply without explaining the project. Each truthful version preserved a different part of the mystery.`
], [
  C("Say it is for someone in the family who deserves a laugh", "adult_crossroads", { inc: { honest: 2, suspicion: 1 }, addCallbacks: ["kind family truth"] }),
  C("Tell Scarlett it is for her, but ask her not to peek", "adult_crossroads", { inc: { honest: 3, suspicion: 3 }, addCallbacks: ["Scarlett knew early and waited"] }),
  C((s) => `Ask her to wait until the password “${s.password || "Wiggly Waffles"}”`, "adult_crossroads", { inc: { honest: 2 }, addCallbacks: ["secret password promise"] }),
  C("Explain one strange supply and keep the project itself secret", "adult_crossroads", { inc: { honest: 1, clever: 1 }, addClues: ["harmless supply explanation"] })
])

, response_distract: N("Keep the secret", "A Real Distraction, Not a Fake One", [
  (s) => `Logan chose a distraction that would actually be fun instead of simply sending Scarlett away. Dad's missing shoes still needed solving. Inspector Sock could conduct an interview. A color hunt could help Mom while keeping Scarlett out of headquarters. Even a seven-step hallway race would buy enough time to move the ${s.projectName}.`,
  "Jenkins produced a card labeled DISTRACTION EQUIPMENT. It listed one spoon, three invisible trumpets, and “possibly moon.” Logan turned the card over. The back said COOKIES ARE CIRCLES OF FOCUS. Jenkins had very consistent interests, even when they were not useful.",
  (s) => `${s.hasSockPuppet ? "Inspector Sock was available and already had Scarlett's attention." : "There was no official puppet ready, but Scarlett's stuffed rabbit could become a temporary interviewer."} ${s.foundShoes ? "Dad's shoes had been found, though their strange trip could still become a game." : "The shoe mystery remained unsolved and was honest distraction material."} Logan could choose a practical errand, a funny performance, a movement game, or a calm snack mission. The trick was to include Scarlett rather than make her feel tricked.`
], [
  C((s) => s.foundShoes ? "Make a silly shoe parade with Dad" : "Start a family search for Dad's traveling shoes", "adult_crossroads", { set: { foundShoes: true }, inc: { clever: 1 }, addCallbacks: ["great shoe game"] }),
  C("Stage a quick Inspector Sock interview", "adult_crossroads", { set: { hasSockPuppet: true }, addItems: ["sockPuppet"], inc: { chaos: 1 }, addCallbacks: ["sock puppet interview"] }),
  C("Create a seven-step color hunt through the hallway", "adult_crossroads", { inc: { clever: 2 }, addClues: ["seven color steps"], addCallbacks: ["hallway color hunt"] }),
  C((s) => s.hasCookie ? "Share the saved cookie and plan calmly" : "Share apple slices and plan calmly", "adult_crossroads", { set: { hasCookie: false, jenkinsCalm: true }, removeItems: ["cookie"], inc: { honest: 1 }, addCallbacks: ["shared calm snack"] })
])

, response_help: N("Keep the secret", "Scarlett, Unknowing Expert", [
  (s) => `Logan gave Scarlett a real job that would improve the ${s.projectName} without revealing it. “I need an expert opinion,” he said. Scarlett stood taller. Jenkins immediately wrote her name on a tiny card beneath UNKNOWING EXPERTS, then showed it to her by mistake.`,
  "“What am I an expert in?” Scarlett asked. “Not knowing,” Jenkins answered. Logan rescued the card. He explained that she could choose a color, locate one harmless supply, decide whether an acorn looked more like a jewel or a nose, or test which puppet voice was funniest. Her answer would matter later.",
  (s) => `${s.hasAcorn ? "The smooth acorn was ready for a surprising new job." : "Jenkins offered a button as a substitute and introduced it as Deputy Circle."} ${s.hasTape ? "Scarlett might even spot the tape without knowing what it would hold." : "Ribbon or a sticker could serve as the supply-search target."} Scarlett was still curious, but the mystery now felt like an invitation instead of a locked door. Logan could pick a contribution that would return during the reveal.`
], [
  C("Ask Scarlett to choose between two bright colors", "adult_crossroads", { inc: { clever: 1, honest: 1 }, addCallbacks: ["Scarlett's chosen color"] }),
  C((s) => s.hasTape ? "Ask her to find where the tape rolled" : "Ask her to find a bright ribbon", "adult_crossroads", (s) => ({ addItems: [s.hasTape ? "tape" : "bright ribbon"], inc: { clever: 1 }, addCallbacks: ["Scarlett found the fastener"] })),
  C((s) => s.hasAcorn ? "Ask whether the acorn should be a jewel or a nose" : "Ask whether a button should be a jewel or a nose", "adult_crossroads", (s) => ({ addItems: [s.hasAcorn ? "acorn" : "button"], inc: { clever: 2 }, addCallbacks: ["Scarlett's tiny jewel idea"] })),
  C("Let Scarlett judge Inspector Sock's funniest voice", "adult_crossroads", { set: { hasSockPuppet: true }, addItems: ["sockPuppet"], inc: { chaos: 1 }, addCallbacks: ["Scarlett approved the puppet voice"] })
])

, response_jenkins: N("Keep the secret", "Jenkins Explains Everything Sideways", [
  (s) => `Logan gave Jenkins one chance to explain. Jenkins stepped forward, cleared his throat, and said, “Scarlett, we are conducting ordinary household science involving no ${s.projectName}, because I should not have said that word.” Scarlett looked at Logan. Logan looked at Jenkins. Jenkins looked at a lamp as if the lamp might take over.`,
  "He placed a lampshade on his head. “I am decorative lighting.” Scarlett pointed out his toes. Jenkins looked down with real disappointment. “These have betrayed me.” His terrible explanation had one advantage: Scarlett was laughing too hard to inspect the hiding place for several seconds.",
  (s) => `${s.suspicion >= 3 ? "Scarlett already understood that a surprise existed, though she still did not know its shape." : "Scarlett suspected mostly that Jenkins was extremely strange, which was already established family knowledge."} Logan could turn the mistake into a statue game, ask Jenkins for one true sentence, use a fake monster rule, or let Inspector Sock overrule the lampshade. A strange answer would not punish the mission, but it might raise the level of delightful chaos waiting at the end.`
], [
  C("Turn everyone into hallway statues for ten seconds", "adult_crossroads", { inc: { clever: 1, chaos: 1 }, addCallbacks: ["hallway statue game"] }),
  C("Require Jenkins to say one true, quiet sentence", "adult_crossroads", { inc: { honest: 2 }, addCallbacks: ["Jenkins finally whispered"] }),
  C("Invoke Monster Rule Twenty-Two: never question a lamp", "adult_crossroads", { inc: { chaos: 2, suspicion: 1 }, addCallbacks: ["Monster Rule Twenty-Two"] }),
  C("Let Inspector Sock declare the lampshade innocent", "adult_crossroads", { set: { hasSockPuppet: true }, addItems: ["sockPuppet"], inc: { chaos: 1 }, addCallbacks: ["Inspector Sock cleared the lamp"] })
])

, adult_crossroads: N("Family crossroads", "Who Should Know the Whole Plan?", [
  (s) => `Scarlett's questions had been handled for now. The ${s.projectName} still needed one final repair, a safe move, and a reveal setup. Mom and Dad were nearby, each competent in different and useful ways. Mom noticed practical problems before they became exciting. Dad could move awkward objects, keep a straight face, and become Agent Dad with almost no warning.`,
  "Jenkins preferred the title “Competent Giants.” Mom replied that she would accept “Mom.” Dad said Agent Dad remained available if the mission needed footwear expertise. Neither tried to take control. They waited for Logan to decide what kind of support would help.",
  (s) => `${s.momKnows ? "Mom already knew at least part of the secret." : "Mom had not yet received the full mission briefing."} ${s.dadKnows ? "Dad was already prepared to protect the plan." : "Dad still thought the unusual activity might be a craft project with a shoe problem."} Logan could recruit Mom, recruit Dad, bring both into a family team, or keep the final repair between himself and Jenkins. Every path left Logan as Chief Giggle Officer.`
], [
  C("Recruit Mom as practical Mission Control", "helper_mom", { set: { adultPlan: "Mom", momKnows: true, recruitedMom: true }, inc: { honest: 2 }, addHelpers: ["mom"] }),
  C("Recruit Dad as Agent Dad", "helper_dad", { set: { adultPlan: "Dad", dadKnows: true, recruitedDad: true }, inc: { honest: 2 }, addHelpers: ["dad"], addCallbacks: ["Agent Dad activated"] }),
  C("Brief both parents and form a five-person team", "helper_both", { set: { adultPlan: "both", momKnows: true, dadKnows: true, recruitedMom: true, recruitedDad: true }, inc: { honest: 3 }, addHelpers: ["mom", "dad"], addCallbacks: ["whole family support team"] }),
  C("Keep the repair small with Logan and Jenkins", "helper_solo", { set: { adultPlan: "solo" }, inc: { clever: 2 }, addCallbacks: ["Logan kept the lead"] })
])

, helper_mom: N("Family crossroads", "Mission Control Mom", [
  (s) => `Logan explained the complete plan. Mom listened even when Jenkins reported that the ${s.projectName} had passed “seven of nine monster joy inspections.” “What happened in inspections eight and nine?” Mom asked. Jenkins looked away. “We do not discuss the wobble test.”`,
  "Mom studied the project, the walking path, and the nearby cups. In six seconds she found a tray for loose pieces, moved a drink away from the paper, and suggested a safer corner. She did not redesign anything. “Logan is in charge,” she said. “Tell me what job helps.”",
  (s) => `${s.promisedClean && s.mess > 0 ? "Mom tapped Jenkins's no-mess promise card. Jenkins agreed that cleaning counted as finishing the mission." : "Jenkins offered Mom a title card reading Supreme Finder of Towels. She accepted the towel and returned the title."} Scarlett called from the next room. Mom could distract her with a real task, inspect one practical weakness, help clean and reset the work area, or reserve a reveal room while Logan finished. Each choice would carry Mom's help into the project-specific crisis.`
], [
  C("Ask Mom to give Scarlett a real helper job", (s) => `late_crisis_${s.project}`, { inc: { clever: 1 }, addCallbacks: ["Mom's helpful distraction"] }),

  C("Clean and reset the work area together", (s) => `late_crisis_${s.project}`, { set: { mess: 0 }, inc: { honest: 1 }, addCallbacks: ["Mom's calm cleanup"] }),
  C("Ask Mom to reserve a safe reveal space", (s) => `late_crisis_${s.project}`, { inc: { clever: 1 }, addCallbacks: ["Mom saved the room"] })
], ["late_crisis_crown", "late_crisis_pancake", "late_crisis_portrait", "late_crisis_treasure"])

, helper_dad: N("Family crossroads", "Agent Dad Reports", [
  (s) => `Dad listened to the plan and straightened. “Agent Dad is active.” He leaned casually against the wall and pressed the light switch with his shoulder. The room blinked off, then on. Jenkins saluted. “Excellent entrance. Very mysterious, then dark, then bright.”`,
  "Dad recovered and offered three skills: moving large objects without bumping doors, looking innocent when Scarlett asked questions, and finding things that were supposedly missing after checking the same place twice. He admitted that the third skill had mixed results where his shoes were concerned.",
  (s) => `${s.foundShoes ? "Both shoes had returned, giving Agent Dad full operational footwear." : "One shoe was still missing, which Jenkins called an opportunity for realistic undercover work."} Dad waited for Logan's assignment instead of taking over. He could run a shoe diversion, carry the project, guard the hall, or inspect one moving part with careful grown-up hands. Jenkins whispered that all four duties deserved medals, but making helper medals would create another mission.`
], [
  C((s) => s.foundShoes ? "Ask Dad to stage a pretend shoe hunt" : "Order a dramatic missing-shoe diversion", (s) => `late_crisis_${s.project}`, { set: { foundShoes: true }, inc: { chaos: 1 }, addCallbacks: ["Agent Dad shoe diversion"] }),
  C("Ask Dad to carry the project on a steady tray", (s) => `late_crisis_${s.project}`, { inc: { clever: 1 }, addCallbacks: ["Agent Dad carried the package"] }),
  C("Put Agent Dad on hallway lookout", (s) => `late_crisis_${s.project}`, { inc: { clever: 2 }, addClues: ["Agent Dad lookout signal"] }),
  C("Ask Dad to inspect one loose or moving part", (s) => `late_crisis_${s.project}`, { inc: { clever: 1 }, addCallbacks: ["Dad's steady-hand repair"] })
], ["late_crisis_crown", "late_crisis_pancake", "late_crisis_portrait", "late_crisis_treasure"])

, helper_both: N("Family crossroads", "The Five-Person Operation", [
  (s) => `Mom and Dad joined the mission without turning it into their project. Mom organized loose pieces and protected the ${s.projectName} from drinks, wind, or wobbling furniture. Dad cleared a safe route and checked the doors. Scarlett received a genuine job outside headquarters, such as choosing music, counting ribbon, or teaching Mr. Bun the password.`,
  "Jenkins watched the teamwork with shining eyes. “Competent Giants in formation,” he whispered. Dad corrected him: “Mom and Dad.” Jenkins wrote both versions on a card. Logan remained the leader. Mom asked what should stay exactly as designed. Dad asked what could safely stay funny.",
  (s) => `${s.promisedClean && s.mess > 0 ? "Everyone helped Jenkins honor the no-mess promise by cleaning the spill instead of arguing with gravity." : "The supplies were already under control, so the team could focus on the final repair."} Logan could give each person one job, keep Jenkins's funniest feature, split the adults into lookout and repair roles, or ask the whole group for one suggestion before deciding. The choice would determine how visible the family team became at the ending.`
], [
  C("Give every family member one clear job", (s) => `late_crisis_${s.project}`, { inc: { clever: 2 }, addCallbacks: ["everyone had one mission job"] }),
  C("Keep Jenkins's funniest safe addition", (s) => `late_crisis_${s.project}`, { inc: { chaos: 1, clever: 1 }, addCallbacks: ["family saved Jenkins's joke"] }),
  C("Put Dad on lookout and Mom on practical support", (s) => `late_crisis_${s.project}`, { inc: { clever: 2 }, addCallbacks: ["parent teamwork"] }),
  C("Hear one suggestion from everyone, then let Logan decide", (s) => `late_crisis_${s.project}`, { inc: { honest: 1, clever: 1 }, addCallbacks: ["Logan led the family team"] })
], ["late_crisis_crown", "late_crisis_pancake", "late_crisis_portrait", "late_crisis_treasure"])

, helper_solo: N("Family crossroads", "Chief Giggle Officer in Charge", [
  (s) => `Logan decided to keep the last repair between himself and Jenkins. That did not mean refusing every grown-up forever. It meant the ${s.projectName} would keep the strange, handmade feeling they had built together, with Logan making the calls and Jenkins following them as closely as Jenkins could.`,
  "“I accept your leadership,” Jenkins said. “Unless I see an emergency spoon.” Logan asked him to define an emergency spoon. Jenkins could not, which was good evidence that none were nearby. They spread the remaining pieces in a neat row and checked the path to the reveal rooms.",
  (s) => `${s.jenkinsCalm ? "The earlier calm snack had worked. Jenkins could now listen through an entire sentence before producing a notecard." : "Jenkins still had enough excitement for three victory dances, so Logan needed to give him a focused job."} They could perform a careful count, make one creative replacement, rehearse the carry, or let Jenkins add one small feature under direct supervision. Each plan remained Logan-led and moved directly into the correct project crisis.`
], [
  C("Count every piece twice and repair only what is loose", (s) => `late_crisis_${s.project}`, { inc: { clever: 2 }, addClues: ["complete piece count"], addCallbacks: ["Logan's careful count"] }),
  C((s) => s.hasAcorn ? "Use the acorn as one clever replacement" : "Use a button as one clever replacement", (s) => `late_crisis_${s.project}`, { set: { hasAcorn: false }, removeItems: ["acorn"], inc: { clever: 2 }, addCallbacks: ["tiny replacement piece"] }),
  C("Rehearse the carry from headquarters to the door", (s) => `late_crisis_${s.project}`, { inc: { clever: 1 }, addCallbacks: ["practice carry"] }),
  C("Let Jenkins add one small joke while Logan supervises", (s) => `late_crisis_${s.project}`, { inc: { chaos: 1, clever: 1 }, addCallbacks: ["supervised Jenkins feature"] })
], ["late_crisis_crown", "late_crisis_pancake", "late_crisis_portrait", "late_crisis_treasure"])

, late_crisis_crown: N("Final repair", "The Crown Rolls for Freedom", [
  (s) => `The tennis-ball crown stood bright and ridiculous, exactly the kind of royal equipment Scarlett might wear while giving orders to furniture. Then Jenkins celebrated one scene too early. His elbow touched the table. One tennis ball came loose and rolled toward the doorway, while the crown slowly tilted toward the ${s.hidingSpot}.`,
  (s) => `${s.recruitedDad ? "Agent Dad blocked the rolling ball with one recovered shoe and reported, “Royal package contained.”" : s.recruitedMom ? "Mom steadied the base without changing Logan's design." : "Logan caught the crown with one hand while Jenkins crawled after the runaway ball."} ${s.hasTape ? "The saved tape could make one strong final joint." : "Ribbon, cardboard, or the tiny replacement piece could solve the wobble without tape."}`,
  (s) => `${s.hasAcorn ? "The acorn fit the center like a tiny forest jewel. Jenkins introduced it as Sir Oakley, Royal Nut." : "A button or paper star could fill the center without adding weight."} Scarlett's footsteps approached. Logan could secure every point, lighten the crown, turn the rolling ball into a swinging jewel, or let Jenkins model the crown as a statue decoy. Each choice created a different final crown but no bad ending.`
], [
  C((s) => s.hasTape ? "Use one careful strip to secure every crown point" : "Use tight ribbon loops to secure every crown point", "reveal_setup", { set: { hasTape: false }, removeItems: ["tape"], inc: { clever: 2 }, addCallbacks: ["humanity's greatest fastener"] }),
  C("Remove one heavy ball and make a lighter royal crown", "reveal_setup", { inc: { clever: 1 }, addCallbacks: ["lightweight crown rescue"] }),
  C("Hang the runaway ball as a swinging royal jewel", "reveal_setup", { inc: { clever: 2, chaos: 1 }, addCallbacks: ["swinging tennis-ball jewel"] }),
  C("Put the crown on Jenkins and use him as a royal statue", "reveal_setup", { inc: { chaos: 2, suspicion: 1 }, addCallbacks: ["Jenkins royal statue"] })
])

, late_crisis_pancake: N("Final repair", "The Trophy With Wobbly Opinions", [
  (s) => `The pancake trophy leaned gently to the left. Jenkins leaned with it, as if moral support might improve breakfast balance. It did not. A berry rolled across the tray and escaped toward the edge. The trophy looked proud, delicious, and unsure about several recent life choices.`,
  (s) => `${s.promisedClean ? "Logan pointed to the no-mess promise. Jenkins examined one dot of syrup and said, “That is not a mess. It is a very small lake.” Then he fetched a towel." : "Jenkins called syrup structural glue until Mom, Dad, or Logan gave him the look that ends structural-glue discussions."} ${s.recruitedMom ? "Mom checked that everything was cool, neat, and safe to serve." : "Logan kept the food on its clean tray and away from art supplies."}`,
  (s) => `${s.hasCookie ? "The saved cookie could become a strong round base, although Jenkins had serious feelings about sacrificing it to engineering." : "An upside-down bowl or thick apple ring could make a sturdy base."} Logan could rebuild for perfect balance, turn the wobble into a dancing-trophy joke, make it a two-part award and snack, or ask Jenkins to present it from beneath the table. Scarlett was close, and the final form had to be decided now.`
], [
  C((s) => s.hasCookie ? "Use the saved cookie as a sturdy trophy base" : "Use an upside-down bowl as a sturdy trophy base", "reveal_setup", { set: { hasCookie: false }, removeItems: ["cookie"], inc: { clever: 2 }, addCallbacks: ["round snack engineering"] }),
  C("Make the wobble part of a dancing-pancake routine", "reveal_setup", { inc: { chaos: 2, mess: 1 }, addCallbacks: ["dancing pancake trophy"] }),
  C("Create a small award plate with a separate pancake snack", "reveal_setup", { inc: { clever: 2 }, addCallbacks: ["two-part pancake prize"] }),
  C("Let Jenkins carry the tray while Logan gives exact directions", "reveal_setup", { inc: { chaos: 1, clever: 1 }, addCallbacks: ["careful Jenkins tray walk"] })
])

, late_crisis_portrait: N("Final repair", "The Portrait Changes Its Mind", [
  (s) => `The monster portrait showed Scarlett as the most important person in a gloriously strange world. Then one paper corner curled forward and covered half her smile. Jenkins tried to flatten it and accidentally moved a moon sticker onto her shoulder. “Improvement,” he said. “She is now carrying the moon politely.”`,
  (s) => `${s.hasTape ? "A tiny loop of saved tape could restore the smile without showing." : "A ribbon tab or folded paper brace could hold the corner flat."} ${s.hasAcorn ? "The acorn could become a textured crown jewel, a portrait stamp, or the moon's tiny hat." : "A button or paper circle could serve the same funny job."} If Scarlett had chosen a color earlier, that color already framed the picture.` ,
  (s) => `${s.recruitedMom ? "Mom noticed where the paper needed support and waited for Logan's decision." : s.recruitedDad ? "Dad held the frame steady while keeping both thumbs out of the artwork." : "Logan laid the portrait flat and considered the safest repair."} He could restore the original picture, keep the polite moon as a Jenkins feature, turn the curled corner into a lift-up flap, or add the tiny jewel idea Scarlett unknowingly helped choose.`
], [
  C((s) => s.hasTape ? "Use a hidden tape loop to restore Scarlett's smile" : "Use a folded paper brace to restore Scarlett's smile", "reveal_setup", { set: { hasTape: false }, removeItems: ["tape"], inc: { clever: 2 }, addCallbacks: ["hidden portrait repair"] }),
  C("Keep the polite moon and give it one tiny speech bubble", "reveal_setup", { inc: { chaos: 1, clever: 1 }, addCallbacks: ["polite moon"] }),
  C("Turn the curled corner into a secret lift-up message", "reveal_setup", { inc: { clever: 2 }, addCallbacks: ["hidden portrait message"] }),
  C((s) => s.hasAcorn ? "Add the acorn as the portrait's royal jewel" : callbackHas(s, "Scarlett's tiny jewel idea") ? "Add Scarlett's chosen button as a royal jewel" : "Add a small button as the portrait's royal jewel", "reveal_setup", { set: { hasAcorn: false }, removeItems: ["acorn"], inc: { clever: 1 }, addCallbacks: ["portrait jewel"] })
])

, late_crisis_treasure: N("Final repair", "The Clue Jenkins Hid Too Well", [
  (s) => `The tiny treasure hunt was ready except for its final clue. Jenkins had hidden that clue somewhere “no human would ever look.” Unfortunately, he had also forgotten where. He searched a shoe, the fruit bowl, his own pocket, and the same pocket again. The second time, he looked surprised to find it still attached to him.`,
  (s) => `${s.foundShoes ? "Dad's recovered shoe contained one tiny card marked SAFE PLACE, but not the actual clue." : "The missing-shoe mystery suggested that footwear had once again become part of Jenkins's filing system."} ${s.hasSockPuppet ? "Inspector Sock stared at Jenkins's back with button-eyed suspicion." : "Logan noticed a square of paper peeking over Jenkins's shoulder."} The clue had been stuck to Jenkins the whole time.` ,
  (s) => `${s.password ? `The password “${s.password}” could become the final answer.` : "Logan could invent one short final password now."} He could keep the clue on Jenkins and make him the treasure, rewrite it as a shoe riddle, let Inspector Sock deliver it, or use Scarlett's earlier harmless contribution as the answer. Each solution would make the hunt feel planned, even though one of them had spent several minutes riding on a monster's back.`
], [
  C("Keep the note on Jenkins and make him the final clue", "reveal_setup", { inc: { chaos: 1, clever: 2 }, addCallbacks: ["Jenkins was the missing clue"] }),
  C("Rewrite the ending as a riddle about Dad's shoes", "reveal_setup", { set: { foundShoes: true }, inc: { clever: 2 }, addCallbacks: ["Dad's shoe riddle"] }),
  C("Let Inspector Sock deliver the final clue", "reveal_setup", { set: { hasSockPuppet: true }, addItems: ["sockPuppet"], inc: { clever: 1 }, addCallbacks: ["Inspector Sock clue delivery"] }),
  C((s) => callbackHas(s, "Scarlett's chosen color") || callbackHas(s, "Scarlett's tiny jewel idea") ? "Use Scarlett's earlier art idea as the last answer" : "Ask Scarlett to choose a color for the last clue", "reveal_setup", { inc: { clever: 2, honest: 1 }, addCallbacks: ["Scarlett unknowingly solved her hunt"] })
])

, reveal_setup: N("Prepare the reveal", "Where Should the Surprise Happen?", [
  (s) => `The ${s.projectName} was ready at last. Logan checked every important part, and Jenkins checked every unimportant part with equal seriousness. “Tape confidence: high,” Jenkins reported. “Spoon weather: calm. Sister location: moving unpredictably near the hallway.”`,
  (s) => `${s.adultPlan === "both" ? "Mom and Dad waited for Logan's signal, ready to help without taking over." : s.adultPlan === "Mom" ? "Mom had cleared a safe path and promised to follow Logan's timing." : s.adultPlan === "Dad" ? "Agent Dad stood by with both shoes ready for official duty." : "Logan and Jenkins still had the final plan in their own hands."} Scarlett was nearby, happily talking to Mr. Bun and unaware that the afternoon had been rearranged in her honor.`,
  "The living room offered space for a big reveal. The kitchen could turn the moment into an award ceremony. The backyard had chalk, sunlight, and room for a trail. The blanket fort felt like the secret headquarters where a puppet or royal surprise belonged. The choice would change the final performance, not the amount of love inside it.",
  (s) => `${s.promisedClean && s.mess > 0 ? "Jenkins glanced at the no-mess promise and quietly picked up one last scrap before moving." : "Jenkins tucked his tiny notecards into a neat stack and whispered, at a surprisingly reasonable volume, “Chief Giggle Officer, select the stage.”"}`
], [
  C("Use the living room for a grand open-space reveal", "reveal_living", { set: { revealLocation: "living room" }, addCallbacks: ["living-room stage"] }),
  C("Turn the kitchen into a tiny award ceremony", "reveal_kitchen", { set: { revealLocation: "kitchen" }, addCallbacks: ["kitchen ceremony"] }),
  C("Build a chalk trail to a backyard surprise", "reveal_yard", { set: { revealLocation: "backyard" }, addCallbacks: ["backyard chalk trail"] }),
  C("Return to the blanket fort for the final secret", "reveal_fort", { set: { revealLocation: "blanket fort", usedFort: true }, addCallbacks: ["blanket-fort finale"] })
])

, reveal_living: N("The final surprise", "The Living-Room Stage", [
  (s) => `The living room became a stage without looking like a stage. Logan moved one chair, Mom or Dad switched off a bright lamp, and Jenkins hid behind the couch with the ${s.projectName}. Jenkins practiced his cue. “When you say now, I leap silently.” His practice leap made the couch cushion say FWUMP.`,
  (s) => `${s.usedFort ? "One blanket from the old fort became a curtain, giving the mission a perfect callback." : "A blue blanket became a simple curtain across the project."} ${s.hasSockPuppet ? "Inspector Sock waited on Logan's hand, prepared to introduce the guest of honor." : "Jenkins had drawn a smiling face on a paper cup and named it Deputy Announcer."}`,
  "Scarlett entered carrying Mr. Bun. She noticed everyone standing in slightly too-normal positions. Dad examined a lamp. Mom studied an empty cup. Jenkins's toes stuck out behind the couch. Scarlett smiled. “Are you all being weird on purpose?” she asked. Logan had one final choice for how the room would answer."
], [
  C("Give Scarlett a quiet countdown, then lift the curtain", (s) => endingRoute(s, "perfect"), { set: { revealStyle: "personal countdown" }, inc: { honest: 1 } }),
  C("Bring Mom and Dad in for a whole-family parade", (s) => endingRoute(s, "family"), { set: { revealStyle: "family parade" }, addCallbacks: ["whole-family living-room parade"] }),
  C("Let Agent Dad make the official announcement", (s) => endingRoute(s, "dad"), { set: { revealStyle: "Agent Dad announcement" }, addCallbacks: ["Agent Dad announcement"] }),
  C("Signal Jenkins to pop up as part of the surprise", (s) => endingRoute(s, "jenkins"), { set: { revealStyle: "Jenkins show" }, inc: { chaos: 1 } })
], ["ending_perfect", "ending_early", "ending_family", "ending_agent_dad", "ending_jenkins", "ending_chaos"])

, reveal_kitchen: N("The final surprise", "The Smallest Award Ceremony", [
  (s) => `The kitchen table became an award platform. Logan placed the ${s.projectName} behind an upside-down mixing bowl while Jenkins arranged spoons like velvet ropes. “Only important guests beyond this point,” he announced. Then he walked beyond the point himself and nodded. “Confirmed.”`,
  (s) => `${s.project === "pancake" ? "The room smelled faintly like pancakes, so hiding the surprise any longer would have required lying to everybody's nose." : "A paper menu labeled TODAY'S SPECIAL: MYSTERY kept the covered project from looking too suspicious."} ${s.recruitedMom ? "Mom quietly checked the table edge and gave Logan the all-clear." : "Mom entered, understood the setup in one glance, and waited for Logan to decide whether he wanted help."}`,
  "Scarlett sat down because Jenkins had placed a card on her chair reading IMPORTANT SCARLETT SEAT. She looked around at the spoons, the bowl, and Dad trying not to smile. “Is this lunch?” she asked. Jenkins whispered, “It is emotionally lunch-adjacent.” Logan could choose a neat ceremony or allow the strange parts to become the show."
], [
  C("Present the surprise with a short champion speech", (s) => endingRoute(s, "perfect"), { set: { revealStyle: "champion speech" }, inc: { honest: 2 } }),
  C("Ask Mom to time the lift and save one last wobble", (s) => endingRoute(s, "mom"), { set: { revealStyle: "Mom's perfect cue", momKnows: true, recruitedMom: true }, addHelpers: ["Mom"] }),
  C("March around the table as a five-person award parade", (s) => endingRoute(s, "family"), { set: { revealStyle: "family parade" }, inc: { chaos: 1 } }),
  C("Turn every wobble into an official victory dance", (s) => endingRoute(s, "chaos"), { set: { revealStyle: "wobble dance" }, inc: { chaos: 3, mess: 1 } })
], ["ending_perfect", "ending_early", "ending_mom_save", "ending_family", "ending_chaos"])

, reveal_yard: N("The final surprise", "The Chalk Trail Outside", [
  (s) => `Logan drew bright chalk arrows across the patio. Each arrow led to a silly clue: LOOK UNDER THE CHAIR THAT IS NOT A CHAIR, WALK PAST THE BUSH THAT OWES US A SPOON, and STOP WHERE JENKINS IS DEFINITELY NOT HIDING. Jenkins hid behind that exact bush.`,
  (s) => `${s.firstSearch === "backyard" ? "The final trail crossed the same muddy route where the mystery had begun. Logan could see the whole adventure folding neatly back on itself." : "A fuzzy footprint from the first investigation had been redrawn in chalk as the mission symbol."} ${s.hasAcorn ? "The caped acorn waited at the final arrow as a tiny royal guide." : "A paper star waited at the final arrow, wearing a cape that Jenkins had added without permission and with excellent results."}`,
  "Scarlett came outside and immediately began following the trail. Dad could become the announcer, the whole family could join, Jenkins could perform his famous Leaf Mode reveal, or Logan could change the final clue if the wind moved something. Scarlett reached the last arrow and called, “I found the suspicious bush!” The suspicious bush giggled."
], [
  C("Let Logan guide her to the surprise one clue at a time", (s) => endingRoute(s, "perfect"), { set: { revealStyle: "personal treasure trail" }, inc: { clever: 1 } }),
  C("Make Dad's recovered shoes the final clue", (s) => endingRoute(s, "dad"), { set: { revealStyle: "Agent Dad shoe clue", foundShoes: true }, addCallbacks: ["shoes became the final clue"] }),
  C("Let Jenkins burst from the bush in full Leaf Mode", (s) => endingRoute(s, "jenkins"), { set: { revealStyle: "Leaf Mode show" }, inc: { chaos: 2 }, addCallbacks: ["Leaf Mode returned"] }),
  C("Invite everybody to follow the last chalk arrow together", (s) => endingRoute(s, "family"), { set: { revealStyle: "family chalk parade" }, addCallbacks: ["family chalk parade"] })
], ["ending_perfect", "ending_early", "ending_agent_dad", "ending_jenkins", "ending_family", "ending_chaos"])

, reveal_fort: N("The final surprise", "The Fort Opens Its Doors", [
  (s) => `The blanket fort glowed with flashlight light. Logan arranged the ${s.projectName} at the far end while Jenkins repaired the pillow doorway. A sign now read WELCOME, SCARLETT. Under it Jenkins had written ALSO WELCOME, COOKIES. Logan left the second line because the fort had earned one strange rule.`,
  (s) => `${s.hasSockPuppet ? "Inspector Sock waited behind a cushion, ready to tell the final joke." : "A new paper-bag puppet waited behind a cushion and looked surprised to have received such a large role."} ${s.password ? `The entrance password was still “${s.password},” a clue Scarlett could finally hear.` : "Jenkins chose a final password: KINDNESS WITH EXTRA BLANKETS."}`,
  "Scarlett knelt at the entrance. “Can I come into my own fort now?” she asked. Logan could give her a gentle reveal, launch the puppet finale, let her discover the secret one beat early, or improvise if the curtain stuck. Jenkins held the blanket roof. It began sliding down his head. “Decision requested before I become architecture,” he whispered."
], [
  C("Invite Scarlett in and tell her why they made it", (s) => endingRoute(s, "perfect"), { set: { revealStyle: "quiet fort welcome" }, inc: { honest: 2 } }),
  C("Begin the full sock-puppet finale", (s) => endingRoute(s, "jenkins"), { set: { revealStyle: "sock-puppet finale", hasSockPuppet: true }, addItems: ["sock puppet"], inc: { chaos: 1 } }),
  C("Let Scarlett lift the blanket and discover it one beat early", (s) => endingRoute(s, "early"), { set: { revealStyle: "early fort discovery" }, inc: { suspicion: 2 } }),
  C("Improvise when Jenkins becomes part of the fort roof", (s) => endingRoute(s, "improvise"), { set: { revealStyle: "Logan's improvised fort show" }, inc: { clever: 2, chaos: 1 } })
], ["ending_perfect", "ending_early", "ending_jenkins", "ending_improvise", "ending_chaos"])

, ending_perfect: END("The Squeaky Giggle", [
  (s) => `Logan gave the signal. The cover lifted, the room seemed to hold its breath, and Scarlett saw the ${s.projectName}. ${projectPayoff(s)}`,
  "For one second Scarlett said nothing. Then her smile grew. A laugh popped out, followed by the tiny squeak at the end that Jenkins had put in enormous letters on every mission card. Jenkins pointed at Logan so excitedly that he nearly tipped over. “Squeaky giggle confirmed! Chief Giggle Officer, the mission is a complete success!”",
  (s) => `${s.honest >= s.chaos ? "Scarlett hugged Logan first and said she loved that he had made something just for her." : "Scarlett laughed again at one wonderfully odd detail and asked who had put it there. Logan and Jenkins pointed at each other."} Mom and Dad came close to admire the work, but everyone knew who had made the decisions that got it safely to the finish.`,
  (s) => `${s.hasAcorn ? "Sir Oakley the caped acorn received a place of honor beside the surprise." : callbackHas(s, "shoe") ? "Dad finally explained the traveling-shoe mystery, which made Scarlett laugh one more time." : "Jenkins awarded the striped leadership spoon a medal for excellent meeting work."} Scarlett wore, ate, studied, or followed her surprise again, depending on what Logan had built. The ordinary afternoon had become exactly the kind of family story people tell later.`
])

, ending_chaos: END("The Wonderfully Wobbly Victory", [
  (s) => `The reveal began neatly for almost four seconds. Then the ${s.projectName} wobbled, Jenkins began the victory dance too early, and one spoon joined the performance without being invited. Nothing dangerous happened. Everything ridiculous happened at once. ${projectPayoff(s)}`,
  "Scarlett stared at the bouncing, tilting, rustling celebration. Then she laughed so hard she had to sit down. Jenkins tried to stop dancing, stepped on his own notecard, and turned the stop into a spin. Dad caught a rolling object with his shoe. Mom moved a cup out of the way with the calm speed of someone who had expected exactly this.",
  (s) => s.promisedClean ? "Logan held up Jenkins's no-mess promise. Jenkins froze. “The promise returns,” he said in a worried voice. The whole family cleaned the little mess together, and Jenkins counted every scrap as it went into the bin." : "Logan turned the chaos into part of the show, directing each person to one easy job until the room was calm again.",
  (s) => `${callbackHas(s, "cookie") ? "The famous emergency cookie appeared as the final prize and was shared." : s.hasSockPuppet ? "Inspector Sock declared the wild reveal completely legal." : "The caped paper star received the title Deputy of Unexpected Events."} Scarlett said it was the funniest surprise she had ever received. It had not been perfect. It had been better: it had been theirs.`
])

, ending_early: END("Scarlett Solves the Mystery", [
  (s) => `Scarlett lifted the curtain, followed the clue, or peeked around the final corner one moment before Logan planned. She saw the ${s.projectName}, Jenkins frozen in a heroic but useless pose, and Logan holding the last part of the reveal. “I knew it was something kind,” she said.`,
  "Jenkins slowly unfolded. “You have discovered the surprise before the official surprise moment. According to Monster Rule Twelve, we must now throw the surprise away and become turnips.” Scarlett looked alarmed. Logan asked to see the rule. Jenkins checked his card. The back actually said BUY PICKLES. He admitted he might have invented the turnip part.",
  (s) => `${callbackHas(s, "include Scarlett") || s.honest > 4 ? "Logan remembered the earlier promise that nobody would be left out. He invited Scarlett to add the final ribbon, berry, paper star, or puppet line herself." : "Logan explained the whole mission and asked Scarlett to choose how the last part should happen."} The early discovery became a new choice, not a ruined one.`,
  (s) => `${projectPayoff(s)} Scarlett loved it even more because she got to finish one tiny piece beside Logan. Mom said a surprise could arrive early and still be a surprise. Dad agreed, although Jenkins insisted on doing the official countdown afterward anyway.`
])

, ending_family: END("Operation Team of Five", [
  (s) => `Logan gave each person a cue. Mom opened the safe path. Dad announced the important guest. Jenkins carried the ${s.projectName} with both hands and only one unnecessary salute. Scarlett followed the final arrow into the middle of her own family.`,
  (s) => `${projectPayoff(s)} The project still looked handmade by Logan and Jenkins. Mom and Dad had helped it arrive, but they had never taken over. Scarlett could see the paper edges, the funny repairs, and the small choices that had traveled through the whole house.` ,
  "“This is for being you,” Logan told her. Scarlett's face changed from curious to surprised to bright. Then came the squeaky giggle. She hugged Logan, hugged Mom and Dad, and tried to hug Jenkins while he was bowing. This created a brief pile of family and one confused spoon.",
  (s) => `${s.foundShoes ? "Dad's recovered shoes became official parade shoes." : "Dad finished the parade wearing one shoe and one slipper, which Jenkins declared more ceremonial."} ${s.promisedClean && s.mess > 0 ? "Jenkins honored his promise by leading the cleanup parade too." : "Mom saved the tiny mission cards in a neat stack for the next adventure."} Operation Giggle ended with five people together and Scarlett exactly where she belonged: right in the middle.`
])

, ending_agent_dad: END("Agent Dad and the Traveling Shoes", [
  (s) => `Agent Dad stepped forward for the announcement. “Presenting Scarlett, winner of today's extremely official family award.” Jenkins whispered that Dad had forgotten to say “top secret.” Dad started again with so much extra secrecy that Scarlett was already laughing before the ${s.projectName} appeared.`,
  (s) => `${projectPayoff(s)} Dad used one recovered shoe as a doorstop, marker, clue, or rolling-ball catcher. The shoe had wandered through the adventure and finally found a useful career. Jenkins saluted it. “Agent Shoe, your service will be remembered.”`,
  "Scarlett accepted the surprise with a serious face for about half a second. Then she made the squeaky giggle and asked Logan how he had kept everything hidden. Dad began to answer. Logan reminded him that Logan had actually made the choices. “Correct,” Dad said. “Agent Dad mostly stood in hallways and looked normal.” Jenkins said his normal face had been excellent.",
