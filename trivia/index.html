<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arcade Trivia</title>
    <style>
        
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #111; color: white; touch-action: none; }
        :root{
            --ui-bg: rgba(255,255,255,0.07);
            --ui-border: rgba(255,255,255,0.16);
            --ui-accent: #00e5ff;
            --ui-radius: 14px;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }

        
        .ui-btn{
            display:inline-flex; align-items:center; justify-content:center;
            gap: 8px; padding: 8px 12px; border-radius: var(--ui-radius);
            border: 1px solid var(--ui-border); background: var(--ui-bg);
            color: #fff; font-weight: 800; letter-spacing: 0.2px;
            user-select: none; -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
        .ui-btn:active{ transform: scale(0.98); background: rgba(255,255,255,0.15); }
        .back-btn{ position:fixed; top:10px; left:10px; z-index:1000; backdrop-filter:blur(6px); }
        #global-settings-btn{ position:fixed; top:10px; right:10px; z-index:1000; }
        
        
        #game-view {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; width: 100%; position: relative;
            background: radial-gradient(circle at center, #1a0b2e 0%, #000 80%);
        }

        
        .hud-bar {
            position: absolute; top: 70px; width: 90%; max-width: 600px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 99px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }
        .hud-group { display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .hud-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .hud-val { font-size: 24px; font-weight: 900; font-family: monospace; }
        .c-green { color: var(--correct); }
        .c-red { color: var(--wrong); }
        .c-gold { color: #ffd700; }

        
        .question-box {
            width: 90%; max-width: 600px;
            min-height: 160px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .q-category {
            background: #333; color: #aaa; padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px;
            border: 1px solid #555;
        }
        .q-text {
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 800; line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        
        .answers-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            width: 94%; max-width: 600px;
        }
        .ans-btn {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            min-height: 80px;
            padding: 10px;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 700; color: #eee;
            cursor: pointer; position: relative;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .ans-btn:active { transform: scale(0.96); }
        .ans-btn.correct { background: var(--correct) !important; border-color: #fff !important; color: #000; z-index: 10; }
        .ans-btn.wrong { background: var(--wrong) !important; border-color: #fff !important; opacity: 0.8; z-index: 10; animation: shake 0.4s; }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }

        
        #cat-menu {
            position: absolute; inset: 0; z-index: 50;
            background: rgba(10,10,12,0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; padding: 20px;
        }
        .menu-title { font-size: 3rem; font-weight: 900; color: #ffd700; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,215,0,0.4); text-align: center;}
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; }
        .cat-btn {
            padding: 25px; font-size: 1.4rem; font-weight: 800;
            background: #222; border: 2px solid #444; border-radius: 18px; color: #fff;
            cursor: pointer; transition: all 0.2s;
        }
        .cat-btn:hover { border-color: var(--ui-accent); background: #2a2a2a; transform: translateY(-3px); }
        .cat-btn:active { transform: scale(0.98); }
        .cat-btn small { display: block; font-size: 0.8rem; color: #888; margin-top: 5px; font-weight: normal; }

        
        #feedback-overlay {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.4); pointer-events: none;
            align-items: center; justify-content: center;
        }
        #feedback-text {
            font-size: 15vw; font-weight: 900;
            text-shadow: 0 5px 30px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0%{transform:scale(0); opacity:0;} 80%{transform:scale(1.1); opacity:1;} 100%{transform:scale(1);} }

        
        #global-settings-modal {
            position: fixed; inset: 0; z-index: 2100;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
        }
        .settings-panel {
            width: min(400px, 90%); background: #1a1a1a;
            border: 1px solid #444; border-radius: 18px; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .set-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .set-row:last-child { border: none; margin: 0; padding: 0; }
        .set-label { font-weight: bold; }
        .set-desc { font-size: 12px; color: #888; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ui-accent); }

    

        .splash-title{ color:#ffd700 !important; text-shadow:0 0 16px rgba(255,215,0,0.25) !important; }
        [id$="-menu"].overlay, #menuOverlay, #startOverlay, #cat-menu, #g-balloons .b-start-overlay{ background: rgba(0,0,0,0.95) !important; }
        #cat-menu .menu-title, #startOverlay .panel h1, #g-balloons .b-start-overlay h1{ color:#ffd700 !important; text-shadow:0 0 18px rgba(255,215,0,0.35) !important; }
        #startOverlay .big-btn, #startOverlay .small, #cat-menu .cat-btn, #g-balloons .b-start-overlay .btn-large-opt{ background:#333 !important; border:2px solid #555 !important; border-radius:15px !important; color:#fff !important; font-weight:900 !important; box-shadow:none !important; }
        #g-balloons .b-start-overlay .btn-large-opt{ font-size: 1.9rem !important; padding: 20px 28px !important; max-width: 320px; width: 80%; }
    </style>

const MathGen = (function(){
    function get() {
        const type = randInt(0, 4); 
        let q = "", a = "", w1, w2, w3;

        if (type === 0) { 
            const n1 = randInt(5, 50), n2 = randInt(5, 50);
            q = `${n1} + ${n2} = ?`;
            a = n1 + n2;
        } else if (type === 1) { 
            const n1 = randInt(10, 99), n2 = randInt(1, n1);
            q = `${n1} - ${n2} = ?`;
            a = n1 - n2;
        } else if (type === 2) { 
            const n1 = randInt(2, 9), n2 = randInt(2, 9);
            q = `${n1} × ${n2} = ?`;
            a = n1 * n2;
        } else if (type === 3) { 
            const shapes = [
                {n:"Triangle", s:3}, {n:"Square", s:4}, {n:"Pentagon", s:5}, 
                {n:"Hexagon", s:6}, {n:"Octagon", s:8}, {n:"Rectangle", s:4}
            ];
            const s = pick(shapes);
            q = `How many sides does a ${s.n} have?`;
            a = s.s;

            const t = randInt(0, 2);
            if(t===0) { q="How many minutes in an hour?"; a=60; }
            else if(t===1) { q="How many cents in a dollar?"; a=100; }
            else { q="How many hours in a day?"; a=24; }

        let wrongs = new Set();
        while(wrongs.size < 3) {
            let offset = randInt(-10, 10);
            let val = ans + offset;
            if(val !== ans && val > 0) wrongs.add(val);
        }
        return { q: q, options: [a, ...wrongs], correct: a };
    }

const Game = (function(){
    let currentPool = [];
    let score = { c: 0, s: 0, w: 0 };
    let isTransitioning = false;
    let currentMode = '';
    let currentQuestion = null;
    let undoStack = [];
    let nextTimer = 0;
    const SAVE_KEY = 'arcade_trivia_save_v1';

    
    const ui = {
        view: document.getElementById('game-view'),
        menu: document.getElementById('cat-menu'),
        qText: document.getElementById('q-text'),
        qLabel: document.getElementById('q-cat-label'),
        grid: document.getElementById('ans-grid'),
        sc: document.getElementById('score-c'),
        ss: document.getElementById('score-s'),
        sw: document.getElementById('score-w')
    };

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function start(category) {
        clearTimeout(nextTimer);nextTimer=0;undoStack=[];syncUndo();
        currentMode = category;
        
        if(category === 'all') {
            
            currentPool = [
                ...STATIC_DATA.science, 
                ...STATIC_DATA.vocab, 
                ...STATIC_DATA.general,
                ...SPELLING_DATA, 
                'GEN_MATH', 'GEN_MATH', 'GEN_MATH', 'GEN_MATH'
            ];
            ui.qLabel.innerText = "MIXED BAG";
            shuffle(currentPool);
        } else if (category === 'math') {
            currentPool = ['GEN_MATH']; 
            ui.qLabel.innerText = "MATH";
        } else if (category === 'spelling') {
            currentPool = [...SPELLING_DATA]; 
            ui.qLabel.innerText = "SPELLING";
            shuffle(currentPool);
        } else {
            currentPool = [...STATIC_DATA[category]];
            ui.qLabel.innerText = category.toUpperCase();
            shuffle(currentPool);
        }
        
        score = { c: 0, s: 0, w: 0 };
        updateScore();
        ui.menu.style.display = 'none';
        nextQuestion();
    }

    function updateScore() {
        ui.sc.innerText = score.c;
        ui.ss.innerText = score.s;
        ui.sw.innerText = score.w;
    }

    function renderQuestion(qData){
        let opts = qData.options;
        let uniqueOpts = [...new Set(opts)];
        while(uniqueOpts.length < 4) {
             if(typeof qData.correct === 'number') {
                let n = qData.correct + randInt(1, 5) * (Math.random() > 0.5 ? 1 : -1);
                if(!uniqueOpts.includes(n)) uniqueOpts.push(n);
             } else {
                uniqueOpts.push("None");
             }
        }
        qData.options = uniqueOpts;
        currentQuestion = { q: qData.q, options: [...qData.options], correct: qData.correct };
        ui.qText.innerText = qData.q;
        let displayOpts = [...qData.options];
        shuffle(displayOpts);
        ui.grid.innerHTML = '';
        displayOpts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.innerText = opt;
            btn.onclick = () => check(btn, opt, qData.correct);
            ui.grid.appendChild(btn);
        });
    }

    function nextQuestion() {
        clearTimeout(nextTimer);nextTimer=0;
        isTransitioning = false;
        ui.grid.innerHTML = '';
        let qData = null;

        
        if (currentMode === 'math') {
            qData = MathGen.get();
        } 
        else if (currentMode === 'all') {
             
             if(currentPool.length > 0 && currentPool[currentPool.length-1] === 'GEN_MATH'){
                 currentPool.pop();
                 qData = MathGen.get();
                 
                 
                 if(Math.random() > 0.5) currentPool.unshift('GEN_MATH');
             } else {
                 if (currentPool.length === 0) {
                     alert("You finished the mixed set! Restarting...");
                     start('all'); return;
                 }
                 const r = currentPool.pop();
                 qData = { q: r[0], options: [r[1], r[2], r[3], r[4]], correct: r[1] };
             }
        }
        else {
            
            if (currentPool.length === 0) {
                 
                 if(currentMode === 'spelling') currentPool = [...SPELLING_DATA];
                 else currentPool = [...STATIC_DATA[currentMode]];
                 shuffle(currentPool);
            }
            const r = currentPool.pop();
            qData = { q: r[0], options: [r[1], r[2], r[3], r[4]], correct: r[1] };
        }

        
        
        renderQuestion(qData);
    }

    function check(btn, selected, correct) {
        if (isTransitioning) return;
        undoStack.push(captureState());if(undoStack.length>60)undoStack.shift();syncUndo();
        isTransitioning = true;

        
        if (selected == correct) {
            btn.classList.add('correct');
            score.c++;
            score.s++;
            updateScore();
            Feedback.show(true);
            nextTimer=setTimeout(nextQuestion, 1200);
        } else {
            btn.classList.add('wrong');
            score.w++;
            score.s = 0;
            updateScore();
            Feedback.show(false);
            
            
            Array.from(ui.grid.children).forEach(b => {
                if (b.innerText == correct) b.classList.add('correct');
            });
            nextTimer=setTimeout(nextQuestion, 2000);
        }
    }

    function save(){
        if(!currentMode || !currentQuestion){
            ui.qText.innerText = 'Start a game first, then tap Save.';
            return;
        }
        const saved = {
            currentMode,
            currentPool,
            score,
            currentQuestion,
            label: ui.qLabel.innerText
        };
        try{
            localStorage.setItem(SAVE_KEY, JSON.stringify(saved));
            ui.qText.innerText = 'Game saved.';
            setTimeout(() => { if(currentQuestion) ui.qText.innerText = currentQuestion.q; }, 800);
        }catch(e){
            ui.qText.innerText = 'Save failed.';
        }
    }

    function load(){
        clearTimeout(nextTimer);nextTimer=0;undoStack=[];syncUndo();
        let saved = null;
        try{ saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ saved = null; }
        if(!saved || !saved.currentQuestion){
            ui.menu.style.display = 'none';
            ui.qLabel.innerText = 'TRIVIA';
            ui.qText.innerText = 'No saved game found.';
            ui.grid.innerHTML = '';
            return;
        }
        currentMode = saved.currentMode || 'all';
        currentPool = Array.isArray(saved.currentPool) ? saved.currentPool : [];
        score = saved.score || { c:0, s:0, w:0 };
        currentQuestion = saved.currentQuestion;
        isTransitioning = false;
        ui.qLabel.innerText = saved.label || currentMode.toUpperCase();
        updateScore();
        ui.menu.style.display = 'none';
        renderQuestion(currentQuestion);
    }

    function captureState(){
        return {
            currentMode,
            currentPool: JSON.parse(JSON.stringify(currentPool)),
            score: Object.assign({},score),
            currentQuestion: currentQuestion ? JSON.parse(JSON.stringify(currentQuestion)) : null,
            label: ui.qLabel.innerText,
            isTransitioning
        };
    }

    function restoreState(saved){
        if(!saved || !saved.currentQuestion || typeof saved.currentMode !== 'string') throw new Error('Invalid Trivia save');
        currentMode=saved.currentMode;
        currentPool=Array.isArray(saved.currentPool)?JSON.parse(JSON.stringify(saved.currentPool)):[];
        score={c:Math.max(0,parseInt(saved.score&&saved.score.c,10)||0),s:Math.max(0,parseInt(saved.score&&saved.score.s,10)||0),w:Math.max(0,parseInt(saved.score&&saved.score.w,10)||0)};
        currentQuestion=JSON.parse(JSON.stringify(saved.currentQuestion));
        isTransitioning=!!saved.isTransitioning;
        ui.qLabel.innerText=saved.label||currentMode.toUpperCase();
        updateScore();ui.menu.style.display='none';
        clearTimeout(nextTimer);nextTimer=0;if(isTransitioning)nextQuestion();else renderQuestion(currentQuestion);syncUndo();
    }

    function syncUndo(){const button=document.getElementById('trivia-undo');if(button)button.disabled=undoStack.length===0;}

    function undo(){
        if(!undoStack.length)return false;clearTimeout(nextTimer);nextTimer=0;Feedback.hide();const saved=undoStack.pop();saved.isTransitioning=false;restoreState(saved);isTransitioning=false;syncUndo();return true;
    }

    function fresh(){
        clearTimeout(nextTimer);nextTimer=0;undoStack=[];currentPool=[];score={c:0,s:0,w:0};isTransitioning=false;currentMode='';currentQuestion=null;syncUndo();
        updateScore();ui.qLabel.innerText='TRIVIA';ui.qText.innerText='Choose a category';ui.grid.innerHTML='';ui.menu.style.display='flex';
    }

    return { start, save, load, undo, captureState, restoreState, fresh, hasGame:()=>!!(currentMode&&currentQuestion), summary:()=>score.c+' right • '+score.w+' wrong' };
})();

window.TriviaAutosave={
    id:'trivia',title:'Trivia',version:1,
    capture:()=>Game.captureState(),
    restore:saved=>{Game.fresh();return Game.restoreState(saved)},
    meaningful:()=>Game.hasGame(),
    summary:()=>Game.summary(),
    startFresh:()=>Game.fresh()
};

const Settings = (function(){
    let s = { sound: true, motion: true };
    function open() { document.getElementById('global-settings-modal').style.display = 'flex'; }
    function close() { document.getElementById('global-settings-modal').style.display = 'none'; }
    function toggle(key) {
        s[key] = !s[key];
        if(key === 'sound' && FX.ctx && FX.ctx.state === 'running' && !s.sound) FX.ctx.suspend();
        if(key === 'sound' && FX.ctx && FX.ctx.state === 'suspended' && s.sound) FX.ctx.resume();
    }
    return { open, close, toggle, get: k => s[k] };
})();

const Feedback = (function(){
    const el = document.getElementById('feedback-overlay');
    const txt = document.getElementById('feedback-text');
    const cvs = document.getElementById('confetti-canvas');
    const ctx = cvs.getContext('2d');
    let particles = [];
    let hideTimer = 0;

    function show(isWin) {
        clearTimeout(hideTimer);
        el.style.display = 'flex';
        txt.innerText = isWin ? ["AWESOME!", "GREAT!", "SUPER!", "GENIUS!"][Math.floor(Math.random()*4)] : "OOPS!";
        txt.style.color = isWin ? "#2ecc71" : "#e74c3c";
        
        if (Settings.get('sound')) FX.play(isWin ? 'win' : 'lose');
        
        if (isWin && Settings.get('motion')) {
            spawnConfetti();
            loop();
        } else {
            ctx.clearRect(0,0,cvs.width,cvs.height);
        }

        hideTimer=setTimeout(hide, 1000);
    }

    function hide(){clearTimeout(hideTimer);hideTimer=0;el.style.display='none';particles=[];ctx.clearRect(0,0,cvs.width,cvs.height);}

    function spawnConfetti() {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        particles = [];
        for(let i=0; i<80; i++) {
            particles.push({
                x: cvs.width/2, y: cvs.height/2,
                vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                color: `hsl(${Math.random()*360}, 100%, 50%)`,
                size: Math.random()*10+5
            });
        }
    }

    function loop() {
        if(particles.length === 0) return;
        ctx.clearRect(0,0,cvs.width,cvs.height);
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.vy += 0.5;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        requestAnimationFrame(loop);
    }

    return { show, hide };
})();

const FX = (function(){
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let ctx = new AudioContext();

    function tone(freq, type, dur) {
        if(!Settings.get('sound')) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        g.gain.setValueAtTime(0.1, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + dur);
    }

    function play(type) {
        if(ctx.state === 'suspended') ctx.resume();
        if(type === 'win') {
            tone(440, 'sine', 0.1);
            setTimeout(()=>tone(554, 'sine', 0.1), 100);
            setTimeout(()=>tone(659, 'sine', 0.2), 200);
        } else {
            tone(150, 'sawtooth', 0.3);
        }
    }

    return { play, ctx };
})();

<script type="application/x-arcade-legacy-disabled">
(function(){
  var busy = false;
  var dirty = false;
  function textOf(el){ return ((el.id || '') + ' ' + (el.className || '') + ' ' + (el.getAttribute && (el.getAttribute('onclick') || '')) + ' ' + (el.textContent || '')).toLowerCase(); }
  function ignoreTarget(target){
    if(!target || !target.closest) return false;
    var link = target.closest('a[href]');
    if(link) return true;
    var form = target.closest('input,select,textarea');
    if(form) return true;
    var button = target.closest('button');
    if(button && /(save|load|menu|back|setting|quit|close)/.test(textOf(button))) return true;
    return false;
  }
  function markDirty(e){ if(!ignoreTarget(e.target)) dirty = true; }
  function call(fn){ if(typeof fn === 'function'){ fn(); return true; } return false; }
  function press(id){ var b = document.getElementById(id); if(b && !b.disabled){ b.click(); return true; } return false; }
  function pressMatch(selector){ var b = document.querySelector(selector); if(b && !b.disabled){ b.click(); return true; } return false; }
  function autoSave(){
    if(busy || !dirty) return;
    busy = true;
    try{
      if(press('saveBtn')) return;
      if(press('saveGameBtn')) return;
      if(pressMatch('button[onclick*="saveGame"],button[onclick*="Game.save"]')) return;
      if(call(window.BJGame && window.BJGame.saveGame)) return;

      if(call(window.TicTacToe && window.TicTacToe.saveGame)) return;
      if(call(window.Game && window.Game.save)) return;
    }catch(e){}
    finally{ dirty = false; setTimeout(function(){ busy = false; }, 300); }
  }
  document.addEventListener('pointerdown', markDirty, true);
  document.addEventListener('click', markDirty, true);
  window.addEventListener('pagehide', autoSave);
  window.addEventListener('beforeunload', autoSave);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') autoSave(); });
})();
</script>


<script id="arcade-resume-loader" type="application/x-arcade-legacy-disabled">
(function(){
  function wantsLoad(){
    try{ var p = new URLSearchParams(location.search); return p.get('load') === '1' || p.get('resume') === '1'; }
    catch(e){ return /[?&](load|resume)=1(?:&|$)/.test(location.search); }
  }
  if(!wantsLoad()) return;
  var finished = false;
  function call(obj, name){
    try{ if(obj && typeof obj[name] === 'function'){ obj[name](); return true; } }catch(e){}
    return false;
  }
  function clickId(id){
    var el = document.getElementById(id);
    if(el && !el.disabled){ try{ el.click(); return true; }catch(e){} }
    return false;
  }
  function clickText(){
    var buttons = Array.prototype.slice.call(document.querySelectorAll('button'));
    for(var i=0;i<buttons.length;i++){
      var b = buttons[i];
      var txt = (b.textContent || '').toLowerCase();
      var attr = ((b.id || '') + ' ' + (b.getAttribute('onclick') || '')).toLowerCase();
      if(!b.disabled && (txt.indexOf('load') !== -1 || attr.indexOf('load') !== -1)){ try{ b.click(); return true; }catch(e){} }
    }
    return false;
  }
  function run(){
    if(finished) return true;
    var ok = false;
    ok = call(window.BJGame,'loadGame') || ok;
    ok = call(window.CheckersGame,'loadGame') || ok;
    ok = call(window.DotsGame,'loadGame') || ok;
    ok = call(window.HangmanGame,'loadGame') || ok;
    ok = call(window.MazeGame,'loadGame') || ok;
    ok = call(window.MiniGolf,'loadGame') || ok;

    ok = call(window.Game,'load') || ok;
    ok = clickId('loadGameBtn') || ok;
    ok = clickId('loadBtn') || ok;
    ok = clickId('overlayLoadBtn') || ok;
    ok = clickText() || ok;
    if(ok){ finished = true; try{ history.replaceState(null, document.title, location.pathname); }catch(e){} }
    return ok;
  }
  function start(){
    var tries = 0;
    run();
    var timer = setInterval(function(){ tries++; if(run() || tries > 30) clearInterval(timer); }, 90);
  }
  if(document.readyState === 'complete') start();
  else window.addEventListener('load', start, {once:true});
})();
</script>
