<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090d1e"><title>Backyard Baseball</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../arcade-ui.css"><style>
.hud{justify-self:end;display:flex;gap:4px}.hud .arcade-pill{font-size:11px;padding:4px 7px;min-height:32px}.game{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.38fr);gap:8px}.field{position:relative;min-height:0;overflow:hidden;background:linear-gradient(#7bd3ff 0 27%,#70ca68 27% 100%)}canvas{width:100%;height:100%;display:block;touch-action:none}.side{min-height:0;padding:9px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:7px}.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.score-cell{padding:7px 4px;border-radius:12px;background:rgba(0,0,0,.3);text-align:center}.score-cell span{display:block;color:var(--arcade-muted);font-size:9px;font-weight:900;text-transform:uppercase}.score-cell strong{font-size:clamp(19px,4vmin,30px)}.bases{width:112px;height:76px;margin:auto;position:relative}.base{position:absolute;width:23px;height:23px;border:3px solid #fff;background:rgba(255,255,255,.13);transform:rotate(45deg);border-radius:3px}.base.on{background:var(--arcade-gold);box-shadow:0 0 12px rgba(255,206,58,.45)}.b1{right:5px;bottom:7px}.b2{left:45px;top:2px}.b3{left:5px;bottom:7px}.message{padding:9px;border-radius:14px;background:rgba(0,0,0,.32);font-weight:900;text-align:center;color:#fff;min-height:48px;display:grid;place-items:center}.aim{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.aim .arcade-btn{padding:6px}.aim .active{background:linear-gradient(135deg,var(--arcade-cyan),#4d73ff);color:#071126}.swing{min-height:74px;border:0;border-radius:19px;background:linear-gradient(135deg,#ffce3a,#ff6b3d);color:#261400;font:1000 clamp(22px,5vmin,36px)/1 system-ui;box-shadow:0 7px 0 #a84b14;touch-action:manipulation}.swing:active{transform:translateY(5px);box-shadow:0 2px 0 #a84b14}.swing:disabled{opacity:.42;filter:grayscale(.5);box-shadow:none}.count{display:flex;justify-content:center;gap:6px;color:var(--arcade-muted);font-size:12px;font-weight:900}.count b{color:#fff}.meter{height:12px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--arcade-red),var(--arcade-gold),var(--arcade-green),var(--arcade-gold),var(--arcade-red));transition:width .05s linear}
@media(max-width:680px){.game{grid-template-columns:1fr;grid-template-rows:minmax(210px,1fr) auto}.side{grid-template-columns:1fr 112px 1fr;grid-template-rows:auto auto auto;padding:6px}.scoreboard{grid-column:1}.bases{grid-column:2}.count{grid-column:3}.message{grid-column:1/4;min-height:37px}.meter{grid-column:1/4}.aim{grid-column:1/3}.swing{grid-column:3;min-height:48px}.side>div[style]{display:none}}
@media(max-height:520px){.game{grid-template-columns:minmax(0,1fr) minmax(220px,.42fr);grid-template-rows:1fr}.side{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto auto auto 1fr auto}.swing{min-height:52px}.bases{height:58px}.score-cell{padding:4px}.message{min-height:35px;padding:5px;font-size:12px}}
</style></head><body class="arcade-shell"><main class="arcade-app"><header class="arcade-top"><button class="arcade-btn arcade-home" id="home">⌂ <span class="label">Arcade</span></button><h1 class="arcade-title">Backyard Baseball</h1><div class="hud"><span class="arcade-pill" id="modePill">Game</span><button class="arcade-btn" id="menu">Menu</button></div></header><section class="game"><div class="field arcade-panel"><canvas id="field"></canvas></div><aside class="side arcade-panel"><div class="scoreboard"><div class="score-cell"><span id="inningLabel">Inning</span><strong id="inning">1</strong></div><div class="score-cell"><span>Runs</span><strong id="runs">0</strong></div><div class="score-cell"><span id="outsLabel">Outs</span><strong id="outs">0</strong></div></div><div class="bases"><span class="base b1" id="base1"></span><span class="base b2" id="base2"></span><span class="base b3" id="base3"></span></div><div class="count">Strikes: <b id="strikes">0</b> / 3</div><div class="message" id="message">Get ready...</div><div><div class="meter"><span id="meter"></span></div></div><div class="aim" id="aim"><button class="arcade-btn" data-lane="-1">Pull</button><button class="arcade-btn active" data-lane="0">Center</button><button class="arcade-btn" data-lane="1">Opposite</button></div><button class="swing" id="swing">SWING!</button></aside></section></main>
<div class="arcade-overlay" id="start"><div class="arcade-dialog arcade-panel"><h1>Backyard Baseball</h1><p>Watch the pitch, aim, and tap Swing when the ball reaches the plate.</p><div class="arcade-choice-grid" id="gameModes"><button class="arcade-choice selected" data-game="innings">⚾ 3-Inning Game<br><small>Score runs and clear the bases</small></button><button class="arcade-choice" data-game="derby">💥 Home Run Derby<br><small>Ten swings, hit as many as you can</small></button></div><div style="height:8px"></div><div class="arcade-segments" id="difficulty"><button class="arcade-btn active" data-d="rookie">Rookie</button><button class="arcade-btn" data-d="pro">Pro</button></div><div style="height:10px"></div><button class="arcade-btn gold" id="play" style="width:100%;font-size:19px">Play Ball!</button><button class="arcade-btn" id="load" style="width:100%;margin-top:7px">Load Saved Game</button><button class="arcade-btn" id="back" style="width:100%;margin-top:7px">Back to Arcade</button></div></div>
<div class="arcade-overlay" id="result" hidden><div class="arcade-dialog arcade-panel"><h1 id="resultTitle">Great Game!</h1><p id="resultText"></p><button class="arcade-btn gold" id="again" style="width:100%">Play Again</button><button class="arcade-btn" id="resultMenu" style="width:100%;margin-top:7px">Choose Mode</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d');let gameMode='innings',difficulty='rookie',active=false,inning=1,runs=0,outs=0,strikes=0,bases=[false,false,false],homers=0,swings=0,aim=0,pitch=null,raf=0,last=0,nextTimer=0;
function resize(){const r=canvas.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function dims(){return{w:canvas.clientWidth,h:canvas.clientHeight}}
function draw(){const{w,h}=dims();ctx.clearRect(0,0,w,h);const horizon=h*.28;ctx.fillStyle='#7bd3ff';ctx.fillRect(0,0,w,horizon);ctx.fillStyle='#6cc65f';ctx.fillRect(0,horizon,w,h-horizon);ctx.fillStyle='#b98552';ctx.beginPath();ctx.moveTo(w*.5,h*.39);ctx.lineTo(w*.88,h);ctx.lineTo(w*.12,h);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(w*.5,h*.82);ctx.lineTo(w*.12,h);ctx.moveTo(w*.5,h*.82);ctx.lineTo(w*.88,h);ctx.stroke();ctx.fillStyle='#fff';ctx.save();ctx.translate(w*.5,h*.82);ctx.rotate(Math.PI/4);ctx.fillRect(-10,-10,20,20);ctx.restore();ctx.font=`${Math.max(34,h*.09)}px system-ui`;ctx.textAlign='center';ctx.fillText('🧢',w*.5,h*.3);ctx.fillText('🏏',w*.63,h*.79);if(pitch){const y=h*(.34+.48*pitch.t),curve=Math.sin(pitch.t*Math.PI)*pitch.curve*w*.12,x=w*.5+pitch.lane*w*.09*pitch.t+curve;ctx.shadowBlur=12;ctx.shadowColor='#fff';ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,Math.max(6,11-pitch.t*3),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}
function setGameMode(m){gameMode=m;document.querySelectorAll('#gameModes button').forEach(b=>b.classList.toggle('selected',b.dataset.game===m))}
function setDifficulty(d){difficulty=d;document.querySelectorAll('#difficulty button').forEach(b=>b.classList.toggle('active',b.dataset.d===d))}
function start(){clearTimeout(nextTimer);active=true;inning=1;runs=outs=strikes=homers=swings=0;bases=[false,false,false];pitch=null;$('start').hidden=true;$('result').hidden=true;$('modePill').textContent=gameMode==='derby'?'Derby':difficulty==='pro'?'Pro Game':'Rookie Game';update();schedulePitch(650);loop(performance.now())}
function schedulePitch(ms=700){$('swing').disabled=true;$('message').textContent='Pitcher is getting ready...';nextTimer=setTimeout(beginPitch,ms)}
function beginPitch(){if(!active)return;const speed=difficulty==='pro'?.68+.16*Math.random():.50+.12*Math.random();pitch={t:0,speed,lane:[-1,0,1][(Math.random()*3)|0],curve:(Math.random()-.5)*(difficulty==='pro'?1:.42),swung:false};$('swing').disabled=false;$('message').textContent='Watch the ball!';last=performance.now();touch()}
function loop(ts){if(!active){draw();return}const dt=Math.min(.04,Math.max(0,(ts-last)/1000||0));last=ts;if(pitch&&!pitch.swung){pitch.t+=pitch.speed*dt;$('meter').style.width=Math.max(0,Math.min(100,pitch.t*100))+'%';if(pitch.t>1.11){pitch=null;strike('Strike! Too late.')}}draw();raf=requestAnimationFrame(loop)}
function grade(error,laneMatch){const a=Math.abs(error);if(a>.18)return{type:'strike',text:error<0?'Too early!':'Too late!'};if(a>.125)return{type:'foul',text:'Foul ball!'};let power=1-a/.18;if(!laneMatch)power-=.23;if(power>.86)return{type:'home',text:'HOME RUN!'};if(power>.69)return{type:'triple',text:'Triple!'};if(power>.49)return{type:'double',text:'Double!'};if(power>.28)return{type:'single',text:'Base hit!'};return{type:'out',text:'Caught!'}}
function swing(){if(!active||!pitch||pitch.swung)return;pitch.swung=true;$('swing').disabled=true;const sweet=difficulty==='pro'?.91:.88,error=pitch.t-sweet,laneMatch=aim===pitch.lane,result=grade(error,laneMatch);pitch=null;if(gameMode==='derby'){swings++;if(result.type==='home'){homers++;runs=homers;$('message').textContent='💥 HOME RUN!'}else $('message').textContent=result.type==='strike'?'Miss!':result.text;if(swings>=10){update();finish();return}update();schedulePitch(850);return}if(result.type==='strike'||result.type==='foul'){strike(result.text);return}strikes=0;if(result.type==='out'){outs++;$('message').textContent='🧤 '+result.text;advanceGame()}else{const n=result.type==='single'?1:result.type==='double'?2:result.type==='triple'?3:4;advanceRunners(n);$('message').textContent=(n===4?'💥 ':'⚾ ')+result.text;advanceGame()}update();touch()}
function strike(text){strikes++;$('message').textContent=text;if(strikes>=3){strikes=0;if(gameMode==='derby'){swings++;if(swings>=10){finish();return}}else outs++;advanceGame()}else schedulePitch(720);update();touch()}
function advanceRunners(n){if(n===4){runs+=1+bases.filter(Boolean).length;bases=[false,false,false];return}for(let i=2;i>=0;i--)if(bases[i]){bases[i]=false;if(i+n>=3)runs++;else bases[i+n]=true}bases[n-1]=true}
function advanceGame(){if(outs>=3){outs=0;inning++;bases=[false,false,false];$('message').textContent=inning>3?'Game over!':`Inning ${inning}! Bases cleared.`}if(inning>3){finish();return}schedulePitch(900)}
function finish(){active=false;cancelAnimationFrame(raf);clearTimeout(nextTimer);pitch=null;$('result').hidden=false;$('resultTitle').textContent=gameMode==='derby'?(homers>=5?'Home Run Hero!':'Derby Complete!'):(runs>=6?'Slugger!':'Great Game!');$('resultText').textContent=gameMode==='derby'?`You crushed ${homers} home run${homers===1?'':'s'} in 10 swings.`:`You scored ${runs} run${runs===1?'':'s'} in three innings.`;touch();draw()}
function update(){$('inningLabel').textContent=gameMode==='derby'?'Swings':'Inning';$('inning').textContent=gameMode==='derby'?`${swings}/10`:Math.min(3,inning);$('runs').textContent=gameMode==='derby'?homers:runs;$('outsLabel').textContent=gameMode==='derby'?'Homers':'Outs';$('outs').textContent=gameMode==='derby'?homers:outs;$('strikes').textContent=strikes;bases.forEach((v,i)=>$(`base${i+1}`).classList.toggle('on',v));if(window.ArcadeSave)ArcadeSave.touch(350)}
function touch(){if(window.ArcadeSave)ArcadeSave.touch(250)}function leave(){active=false;cancelAnimationFrame(raf);clearTimeout(nextTimer);const go=()=>location.href='../index.html';window.ArcadeSave?ArcadeSave.saveNow().finally(go):go()}
document.querySelectorAll('#gameModes button').forEach(b=>b.addEventListener('click',()=>setGameMode(b.dataset.game)));document.querySelectorAll('#difficulty button').forEach(b=>b.addEventListener('click',()=>setDifficulty(b.dataset.d)));document.querySelectorAll('#aim button').forEach(b=>b.addEventListener('click',()=>{aim=Number(b.dataset.lane);document.querySelectorAll('#aim button').forEach(x=>x.classList.toggle('active',x===b))}));$('swing').addEventListener('pointerdown',e=>{e.preventDefault();swing()});$('play').addEventListener('click',start);$('again').addEventListener('click',start);$('menu').addEventListener('click',()=>{active=false;cancelAnimationFrame(raf);clearTimeout(nextTimer);$('start').hidden=false});$('resultMenu').addEventListener('click',()=>{$('result').hidden=true;$('start').hidden=false});$('load').addEventListener('click',()=>window.ArcadeSave&&ArcadeSave.load());$('home').addEventListener('click',leave);$('back').addEventListener('click',leave);addEventListener('resize',resize);
window.BaseballAutosave={id:'baseball',title:'Backyard Baseball',version:1,capture:()=>inning?{gameMode,difficulty,inning,runs,outs,strikes,bases,homers,swings,aim,active}:undefined,restore:s=>{if(!s||!['innings','derby'].includes(s.gameMode))throw new Error('Invalid baseball save');gameMode=s.gameMode;difficulty=s.difficulty==='pro'?'pro':'rookie';inning=Math.max(1,Number(s.inning)||1);runs=Math.max(0,Number(s.runs)||0);outs=Math.max(0,Number(s.outs)||0);strikes=Math.max(0,Number(s.strikes)||0);bases=Array.isArray(s.bases)?s.bases.slice(0,3).map(Boolean):[false,false,false];homers=Math.max(0,Number(s.homers)||0);swings=Math.max(0,Number(s.swings)||0);aim=Math.max(-1,Math.min(1,Number(s.aim)||0));setGameMode(gameMode);setDifficulty(difficulty);$('start').hidden=true;$('result').hidden=true;active=true;update();resize();schedulePitch(650);last=performance.now();loop(last);return true},meaningful:()=>active&&(runs+outs+strikes+swings+homers>0),summary:()=>gameMode==='derby'?`${homers} homers • ${swings}/10 swings`:`Inning ${Math.min(inning,3)} • ${runs} runs`,startFresh:()=>{active=false;cancelAnimationFrame(raf);clearTimeout(nextTimer);inning=1;runs=outs=strikes=homers=swings=0;bases=[false,false,false];$('result').hidden=true;$('start').hidden=false}};
window.BaseballDebug={grade};setGameMode('innings');setDifficulty('rookie');resize();update();
})();
</script><script src="../arcade-save.js"></script><script>ArcadeSave.register(window.BaseballAutosave);</script></body></html>
